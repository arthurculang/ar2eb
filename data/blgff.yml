    headline: NAV +10%/yr; discount ~5%.
    narrative:
    - 'The portfolio does its job. US growth holdings — Amazon, Meta, Shopify, Nvidia, Netflix, DoorDash — compound
      NAV ~10%/yr, the private sleeve holds or appreciates modestly (Anthropic marks firm, SpaceX steady), and the
      discount settles around ~5% as Saba''s buyback discipline persists without a full closure event. No re-rating
      windfall and no write-down — just the book working over three years, which is the honest base for a trust
      already trading near par.

      '
    - 'NAV compounds from $4.61 to ~$6.05/sh by 2029; at a ~5% residual discount the share-price exit is ~$5.75
      nominal. PV at the 9.5% fund discount over three years: ~$4.38 — about 3% above today. The modest premium to
      spot is the point: with the discount already compressed, the return now comes from NAV compounding, not the
      re-rating that drove the last two years.

      '
    - 'Modal outcome; portfolio compounding, not the discount, is the variable.

      '
    probability_rationale: 'Modal. Conditions: US growth compounds at a mid-cycle pace, no private-mark reset, the

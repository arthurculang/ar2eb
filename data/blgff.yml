central_question: 'Is the ~2-3% discount to a 343.91p NAV defensible against a probability-weighted distribution of
  NAV-realization outcomes over 3-4 years — when the easy re-rating is largely spent and the NAV itself leans on
  illiquid private marks (SpaceX at ~2× third-party fair value)?

  '
thesis: 'USA is a closed-end US-growth trust whose share price ($4.25) sits a few points below a 343.91p NAV ($4.61).
  The dominant variable is not an operating DCF — there is no operating business, only a portfolio — but the
  NAV-realization distribution: you buy at a discount and "exit" by realizing NAV as the discount narrows and the
  book compounds over 3-4 years. The hook is the ~30-40% unlisted sleeve (27-28 names): SpaceX 16.5% and Anthropic
  7.4% are ~24% of assets in two illiquid marks. Saba''s ~29% activist stake has already compressed the discount
  from ~20% (2023) to ~2-3%, so the re-rating money is largely spent. The bear is not slow erosion but a 2022 redux
  — a growth drawdown plus stale private marks written down — with the discount re-widening. Probability-weighted PV
  lands ~$4.18, ≈ the price. The single most consequential editorial input is the private-mark realism, not the
  discount. Five NAV-realization scenarios, weighted; show your work.

  '

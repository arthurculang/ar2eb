  bear:
    label: Flat NAV
    short_label: FlatNAV
    probability: 0.25
    headline: NAV flat; discount widens to ~12%.
    narrative:
    - 'The "treads water" path. US growth de-rates modestly and the private sleeve is held flat — no SpaceX IPO to
      crystallize the carry, Anthropic marks paused — so NAV ends 2029 roughly where it started. With nothing
      compounding and Saba''s presence less decisive (or its buyback firepower spent), the discount drifts back out
      to ~12% — wider than today but short of the 2023 blowout, since the activist overhang still caps it below the
      ~20.8% peer average.

      '
    - 'NAV holds near $4.60/sh but a ~12% discount puts the share-price exit at ~$4.05 nominal in 2029. PV at the
      9.5% fund discount over three years: ~$3.08 — meaningfully below today even though NAV barely moved, because
      the discount, not the portfolio, does the work. This is the underappreciated outcome: you can be right on NAV
      and still lose on the re-rating.

      '
    - 'Saba''s stake is both the floor under the discount and, if it exits, the trigger that re-opens it.

      '
    probability_rationale: 'Modal-adjacent over three years. The activist overhang makes a full 2023-style blowout
      unlikely, but a drift to low-teens is easy if NAV stops compounding and buyback cadence slows. The realistic
      lever is Saba''s posture — a tender or wind-down resolves the discount, but a quiet exit re-opens it. 25%
      reflects that "flat and re-widening" is a live, often-ignored middle.

      '

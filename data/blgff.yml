      closes to par — buybacks at a tightening discount stay NAV-accretive.

      '
    - 'NAV reaches ~$7.40/sh by 2029 and the discount goes to ~0, so the share-price exit ≈ $7.40 nominal. PV at the
      9.5% fund discount over three years: ~$5.64 — about 1.3× today. The upside is real but bounded: even crystallizing
      the single richest mark, the holder captures NAV compounding plus the last few points of discount, not a venture

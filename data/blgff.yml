scenarios:
  ultra_bear:
    label: Crash Redux
    short_label: Crash
    probability: 0.12
    headline: Growth crash; private marks cut.
    narrative:
    - 'A 2022 redux. US growth equities draw down hard; the SpaceX 16.5% and Anthropic 7.4% marks — already rich
      (BG carries SpaceX at ~$1.6T vs Morningstar''s ~$780B fair value) — get written toward third-party levels as
      a delayed IPO or down-round resets the carry. Net gearing (~3%) amplifies the fall. Saba, having compressed the
      discount, either exits or shifts tactics; with buybacks no longer enough to hold it, the discount re-widens
      toward the ~20% it carried in 2023 and the AIC North-America peer average (~20.8%).

      '
    - 'NAV falls to ~$3.35/sh and the discount re-opens to ~20%, so the share-price "exit" lands near $2.68 nominal
      in 2029 — discounted three years at the 9.5% fund required return, expected PV is ~$2.04/share, roughly half
      today. No total-loss term: a diversified equity portfolio doesn''t go to zero.

      '
    - 'Growth crash + private-mark write-down + discount re-widening is a compound event sized at ~12%.

      '
    probability_rationale: 'A growth drawdown, a private-mark reset, and a discount re-widening are correlated — the
      same risk-off regime drives all three — which is why the tail is fatter than for a single binary. Each is
      30-45% plausible over three years; jointly ~12%. The 5-yr annualised NAV record (+3.9% vs benchmark +14.5%)
      proves the 2022-style drawdown is a lived outcome here, not a hypothetical, so the a-priori sits above a
      typical equity fund''s.

      '
    exit_terms:

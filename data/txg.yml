- label: Ultra Bear 15%
  body: NIH cuts crush demand; revenue declines; ~$5.
- label: Bear 30%
  body: Flat revenue, thin margins; dominant ex-growth; ~$8.
- label: Base 33%
  body: Slow ~3% grind; margins recover; ~$14 (≈-50%).
- label: Bull 17%
  body: Spatial re-accelerates to ~8%; ~$26 (≈spot).
- label: Ultra Bull 5%
  body: Clinical spatial inflection; mid-teens; ~$43.
appendix:
  pushback:
  - label: Razor/blade annuity is the moat.
    body: ~85% of revenue is recurring 70%-gross-margin consumables off a >7,900-instrument installed base — a durable Scale-Economies
      Power.
  - label: Net-cash, self-funding, no dilution.
    body: ~$540M net cash, debt-free, and freshly cash-generative (+$26M op cash Q1'26) — no raise needed; failure risk negligible.
  - label: IP estate bankrupted a competitor.
    body: 10x's droplet/in-situ patents bankrupted NanoString and extract royalties from Bruker/Vizgen — a real cornered resource.
  - label: Spatial (Xenium) is the growth engine.
    body: Spatial consumables +19%; Xenium Protein multiomics extends the lead — the re-acceleration optionality.
  - label: Cost discipline already executed.
    body: A 17% opex cut + 8% headcount reduction collapsed the net loss from -$183M to -$44M; the operating leverage is in
      place if revenue grows.
  triggers:
  - label: Bull validation
    body: total revenue growth re-accelerates >7%  ·  spatial offsets single-cell decline  ·  NIH / instrument placements
      recover  ·  FCF margin > 15%
  - label: Bear validation
    body: single-cell consumables decline accelerates < -5%  ·  instruments stay frozen  ·  NIH cuts bite  ·  revenue flat-to-down
      through FY27
  - label: Reframe needed
    body: if spatial biology inflects into clinical/translational use at scale, re-rate the growth path and terminal multiple
      toward a secular-platform level
glossary:
- term: Chromium / single-cell
  definition: 10x's flagship single-cell platform; the legacy core — ~$386M revenue, slowly declining.
- term: Visium / Xenium / spatial
  definition: 10x's spatial-biology platforms (in-situ + sequencing-based); the +19% growth engine.
- term: Razor/blade (consumables)
  definition: Instruments (the razor) drive recurring consumable-reagent sales (the blade); ~85% of 10x revenue is recurring
    consumables.
- term: NIH funding shock
  definition: ~25% of revenue is NIH-tied; proposed ~40% NIH cuts froze academic instrument purchases (-39% in FY25) — the
    dominant headwind.
- term: FCF margin
  definition: Mature-DCF lever — the free-cash-flow margin the 70% gross margin converts to as revenue and operating leverage
    build.
competitive:
  arena: Single-cell + spatial biology tools — 10x Genomics (Chromium single-cell, Visium/Xenium spatial; ~85% recurring consumables)
    vs Illumina (sequencing platform, entering spatial), Bruker (CosMx/GeoMx ex-NanoString), Parse (instrument-free single-cell),
    Standard BioTools; defending a dominant tools franchise as growth stalls.
  lens: power_audit
  powers:
    scale_economies:
      score: 3
      note: Razor/blade installed base (>6,400 Chromium + >1,500 spatial instruments) → ~85% recurring high-margin consumables;
        the strongest, most durable Power.
    network_economies:
      score: 1
      note: A published-protocol / citation network is mild; not a hard flywheel.
    counter_positioning:
      score: 1
      note: 10x is the incumbent, not counter-positioned; instrument-free entrants (Parse) counter-position against its razor
        model.
    switching_costs:
      score: 2
      note: Entrenched lab workflows, protocols, and data pipelines create real but not insurmountable lock-in.
    branding:
      score: 2
      note: The 'gold standard' single-cell brand; strong in academia.
    cornered_resource:
      score: 2
      note: Extensive droplet + in-situ patent estate (bankrupted NanoString; forces rivals to license) — durable on existing
        methods, but doesn't stop combinatorial-barcoding designs-around.
    process_power:
      score: 2
      note: Manufacturing + assay learning curve; real but contestable.
  dominant_power: scale_economies
  durability: medium
  rivals:
  - name: Illumina
    kind: public
    note: Sequencing platform 10x's reads run on; entering spatial; huge balance sheet. 10x is suing it over spatial/single-cell
      IP.
    growth: 0.03
    margin: 0.2
    multiple: ~5x sales
  - name: Bruker
    kind: public
    note: CosMx/GeoMx (ex-NanoString) spatial imaging; settled & licenses 10x IP (pays $68M + royalties).
    growth: 0.05
    margin: 0.15
    multiple: ~3x sales
  - name: Parse Biosciences
    kind: private
    note: Instrument-free split-pool single-cell — removes the razor, undercuts Chromium. 10x won an ATAC injunction vs it.
    growth: null
    margin: null
    multiple: private
  - name: Standard BioTools
    kind: public
    note: Fluidigm + Olink; multiomics-adjacent, consolidating.
    growth: 0.0
    margin: null
    multiple: ~2x sales
  threats:
  - vector: counter_positioning
    who: Instrument-free entrants (Parse; 10x's own ScaleBio chemistry)
    falsifier: Single-cell consumables decline accelerates beyond -5%/yr as researchers adopt instrument-free workflows.
  - vector: scale_economies
    who: NIH / academic funding cuts
    falsifier: Instrument placements stay frozen (instruments < -20%/yr) for two more years, shrinking the future consumables
      annuity.
  - vector: cornered_resource
    who: Illumina spatial entry + design-arounds
    falsifier: Illumina or a combinatorial-barcoding rival takes material spatial share while 10x's IP suits stall.
  takeaway: '10x''s Scale-Economies Power — a >7,900-instrument installed base throwing off ~85% recurring, 70%-margin consumables
    — is real and durable, and its IP estate bankrupted NanoString. But the Power is being audited in real time: single-cell
    consumables are declining, instrument placements are frozen by the NIH funding shock, and instrument-free entrants (Parse
    — and 10x''s own ScaleBio acquisition) attack the razor model the annuity depends on. The market pays ~5x EV/sales for
    a spatial re-acceleration the base case doesn''t yet support; the durability of the consumables annuity through the academic-funding
    shock is the falsifier the valuation rests on.'

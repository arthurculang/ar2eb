central_question: Is the market paying a spatial-growth multiple (~5x EV/sales) for a single-cell-decline reality — or correctly
  pricing a margin inflection plus spatial re-acceleration?
thesis: '10x trades at ~$3.6B (≈$28/sh) — ~5x EV/sales on ~$600M revenue now flat-to-declining for three years. A dominant
  tools franchise: >7,900 instruments and ~85% recurring 70%-gross-margin consumables, net-cash and cash-generative after
  a 17% opex cut. The mature DCF asks whether revenue re-accelerates and margins convert to operating profit — against an
  NIH-funding shock and instrument-free rivals. The finding: the recent triple prices a spatial re-acceleration the base case
  (~3% grind) doesn''t support — only the bull (~8%) approaches spot, the ultra-bull clears it.'

    narrative:
    - 'Zipline IPOs in 2029 on the back of a US-density inflection — Walmart scaling past DFW and Atlanta into Houston, Phoenix,
      and five states, the State Dept partnership tripling African healthcare facilities, and the Platform 2 droid proving
      precise home delivery at volume. Lead underwriters anchor a $13B post-money — roughly 1.7× the Series H valuation — reflecting
      delivery growth, the largest live autonomous network, and a re-opened logistics-tech IPO window.

      '
    - 'Per-share at IPO ≈ $101.6 nominal. PV back to today at a 20% venture-WACC over ~3 years = ~$58.8 — above the ~$50 secondary
      and near the ~$65 mark. That is why secondary buyers paying ~$50 capture the discount: the modal good outcome already
      clears the entry price.

      '
    - 'Modal outcome; the US density curve is the variable.


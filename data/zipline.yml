central_question: 'Is the Series H $7.6B mark (~$65/share) defensible against a probability-weighted exit distribution over
  3-5 years — and, given secondaries already trade ~23% under the mark at ~$50, is the discount itself the opportunity?

  '
thesis: 'Zipline runs the world''s largest autonomous logistics network — >2M commercial deliveries and >120M autonomous miles
  by Jan 2026, US volume now exceeding the rest of the world combined and growing ~15%/week for ~7 months. The dominant variable
  in valuing the equity today is not an operating DCF (revenue is undisclosed, ~$50M ARR is an estimate) but the exit distribution:
  an IPO between 2029 and 2030 at $13-25B is the modal good outcome (PitchBook puts IPO likelihood ~97%; the Series H crossover
  syndicate — Fidelity, Tiger — is the classic pre-IPO setup). The Walmart anchor plus the Platform 2 droid (precise ~1m home
  delivery, commercial since Apr 2025) give it a line-of-sight to $2-4/delivery from ~$13.50 today. The bear is not erosion
  but capital intensity meeting unproven scale economics, FAA BVLOS dependency, and heavyweight competition. Probability-weighted
  PV lands near $58 — above the ~$50 secondary, below the ~$65 mark. The load-bearing input is the discount rate, not the
  exit valuations. Five exit scenarios, weighted; show your work.

  '

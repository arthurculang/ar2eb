competitive:
  arena: >
    Autonomous drone logistics — Zipline vs Alphabet Wing, Amazon Prime Air, DoorDash/Flytrex,
    and Matternet/UPS Flight Forward; the race to own scaled, certified, low-cost last-mile delivery.
  lens: power_origination
  powers:
    scale_economies:     { score: 3, note: "Fleet + network density amortize fixed autonomy/ops cost; the largest live network by volume." }
    network_economies:   { score: 2, note: "Hub density compounds — more sites per metro lowers cost and widens coverage." }
    counter_positioning: { score: 2, note: "Full-stack autonomy vs incumbent van logistics; hard for asset-heavy delivery to copy." }
    switching_costs:     { score: 2, note: "Integrated into Walmart and health-system operations and SKUs; rip-out cost rises with depth." }
    branding:            { score: 2, note: "Trusted healthcare + retail delivery brand across seven countries." }
    cornered_resource:   { score: 3, note: "Years of certified BVLOS ops + the largest live autonomous network — not quickly replicable." }
    process_power:       { score: 3, note: "Autonomy stack + droid precision engineering refined over >120M miles." }
  dominant_power: cornered_resource
  window: open
  rivals:
    - { name: "Alphabet Wing", kind: incumbent-division, note: "~350k deliveries vs Zipline's >2M; Alphabet balance sheet + distribution.", share_now: 0.10, share_terminal: 0.18, capital: "Alphabet balance sheet" }
    - { name: "Amazon Prime Air", kind: incumbent-division, note: "MK30 drone + Amazon logistics scale; slow to certify at volume.", share_now: 0.08, share_terminal: 0.20, capital: "Amazon balance sheet" }
    - { name: "DoorDash / Flytrex", kind: private, note: "Restaurant/retail delivery network adding drones via Flytrex.", share_now: 0.05, share_terminal: 0.10, capital: "$ billions" }
    - { name: "Matternet / UPS Flight Forward", kind: incumbent-division, note: "Healthcare/B2B drone routes; narrower consumer footprint.", share_now: 0.04, share_terminal: 0.07, capital: "UPS balance sheet" }
  lead_lag:
    - { metric: "Delivery volume / autonomous miles", company: ">2M / >120M", best_rival: "~350k", verdict: leading }
    - { metric: "Certified BVLOS operating base", company: "7 countries, multi-year", best_rival: "limited", verdict: leading }
    - { metric: "Balance-sheet / distribution scale", company: "~$1B cash", best_rival: "far larger", verdict: lagging }
  takeaway: >
    Zipline is originating a real cornered-resource position — the largest live, certified, multi-country
    autonomous network and a refined autonomy/droid stack — anchored by Walmart and scaling US density;
    it lags Alphabet and Amazon on balance-sheet and distribution scale, so the window is open while the
    frontier moves — whether Wing or Prime Air closes the certified-volume gap is the falsifier.

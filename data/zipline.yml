  bear:
    label: Stay Private
    short_label: StayPriv
    probability: 0.22
    headline: Stays private 4y+; no liquidity.
    narrative:
    - 'The "stays private" path. Zipline raises one or two more growth rounds at marks that grow modestly — a Series I around
      $5.5B by 2030 — but no IPO appears credible (a depressed listing window, BVLOS scale-up taking longer than planned, or
      a decision that public-market quarterly pressure conflicts with the long build-out). Secondaries create episodic liquidity
      at steep discounts to the mark.

      '
    - 'The network is real — deliveries compound and the droid scales — but without an IPO catalyst the holder faces ~4 years
      of illiquidity and dilution. PV at a 22% venture discount: ~$19, below both the secondary and the mark even as the nominal
      round price grows. This is the underappreciated outcome for a capital-intensive private.

      '
    - 'Stripe is the canonical case: a rich mark, no IPO years later.

      '
    probability_rationale: 'Stripe is the analog: a high mark and no IPO years on. A capital-intensive network can keep raising
      from crossover funds without a listing if the window stays shut. Plausible over 4 years but not over 5+; eventually holders
      demand liquidity and the ~97% IPO-likelihood read reasserts. 22% reflects the real chance the build simply takes longer
      than the market window allows.

      '

scenarios:
  ultra_bear:
    label: Down Round
    short_label: DownRnd
    probability: 0.1
    headline: Scale economics fail; down-round.
    narrative:
    - 'Unit economics stall above ~$13/delivery — the droid fleet doesn''t hit the density that drives cost toward $2-4, and
      a capital-intensive build (~$1.8B raised) collides with a tighter funding market. FAA BVLOS rule-making slows the US
      expansion; Walmart caps the rollout at a handful of metros rather than five states. Alphabet Wing and Amazon Prime Air
      undercut on subsidized economics. A planned 2029 listing is pulled; a bridge round prices below the Series H mark, triggering
      dilution and a quiet strategic sale.

      '
    - 'At the resulting $3B post-money, common-equity per share falls to ~$22.7 nominal — discounted three years at a 25% venture-WACC
      (illiquidity + execution + dilution), and after a 15% within-scenario write-to-zero probability, expected PV is ~$10.8/share,
      roughly a fifth of the secondary.

      '
    - 'Scale-economics failure + funding-market tightening + regulatory delay is a compound event sized at ~10%.

      '
    probability_rationale: 'Cost-curve failure + a capital-market squeeze + BVLOS delay is a compound 3-vector event. Each
      individually 20-35% over three years; joint at ~10%. The dominant risk for a pre-profit hardware-logistics network is
      that scale economies never arrive before the cash does — one binary, not slow erosion. The live >2M-delivery base and
      net-cash balance sheet keep this off the modal path.

      '
    exit_terms:
      kind: down_round
      exit_year: 2029
      years_to_exit: 3.0
      exit_post_money_billion: 3.0
      exit_per_share_nominal: 22.7

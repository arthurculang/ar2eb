spot_caveat: '$50 is the secondary-market per-share (Forge ~$49.49 / Nasdaq Private ~$51.40, Jun 2026) — a ~23% discount to
  the ~$65/share Series H primary mark ($7.6B post-money ÷ ~117M fully-diluted). The discount to the mark IS the entry: the
  same exit distribution that values the mark fully is positive against $50. FDS is an estimate (undisclosed).

  '

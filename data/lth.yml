      luxury_club_count_fy30: 107                                # 42 + 5×13
      fcf_to_ebitda_ratio:    0.50

  # ───────────────────────────────────────────────────────────────────────────
  ultra_bull:
    label: Ultra Bull
    short_label: UltBull
    probability: 0.05
    expected_per_share: 95.14
    headline: "Luxury category-of-one; 15x re-rate."
    narrative:
      - >
        The ultra-bull case is that LTH compounds as the dominant luxury
        wellness platform AND the market re-rates. Network grows 191 → 250
        clubs by 2030 at 15+ new clubs/year (vs 12-14 base). Average member
        spend rises from $4,500 to $6,500 annually as ultra-luxury services
        (medspa, nutrition science, recovery) drive ARPU. SLB program
        self-funds at 6% cap rate with bank financing. EBITDA grows to
        $1.5B+ by 2030.
      - >
        Multiple expands from 9x EV/EBITDA (current) to 15x as growth story
        consolidates and capital structure de-risks. Result: $22.5B EV -
        $1.3B net debt = $21.2B equity ÷ 235M FY30 shares = $90/share. The
        ultra-bull case requires BOTH operational excellence AND multiple
        re-rating — most LTH bulls only price one of these.
    probability_rationale: >
      Joint conditional: 250+ clubs by 2030 (40%) AND ARPU $6,500+ achieved
      via medspa/recovery upsell (50% conditional on club growth) AND SLB
      self-funded with bank capital (60%) AND multiple expansion to 15x
      EV/EBITDA (50%). Joint at 4-6%, reflected here at 5%. Tail of tails:
      LTH stops being a 'leveraged real estate compounder' and becomes a
      'luxury wellness software-like compounder.'


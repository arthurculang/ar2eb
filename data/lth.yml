# Schema v003 · 2026-05-18_07-00
# ═════════════════════════════════════════════════════════════════════════════
#
# Mature-Company DCF (standard — no SOTP framing). Same length-5 DCF arrays
# as ZM, but `dcf_metrics` third metric is `slb_total_5y` (cumulative
# sale-leaseback proceeds over 5 years) instead of ZM's `anthropic_stake`.
# No `special_assets` field in dcf_path — straight op_ev + cash - net_debt
# equity equation.
#
# This is the test case for "Mature-Company DCF where third ribbon metric is
# ticker-specific (SLB for LTH, Anthropic for ZM)." Generator dispatches on
# `dcf_type` + checks for known third-metric keys.
# ═════════════════════════════════════════════════════════════════════════════

# ── Ticker identity ─────────────────────────────────────────────────────────

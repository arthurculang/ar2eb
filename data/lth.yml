      buyback (early 2026), no dividend. The PE sponsors (Leonard Green, TPG) that took the company private in 2015
      are selling down.'
    incentive_alignment: Akradi’s steady-state pay is modest (~$6.3M FY2024); the headline ~$218M for 2025 was a one-time
      exercise of 2015 legacy options, not run-rate, and he net-accumulated shares. He owns ~7.3%. The persistent
      flag is a related-party real-estate web — Life Time leases multiple properties from Akradi-affiliated entities
      ($0.8-2.6M/yr each) and historically forgave a $17.7M loan to him — with audit-committee oversight.
    governance_flags:
    - single class of common stock, one vote per share — no founder super-voting; Akradi’s ~7.3% economic stake equals
      his vote
    - controlled-company status ENDED (June 2025) as the sponsor "Voting Group" fell below 50%; Leonard Green retains
      one board-nomination right, TPG/Partners Group none
    - founder concentration — Akradi holds all three of Chairman, President and CEO; he also chairs another public
      company (Northern Oil & Gas)
    - the lead independent director (Danhakl) is the managing partner of lead sponsor Leonard Green — an independence
      caveat; board is ~10 of 12-13 independent
    - classified / staggered board (three classes), plus a recurring related-party real-estate web (Akradi-affiliated
      leases / sale-leasebacks) under audit-committee oversight
    key_person_risk: medium
    score: 3
    takeaway: 'The positives are real for a founder-led, post-LBO name: single-class one-vote (no super-voting; the
      founder owns just ~7.3%), controlled-company status already ended, deleveraging done, and a first buyback. Holding
      it at 3 are the concentration of all three top titles in Akradi, a lead independent director who is the lead
      sponsor’s managing partner, a classified board, and — most of all — a persistent related-party real-estate web
      (Akradi-affiliated leases and a historical loan forgiveness). Key-person risk is moderate.'

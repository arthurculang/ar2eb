# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Is Life Time a premium wellness platform with durable luxury economics —
  or a leveraged real estate vehicle whose positive FCF depends on perpetual
  $400M/year sale-leasebacks?

thesis: >
  LTH trades at $40.04 ($8.9B mkt cap) on TTM revenue $3.0B and Adj EBITDA
  $824M (27.5% margin). 190+ premium athletic clubs, 891K members, 12-14
  luxury openings/yr. But FY25 FCF $206M required $400M of sale-leaseback
  proceeds offsetting $870M capex — ex-SLB, operating FCF is zero. Bear:
  capital recycling unsustainable, leveraged real estate vehicle. Bull:
  luxury wellness category-of-one, SLB is smart financing. Today's price
  requires bull-case execution. Five scenarios, weighted; show your work.


# ═════════════════════════════════════════════════════════════════════════════
# SCENARIOS
# ═════════════════════════════════════════════════════════════════════════════

scenarios:

  # ───────────────────────────────────────────────────────────────────────────
  ultra_bear:
    label: Ultra Bear
    short_label: UltBear
    probability: 0.08
    expected_per_share: 0.00
    headline: "Leverage bites; deep decline."
    narrative:
      - >
        The deepest tail: a real recession compresses discretionary luxury-fitness
        spend, so memberships and revenue do not merely decelerate (the bear) but
        decline — revenue shrinks at a low-single-digit rate through FY30 and the
        FCF margin erodes toward the low single digits.
      - >
        The sale-leaseback tap closes faster and on worse terms in a downturn:
        less real-estate value is realized (~$0.55B over five years vs the bear's
        ~$0.95B) while the rent obligations from prior SLBs keep compounding
        against a shrinking revenue base — the capital-recycling engine runs in
        reverse.
      - >
        With ~$1.3B of financial net debt (plus $2.5B+ of capitalized leases)
        sitting against a declining ~$0.6B operating EV, the equity is deeply
        underwater — a notional -$2/share. Expected per-share floors at $0.00: a
        markedly deeper wipeout than the bear, where the business at least holds
        flat. This is the tail where the leveraged structure, not the brand,
        decides the outcome.
    probability_rationale: >
      The deepest-failure tail, split from the bear so the downside is not one
      undifferentiated bucket (the book-wide convention). 8% weight reflects a
      genuine recession-plus-leverage scenario for a company whose enterprise
      obligations approach $4B; distinct from the bear (flat-to-soft, equity ~$0)
      in that revenue actually declines and the SLB engine reverses. Mature names
      carry no within-scenario failure probability, so the value is the levered
      DCF floored at zero.

    # Mature-Company DCF metrics (LTH variant: third metric is SLB total)
    dcf_metrics:
      cagr_5y: -3.4
      wacc: 0.115
      slb_total_5y: 0.55          # cumulative SLB proceeds over 5y ($B) — taps out faster in a downturn

    # 5-year DCF path (FY26 → FY30) — length-5 arrays, NOT zero-padded
    dcf_path:
      rev_b: 2.995
      rev_path:    [0.03, -0.02, -0.05, -0.06, -0.07]    # growth rates (revenue declines)
      op_margin:   [0.165, 0.155, 0.145, 0.135, 0.125]
      wacc_path:   [0.115, 0.115, 0.115, 0.115, 0.115]
      fcf:         [0.120, 0.105, 0.085, 0.065, 0.050]
      pv_fcf:      [0.108, 0.084, 0.061, 0.042, 0.029]
      term_g: 0.010
      sum_pv_fcf: 0.32
      terminal_value: 0.48
      pv_terminal: 0.28
      op_ev: 0.60
      cash: 0.232
      net_debt: 1.522
      total_equity: -0.69           # = op_ev + cash - net_debt
      raise_total: 0.0
      dilution_pct: 0
      final_shares: 222
      dcf_per_share: -3.11
      distress: 0.0

    chart_data:
      slb_per_year:           [0.20, 0.15, 0.10, 0.05, 0.05]    # $B SLB proceeds (sums to slb_total_5y)
      luxury_club_count_fy30: 60                                 # fewer luxury openings in a downturn
      fcf_to_ebitda_ratio:    0.08

  # ───────────────────────────────────────────────────────────────────────────
  bear:
    label: Bear
    short_label: Bear
    probability: 0.12
    expected_per_share: 0.00
    headline: "Capital recycling, not earnings."
    narrative:
      - >
        The pessimistic case is straightforward. LTH only delivers 'positive
        FCF' after $400M/year of sale-leaseback proceeds. Strip those out and
        operating FCF is barely positive — FY25 OCF $870M minus capex ~$870M
        equals zero before SLB. The reported $206M FY25 FCF is essentially
        $400M of real estate proceeds offset against expansion capex. This
        is capital recycling reported as cash generation.
      - >
        The SLB program is finite. LTH has ~190 clubs, of which perhaps 40-50
        remain owned outright after cumulative SLB transactions. At $40M
        average per club, that's roughly $2B of remaining real estate
        runway. At the planned $400M/year pace, the tap closes in 4-5 years
        — exactly the DCF horizon. Meanwhile rent obligations from prior
        SLBs (~$300M/yr and growing) compound — every SLB trades a one-time
        cash inflow for a permanent operating expense increase.
      - >
        Net debt is $1.3B financial plus $2.5B+ of capitalized lease
        liabilities. Total enterprise obligations near $4B. If macro slows
        and luxury fitness spending compresses, FCF margin drops to 2-3%,
        undoing the recent S&P upgrade. Net debt builds back. Stock works
        to $20-25 as the market re-applies a higher discount rate to the
        operating business.
    probability_rationale: >
      Bearish thesis is structurally coherent: LTH's headline FCF is
      dependent on SLB proceeds (~$400M/yr); strip those out and operating
      FCF is barely positive. Cumulative SLB program is finite (~$2B
      remaining); each SLB trades one-time cash for permanent rent increase.
      Net debt + capitalized lease obligations near $4B. If macro slows and
      luxury fitness spend compresses, FCF margin drops, stock works to
      $20-25. The 12% weight reflects that this thesis bumps against LTH's
      actual track record: FY24/25 execution strong, recent S&P upgrade
      validates the credit story, and new luxury club economics ($25-35M
      revenue vs $15-20M legacy) genuinely change the unit math.

    # Mature-Company DCF metrics (LTH variant: third metric is SLB total)
    dcf_metrics:
      cagr_5y: 5.1
      wacc: 0.110
      slb_total_5y: 0.95          # cumulative SLB proceeds over 5y ($B)

    # 5-year DCF path (FY26 → FY30) — length-5 arrays, NOT zero-padded
    dcf_path:
      rev_b: 2.995                 # starting revenue ($B FY25 actual)
      rev_path:    [0.11, 0.06, 0.04, 0.03, 0.02]    # growth rates
      op_margin:   [0.175, 0.170, 0.160, 0.150, 0.140]
      wacc_path:   [0.110, 0.110, 0.110, 0.110, 0.110]
      fcf:         [0.133, 0.176, 0.147, 0.113, 0.077]
      pv_fcf:      [0.120, 0.143, 0.107, 0.075, 0.046]
      term_g: 0.015
      sum_pv_fcf: 0.49
      terminal_value: 0.82
      pv_terminal: 0.49
      op_ev: 0.98
      cash: 0.232
      net_debt: 1.522
      total_equity: -0.31           # = op_ev + cash - net_debt (negative for bear)
      raise_total: 0.0
      dilution_pct: 0
      final_shares: 222
      dcf_per_share: -1.4
      distress: 0.0

    chart_data:
      # LTH chart auxiliaries — no raises (LTH doesn't issue equity),
      # SLB cadence + luxury club count instead
      slb_per_year:           [0.30, 0.25, 0.20, 0.10, 0.10]    # $B SLB proceeds (sums to slb_total_5y)
      luxury_club_count_fy30: 77                                 # 42 + 5×7 (5 years × 7 luxury openings)
      fcf_to_ebitda_ratio:    0.10                               # for terminal EV/EBITDA computation

  # ───────────────────────────────────────────────────────────────────────────
  base:
    label: Base
    short_label: Base
    probability: 0.55
    expected_per_share: 13.96
    headline: "Premium platform, leveraged structure."
    narrative:
      - >
        The middle path takes LTH's recent execution at face value. Revenue
        grows 11% in FY26 per guidance, decelerating to mid-single-digits as
        the base builds. Adjusted EBITDA margin holds in the 28-30% range —
        top quartile for consumer services. Average revenue per membership
        grows from $3,531 toward $4,000 as new luxury clubs ramp at higher
        price points.
      - >
        New club economics are unique: 1.2M sq ft of 2026 openings is
        concentrated in resort-style luxury formats generating $25-35M
        annual revenue at maturity vs $15-20M for legacy. Maturation takes
        3-4 years; 2026 openings contribute meaningfully only by 2028-29.
        SLB cadence holds at $300-400M for 2-3 years then tapers. Net debt
        leverage stays in the 1.5-2.0x EBITDA target.
      - >
        The math: $4.39B op EV + $0.23B cash − $1.29B net debt = $3.33B
        equity ÷ 222M sh = $13.96/share. Materially below today's $40.04 —
        meaning the current price requires bull-case assumptions. The base
        case is well-run but priced for steady-state execution. Modest
        upside requires the bull narrative to convert.
    probability_rationale: >
      Modal outcome. LTH executes guidance: revenue grows 11% FY26,
      decelerating to mid-single-digits. EBITDA margin holds 28-30% (top
      quartile for consumer services). New 2026 club openings (1.2M sq ft,
      mostly luxury) mature over 3-4 years. SLB cadence holds for 2-3 more
      years then tapers. Net debt leverage stays in the 1.5-2.0x EBITDA
      target. The 55% weight reflects that this requires the least faith —
      sequential execution on plans already in motion. The base case is
      well-run but priced for steady-state execution; the multiple stays
      compressed.

    dcf_metrics:
      cagr_5y: 7.8
      wacc: 0.095
      slb_total_5y: 1.70

    dcf_path:
      rev_b: 2.995
      rev_path:    [0.11, 0.09, 0.08, 0.06, 0.05]
      op_margin:   [0.180, 0.185, 0.188, 0.190, 0.190]
      wacc_path:   [0.095, 0.095, 0.095, 0.095, 0.095]
      fcf:         [0.233, 0.290, 0.313, 0.332, 0.348]
      pv_fcf:      [0.213, 0.242, 0.238, 0.231, 0.221]
      term_g: 0.025
      sum_pv_fcf: 1.14
      terminal_value: 5.10
      pv_terminal: 3.24
      op_ev: 4.39
      cash: 0.232
      net_debt: 1.522
      total_equity: 3.1
      raise_total: 0.0
      dilution_pct: 0
      final_shares: 222
      dcf_per_share: 13.96
      distress: 0.0

    chart_data:
      slb_per_year:           [0.40, 0.40, 0.35, 0.30, 0.25]    # sums to ~1.70
      luxury_club_count_fy30: 97                                 # 42 + 5×11
      fcf_to_ebitda_ratio:    0.30

  # ───────────────────────────────────────────────────────────────────────────
  bull:
    label: Bull
    short_label: Bull
    probability: 0.20   # reduced from 0.25 for ultra_bull (20+5=25)
    expected_per_share: 45.0
    headline: "Luxury wellness platform compounds."
    narrative:
      - >
        The bull case is that Life Time is a category of one. There is no
        other US operator at the premium luxury athletic country club scale
        — Equinox is private and smaller, gym chains are budget-positioned,
        boutique concepts are single-discipline. LTH's 'Country Club'
        positioning combines fitness, racquet sports, kids, pools, dining,
        work-from-club spaces, and recovery in a single membership.
      - >
        In-center revenue compounds faster than membership dues — Dynamic
        Personal Training, swim lessons, pickleball clinics, MIORA hormone
        optimization, Life Spa, Life Cafe. In-center revenue per member
        grows from $1,050 toward $1,400-1,500. SLB program sustains: as LTH
        opens 12-14 new luxury clubs/year, each becomes future SLB inventory
        5-7 years later. The flywheel: build → operate → SLB → recycle.
      - >
        EBITDA margin expands toward 30%+ as new-club mix shifts to
        higher-revenue luxury formats. Operating FCF ex-SLB turns
        meaningfully positive by FY28. Stock works to $46+ as the market
        gives LTH credit for a premium consumer franchise, re-rating from
        ~15x P/E toward 22-25x.
    probability_rationale: >
      Multi-decade luxury wellness platform compounding. LTH is genuinely a
      category-of-one — no other US operator at premium luxury athletic
      country club scale (Equinox is private and smaller; gym chains are
      budget-positioned; boutique concepts are single-discipline). In-center
      revenue (Dynamic PT, MIORA hormone optimization, swim lessons,
      pickleball clinics, spa, cafe) compounds faster than dues. EBITDA
      margin expands toward 30%+ as new-club mix shifts to higher-revenue
      luxury formats. The SLB flywheel sustains: 12-14 new luxury clubs/year
      become future SLB inventory 5-7 years later. The 25% weight reflects
      that multiple expansion (15x P/E to 22-25x) is plausible but requires
      both execution AND market re-rating — the conjunction is demanding.

    dcf_metrics:
      cagr_5y: 9.8
      wacc: 0.080
      slb_total_5y: 2.00

    dcf_path:
      rev_b: 2.995
      rev_path:    [0.12, 0.11, 0.10, 0.09, 0.07]

appendix:
  pushback:
  - label: The +18% growth is a billing-model mirage.
    body: The agency->direct model inflates as-reported revenue/billings/FCF; the base uses the lower underlying ~8-12%, and
      still lands +53%.
  - label: Switching costs are the real moat.
    body: CAD/file-format lock-in (.dwg/.rvt, trained workforces, BIM mandates) makes Autodesk mission-critical - the durability,
      not the growth rate.
  - label: Starboard is forcing an under-earned margin.
    body: A ~$500M stake + proxy fight pushing ~45% operating margin by FY28 against ~22% today is the explicit margin catalyst,
      not a growth bet.
  - label: Maturing growth is the live risk.
    body: Decelerating mid-teens (before the billing flatter), cyclical end-markets, and execution/CEO noise keep the bear (+9%)
      and ultra-bear (-25%) in play.
  - label: Roughly net-cash-neutral, p_fail ~0.
    body: $2.60B cash vs $2.50B debt (~$0.1B net cash) on $2.4B FCF — no solvency risk; the downside is multiple/margin execution.
  triggers:
  - label: Bull validation
    body: Starboard margin program ratified, operating margin steps toward mid-30s+  ·  underlying (cc/model-adjusted) growth
      holds >=8%  ·  RPO/billings re-accelerate ex-model-change  ·  AEC + cloud keep outperforming
  - label: Bear validation
    body: underlying growth decelerates below ~6% ex-billing-change  ·  the activist program stalls and margins stay near ~22%
      ·  construction/manufacturing cycle turns down  ·  CEO/execution disruption
  - label: Reframe needed
    body: if the lock-in cracks (a cloud-CAD challenger or open file formats erode .dwg/.rvt switching costs) OR Starboard
      exits with margins unchanged, re-rate the terminal toward a slow-growth, mid-20s-margin software multiple
glossary:
- term: Switching costs
  definition: 'Helmer Power: CAD/file-format lock-in (.dwg/.rvt), trained workforces, and BIM mandates that make leaving Autodesk
    costly — the dominant, durable moat.'
- term: AEC
  definition: Architecture, Engineering & Construction — Autodesk's largest segment (Revit, AutoCAD, Construction Cloud);
    the outperforming end-market plus Manufacturing (Fusion) drives the top line.
- term: New transaction model
  definition: The agency->direct billing change that inflates as-reported revenue/billings/FCF growth; the base strips it out
    to the lower underlying (cc, model-adjusted) ~8-12% rate.
- term: Starboard / activist
  definition: Starboard Value's ~$500M stake and proxy fight pushing ~45% adjusted operating margin by FY28, comp realignment,
    and a CEO reassessment — the explicit margin catalyst (a process-power story).
- term: FCF margin
  definition: Free cash flow / revenue (~33% FY26 as-reported); the mature-DCF swing factor — whether the activist-forced
    operating-margin lift toward ~45% converts to free cash flow.
competitive:
  arena: 'Design/engineering software — Autodesk (CAD/BIM franchise: AutoCAD, Revit, Fusion, Construction Cloud) vs PTC, Dassault,
    Ansys, Bentley, Adobe, and emerging cloud-CAD; auditing a switching-cost Power against maturing growth and an activist-forced
    margin reset.'
  lens: power_audit
  powers:
    scale_economies:
      score: 3
      note: R&D and go-to-market leverage across a ~$7.2B, ~98%-recurring base; large vs CAD peers, the cost base Starboard
        is targeting.
    network_economies:
      score: 2
      note: File-format + ecosystem effects (.dwg/.rvt as industry standards, partner/plug-in ecosystem) — real but more standard
        than two-sided network.
    counter_positioning:
      score: 1
      note: Was the desktop-CAD disruptor; now the subscription incumbent, with cloud-CAD challengers counter-positioning
        against it.
    switching_costs:
      score: 4
      note: 'The dominant Power: CAD/file-format lock-in (.dwg/.rvt), trained workforces, BIM mandates and deep workflow integration
        make migration costly and rare.'
    branding:
      score: 3
      note: AutoCAD/Revit are category-defining, mission-critical brands with pricing power across architecture/engineering/manufacturing.
    cornered_resource:
      score: 2
      note: The installed file-format standards + decades of drawing data are a quasi-cornered asset, though not legally exclusive.
    process_power:
      score: 2
      note: Emerging via the Starboard cost program (sales-optimization, comp realignment) and cloud/AI delivery — the margin-expansion
        lever, unproven at the ~45% target.
  dominant_power: switching_costs
  durability: high
  rivals:
  - name: PTC
    kind: public
    note: CAD/PLM peer (Creo, Windchill); recurring-software comp on growth and margin.
    growth: 0.1
    margin: 0.27
    multiple: ~30x EV/FCF
  - name: Dassault Systemes
    kind: public
    note: CAD/PLM scale leader (SolidWorks, CATIA, 3DEXPERIENCE); the closest large-cap design franchise.
    growth: 0.08
    margin: 0.3
    multiple: ~30x P/E
  - name: Ansys
    kind: public
    note: Simulation leader (now Synopsys-owned); adjacency in engineering software.
    growth: 0.11
    margin: 0.4
    multiple: ~30x EV/FCF
  - name: Bentley Systems
    kind: public
    note: Infrastructure-engineering software; direct AEC competitor in civil/infrastructure.
    growth: 0.1
    margin: 0.28
    multiple: ~35x P/E
  threats:
  - vector: switching_costs
    who: Cloud-CAD challengers / open file formats
    falsifier: A credible browser-native CAD platform or open .dwg/.rvt interoperability erodes lock-in and lifts churn.
  - vector: scale_economies
    who: Maturing growth + construction/manufacturing cycle
    falsifier: Underlying (ex-billing-change) growth decelerates below ~6% as end-markets soften, de-levering the operating
      model.
  - vector: process_power
    who: Starboard rebuffed / margin program stalls
    falsifier: Operating margin stays near ~22% and the ~45% target slips, confirming the under-earned gap won't close.
  takeaway: 'Autodesk''s dominant Power is switching costs — CAD/file-format lock-in (.dwg/.rvt), trained workforces, BIM
    mandates, and deep workflow integration make its ~98%-recurring base sticky and mission-critical, durability high — reinforced
    by category-defining branding and real scale. The live audit question is not whether the moat holds but whether two things
    stack on top of it: a maturing top line (the +18% as-reported figure is flattered by the billing change; underlying is
    ~8-12%) and a Starboard-forced lift toward ~45% operating margin, a process-power catalyst that is unproven at target.
    The threats are a cloud-CAD/open-format challenge to lock-in, a construction/manufacturing cycle, and the activist program
    stalling. The ~31% de-rate to ~17x FCF prices maturing growth heavily; the DCF tests lock-in plus the margin catalyst,
    and even the bear is +9% with the modal case +53% on the lower underlying growth — cheap quality with a catalyst, with
    activist/execution noise the watch-out.'
pocd:
  people:
    ceo: 'Andrew Anagnost'
    founder_led: false
    tenure_years: 9
    insider_ownership_pct: 0.5
    capital_allocation: 'Disciplined capital return. No dividend since 2004; buybacks are the primary return and are accelerating ($1.4B in FY2026 against a $10B authorization), outpacing heavy SBC ($788M FY2026) so the share count net-declines (~229M in 2009 to ~211M in 2026). Balance sheet is roughly net-cash (~$3.0B cash + securities vs ~$2.5B notes). M&A is programmatic tuck-ins, not transformational.'
    incentive_alignment: 'CEO pay is heavily equity-weighted (FY2026 total ~$30.1M, ~90% stock, ~4% salary). Say-on-pay passed in 2026. Insider Form 4 activity is mostly grants + tax-withholding; a recent alignment signal is CFO Janesh Moorjani''s open-market BUY of 2,500 shares (~$0.5M) in Jun 2026.'
    governance_flags:
      - 'single class, one vote per share; no controlling or super-voting holder'
      - 'strong structure: an independent Chair (Stacy Smith) separate from the CEO, 11 directors with 10 independent (~91%), all-independent committees, and an annually-elected (declassified) board'
      - 'central flag - a FY2024 audit-committee investigation into free-cash-flow / non-GAAP operating-margin practices (FY2022-24): discretionary spend, collections, and AP timing were informed by their effect on FCF/margin targets; NO restatement, but remedial measures and an NT 10-K / delayed 10-K resulted'
      - 'CFO turnover around the probe (Clifford -> interim Rafael -> permanent Moorjani, 2024)'
      - 'Starboard Value activist campaign (2024-25, ~$500M stake, publicly urged a CEO change) settled Apr 2025 with two new independent directors (Epstein, Simons) + a standstill'
    key_person_risk: low
    score: 3
    takeaway: 'Structurally clean governance - single-class one-vote, an independent Chair split from a long-tenured professional CEO, a ~91%-independent declassified board, and buyback discipline that shrinks the share count. Held to a 3 by the FY2024 free-cash-flow / non-GAAP-margin reporting investigation (no restatement, but a real control-environment flag), the CFO turnover around it, and the Starboard campaign that had to force accountability.'
  opportunity_ref: 'The scenario distribution · the Page-3 business snapshot · the Arthur Indicator'
  context_ref: 'The 7 Powers analysis (Power Audit)'
  deal: 'Open-market purchase = the deal: entry price vs. the scenario distribution (the +53.6% finding) + position sizing.'

thesis: 'Autodesk trades at ~$41.9B (~$198, down ~31% YTD near the 52-week low) — ~17x FCF on $7.21B revenue, a ~98%-recurring
  CAD/design franchise, roughly net-cash-neutral. The +18% as-reported growth is flattered by an agency->direct billing change;
  underlying (cc-adjusted) growth is nearer ~8-12%. The bull is durable switching-cost lock-in plus a Starboard-forced lift
  toward ~45% operating margin by FY28; the bear is maturing growth and activist/execution noise. The finding is +53.6%: even
  the bear is +9% and the modal case +53% on the lower underlying growth.'

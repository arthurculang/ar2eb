central_question: As comps inflect barely positive while restaurant-level margin compresses, does the 4,100->7,000 unit runway
  re-rate the stock, or is ~30x FCF already full?
thesis: Chipotle trades at ~$41.96B (~$32.23, down ~14% YTD / ~36% TTM, near the 52-week low) — ~30x FCF on $11.93B revenue,
  net cash, GAAP op margin 16.2% off a 16.9% peak. Q1'26 comps just turned positive (+0.5%, traffic-led, no price), but restaurant-level
  margin fell 250bps as management declines to fully price mid-single-digit inflation to defend value. The bull is the unit
  runway (~4,100 -> 7,000 NA) plus throughput/automation; the bear is a maturing concept with structurally low-single-digit
  same-store growth at a premium multiple. The weighted DCF lands -4.8% — the modal base (-5.5%) only reaches about today's
  price; the runway is real, the multiple already pays for it.

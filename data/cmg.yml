weighting_rationale:
- label: Ultra Bear 13%
  body: Comps roll over and margin slides; ~$14.66 (-54%).
- label: Bear 27%
  body: Units grow but same-store stays sluggish; ~$21.83 (-32%).
- label: Base 34%
  body: Runway delivers at low-single-digit comps; ~$30.47 (-5.5%).
- label: Bull 18%
  body: Throughput inflects, comps and margin lift; ~$44.77 (+39%).
- label: Ultra Bull 8%
  body: Full runway plus automation; ~$55.75 (+73%).
appendix:
  pushback:
  - label: Comps finally turned positive — isn't that the inflection?
    body: +0.5% is traffic-led with no price; the modal DCF is still -5.5% because ~30x FCF already embeds a re-acceleration
      the +0.5% doesn't clear.
  - label: The 7,000-unit runway is a long compounding machine.
    body: ~4,100 -> 7,000 NA is ~10% unit growth, but the base lands ~fair because same-store growth is structurally low and
      the multiple already pays for it.
  - label: Margin compression is the live risk, not the runway.
    body: RLM fell 250bps to 23.7% as management won't fully price inflation; the swing is whether unit economics (~25%+ RLM)
      hold while scaling.
  - label: It's the cheapest Chipotle has been in years.
    body: True on the multiple (~30x FCF vs history), but cheap-vs-itself isn't cheap-vs-DCF; the distribution still centers
      slightly negative.
  - label: Net cash, p_fail ~0.
    body: ~$1.05B cash and no funded debt — no solvency risk; the downside is multiple/comp/margin, not survival.
  triggers:
  - label: Bull validation
    body: comps re-accelerate with traffic (not price)  ·  RLM recovers toward 25%+  ·  automation lifts throughput  ·  openings
      hold toward 7,000
  - label: Bear validation
    body: comps slide back to flat/negative 2+ quarters  ·  RLM falls below ~23%  ·  inflation stays unpriced and op margin
      drifts toward 14%
  - label: Reframe needed
    body: if same-store growth stays structurally low AND margin can't hold ~25%, the runway compounds at low unit economics
      - re-rate toward a maturing QSR multiple
glossary:
- term: Comparable restaurant sales (comps)
  definition: Same-store sales growth at restaurants open 13+ months; Q1'26 +0.5%, traffic-led with no price - the central
    swing signal.
- term: Restaurant-level margin (RLM)
  definition: Restaurant-level operating margin (non-GAAP, 23.7% Q1'26, -250bps YoY) before G&A - the unit-economics gauge
    that must hold ~25%+ as units scale.
- term: AUV
  definition: Average unit volume (~$3M per restaurant) - the per-store sales base, well above QSR, that sets new-unit returns.
- term: Hyphen / makeline automation
  definition: Automated digital makeline being tested to speed throughput and lift restaurant margin - the process lever and
    the bull's margin path.
- term: FCF margin
  definition: Free cash flow / revenue (~12% FY25); the mature-DCF swing factor - whether the unit runway and automation convert
    to free cash flow against growth capex.
competitive:
  arena: Premium fast-casual / fast food — Chipotle (the premium QSR brand, ~$3M AUV, ~4,100 company-owned units) vs Cava,
    Shake Shack, Wingstop and the QSR value set (McDonald's, Taco Bell); auditing a brand Power against QSR value-wars and
    value-perception softness.
  lens: power_audit
  powers:
    scale_economies:
      score: 4
      note: ~$12B revenue, ~4,100 company-owned units -> real sourcing/marketing/G&A leverage and a self-funded build; second
        only to branding here.
    network_economies:
      score: 0
      note: None - restaurants aren't networks; the app/loyalty is a channel, not a network effect.
    counter_positioning:
      score: 1
      note: Was the 'food with integrity' fast-casual disruptor; now the scaled incumbent, so this has faded.
    switching_costs:
      score: 1
      note: Near-zero - dining is promiscuous; loyalty/digital nudges repeat but every meal is a fresh decision.
    branding:
      score: 5
      note: 'The dominant Power: a best-in-class premium QSR brand with ~$3M AUV well above peers and genuine pricing power
        - though it''s choosing not to fully exercise it to defend value.'
    cornered_resource:
      score: 1
      note: Prime real estate, supply relationships and recipe/operations IP; valuable but not truly cornered.
    process_power:
      score: 2
      note: Throughput discipline and Hyphen makeline automation - a real emerging lever but unproven at the 7,000-unit scale;
        the bull's swing factor.
  dominant_power: branding
  durability: high
  rivals:
  - name: Cava (CAVA)
    kind: public
    note: The fast-casual growth darling; richest multiple in the set, the unit-growth comp Chipotle is benchmarked against.
    growth: 0.25
    margin: 0.12
    multiple: ~46x EV/EBITDA
  - name: Shake Shack (SHAK)
    kind: public
    note: Premium 'better burger', smaller and thinner-FCF; a same-archetype premium-brand unit-growth comp.
    growth: 0.06
    margin: 0.04
    multiple: ~13x EV/EBITDA
  - name: Wingstop (WING)
    kind: public
    note: Asset-light franchise compounder; richly valued but wobbling - Q1'26 domestic SSS -8.7%.
    growth: 0.11
    margin: 0.25
    multiple: ~37x EV/EBITDA
  - name: McDonald's (MCD)
    kind: public
    note: The QSR value benchmark; the value-wars/trade-down pressure on Chipotle's premium pricing.
    growth: 0.05
    margin: 0.45
    multiple: ~25x P/E
  threats:
  - vector: branding
    who: QSR value-wars / trade-down (McDonald's, Taco Bell value menus)
    falsifier: Comps stay flat-to-negative as premium pricing loses to value in a soft consumer and value-perception softens.
  - vector: scale_economies
    who: Beef/freight/labor inflation management won't fully price
    falsifier: Restaurant-level margin falls further below ~23%, rolling back the unit economics the runway needs.
  - vector: process_power
    who: Cava / a crowded fast-casual field + throughput limits
    falsifier: Same-store traffic fades and automation doesn't lift margin, so the 7,000-unit build compounds at low unit
      economics.
  takeaway: 'Chipotle''s brand Power is dominant and durable - a best-in-class premium QSR with ~$3M AUV, real scale economies
    across ~4,100 company-owned units, and pricing power it is deliberately not fully using to defend value. The Audit: branding
    is durable (high), process_power (throughput, Hyphen automation) is the emerging swing factor, and the live threats are
    QSR value-wars / value-perception softness plus unrecovered beef/labor inflation that just cut restaurant-level margin
    250bps. The franchise quality isn''t in question; the price is. Comps barely turned positive (+0.5%, no price) while the
    stock still trades ~30x FCF, and the weighted DCF lands -4.8% - the unit runway is real and the brand is excellent, but
    the modal case (-5.5%) shows the multiple already pays for the runway, leaving the upside in the bull/ultra automation-and-comps
    re-acceleration.'
pocd:
  people:
    ceo: Scott Boatwright
    founder_led: false
    tenure_years: 2
    insider_ownership_pct: 1.0
    capital_allocation: Scott Boatwright became CEO in November 2024 (interim from August 2024, after Brian Niccol
      left for Starbucks); an internal promotion, not a founder. The balance sheet is net cash ($0 long-term debt);
      FY2025 net income $1.54B on $11.9B revenue, ~$1.45B FCF, funding aggressive unit growth and a buyback-only return
      (a $1.8B authorization added Dec 2025; ~$2.3B repurchased in 2025), no dividend. Ackman’s Pershing Square fully
      exited in Q4 2025.
    incentive_alignment: Boatwright’s pay is ~96% variable/equity (FY2024 ~$19M including transition grants; FY2025
      ~$15.5M). Insider trading is routine 10b5-1 selling. The flag is say-on-pay volatility — two low votes in five
      years (~51% in 2021, ~55% in 2025, both on one-time equity), each followed by remediation; the 2026 vote recovered
      to ~95%.
    governance_flags:
    - single class of common stock, one vote per share — no dual-class, no controlling shareholder (Ackman exited
      Q4 2025)
    - Chair and CEO are SEPARATE, with an independent Chair (Scott Maw); 9 of 10 directors independent
    - board declassified (annual elections since 2016); all committees independent
    - say-on-pay volatility — two sub-60% votes in five years (2021, 2025), both remediated; a recurring pay-design
      watch-item
    - compressed 2024-25 leadership turnover — a new CEO and a new CFO (after a ~24-year CFO) within ~18 months
    key_person_risk: medium
    score: 4
    takeaway: 'Structurally clean: single-class one-vote, a separate independent Chair, a 9-of-10 independent declassified
      board, net cash, no controlling holder. It sits at the lower end of the clean tier because of two real watch-items
      — a volatile say-on-pay record (two sub-60% votes in five years, both on one-time equity, since remediated)
      and a compressed CEO-plus-CFO turnover in 2024-25. Key-person risk is moderate given the recency of that turnover,
      offset by an internal-promote bench and a clean Niccol-to-Boatwright handoff.'

weighting_rationale:
- label: Ultra Bear 12%
  body: Traffic stalls; FCF never inflects; ~$13 (-76%).
- label: Bear 30%
  body: Units grow but FCF stays thin; ~$25 (-54%).
- label: Base 33%
  body: Runway continues; FCF grinds to 8%; ~$50 (-9%).
- label: Bull 18%
  body: Lynch delivers FCF inflection; ~$85 (+56%).
- label: Ultra Bull 7%
  body: Wingstop-style compounder; ~$121 (+121%).
appendix:
  pushback:
  - label: The de-rate corrected an excess, it didn't create a bargain.
    body: ~13x EV/EBITDA is cheap vs CAVA (~46x) / WING (~37x) but the modal DCF is still ~-9% — thin capital-intensive FCF,
      not the multiple, is the constraint.
  - label: FCF conversion is the whole question.
    body: ~$57M FCF on $1.445B revenue (~4%) while capex runs ~11-12%; the gap between 'units grow' and 'free cash flow grows'
      is the bull/bear fork.
  - label: Build cost below $2.0M is the real improvement.
    body: A ~20% build-cost cut directly lifts new-unit cash-on-cash (~$0.9M restaurant profit on <$2.0M invested) and self-funds
      more of the runway.
  - label: New CEO from an elite compounder.
    body: Rob Lynch built Wingstop into a unit-growth/digital/franchise machine; the drive-thru format + 'Project Catalyst'
      digital backbone are his levers here.
  - label: Net cash, p_fail ~0.
    body: $314M cash vs a single $250M 0% convert (OTM, due 2028) — no solvency risk; the downside is multiple/FCF, not survival.
  triggers:
  - label: Bull validation
    body: traffic re-accelerates above +2% (not just price/mix)  ·  restaurant-level margin holds >=23% through beef inflation  ·  FCF
      margin expands toward 8-10%  ·  55-60+ builds/yr at <$2.0M
  - label: Bear validation
    body: same-Shack sales turn negative or traffic stays negative 2+ quarters  ·  restaurant-level margin falls below ~21%  ·  FCF
      turns negative again as capex outruns cash  ·  another guide-vs-miss on EBITDA
  - label: Reframe needed
    body: if unit growth slows below ~45 builds/yr or build cost creeps back above ~$2.2M, the runway shortens - re-rate the
      terminal toward a low-growth, capital-intensive restaurant multiple
glossary:
- term: Same-Shack sales (SSS)
  definition: Comparable-base sales growth at company-operated Shacks open 24+ months; decelerating to ~+2% and increasingly
    price/mix, not traffic - the central bear signal.
- term: Restaurant-level margin
  definition: Shack-level operating profit margin (non-GAAP, ~22.6% FY25) before corporate G&A and pre-opening - the unit-economics
    gauge; the build feeds it into a 4.3% company operating margin.
- term: AUV
  definition: Average unit volume (~$4.0M company-operated) - the per-Shack sales base that, against build cost, sets new-unit
    returns.
- term: Licensing
  definition: Capital-light royalty revenue (~3.7% of revenue but ~$2.2B system-wide sales) from licensed Shacks, mostly international
    - the brand's high-margin optionality.
- term: FCF margin
  definition: Free cash flow / revenue (~4% FY25); the mature-DCF swing factor - whether heavy growth capex lets the unit
    runway convert to free cash flow.
competitive:
  arena: Premium fast-casual / 'better burger' — Shake Shack (premium brand, ~$4.0M AUV, ~373 company-operated + ~285 licensed)
    vs Chipotle, Wingstop, Cava, Portillo's, and the burger set (Five Guys, In-N-Out, McDonald's value); auditing a brand
    Power against capital intensity and a crowded field.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Sourcing/marketing leverage at $1.4B revenue and growing, but small vs McDonald's/CMG; national scale is years
        away.
    network_economies:
      score: 0
      note: None — restaurants aren't networks; the app/loyalty is a channel, not a network effect.
    counter_positioning:
      score: 1
      note: Was the 'fine casual' better-burger disruptor; now the incumbent, with drive-thru a catch-up format, not counter-positioning.
    switching_costs:
      score: 0
      note: Zero — dining is promiscuous; every meal is a fresh decision.
    branding:
      score: 3
      note: 'The dominant Power: a genuine premium brand (NYC heritage, ~$4.0M AUV well above QSR, pricing power) — but brand
        alone doesn''t convert to FCF while capex is heavy.'
    cornered_resource:
      score: 1
      note: Prime urban real estate + recipes/hospitality culture; valuable but not truly cornered.
    process_power:
      score: 1
      note: Emerging under Lynch — build-cost reduction, throughput, digital ('Project Catalyst'); unproven at scale, the
        bull's swing factor.
  dominant_power: branding
  durability: medium
  rivals:
  - name: Chipotle (CMG)
    kind: public
    note: Best-in-class fast-casual compounder; the margin/FCF benchmark Shake Shack is measured against.
    growth: 0.06
    margin: 0.17
    multiple: ~18x EV/EBITDA
  - name: Wingstop (WING)
    kind: public
    note: Asset-light franchise compounder (Lynch's old shop); also wobbling — Q1'26 domestic SSS -8.7%.
    growth: 0.11
    margin: 0.25
    multiple: ~37x EV/EBITDA
  - name: Cava (CAVA)
    kind: public
    note: The fast-casual growth darling; richest multiple in the set, the unit-growth comp.
    growth: 0.25
    margin: 0.12
    multiple: ~46x EV/EBITDA
  - name: Portillo's (PTLO)
    kind: public
    note: Closest size/model comp — mid-cap, capital-intensive unit growth, similar multiple.
    growth: 0.12
    margin: 0.1
    multiple: ~14x EV/EBITDA
  threats:
  - vector: branding
    who: QSR value wars / trade-down (McDonald's, Five Guys, In-N-Out)
    falsifier: Same-Shack traffic stays negative as premium pricing loses to value in a soft consumer.
  - vector: scale_economies
    who: Beef/commodity + labor inflation
    falsifier: Restaurant-level margin falls below ~21%, rolling back the recovery the build needs.
  - vector: process_power
    who: Cava / Wingstop / capital intensity
    falsifier: FCF turns negative again as the 55-60/yr build pace outruns operating cash.
  takeaway: 'Shake Shack''s brand Power is genuine — a premium ''fine casual'' name with ~$4.0M AUV well above QSR and real
    pricing power — but a brand doesn''t convert to free cash flow while capex runs 11-12% of revenue to fund a 4x unit runway.
    The Audit: branding is durable (medium), process_power is the emerging swing factor under Lynch (build-cost cut, drive-thru,
    digital), and the threats are capital intensity + a soft, value-seeking consumer. The ~55% de-rate to ~13x EBITDA corrected
    the prior excess to roughly fair; the DCF tests whether the runway converts to FCF, and the modal case lands ~-9% — cheap-looking
    on the multiple, fair on the cash.'

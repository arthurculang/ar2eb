central_question: Did Shake Shack's ~55% crash to ~13x EV/EBITDA correct an excess to fair value — or overshoot a long-runway,
  new-CEO unit-growth compounder?
thesis: Shake Shack trades at ~$2.34B (~$54.70, down ~55% YoY after a June-2026 guidance cut) — ~13x EV/EBITDA on $1.445B
  revenue growing ~15%, net cash, operating margin back to 4.3%, FCF positive (~$57M, ~4%). The bull is a 4x US unit runway
  (~373 -> 1,500), a sub-$2.0M build cost, a new CEO (Rob Lynch, ex-Wingstop); the bear is capital intensity keeping FCF thin
  while traffic is barely positive. The DCF asks whether the runway converts to free cash flow — the modal case lands ~fair
  (-9%), so the crash corrected the excess, not created a bargain.

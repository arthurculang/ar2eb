  body: Precision-ag platform re-rates the cycle away; ~$810 (+40%).
appendix:
  pushback:
  - label: Modeled debt EXCLUDES the ~$45B captive lender.
    body: The DCF carries only ~$13.8B equipment-ops debt; Deere Capital's ~$45B (offset by finance receivables) is left out,
      so the equity bridge is approximate.
  - label: A full multiple on trough earnings already prices the recovery.
    body: ~26x trough FCF (~17x near the bottom) embeds the upturn; buying the trough is right, but paying full leaves the modal
      at -23%.
  - label: Precision ag is the de-cyclicalizing bull, not yet the base.
    body: See & Spray / autonomy / JDLink build recurring ARR, but the mix is still small (PPA -39%) - it shifts margins only
      if it scales.
  - label: 2026 is management's called bottom.
    body: CEO John May calls 2026 the bottom; C&F (+29%/+48%) and small-ag (+16%) recover while large-ag (-14%) troughs - leading
      legs turn first.
  - label: Tariffs are a real, sized drag.
    body: ~$200M/qtr (~$1.2B FY) tariff headwind, partly mitigated via reshoring/USMCA, caps the near-term margin recovery.
  triggers:
  - label: Bull validation
    body: large-ag returns to order-book growth  ·  operating margin recovers toward 18-20% on leverage  ·  precision-ag recurring/ARR
      revenue grows to a disclosed, material share  ·  net price holds +1.5-2%
  - label: Bear validation
    body: large-ag declines worsen past -20% as farm income stays weak  ·  used-equipment inventories overhang new sales  ·
      operating margin stays stuck in the low-teens  ·  tariff drag widens beyond ~$1.2B
  - label: Reframe needed
    body: if the precision-ag recurring mix fails to scale and margins keep reverting to the boom-bust cycle, re-rate the terminal
      toward a normal mid-cycle capital-goods multiple - not a de-cyclicalized platform
glossary:
- term: Production & Precision Ag (PPA)
  definition: Deere's largest segment - large tractors, combines, planters + the precision-ag tech layer; -14%/op profit -39%
    this quarter, the cycle trough and swing-factor segment.
- term: Precision ag / recurring revenue
  definition: Software-and-service layer (See & Spray targeted spraying, autonomous tractors, JDLink connectivity/ARR) that
    adds recurring revenue and, the bull argues, de-cyclicalizes margins.
- term: Ag down-cycle
  definition: The boom-bust farm-equipment cycle driven by crop prices and farm income; revenue fell from a $61.3B FY23 peak
    to $45.7B FY25 - the trough this memo prices off.
- term: Captive finance (Deere Capital)
  definition: Deere's in-house lender financing dealer/customer equipment purchases (see pushback for the modeled-debt caveat).
- term: FCF margin
  definition: Free cash flow / revenue (~13% FY25 at the trough); the mature-DCF swing factor - whether cycle recovery + the
    precision-ag mix lift it durably above the trough.
competitive:
  arena: Farm + construction equipment - Deere (scale leader, dealer network + installed base, emerging precision-ag tech)
    vs CNH Industrial, AGCO, Kubota in ag and Caterpillar/Komatsu in construction; auditing a scale + cornered-resource Power
    against the ag cycle and tariffs.
  lens: power_audit
  powers:
    scale_economies:
      score: 4
      note: 'Dominant Power: #1 global ag-equipment maker with R&D, manufacturing and parts scale peers can''t match; structurally
        higher trough margins than prior cycles.'
    network_economies:
      score: 1
      note: JDLink/Operations Center data network is growing but not yet a hard network effect; emerging with precision ag.
    counter_positioning:
      score: 1
      note: The incumbent, not the disruptor; precision-ag autonomy is more extension than counter-position.
    switching_costs:
      score: 3
      note: 'Real: an installed fleet, dealer service relationships, JDLink data lock-in and operator familiarity make a farmer''s
        next purchase sticky.'
    branding:
      score: 3
      note: The green brand commands a price premium and resale value, but doesn't override the ag cycle.
    cornered_resource:
      score: 3
      note: The exclusive franchised dealer network + the largest installed base - hard to replicate, the distribution moat
        under the scale Power.
    process_power:
      score: 2
      note: 'Nascent: precision-ag/autonomy (See & Spray, autonomous tractors) is a building manufacturing+software capability,
        unproven as a durable margin shifter at scale.'
  dominant_power: scale_economies
  durability: high
  rivals:
  - name: CNH Industrial
    kind: public
    note: 'Case IH / New Holland - the #2 full-line ag player; the direct large-ag share comp, also cycle-pressured.'
    growth: 0.0
    margin: 0.1
    multiple: ~10x P/E
  - name: AGCO
    kind: public
    note: Fendt/Massey Ferguson - pure-play ag, smaller and more cyclical; the precision-ag (PTx) challenger.
    growth: 0.0
    margin: 0.08
    multiple: ~12x P/E
  - name: Caterpillar (CAT)
    kind: public
    note: Construction/mining scale leader; overlaps Deere's C&F segment, the construction-cycle comp.
    growth: 0.05
    margin: 0.2
    multiple: ~18x P/E
  - name: Kubota
    kind: private
    note: Strong in compact/small-ag and Asia; smaller-equipment share pressure, not the large-ag core.
    growth: null
    margin: null
    multiple: ~12x P/E
  threats:
  - vector: scale_economies
    who: The ag down-cycle + tariffs
    falsifier: Large-ag declines worsen and operating margin stays stuck in the low-teens, showing the trough is deeper/longer
      than priced.
  - vector: process_power
    who: CNH PTx / AGCO precision-ag challengers
    falsifier: A rival's precision-ag platform wins data/autonomy share, capping the recurring-revenue mix that the bull needs
      to de-cyclicalize margins.
  - vector: cornered_resource
    who: Direct-to-farmer / dealer-model disruption
    falsifier: Right-to-repair pressure or new distribution erodes the dealer-network + JDLink lock-in that anchors switching
      costs.
  takeaway: 'Deere''s scale Power is durable (high) - the #1 ag-equipment maker with a cornered dealer network, the largest
    installed base, and real switching costs from fleets and JDLink data; the structurally higher trough margins this cycle
    are evidence the moat is widening. The Audit: the live threats are the ag cycle itself plus ~$1.2B of tariffs (which compress
    margins regardless of moat), and the contest over whether precision ag (See & Spray, autonomy) scales into a recurring-revenue
    layer that de-cyclicalizes the mix - or whether rivals (CNH PTx, AGCO) split that prize. That squares with the -21.8%
    finding: the franchise is excellent, but bought at ~26x trough FCF the modal recovery is already priced, and only the
    bull''s de-cyclicalization (or a strong cycle turn) justifies the full multiple.'
pocd:
  people:
    ceo: John C. May
    founder_led: false
    tenure_years: 6
    insider_ownership_pct: 0.3
    capital_allocation: 'John May has been CEO since 2019 and Chairman since 2020 (a career Deere executive at a ~188-year-old
      company). Capital allocation is disciplined through the ag cycle: FY2025 net income $5.0B (−29% in the downturn)
      and ~$8B free cash flow funded a large buyback ($18B program, ~$10B executed, plus a new authorization in 2026)
      while the dividend was held flat ($6.48) rather than cut. The ~$43B consolidated debt is overwhelmingly the
      John Deere Capital captive-finance receivables book, not industrial leverage.'
    incentive_alignment: May’s FY2025 compensation was ~$27.9M, ~92% at-risk and ~54% performance-based; say-on-pay
      drew ~92% support. Insiders hold ~0.3% as a group — the aggregator "12% insiders" figure simply miscategorizes
      Gates’ Cascade stake. Largest holder Cascade (~10.8%) holds a board seat (Heuberger).
    governance_flags:
    - single class of common stock, one vote per share — no dual-class, no controlling shareholder
    - combined Chair & CEO (May), mitigated by an independent lead director (Feight) and a 10-of-11 independent board
    - board declassified — annual elections (a governance positive)
    - the largest holder (Gates’ Cascade, ~10.8%) holds a board seat — disclosed, not control
    - pronounced ag-equipment cyclicality (FY2025 net income −29%; dividend frozen) — a financial, not governance,
      flag
    key_person_risk: low
    score: 4
    takeaway: 'Clean blue-chip governance: single-class one-vote, a 10-of-11 independent declassified board, an independent
      lead director, ~92% say-on-pay, and heavily at-risk pay. The combined Chair/CEO is mitigated exactly as a comparable
      mega-cap’s is — and there is no founder concentration (insiders ~0.3%). Key-person risk is low for a 188-year-old,
      professionally-managed institution; the real risk is cyclical, not governance.'
  opportunity_ref: The scenario distribution · the business snapshot · the Arthur Indicator
  context_ref: The 7 Powers analysis (Power Audit)
  deal: 'Open-market common — entry price weighed against the probability-weighted fair value (the -21.8% finding) + position
    sizing.'

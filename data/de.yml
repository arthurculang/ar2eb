central_question: Has Deere's stock already priced the ag-cycle recovery off the trough, or does the precision-ag recurring-revenue
  mix structurally lift mid-cycle margins beyond what ~26x trough FCF embeds?
thesis: 'Deere trades at ~$156B (~$577, +10.5% YTD into the cycle low) — ~26x trough FCF on $45.7B revenue down 12% in the
  third year of an ag down-cycle, GAAP operating margin compressed to 14.0%, FCF ~$6.1B. The DCF asks
  whether the recovery is already priced: the modal case says largely yes (base -23%) — a full multiple on trough earnings
  already discounts the upturn. The bull is the cycle turning plus precision ag de-cyclicalizing margins. The finding: -21.8%,
  quality bought rich near a trough.'

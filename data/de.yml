    headline: Deeper, longer ag recession.
    narrative:
    - 'The down-cycle extends rather than bottoms: large-ag (Production & Precision Ag) keeps falling past the guided -15-20%
      as farm income stays depressed, used-equipment inventories overhang new sales, and tariffs (~$1.2B FY) compound the
      squeeze. Revenue declines again before a shallow late-decade recovery; operating margin troughs near 10-13% and the
      recurring-revenue mix is too small to cushion the drop.'
    - A capital-goods cyclical caught a year early in a worse-than-feared recession earns a low-teens trough multiple -> DCF
      ~$219 (-62%). The captive-lender complexity and a richer-than-peer starting valuation amplify the downside.
    probability_rationale: 'The genuine bear: large-ag is already guided -15-20% with weak farm income, the FY26 net-income
      guide ($4.5-5.0B) is roughly half the peak, and a full multiple on trough earnings has no cushion if the trough deepens.

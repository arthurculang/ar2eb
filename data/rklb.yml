  takeaway: 'Rocket Lab is originating a genuine vertically-integrated space-prime position — the credible #2 to SpaceX —
    with real Space Systems scale, a $1.85B backlog, and Neutron optionality. But it lags SpaceX by an order of magnitude
    on launch cadence/reusability, and Neutron is unproven; the window is open as the #2, but SpaceX''s cost-and-scale gravity
    well is the falsifier the whole bull case must clear.'

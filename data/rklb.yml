central_question: 'Does ~$41B (~45x FY26E revenue) — plus a pending ~$8B debt-and-stock purchase of Iridium''s constellation
  — price a realistic path to a space prime when the second act is bought, not originated?'
thesis: 'Rocket Lab has halved to ~$41B at $71.55 — ~68x trailing sales, ~45x the ~$900M FY26 run-rate — while the business
  accelerated (Q1''26 revenue +64%, backlog >$2.2B). And the second act changed form: rather than originate a constellation,
  RKLB agreed to buy one — the pending ~$8B Iridium acquisition (mid-2027 close; $871M revenue, ~$495M operational EBITDA,
  2.6M subscribers), funded by a $3.6B bridge plus up to ~44M collared shares. The DCF asks whether a halved price plus a
  leveraged, dilutive constellation purchase changes the answer. The finding: it narrows the gap, not the verdict — the weighted
  sits ~38% below spot; the market still prices near-certain success.'

- label: Ultra Bear 10%
  body: Neutron fails; Iridium deal breaks; defensive dilution.
- label: Bear 25%
  body: Neutron slips; deal closes at max collar dilution + ~$5B debt.
- label: Base 35%
  body: 'Neutron works; #2 prime + a value-neutral bought constellation.'
- label: Bull 24%
  body: Reusable Neutron scales; the constellation leg arrives by purchase.
- label: Ultra Bull 6%
  body: Next-gen constellation on acquired spectrum; ~$212B smaller-SpaceX.
appendix:
  pushback:
  - label: Best-capitalized new-space name.
    body: $1.48B cash + >$2.2B backlog (Q1'26); ATM complete, $474M equity forward committed — the standalone burn is funded.
      The $355M 2029 convert and the pending $3.6B deal bridge are the debt to watch.
  - label: Space Systems is the hidden engine.
    body: The majority of revenue is components/satellites, not launch — diversified, growing, and sticky (designed-in).
  - label: Neutron is optionality, not the whole thesis.
    body: Even modeling Neutron conservatively, Space Systems alone compounds to a real business.
  - label: Reusability could reset the cost curve.
    body: If Neutron lands reuse economics, the bull launch-share path opens — the single biggest swing factor.
  - label: Backlog visibility.
    body: '>$2.2B backlog at Q1''26 (from $1.85B at FY25) plus a record 36 Q1 launch contracts — unusual revenue visibility
      for a ''young'' name.'
  triggers:
  - label: Bull validation
    body: Iridium close on terms by mid-2027  ·  bridge refinanced at sustainable cost  ·  Neutron orbital debut Q4'26  ·  Q2
      print Mon Aug 10
  - label: Bear validation
    body: Deal break, or close at the 0.40 collar floor (max dilution)  ·  pro-forma leverage above ~5x net debt/EBITDA at
      close  ·  Beck's 10b5-1 completes the remaining ~1.7M shares
  - label: Reframe needed
    body: At close the combined company (~$1.8B revenue, ~$400M+ EBITDA, real net debt) reads as a mature operating business
      — re-underwrite it as one the following quarter
glossary:
- term: Electron
  definition: 'RKLB''s small-lift (~300kg) orbital rocket; the established #2 to SpaceX by launch count.'
- term: Neutron
  definition: RKLB's reusable medium-lift (~13t) rocket targeting a Q4 2026 first launch; the core bull catalyst.
- term: Space Systems
  definition: 'RKLB''s non-launch segment: satellites, star trackers, solar, separation systems, components — the majority
    of revenue.'
- term: Backlog
  definition: Contracted future revenue not yet recognized; RKLB's was >$2.2B at Q1'26 (from $1.85B at FY25).
- term: Collared stock (Iridium deal)
  definition: Each Iridium share receives $27 cash plus $27 of RKLB stock within a 0.24-0.40 exchange-ratio collar; below
    $67.50 the 0.40 floor binds — maximum dilution (~44M new shares).
- term: Sales-to-capital (s2c)
  definition: 'Damodaran reinvestment efficiency: incremental revenue per dollar of reinvested capital. Higher = more capital-efficient
    growth.'
competitive:
  arena: Space launch + space systems — Rocket Lab (Electron small-lift, Neutron medium-lift reusable coming, vertically-integrated
    Space Systems) vs SpaceX (dominant), Firefly, Stoke Space, ULA/Blue Origin; the race to become a vertically-integrated
    space prime.
  lens: power_origination
  powers:
    scale_economies:
      score: 1
      note: Electron cadence builds a learning curve; Neutron reusability could reset cost, but it is pre-launch.
    network_economies:
      score: 1
      note: Constellation/data flywheel — now acquire-and-integrate via the pending Iridium deal (mid-2027 close); scores
        1 until it closes and integrates.
    counter_positioning:
      score: 2
      note: Vertically integrated launch + components + future constellation — few new-space peers can replicate the full
        stack.
    switching_costs:
      score: 1
      note: Space Systems components get designed-in (some lock-in); launch is largely contestable.
    branding:
      score: 2
      note: 'The credible #2 launch brand after SpaceX; strong gov/defense trust.'
    cornered_resource:
      score: 2
      note: Launch sites/licenses, component portfolio, Beck-led talent, Neutron IP — plus, pending close, Iridium's licensed
        global L-band spectrum and 2.6M-subscriber constellation, a textbook cornered resource.
    process_power:
      score: 2
      note: Electron reliability + manufacturing learning curve; a genuine, if narrow, process edge.
  dominant_power: cornered_resource
  window: open
  rivals:
  - name: SpaceX
    kind: private
    note: Falcon 9 cadence + Starship + Starlink — the gravity well of the industry.
    share_now: 0.0
    share_terminal: 0.45
    capital: $ tens of B; Starlink cash flow
  - name: ULA / Blue Origin
    kind: incumbent-division
    note: Vulcan / New Glenn — an integrated vehicle destroyed in a May 28 hot-fire anomaly, return-to-flight targeted before
      end-2026; legacy contracts + Bezos capital.
    share_now: 0.0

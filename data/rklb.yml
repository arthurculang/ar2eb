central_question: Does ~135x sales (~$81B on $602M FY25 revenue) price a realistic path to a space prime — or a SpaceX-scale
  outcome a decade of fundamentals can't reach?
thesis: 'Rocket Lab trades at ~$81B on $602M FY25 revenue — ~135x sales. Electron (#2 small-lift) + Neutron (reusable medium-lift,
  Q4 2026 debut) + a vertically-integrated Space Systems segment with a path to owned constellations. The DCF asks what scale,
  prime margins, and — in the upper scenarios — a Starlink-style constellation second act are plausible over a decade. The
  finding: launch+systems alone is priced beyond ten years; only if RKLB originates an owned constellation does the ultra-bull
  clear spot (+159%, a ~$213B smaller-SpaceX) — even then the modal base leaves the weighted ~-63%: the market prices near-certain
  success.'

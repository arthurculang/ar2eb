    headline: Neutron fails; dilution; SpaceX runs away.
    narrative:
    - Neutron's tank-test troubles compound into a failed or indefinitely delayed program; RKLB stays a sub-scale small-lift
      + components shop. Launch cadence stalls, Space Systems growth decelerates as satellite primes in-source, and gross
      margins stay structurally thin against a fixed-cost manufacturing base.
    - Repeated dilutive ATM raises fund the burn (start cash $0.83B), share count creeps toward 590M, and by FY35 revenue
      is ~$1.4B at ~7-8% operating margin. With a 25% probability of an outright restructuring/recap, the expected per-share
      collapses toward the distress floor — orders of magnitude below today's price.
    probability_rationale: 'The compound bear: a Neutron failure (the FY26 tank-test failure is a real datapoint) plus Space
      Systems deceleration plus persistent thin margins. Aerospace hardware is unforgiving and SpaceX''s cost curve is brutal.
      25% within-scenario failure probability reflects that RKLB, while revenue-generating with $1.85B backlog, is still capital-hungry

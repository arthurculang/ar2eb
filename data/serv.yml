central_question: With a fleet of ~2,000 robots already built but fewer than half daily-active, is SERV a cheap option on
  utilization inflecting to profitable unit economics, or a dilutive grind where the modal case loses money?
thesis: 'Serve Robotics runs autonomous sidewalk delivery robots, spun out of Uber/Postmates and Nvidia-backed. It trades
  at $7.22 (~$540M cap), down ~23% YTD, on FY25 revenue of just $2.7M against a ~$41M/quarter operating burn — a pre-scale
  company with ~$197M of liquidity and roughly 1.2 years of runway. The build is done: ~2,000 robots sit across 44 cities,
  but only ~812 are daily-active, so the central question is utilization, not fleet size. Anchor demand from Uber Eats (up-to-2,000-robot
  deal) and DoorDash exists to fill it. The DCF weighted fair value is $9.33, +29% above spot — but the modal base sits ~63%
  below the price, so the answer rides the right tail and is paid for with relentless dilution.'

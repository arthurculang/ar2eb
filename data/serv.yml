      exceeds the price paid plus the dilution to get there.
    probability_rationale: A 15% p_fail. Requires utilized-fleet unit economics to turn durably profitable and the deployment
      to broaden regionally — anchored to the FY26 utilization and cost-per-delivery targets, which would be the first hard

    expected_per_share: 1.08
    headline: Utilization stalls; dilutive grind
    narrative:
    - Daily-active robots stay stuck below half the deployed fleet, unit economics never clear the sub-$1/delivery bar, and
      Uber Eats and DoorDash volume fails to fill the built capacity. Revenue reaches only about $0.18B by FY35 at a 6% operating
      margin — sub-scale logistics economics that never earn their cost of capital.
    - With nothing to fund the burn, the auto-sized raises push the share count from ~77M toward ~227M, nearly tripling the
      float. The DCF lands at −$1.32; the $1.50 distress floor and residual liquidity drag the expected value to $1.08. The
      fleet exists, but the equity is diluted toward salvage.
    probability_rationale: A 15% read. An 85% p_fail reflects that thin-margin delivery economics at sub-half fleet utilization
      rarely turn profitable before the cash and a live $150M ATM plus $100M registered-direct are exhausted.

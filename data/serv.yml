weighting_rationale:
- label: Ultra Bear 15%
  body: Utilization never improves; unit economics fail; dilutive grind toward the distress floor.
- label: Bear 30%
  body: Modest scaling but stays sub-scale; heavy dilution offsets the operating progress.
- label: Base 30%
  body: Fleet utilization inflects and unit economics work; ~$0.70B revenue, but dilution caps per-share value below spot.
- label: Bull 17%
  body: Delivery automation scales regionally; operating leverage on the already-built fleet.
- label: Ultra Bull 8%
  body: Becomes a DoorDash-scale autonomous delivery network at ~7M deliveries/day.
appendix:
  pushback:
  - label: The fleet is already built
    body: ~2,000 robots across 44 cities are deployed; the spend is largely sunk, so utilization rising to profitability is
      operating leverage, not new capex.
  - label: Anchor demand is contracted
    body: Uber Eats (up-to-2,000-robot multi-year deal) plus DoorDash give committed volume to fill the fleet — the demand
      side is signed, not speculative.
  - label: Hyper-growth off a tiny base
    body: Revenue grew +578% YoY in Q1'26 and FY26 is guided to ~$26M (~9x FY25); management now reports utilization, not
      fleet size.
  - label: De-rated price, fat right tail
    body: Down ~23% YTD, the equity is a cheap option — roughly 89% of the expected value sits in the bull and ultra-bull,
      priced lightly versus spot.
  - label: A vertically-integrated stack
    body: Magna manufacturing, Nvidia compute, and the Diligent Robotics acquisition build a hardware-and-autonomy stack rivals
      must assemble from scratch.
  triggers:
  - label: Bull validation
    body: Daily-active robots climb toward the ~2,000 deployed; cost-per-delivery falls through $1; Uber Eats scales toward
      the 2,000-robot commitment; raises shrink as revenue funds the burn.
  - label: Bear validation
    body: Utilization stays stuck below half the fleet; the FY26 ~$26M guide slips; an equity raise on weak terms confirms
      dilutive stagnation; unit economics stay above $1/delivery.
  - label: Reframe needed
    body: Utilized-fleet unit economics turn durably profitable and self-funding, shifting the story from option-on-fleet
      to cash-flow; or the cash and ATM exhaust before that, breaking the thesis.
glossary:
- term: Daily-active vs deployed fleet
  definition: Robots actually running paid deliveries each day (~812) versus the total fielded (~2,000). The gap — under half
    utilized — is the central operational fact.
- term: Unit economics / cost-per-delivery
  definition: The profit on a single delivery after labor, energy, hardware depreciation and operations. SERV targets sub-$1/delivery;
    clearing it is what makes the model work.
- term: Operating leverage
  definition: Because the ~2,000-robot fleet is already built, additional deliveries on the same hardware drop largely to
    profit — so the model's value is highly sensitive to utilization.
- term: Sales-to-capital (s2c)
  definition: How much new revenue each dollar of reinvested capital produces; it sets how fast revenue can grow before the
    company must raise fresh capital.
- term: ATM dilution
  definition: An at-the-market equity program (here a live $150M ATM plus a $100M registered-direct) that funds the burn by
    selling new shares — the source of the modeled share-count growth.
- term: p_fail
  definition: The modeled probability the scenario ends in failure (utilization and unit economics never clear), driving the
    equity toward the $1.50 distress floor.
competitive:
  arena: Autonomous last-mile delivery — sidewalk robots and small autonomous vehicles fulfilling food and goods orders —
    where SERV competes with platform in-house autonomy, venture-backed robot fleets, and logistics incumbents.
  lens: power_origination
  powers:
    scale_economies:
      score: 1
      note: A first-mover fleet could earn route density and hardware-cost scale, but unit economics at scale are unproven.
    network_economies:
      score: 1
      note: Density helps reliability and cost, but value does not yet compound two-sidedly across users the way a marketplace
        does.
    counter_positioning:
      score: 1
      note: A robotics-native model the platforms are slower to build, but Uber and DoorDash are funding their own autonomy
        in parallel.
    switching_costs:
      score: 1
      note: Multi-year platform deals create some stickiness, but Uber and DoorDash multi-source delivery and can shift volume.
    branding:
      score: 0
      note: No consumer brand power; the order rides on Uber Eats or DoorDash, not the Serve name.
    cornered_resource:
      score: 2
      note: The Magna exclusive-manufacturing and Nvidia compute stack plus the contracted Uber/DoorDash demand are the strongest
        candidate, but each is contractual, not owned.
    process_power:
      score: 1
      note: An integrated build-and-operate workflow is distinctive but not yet shown to deliver profitably at scale.
  dominant_power: cornered_resource
  window: open
  rivals:
  - name: DoorDash (in-house / Wolt)
    kind: incumbent-division
    note: A core customer building its own autonomy and robots — partner and potential substitute
    share_now: 0.0
    share_terminal: 0.0
    capital: DoorDash balance sheet
  - name: Coco Robotics
    kind: private
    note: Venture-backed sidewalk delivery robots in overlapping US cities
    share_now: 0.0
    share_terminal: 0.0
    capital: Private (VC-backed)
  - name: Nuro
    kind: private
    note: Well-funded autonomous delivery vehicles; deep capital and AV stack
    share_now: 0.0
    share_terminal: 0.0
    capital: Private (heavily funded)
  - name: Avride / Amazon logistics
    kind: incumbent-division
    note: Platform and retail-scale autonomy efforts with vast balance sheets
    share_now: 0.0
    share_terminal: 0.0
    capital: Corporate balance sheets
  lead_lag:
  - metric: Robots deployed in commercial service
    company: ~2,000 across 44 cities
    best_rival: Smaller commercial fleets (Coco/Nuro)
    verdict: leading
  - metric: Profitable utilized-fleet unit economics
    company: Unproven; targeting sub-$1/delivery
    best_rival: Also unproven across the field
    verdict: even
  - metric: Capital and balance-sheet depth
    company: ~$197M liquidity, dilution-funded
    best_rival: Deeper (DoorDash, Amazon, Nuro)
    verdict: lagging
  takeaway: SERV is trying to originate a scale-economies plus cornered-resource Power — a first-mover commercial fleet, contracted
    Uber and DoorDash demand, and an exclusive Magna/Nvidia build stack — but no durable Power exists yet, because under half
    the fleet is utilized and unit economics at scale are unproven. The demand and the stack are contractual, not owned, and
    the platforms are funding their own autonomy, so the moat is contestable. The falsifier the bull must clear is utilized-fleet
    unit economics turning durably profitable — sub-$1/delivery on a high-utilization fleet — before dilution exhausts holders.
    Until that prints, the fleet is a built option, not a won Power, and the window stays open.

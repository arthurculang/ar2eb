central_question: 'Is the Series F $61.5B mark ($165/share for common) defensible against a probability-weighted distribution
  of exits over 1-5 years — when secondary buyers are already paying through the last mark in tender offers?

  '
thesis: 'Anthropic prints ~$4B annualized revenue (mid-2026, up from ~$1B end-2024), still growing >100% YoY, with an enterprise
  mix that increasingly looks like a software platform rather than a research lab. The Series F priced ~15× forward revenue.
  The dominant variable in valuing the equity today is not an operating DCF (revenue is opaque, inference economics in flux)
  but the exit distribution: an IPO between 2027 and 2029 at $250B-$1.5T is the modal good outcome. The bear case is not slow
  erosion but a capability eclipse — OpenAI ships a step-function, AWS cools on Bedrock, talent exits to Google DeepMind.
  Probability-weighted present value lands near 2× the last mark, justifying secondary buyers paying premium-to-mark. The
  single most consequential editorial input is the discount rate, not the exit valuations. Five exit scenarios, weighted;
  show your work.

  '

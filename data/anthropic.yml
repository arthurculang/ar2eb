  bear:
    label: Slow Private
    short_label: SlowPriv
    probability: 0.2
    headline: Stays private 5y+; no liquidity.
    narrative:
    - 'The "stays private indefinitely" path. Anthropic raises 2-3 more growth rounds at marks that grow with the AI sector
      — Series G ~2027 around $95B, Series H ~2029 around $130B — but no IPO appears credible (regulatory uncertainty, a depressed
      IPO window, or a Long-Term Benefit Trust decision that public-company quarterly pressure conflicts with the safety mission).
      Secondaries create episodic liquidity at steep discounts to the mark.

      '
    - 'The economics are real — ARR grows from $4B to ~$25B by 2031 — but without an IPO catalyst, the holder faces ~5 years
      of illiquidity and substantial dilution risk. PV at a 23% venture discount: ~$78, meaningfully below the $165 last mark
      even as the nominal round price grows. This is the underappreciated outcome.

      '
    - 'Stripe is the canonical case: a $95B mark, no IPO seven years later.

      '
    probability_rationale: 'Stripe is the canonical analog: $95B mark, no IPO seven years later. Anthropic''s PBC + Long-Term
      Benefit Trust structure makes the "we don''t have to go public" stance more credible than for a vanilla C-corp. Modal
      over 3 years but not over 5+; at some point holders demand liquidity. 20% reflects the real possibility the LTBT prefers
      indefinite private status.


scenarios:
  ultra_bear:
    label: Wipeout
    short_label: Wipeout
    probability: 0.1
    headline: Capability eclipsed; down-round.
    narrative:
    - 'OpenAI ships GPT-6 with a step-function capability gain. Google folds Gemini-Ultra into Workspace at near-zero marginal
      price. Anthropic''s growth decelerates; AWS cools on Bedrock as Amazon''s own Nova line gains traction. Top safety researchers
      exit for Google DeepMind and a stealth lab. A planned 2027 IPO gets pulled; a 2028 bridge round prices below the Series
      F mark, triggering dilution and a quiet acqui-hire by Amazon or Google.

      '
    - 'At the resulting $12B post-money, common-equity per share falls to ~$32 nominal — discounted three years at a 22% venture-WACC
      (illiquidity + execution + dilution overhang), and after a 20% within-scenario write-to-zero probability, expected PV
      is ~$14/share, roughly a tenth of the last mark.

      '
    - 'Catastrophic capability loss + safety-talent attrition + AWS withdrawal is a compound event sized at ~10%.

      '
    probability_rationale: 'Capability eclipse + safety-talent attrition + AWS withdrawal is a compound 3-vector event. Each
      individually 25-40% plausible across a 3-year horizon; joint at ~10%. The dominant risk for any frontier-AI lab is being
      lapped on capability — the downside is one binary, not slow erosion. Bayesian update from 2026: Claude 4.5 reception
      was strong, enterprise revenue held, the RSP framework didn''t constrain commercial deployment as much as bears feared
      — so a-priori 15% nudges down to 10%.

      '

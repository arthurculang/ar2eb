appendix:
  pushback:
  - label: Enterprise revenue inflection is real.
    body: $1B → $4B in 18 months beats Snowflake's comparable phase. NDR >150% implies land-and-expand, not pilots.
  - label: AWS Project Rainier is a strategic moat.
    body: A 1M+ Trainium2 cluster reserved for Anthropic is durable compute alignment rivals can't replicate cheaply.
  - label: Safety positioning may monetize in regulation.
    body: EU AI Act enforcement begins 2026-2027. RSP / Constitutional AI framing makes Anthropic the easiest model to deploy
      in regulated industries.
  - label: Secondaries pay through the mark.
    body: 2026 tender activity cleared ~$200/share-equiv (~$74B implied) for common — the equity already trades above the
      $165 mark.
  triggers:
  - label: Bear validation
    body: OpenAI ships GPT-6 with measurable step-function gains  ·  200+ research-head exit in any 6-month window  ·  AWS
      cools publicly on Project Rainier expansion
  - label: Bull validation
    body: ARR crosses $8B run-rate by Q2 2027  ·  a confidential S-1 leaks  ·  enterprise NDR sustains >130% in a published
      reference disclosure
  - label: Reframe needed
    body: An LTBT action blocking/delaying IPO — the 'stay private' path becomes modal, inverting the discount-rate logic
      and depressing PV ~40%.
glossary:
- term: Constitutional AI (CAI)
  definition: Anthropic's training method — models trained against a written constitution using AI feedback rather than dense
    human ratings.
- term: Responsible Scaling Policy (RSP)
  definition: Published commitments to halt/slow deployments when dangerous-capability evals trip. Both a safety mechanism
    and a marketed differentiator.
- term: Claude family (Opus / Sonnet / Haiku)
  definition: Tiered model family — Opus highest capability, Sonnet the workhorse, Haiku fast/cheap. Generations refresh ~twice
    a year.
- term: Long-Term Benefit Trust (LTBT)
  definition: Independent trust holding a stock class that elects a board majority over time. Non-investor members aligned
    with the safety mission.
- term: Project Rainier
  definition: AWS's announced 1M+ Trainium2 cluster reserved for Anthropic — a supply commitment and a marker of AWS's strategic
    stake.
- term: Last-round mark
  definition: Per-share value implied by the latest round (post-money ÷ fully-diluted). A preferred, illiquid, single-counterparty
    price — not a market quote.

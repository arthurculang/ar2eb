weighting_rationale:
- label: Ultra Bear 16%
  body: Programs fail or cash runs out; ATM dilutes to the $0.40 floor.
- label: Bear 30%
  body: One program limps; repeated raises at low prices overwhelm holders.
- label: Base 30%
  body: A liver program clears + BMS pays, but ~$0.9B of raises nearly triples shares.
- label: Bull 16%
  body: Multiple liver successes; milder dilution as proof lifts the financing price.
- label: Ultra Bull 8%
  body: Prime editing wins broadly in-vivo; cleanest share count, platform terminal.
appendix:
  pushback:
  - label: First-in-class proof is real
    body: PM359 restored NADPH-oxidase activity in the first-ever clinical prime edit (NEJM Dec 2025) — the core chemistry
      works in humans, not just in vitro.
  - label: Liver refocus de-risks delivery
    body: The May 2025 pivot to in-vivo liver (Wilson's, AATD) targets the best-validated delivery route, where LNP-to-liver
      is a solved problem for rivals.
  - label: Non-dilutive capital exists
    body: BMS ($55M upfront, $55M equity, >$3.5B milestones) and CFF (up to $39M) offset some burn — not every dollar of progress
      must come from the ATM.
  - label: The de-rating prices the distress
    body: At $3.16, down from a $6.94 high, much of the going-concern risk is already in the stock; the platform tail is being
      bought cheaply.
  - label: David Liu lineage
    body: The Broad-Institute prime-editing IP and scientific lead are a genuine cornered resource that a partner or acquirer
      could fund through the cash crunch.
  triggers:
  - label: Bull validation
    body: A partnered or approved liver program (Wilson's/AATD), a PM359 partner/BLA path, or a financing/partnership that
      closes the runway gap before the ATM is leaned on.
  - label: Bear validation
    body: Repeated ATM draws at sub-$3 prices, a clinical setback in the lead liver programs, or runway slipping below two
      quarters without a partner.
  - label: Reframe needed
    body: Insolvency, a recap, or a take-under would move this from 'distressed option' to 'broken' — re-underwrite from the
      floor, not the platform tail.
glossary:
- term: prime editing
  definition: Precise 'search-and-replace' gene edit that rewrites DNA without a double-strand break; makes many edit types.
    David Liu / Broad lineage.
- term: PM359 / CGD
  definition: PRME's program for chronic granulomatous disease; the first-ever clinical prime edit (NEJM Dec 2025). Deprioritized;
    now seeking a partner/BLA path.
- term: in-vivo liver editing
  definition: Editing genes directly inside the body in the liver — the focus after the May 2025 refocus (Wilson's disease
    PM577, AATD PM647).
- term: going-concern
  definition: Auditor/management doubt, flagged in the FY2025 10-K, that the company has enough cash to operate for the next
    12 months.
- term: ATM / forced dilution
  definition: An 'at-the-market' equity program ($200M here) that sells new shares into the open market; at a ~$3 stock it
    heavily dilutes existing holders.
- term: p_fail
  definition: Modeled probability the scenario ends in failure or insolvency before economics arrive — elevated here because
    surviving the cash crunch is itself uncertain.
competitive:
  arena: In-vivo and ex-vivo precise gene editing for genetic disease, against base editors (BEAM), nuclease editors (Intellia,
    CRISPR Therapeutics) and editing platforms (Editas).
  lens: power_origination
  powers:
    scale_economies:
      score: 1
      note: Sub-scale and cash-starved; forced to cut ~25% of staff and the pipeline in May 2025.
    network_economies:
      score: 0
      note: No network effects in a therapeutics platform; value is clinical proof, not adoption density.
    counter_positioning:
      score: 2
      note: Prime editing avoids double-strand breaks and makes edit types base editing cannot — a model rivals can't simply
        copy.
    switching_costs:
      score: 1
      note: Switching costs accrue only post-approval, per indication; none yet with zero approved products.
    branding:
      score: 0
      note: No commercial brand; pre-revenue clinical-stage with reputational, not pricing, recognition.
    cornered_resource:
      score: 2
      note: David Liu / Broad prime-editing IP and know-how are a genuine scarce asset — but underfunded to exploit.
    process_power:
      score: 1
      note: Editing-design and delivery know-how is real but early and not yet a durable manufacturing advantage.
  dominant_power: cornered_resource
  window: closing
  rivals:
  - name: BEAM (base editing)
    kind: public
    note: Same gene-editing family; $1.21B cash vs PRME's $149M — far better capitalized.
    share_now: 0.3
    share_terminal: 0.3
    capital: $1.21B cash, runway to ~2029
  - name: Intellia / NTLA
    kind: public
    note: In-vivo CRISPR nuclease editing; deeper clinical pipeline and balance sheet.
    share_now: 0.25
    share_terminal: 0.25
    capital: well-funded, partnered
  - name: CRISPR Therapeutics
    kind: public
    note: Approved ex-vivo product (Casgevy) and substantial cash; nuclease leader.
    share_now: 0.25
    share_terminal: 0.2
    capital: product revenue + large cash
  - name: Editas Medicine
    kind: public
    note: Editing platform peer; also capital-constrained and restructuring.
    share_now: 0.1
    share_terminal: 0.05
    capital: constrained
  lead_lag:
  - metric: Clinical first
    company: PM359 first-ever clinical prime edit (NEJM)
    best_rival: Base/nuclease peers further in pivotal trials
    verdict: even
  - metric: Balance sheet
    company: ~$149M / ~9 months / going-concern
    best_rival: BEAM ~$1.21B / runway to ~2029
    verdict: lagging
  - metric: In-vivo delivery
    company: Refocused to liver, pre-clinical-readout
    best_rival: NTLA/peers with in-vivo human data
    verdict: lagging
  takeaway: PRME is trying to originate a cornered-resource/process Power in versatile, precise editing — the David Liu prime-editing
    platform is a genuine scarce asset, and PM359 proves the chemistry works in humans. But the company is cash-starved and
    was forced to cut its pipeline, so the Power-origination window is closing faster than the science is maturing. The falsifier
    the bull must clear is concrete — reach a partnered or approved program before the balance sheet forces value-destroying
    dilution. Same family as BEAM, opposite balance sheet.
pocd:
  people:
    ceo: Allan Reine, M.D.
    founder_led: false
    tenure_years: 1
    insider_ownership_pct: 15.61
    capital_allocation: Allan Reine became CEO in May 2025 (prior CFO, Jan 2024-May 2025), replacing scientific-founder
      CEO Keith Gottesdiener in a restructuring that shelved the lead clinical program and refocused the pipeline
      on liver targets. The company is cash-starved — a going-concern flag and a ~$200M ATM facility — so capital
      allocation is dominated by survival and dilution management. Pre-revenue; no dividend or buyback.
    incentive_alignment: Directors and officers as a group hold ~15.6% (11 persons, Feb 2026). The clearest positive
      alignment signal is scientific co-founder David Liu — filed as a director and 10% owner, ~11.2% (~20.2M shares),
      the largest individual holder — making open-market purchases in June 2025. The new CEO’s pay is option-weighted
      (a 1.3M-share grant in February 2026).
    governance_flags:
    - single class of common stock, one vote per share — no dual-class (Delaware)
    - classified / staggered board (three classes) — a director-entrenchment flag
    - going-concern condition with a ~$200M ATM — forced-dilution overhang is the central capital-allocation risk
    - co-founder David Liu filed as director / 10% owner (also the operating SAB chair) and made open-market purchases
      June 2025
    - ARCH Venture (~10.2%) and GV / Google Ventures (~9.2%) are the largest outside holders
    key_person_risk: high
    score: 3
    takeaway: 'A clean single-class one-vote register and a genuine founder-alignment signal (co-founder David Liu,
      the largest holder, buying in the open market) are the positives. Against them sit a classified/staggered board,
      a recent CEO change-plus-restructuring, and — most of all — a going-concern balance sheet with a ~$200M ATM,
      so capital allocation is hostage to dilution. Key-person risk is high: the prime-editing platform is founder-science
      led and the clinical pipeline was just cut to one focus.'

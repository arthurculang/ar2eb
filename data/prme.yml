      flag, the $200M ATM is tapped repeatedly into a falling stock, sinking the equity toward the $0.40 distress floor.
    - FY35 product revenue stalls at ~$0.11B and p_fail is 90% — survival itself is the bet, not just the science. The share
      count balloons from 180M to ~702M, so even residual value is spread thin. DCF −$0.81; the distress-weighted expected
      value is ~$0.28.
    probability_rationale: 16% — the combination of 9-month runway, going-concern doubt, and clinical-stage risk makes near-term

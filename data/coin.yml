appendix:
  pushback:
  - label: Subscription engine is structural.
    body: Sub & services hit $555M in Q2 2026 (48% of net revenue) despite the trading slump, on a record $20B of Coinbase-held
      USDC.
  - label: Regulatory moat is unprecedented.
    body: SEC case dropped 2025; GENIUS Act; 2026 SEC tokenized-securities exemption + UK FCA approval. The only fully-regulated
      big US exchange.
  - label: Deribit makes COIN the global derivatives leader.
    body: Closed Aug 2025 (~$4.3B); ~49% of crypto options (IBIT briefly topped its open interest, Apr 2026). Higher-margin,
      less cyclical than spot.
  - label: Coinbase One is the cycle hedge.
    body: '>1M paid subs at $30/mo + premium tiers. Engagement floor regardless of BTC price. Higher trading volume + revenue
      per user vs free tier.'
  - label: Balance sheet absorbs cycle.
    body: $8.6B cash + ~$1.5B BTC + CRCL vs $6.0B debt, after repaying the 2026 converts in cash. Survives a 2022-style winter.
  triggers:
  - label: Bear validation
    body: BTC < $60K sustained > 2 quarters  ·  transaction rev < $700M/qtr  ·  take-rate below 10 bps  ·  Coinbase-held USDC < $15B  ·  Hyperliquid-style
      deals proliferate
  - label: Bull validation
    body: BTC > $150K sustained > 2 quarters  ·  derivatives rev > $400M/qtr  ·  Coinbase-held USDC > $50B  ·  Coinbase One > 2M subs  ·  international
      flows > 25% of derivatives
  - label: Reframe needed
    body: If bank-issued stablecoins (the 21-bank consortium coin, Open USD) scale and take >20% of USDC's share, the rails
      thesis breaks. Conversely, a major COIN acquisition (>$5B) broadens the thesis.
glossary:
- term: USDC
  definition: Circle-issued dollar stablecoin. ~$75B circulating (~24% of stablecoins, Sep 2026); a record ~$20B held in
    Coinbase products (Q2 2026). GENIUS Act-regulated (effective by Jan 2027).
- term: Transaction revenue
  definition: Fees on trading volume (spot + derivatives). $4.0B FY25 (56% of revenue). Cyclically tied to crypto prices/volatility;
    the main swing variable.
- term: Subscription & services
  definition: Non-transaction revenue — USDC interest, staking, custody, Coinbase One subs. $2.8B FY25; $555M in Q2 2026 (48%
    of net revenue) as lower crypto prices and rates offset USDC growth.
- term: Deribit
  definition: Crypto-options exchange acquired Aug 2025 (~$2.9B announced, ~$4.3B at close). ~49% of crypto options (55% of
    BTC); IBIT options briefly topped its open interest (Apr 2026).
- term: GENIUS Act
  definition: US stablecoin law (2025). Defines permitted issuers; $10B ceiling for state-qualified ones. Federal moat for
    USDC.
- term: Circle (CRCL) stake
  definition: CRCL shares received in the 2023 Centre dissolution; part sold Q1 2026. The remainder (≤~8.4M shares) is worth
    ≤~$0.8B at ~$92 (Sep 2026). Marked as a strategic investment.

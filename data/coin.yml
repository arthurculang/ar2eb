    headline: Cycle bottoms; multiple resets to 18×.
    narrative:
    - 'Not existential — the cycle normalizing and the market repricing. BTC trades $50-80K for two years (a deeper, longer
      correction than Q1 2026 priced). Transaction revenue runs $2.5-3.0B annually — below FY25''s $4.0B peak but above the
      FY23 winter trough. Coinbase still gains share (regulatory wedge post-SEC dismissal) but on a smaller pie. The everything-exchange
      thesis holds operationally, but the equity re-rates to 18-22× FCF — crypto stocks lose their growth premium when transaction
      revenue stops growing.

      '
    - 'The subscription engine partially compensates. USDC float plateaus at $25-30B as the GENIUS Act ceiling caps growth
      and bank-issued stablecoins take 30-40% of new issuance. Stablecoin revenue holds $1.0-1.2B annually. Derivatives volume
      grows as Deribit integrates, but margin profile is structurally lower than spot. FCF cycles $1.5-2.5B/year. Exit-multiple
      SOTP: ~$138/share, ~24% below spot — a real downside but not catastrophic. The cycle hurts; the platform survives.

      '
    probability_rationale: 'Cycle-normalization plus competitive compression: BTC range-bound $50-80K for 18-24 months (median
      post-peak crypto correction); revenue stays $2.5-3.0B; take-rate compresses 15-20% as Robinhood gains retail share and
      Hyperliquid-style deals nick institutional flows; USDC float plateaus under the GENIUS Act ceiling; multiple resets
      from ~20× to 18× FCF. The 22% weight reflects that crypto cycles are real and historically common (2018, 2022 — base

appendix:
  pushback:
  - label: Subscription engine is structural.
    body: Sub & services hit $584M Q1 2026 despite trading collapse — counter-cyclical USDC float kept revenue from imploding
      like 2022. ~44% of net revenue.
  - label: Regulatory moat is unprecedented.
    body: SEC dismissed with prejudice Feb 2025; GENIUS Act passed; CFTC derivatives jurisdiction clear. The only fully-regulated
      US large-scale exchange.
  - label: Deribit makes COIN the global derivatives leader.
    body: 'Acquisition closed Aug 2025 at $4.3B effective. #1 by options open interest and volume. Derivatives are higher-margin
      and less cycle-correlated than spot.'
  - label: Coinbase One is the cycle hedge.
    body: '>1M paid subs at $30/mo + premium tiers. Engagement floor regardless of BTC price. Higher trading volume + revenue
      per user vs free tier.'
  - label: Balance sheet absorbs cycle.
    body: $10.2B cash + $1.3B BTC + ~$1B CRCL + ~$1.3B crypto = $13.8B liquid. Survives a 2022-style winter without distress.
  triggers:
  - label: Bear validation
    body: BTC < $60K sustained > 2 quarters  ·  transaction rev < $700M/qtr  ·  take-rate below 10 bps  ·  USDC float < $20B  ·  Hyperliquid-style
      deals proliferate
  - label: Bull validation
    body: BTC > $150K sustained > 2 quarters  ·  derivatives rev > $400M/qtr  ·  USDC float > $50B  ·  Coinbase One > 2M subs  ·  international
      flows > 25% of derivatives
  - label: Reframe needed
    body: If banks (JPM, BoA) launch GENIUS-compliant stablecoins at scale taking >20% of USDC share, the rails thesis breaks.
      Conversely, a major COIN acquisition (>$5B) broadens the thesis.
glossary:
- term: USDC
  definition: Circle-issued regulated dollar stablecoin. ~$60B circulating; $19B held within Coinbase products Q1 2026. Federally
    regulated under the GENIUS Act.
- term: Transaction revenue
  definition: Fees on trading volume (spot + derivatives). $4.0B FY25 (56% of revenue). Cyclically tied to crypto prices/volatility;
    the main swing variable.
- term: Subscription & services
  definition: Non-transaction revenue — USDC interest, staking, custody, Coinbase One subs. $2.8B FY25; structurally growing.
- term: Deribit
  definition: 'Crypto-options exchange acquired Aug 2025 for $4.3B. Global #1 by options open interest. Made COIN the derivatives
    leader.'
- term: GENIUS Act
  definition: US stablecoin law (2025). Defines permitted issuers; $10B ceiling for state-qualified ones. Federal moat for
    USDC.
- term: Circle (CRCL) stake
  definition: COIN holds ~8.4M CRCL shares from the 2023 Centre dissolution. ~$1B at $120/share (range $0.5-2.5B). Marked
    as a strategic investment.

  ultra_bear:
    label: Ultra Bear
    short_label: UltBear
    probability: 0.08
    expected_per_share: 30.41
    headline: Crypto winter + take-rate war.
    narrative:
    - 'Not slow cycle — a coordinated four-front collapse. BTC enters a multi-year bear market mirroring 2022 (down 70%+ from
      $120K peak to $35-40K) as ETF outflows compound and the post-halving liquidity wave fails to materialize. Transaction
      revenue collapses from $4.0B FY25 to $1.5B by FY28 as both volume drops 60% AND take-rate compresses 30% under Robinhood/Hyperliquid
      pressure. The GENIUS Act regime turns hostile in implementation — bank-issued stablecoins take share from USDC and the
      discount-window asymmetry kills USDC''s runway.

      '
    - 'The Circle relationship inverts: Hyperliquid-style direct-USDC deals proliferate across DeFi, compressing Coinbase''s
      50% revenue share to 30% on a smaller pie. Coinbase One churn spikes. Operating margin compresses from 40% (FY25) to
      10% by FY28 as Coinbase spends defensively. FCF goes negative two years. The multiple collapses from ~15× FCF normalized
      to 8× — crypto loses its narrative entirely. Exit-multiple SOTP: ~$52/share, a -71% tail. Mirrors the 2022 winter (COIN
      traded to $33 from $381 IPO) on a more diversified business.

      '
    probability_rationale: 'Joint conjunction of four largely independent fault lines: (a) BTC enters a 2022-style multi-year
      bear (~30% in any 3-year window post-halving); (b) take-rate compression accelerates as Robinhood gains share AND Hyperliquid-style
      USDC deals proliferate ($80M annualized EBITDA drag from Hyperliquid alone per Coindesk May 2026); (c) GENIUS Act favors
      bank-issued stablecoins, capping USDC at ~$50B float; (d) Deribit integration friction stalls the derivatives flywheel.
      Each individually 20-30%; joint at 8%. Higher than ZM''s 8% ultra_bear because crypto-cycle volatility has a real historical
      base rate (2022 was 14 months ago).

      '

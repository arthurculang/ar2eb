thesis: 'Coinbase trades at $182.25 ($48B mkt cap) on FY25 revenue $7.18B and adj EBITDA $2.81B, with a fortress balance sheet
  (~$10.2B cash, $7.2B debt, ~$3.5B CRCL + BTC + crypto). FY25 was peak-cycle; Q1 2026 broke the spell: revenue $1.4B (-40%
  from Q4), a $394M net loss as BTC slid $120K to $73K. Bull thesis is structural (SEC case dropped, GENIUS Act USDC moat,
  Deribit derivatives leadership); bear is equally real (take-rate compression, persistent cycle exposure). Mature-Company
  SOTP DCF, exit-multiple terminal; five scenarios; show your work.'

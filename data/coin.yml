# ═════════════════════════════════════════════════════════════════════════════
competitive:
  arena: >
    Crypto exchange + on-chain financial rails — Coinbase vs Binance (global volume),
    Kraken, Robinhood (low-fee), spot ETFs (BlackRock/Fidelity), and on-chain DEXs;
    the race for the regulated US rails, custody, and stablecoin (USDC/Base).
  lens: power_audit
  powers:
    scale_economies:     { score: 2, note: "Liquidity + volume amortize compliance/security cost." }
    network_economies:   { score: 2, note: "Liquidity begets liquidity; Base L2 ecosystem; USDC distribution." }
    counter_positioning: { score: 1, note: "Hard to counter-position in a commoditizing exchange market." }
    switching_costs:     { score: 2, note: "Custody, staking, institutional integrations, fiat on-ramps." }
    branding:            { score: 3, note: "The trusted, regulated, public-company US crypto brand." }
    cornered_resource:   { score: 2, note: "US regulatory licenses/compliance estate; Circle/USDC relationship (revenue share renewed unchanged into 2029); Base L2." }
    process_power:       { score: 2, note: "Compliance + security track record (no major custody hack)." }
  dominant_power: branding
  durability: medium
  rivals:
    - { name: "Binance", kind: private, note: "Largest global volume; regulatory overhang; offshore.", growth: 0.10, margin: 0.45, multiple: "private" }
    - { name: "Robinhood", kind: public, note: "Low/zero-fee; Q2 crypto revenue -38% YoY; prediction markets now out-earn crypto.", growth: 0.25, margin: 0.30, multiple: "~30x" }
    - { name: "Spot ETFs (BlackRock/Fidelity)", kind: incumbent-division, note: "Disintermediate spot holding/custody; IBIT options open interest briefly topped Deribit's (Apr 2026).", growth: 0.40, margin: null, multiple: "n/a" }
    - { name: "Kraken", kind: private, note: "Established US exchange; IPO paused Mar 2026; Q2 adj. revenue $508M (+17%).", growth: 0.15, margin: null, multiple: "private" }
  threats:
    - { vector: scale_economies, who: "Robinhood / zero-fee entrants", falsifier: "Consumer transaction revenue / consumer spot volume below 1.0% for two straight quarters (~1.75% in Q2 2026)." }
    - { vector: counter_positioning, who: "Spot ETFs + DEXs", falsifier: "Coinbase trading-volume share declines 2 consecutive quarters during a crypto bull market." }
    - { vector: cornered_resource, who: "Bank-consortium stablecoin (21 banks) / Open USD", falsifier: "USDC share of stablecoin supply falls below 20% (24% in Sep 2026), or average USDC held in Coinbase products falls below $15B (record $20B, Q2 2026)." }
  takeaway: >
    A regulated-trust brand plus liquidity/USDC network with real compliance barriers,
    underpinning the bull terminal value; fee compression, ETF/DEX disintermediation, and
    bank / Open USD stablecoins taking USDC share are the durability falsifiers to watch.
pocd:
  people:
    ceo: 'Brian Armstrong'
    founder_led: true
    tenure_years: 14
    insider_ownership_pct: 14.0
    capital_allocation: 'M&A-led with a growing capital return: bolt-ons (Xapo, Tagomi, Bison Trails, FairX)
      culminating in Deribit (~$2.9B announced, ~$4.3B at the Aug-2025 close — the largest crypto-industry deal),
      funded partly in stock. A $4.0B repurchase authorization ($1B Oct 2024 → $2B Oct 2025 → $4B Jan 2026, incl.
      converts/notes) is half spent: $2.0B through Jun 30 2026, retiring ~10.1M Class A shares; the 2026 converts
      were repaid in cash. Holds a long-term crypto treasury (~17,200 BTC, Jun 2026).'
    incentive_alignment: 'Alignment runs through the founder stake, not fresh pay: FY2024 was a $1M salary with
      $0 bonus and $0 new equity (the bulk of "other comp" ~$6.2M is personal security). But Armstrong is a
      steady seller — a 10b5-1 plan moved ~$550M (>1.5M shares, ~5% of his stake) over the past year.'
    governance_flags:
      - 'super-voting dual-class (Class B = 20 votes) → majority (~60%+) founder voting control'
      - '"controlled company" eligible — but committees 100% independent (does not lean on the exemptions)'
      - 'CEO + Chairman combined (lead independent director)'
      - 'Class B non-dilutable by outsiders (converts on transfer)'
    key_person_risk: high
    score: 3
    takeaway: 'Founder-CEO with ~14% economic but majority, non-dilutable voting control — outsiders cannot
      force a change. Aligned via the stake and a fully-independent committee structure, but the offsets stack:
      majority control and a steady 10b5-1 sell-down, with capital split across M&A, a crypto treasury and a $4B
      buyback (half spent).'
  opportunity_ref: 'The scenario distribution · the business snapshot · the Arthur Indicator'
  context_ref: 'The 7 Powers analysis (Power Audit)'
  deal: 'Open-market common — entry price weighed against the probability-weighted fair value (the +34.2% finding), then position-sized.'

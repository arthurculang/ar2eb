  ultra_bear:
    label: Ultra Bear
    short_label: UltBear
    probability: 0.08
    expected_per_share: 27.96
    headline: Crypto winter + take-rate war.
    narrative:
    - 'Not slow cycle — a coordinated four-front collapse. BTC enters a multi-year bear market mirroring 2022 (down
      70%+ from its $120K+ peak to $35-40K) as ETF outflows compound and the post-halving liquidity wave fails to
      materialize. Transaction revenue collapses from $4.0B FY25 to $1.5B by FY28 as both volume drops 60% AND
      take-rate compresses 30% under Robinhood/Hyperliquid pressure. The GENIUS Act regime turns hostile in
      implementation — bank-issued stablecoins take share from USDC and the discount-window asymmetry kills USDC''s
      runway.'
    - 'The Circle relationship inverts at the 2029 renewal: Hyperliquid-style direct-USDC deals proliferate across
      DeFi, compressing Coinbase''s 50% revenue share to 30% on a smaller pie. Coinbase One churn spikes. Operating
      margin compresses to ~10% by FY28 as Coinbase spends defensively, and FCF compresses to ~$0.3-0.4B. The multiple
      collapses to an 8× FCF exit — crypto loses its narrative entirely. Mirrors the 2022 winter (COIN closed near
      $33, from a $381 listing-day open) on a more diversified business.'
    probability_rationale: 'Joint conjunction of four largely independent fault lines: (a) BTC enters a 2022-style
      multi-year bear (~30% in any 3-year window post-halving); (b) take-rate compression accelerates as Robinhood
      gains share AND Hyperliquid-style USDC deals proliferate ($80M annualized EBITDA drag from Hyperliquid alone per
      Coindesk May 2026); (c) bank-issued stablecoins take share, shrinking Coinbase-held USDC below $15B; (d) Deribit
      integration friction stalls the derivatives flywheel. Each individually 20-30%; joint at 8%. Same 8% as ZM''s
      ultra_bear: crypto-cycle volatility has a real historical base rate (the 2022 winter).'

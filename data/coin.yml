    short_label: Bear
    probability: 0.22
    expected_per_share: 102.65
    headline: Cycle bottoms; multiple resets to 12×.
    narrative:
    - 'Not existential — the cycle normalizing and the market repricing. BTC trades $50-80K for two years, extending
      the H1 2026 slide. Revenue settles at ~$5.5-6.1B a year — below FY25''s $7.18B peak but well above the FY23
      winter trough ($3.1B). Coinbase still gains share (regulatory wedge post-SEC dismissal) but on a smaller pie.
      The everything-exchange thesis holds operationally, but the equity re-rates to a ~12× FCF exit — crypto stocks
      lose their growth premium when transaction revenue stops growing.'
    - 'The subscription engine partially compensates. Coinbase-held USDC stalls near today''s ~$20B as bank-issued
      stablecoins take 30-40% of new issuance. Stablecoin revenue holds $1.0-1.2B annually. Derivatives volume grows
      as Deribit integrates, but its margin profile is structurally lower than spot. FCF runs $1.7-2.0B a year. A real
      downside but not catastrophic: the cycle hurts; the platform survives.'
    probability_rationale: 'Cycle-normalization plus competitive compression: BTC range-bound $50-80K for 18-24 months
      (median post-peak crypto correction); revenue stays well below FY25; take-rate compresses 15-20% as Robinhood
      gains retail share and Hyperliquid-style deals nick institutional flows; Coinbase-held USDC stalls; the exit
      multiple resets to ~12× FCF. The 22% weight reflects that crypto cycles are real and historically common (2018,
      2022 — base rate ~25% per 5-year window), and the H1 2026 losses already validated some of the cycle thesis.'

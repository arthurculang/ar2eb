    headline: Everything-exchange compounds.
    narrative:
    - 'The middle path: Coinbase builds the regulated, vertically-integrated everything-exchange. BTC ranges $80-130K
      (mid-cycle). Transaction revenue runs $3.5-4.5B annually with cycle texture. Subscription & services becomes the
      structural growth engine — Coinbase-held USDC compounds to $35-40B, stablecoin revenue grows to $1.5-2.0B,
      staking + custody + interest add another $1.5B+. The Deribit acquisition delivers — derivatives volume grows
      40%+ annually with margin converging toward spot over time.'
    - 'The regulatory tailwind is priced but structurally favorable. GENIUS Act gives USDC durable clarity. Deribit
      scales as offshore derivatives institutionalize. Coinbase One reaches 2.5M subs by FY30, putting a floor under
      engaged users. Operating margin rises to ~40%. Revenue reaches ~$9.5B by FY30 (5.8% CAGR off FY25''s $7.18B);
      FCF $2.55B → ~$3.8B; ~15× FCF exit — what a great mature platform offers when the moat is mostly priced.'
    probability_rationale: 'Modal outcome. SEC dropped its case, GENIUS Act gave USDC clarity, Deribit closed and is
      integrating, Coinbase One crossed 1M paid subs — the structural picture is set. What remains is execution +
      cycle. Base assumes BTC ranges $80-130K (most common 5-year outcome post-peak), take-rate compresses gradually

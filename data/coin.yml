central_question: Is Coinbase the durable monopoly rail layer for crypto — a record $20B of Coinbase-held USDC, the Deribit
  derivatives platform, a regulator that surrendered — or a cycle stock that has now printed back-to-back quarterly losses?
thesis: 'Coinbase trades at $201 (~$53B) after a cyclical 2026: Q2 revenue $1.22B (-18.5% YoY) and a $360M GAAP loss, the
  second straight, as BTC fell from above $120K (Oct 2025) to a $58K low before recovering to ~$87K. The structural case
  firmed in the same quarter: a record 10.3% volume share, a record $20B of USDC in Coinbase products, and the Circle revenue
  share renewed unchanged into 2029, on $8.6B cash vs $6.0B debt. The bear: cycle exposure plus new stablecoin rivals. Modal
  case ~12% above the price; 30% of the probability sits below it. Mature-company SOTP DCF, exit-multiple terminal; five
  scenarios.'

central_question: At ~$30 with ~$11.75/share of net cash, do the de-risked BEAM-302 (AATD) and risto-cel SCD programs make
  base editing a cheap option, or is clinical failure the likelier outcome?
thesis: 'Beam is a pre-product, clinical-stage base-editing biotech — it precisely rewrites a single DNA base with no double-strand
  cut. Revenue is lumpy collaboration income ($139.7M FY25); the op loss runs ~$400M/yr. The asset that matters is $1.21B
  cash (~$11.75/share, runway to mid-2029) plus a pipeline: risto-cel SCD (BLA as early as YE2026) and BEAM-302, the first
  in-vivo corrective editor, on an FDA-aligned accelerated path. The DCF asks whether the leads reach market before dilution
  erodes the equity. Weighted fair value is $39.38 vs $30 spot, +31% — asymmetric: the cash raises the floor, the de-risked
  data builds the right tail, clinical failure is the risk.'

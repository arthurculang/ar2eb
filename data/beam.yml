weighting_rationale:
- label: Ultra Bear 16%
  body: Leads fail; reverts to the ~$8 cash floor.
- label: Bear 29%
  body: Risto-cel ships, slow vs Casgevy; one franchise.
- label: Base 32%
  body: Both leads reach market; partial validation.
- label: Bull 15%
  body: Both win; in-vivo platform scales to franchises.
- label: Ultra Bull 8%
  body: Dominant in-vivo platform; several blockbusters.
appendix:
  pushback:
  - label: Cash floor is real
    body: $1.21B cash (~$11.75/share) and runway to mid-2029 bound the downside — even the ultra-bear expected value is $5.77.
  - label: BEAM-302 is de-risked
    body: The AATD Phase 1 data showed a working in-vivo corrective edit on the AAT biomarker, with an FDA-aligned accelerated
      path.
  - label: Two independent shots
    body: Risto-cel (SCD) and BEAM-302 (AATD) fail or succeed on different biology, so partial success beats an all-or-nothing
      wipeout.
  - label: No-cut mechanism
    body: Base editing avoids CRISPR's double-strand cut; Casgevy needs myeloablative chemo and carries a malignancy black-box
      — a differentiation lane.
  - label: Self-funded to inflection
    body: Burn is heavy but funded; raises are dilutive, not existential — the risk is clinical, not insolvency.
  triggers:
  - label: Bull validation
    body: BEAM-302 pivotal cohort shows durable AAT correction with clean safety; risto-cel BLA accepted and a differentiated
      SCD launch lands vs Casgevy.
  - label: Bear validation
    body: BEAM-302 durability fades or an in-vivo LNP safety signal emerges; risto-cel launch stalls against the incumbent;
      raises come faster and larger than ~$0.95B.
  - label: Reframe needed
    body: If cash falls toward the floor without a pivotal win, or a platform-wide safety class effect appears, the option
      re-rates toward the distress case.
glossary:
- term: base editing
  definition: A precise single-base DNA rewrite that corrects a mutation without cutting both strands, avoiding the genotoxicity
    of a CRISPR double-strand cut.
- term: risto-cel / BEAM-101
  definition: Beam's ex-vivo base-editing therapy for sickle cell disease; durably induces protective fetal hemoglobin; BLA
    possible as early as YE2026.
- term: BEAM-302
  definition: An in-vivo LNP base editor for AATD that corrects the PiZ→PiM mutation — the first in-vivo corrective editor
    and the biggest swing factor.
- term: AATD
  definition: Alpha-1 antitrypsin deficiency — a genetic disorder; the AAT protein level is the FDA-accepted accelerated-approval
    biomarker.
- term: Casgevy
  definition: The Vertex/CRISPR Therapeutics approved SCD therapy — the incumbent — burdened by myeloablative chemo conditioning
    and a malignancy black-box warning.
- term: p_fail
  definition: Modeled probability the scenario's programs fail to reach commercial value — the clinical/regulatory risk weight,
    high for a pre-product editing platform.
competitive:
  arena: In-vivo and ex-vivo gene editing for genetic disease, where Beam competes with Vertex/CRISPR, Intellia, CRISPR Therapeutics,
    and Editas.
  lens: power_origination
  powers:
    scale_economies:
      score: 1
      note: Manufacturing and trial scale matter, but Beam is pre-product and sub-scale versus the SCD incumbent today.
    network_economies:
      score: 0
      note: No network effect in therapeutics; demand does not compound with an installed base.
    counter_positioning:
      score: 2
      note: No-cut base editing is positioned against CRISPR's genotoxic double-strand cut; incumbents cannot easily abandon
        their cutting approach.
    switching_costs:
      score: 1
      note: One-time curative dosing creates patient lock-in per franchise, but does not bind the next indication or prescriber.
    branding:
      score: 1
      note: NEJM data and platform reputation help, but prescribing follows clinical evidence, not brand.
    cornered_resource:
      score: 2
      note: Foundational base-editing IP and the in-vivo LNP delivery toolkit are the resource Beam is trying to corner.
    process_power:
      score: 2
      note: A repeatable single-base correction process across targets is the Power being originated — unproven until durability
        replicates.
  dominant_power: cornered_resource
  window: open
  rivals:
  - name: Vertex / CRISPR Therapeutics
    kind: public
    note: 'Casgevy: approved SCD incumbent, chemo conditioning, slow uptake'
    share_now: 0.6
    share_terminal: 0.35
    capital: Well-capitalized, marketed product
  - name: Intellia / NTLA
    kind: public
    note: In-vivo CRISPR editor; direct competitor for the in-vivo category
    share_now: 0.15
    share_terminal: 0.25
    capital: Funded, clinical-stage
  - name: CRISPR Therapeutics / CRSP
    kind: public
    note: CRISPR platform breadth beyond Casgevy across multiple indications
    share_now: 0.1
    share_terminal: 0.15
    capital: Strong balance sheet
  - name: Editas
    kind: public
    note: Gene-editing peer, repositioning; smaller and earlier
    share_now: 0.05
    share_terminal: 0.05
    capital: Smaller cap, clinical-stage
  lead_lag:
  - metric: In-vivo corrective editing
    company: First in-vivo corrective Phase 1 readout (BEAM-302)
    best_rival: Intellia in-vivo programs
    verdict: leading
  - metric: SCD commercialization
    company: BLA-stage, not yet launched
    best_rival: Vertex/CRISPR (Casgevy approved)
    verdict: lagging
  - metric: Editing precision / safety
    company: No double-strand cut, durable HbF induction
    best_rival: CRISPR cut-based platforms
    verdict: leading
  takeaway: 'Beam is trying to originate a cornered-resource and process Power in precise in-vivo editing — foundational base-editing
    IP plus a repeatable LNP correction process that, if it replicates, turns each genetic target into a shot on goal. The
    window is open: no rival has shown a durable in-vivo corrective edit. The falsifier the bull must clear is concrete —
    BEAM-302 must show durable AAT correction with a clean in-vivo safety profile, and risto-cel must launch differentiated
    against Casgevy. Without durability the resource is not yet cornered.'

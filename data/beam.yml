  ultra_bear:
    label: Ultra Bear
    short_label: UltBear
    probability: 0.16
    expected_per_share: 5.77
    headline: Leads fail; cash floor holds
    narrative:
    - The lead programs fail in pivotal trials or a serious safety signal halts the in-vivo platform. FY35 product revenue
      is just $0.21B at a −15% op margin; p_fail is 80%. The company burns down toward its cash, and the going-concern value
      collapses to the operating business.
    - The standalone DCF is −$3.15/share, but the expected value is $5.77 because the rich $1.21B cash translates into an
      ~$8.00 distress floor — the cushion, not the pipeline, is what the holder recovers. This is the structural reason the
      downside is bounded rather than zero.
    probability_rationale: 'High clinical risk is real for a pre-product editing platform — in-vivo LNP safety and BEAM-302
      durability are unproven. Weighted at 16%: a credible but not modal path, given two independent lead programs and a deep
      early pipeline.'

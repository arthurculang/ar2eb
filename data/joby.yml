  extras: []

# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Will Joby capture meaningful share of a $250B global UAM TAM by 2036 —
  or is today's ~$7.5B market cap pricing certainty that competitive eVTOL
  economics don't support?

thesis: >
  Joby trades at ~$7.5B against $24M of Q1 2026 revenue and $700M
  annualized cash burn. The $2.5B cash position (post Feb 2026 $1.2B raise)
  provides ~3 years of runway. FAA certification entered Stage 5 (TIA) in
  March 2026 with the type certificate guided late 2026, Dubai exclusive
  operations begin in 2026, and the June 2026 Toyota manufacturing joint
  venture unlocks scale. Pre-revenue category-defining companies present
  a Damodaran problem: the standard 5-year DCF generates nonsense. The
  young-company framework asks what mature TAM share is plausible, what
  terminal margins look like at scale, and what probability of outright
  failure. Five scenarios, weighted; show your work.

# ── Page 3 chart-level reference data ───────────────────────────────────────
# Ticker-constant data the Page 3 chart builder needs.
# (Per-scenario chart data lives inside each scenario's chart_data block.)

chart_reference:
  tam_billion: 250  # global UAM TAM at FY36
  history_years: [2024, 2025, 2026]  # FY24-26 actuals on Page 3 charts
  history_revenue: [0.080, 0.150, 0.110]  # $B actuals; FY26 = midpoint of reaffirmed $105-115M guidance (Q1'26 release)
  history_fleet: [12, 28, 50]  # cumulative aircraft delivered

# ── Page 3 chart-aesthetic config (Phase 4: migrated out of JSX) ────────
page3_chart_config:
  peer_y: 15
  peer_text: "Aerospace + operator peer median ~15%"
  fleet_anchor: 50                            # anchor to last historical aircraft count
  fleet_title: "eVTOL aircraft deployed (log)"
  fleet_reference: null
  valn_anchor_y: 3
  valn_anchor_text: "Mature aerospace P/S ~2-4×"
  valn_caption: "Bear=very stretched (6.9×), base=full (1.5×), bull=cheap (0.5×)."
  tam_title: "$250B global UAM TAM (FY36) — Joby share"
  tam_legend: ["JOBY", "Competitors", "Other UAM (cargo, etc.)"]


# ── Page 1 weighting rationale (4 short lines, one per scenario) ────────────
weighting_rationale:
  - label: "Ultra Bear 13%"
    body: "Deepest tail: heavier distressed dilution to survive; the $2.5B cash floor keeps it above zero."
  - label: "Bear 17%"
    body: "Aerospace startups historically fail at high rates; for-credit testing routinely runs long."
  - label: "Base 55%"
    body: "Modal outcome: Joby + Archer split US with aerospace-blend margins."
  - label: "Bull 12%"

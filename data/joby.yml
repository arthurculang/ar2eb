    headline: "Western eVTOL leader; SaaS margins."
    narrative:
      - >
        The bull case is that Joby becomes the dominant Western eVTOL operator
        and manufacturer. FAA Type Certification on schedule in 2026 unlocks
        rapid scaling. The Toyota manufacturing partnership delivers the Dayton
        facility at full 500-aircraft/year capacity by FY28-29. Dubai
        exclusivity becomes a template — Joby wins similar long-term operating
        contracts in Saudi Arabia, India, and Southeast Asia.
      - >
        Competition narrows. Archer ships but at lower volumes. EHang remains
        regional to China. By FY36 Joby operates 4,000 aircraft, generates $20B
        revenue, and captures 8% of $250B global UAM TAM. As autonomous flight
        capability matures (5-7 years away), Joby pivots to a software-take-rate
        model on partner-operated aircraft, reaching software-like margins.
        Mature operating margin reaches 28%.
      - >
        The math: $33B operating EV, $2.5B cash, 1.09B FY36 shares (11%
        dilution). DCF $32.58/share. With 8% failure probability, expected
        per-share $30.05. The bull case implies today's price deeply
        undervalues the trajectory — but only with meaningful probability
        weight on dominance.
    probability_rationale: >
      The bull case requires a chain of conditional events: FAA Type Cert on
      schedule by end-2026 AND Toyota Dayton scales to full 500-aircraft/year
      capacity by 2028-29 AND Dubai exclusivity template replicates in 3+
      countries (Saudi Arabia, India, SE Asia) AND competition narrows (Archer
      ships meaningfully lower volumes, EHang stays regional to China) AND
      autonomous flight matures within 5-7 years AND Joby successfully pivots
      to software-take-rate model on partner aircraft. Even granting 60-70%
      probability per condition with correlation (i.e., if cert works Toyota
      probably scales), joint probability lands closer to 10-15%. Conjunctive
      probability is one of the most reliably underestimated quantities in
      forecasting — the bull case isn't blocked by any single piece looking
      unlikely, but by compound dependency. 15% reflects that this is a real
      possibility, just not central.


    headline: "eVTOL stalls; cash floors a thin value."
    narrative:
      - >
        The deepest tail: Joby's commercial eVTOL ramp stalls (~$0.82B by FY36) — certification, manufacturing yield or route economics disappoint and adoption never reaches scale, well below the bear's $1.5B niche.
      - >
        Surviving the stall requires heavier, more dilutive capital than the bear: successive distressed raises take the share count to ~2.87B (from ~0.9B, ~69% dilution) versus the bear's ~1.5B. Operating EV stays negative with no self-sustaining FCF base.
      - >
        Joby's ~$2.5B cash is the floor: even in this tail the residual cash + a 40% distress recovery hold expected per-share to ~$0.29 — a positive but materially lower value than the bear's $0.42, the deepest of the distribution. The cash cushion is precisely why the ultra-bear is not a zero.
    probability_rationale: >
      The deepest-failure tail, split from the bear for book-wide consistency. 13% weight reflects genuine certification / manufacturing / unit-economics risk for pre-revenue eVTOL; distinct from the bear in that survival here demands heavier dilution. Within-scenario 48% p_fail; the large cash balance keeps even this tail above zero.


      - >
        The middle path. FAA Type Certification comes through in late 2026 /
        early 2027. Joby's Dubai exclusivity through 2032 anchors Middle East
        revenue, US operations via the eIPP program scale through 2027-28, and
        the Toyota partnership delivers manufacturing scale at the Dayton
        facility. By FY36, ~1,400 aircraft and $7B revenue at 13% operating
        margin.
      - >
        But the market splinters. Archer is the credible #2 in the US. EHang
        dominates China. Joby captures 2.8% of $250B global UAM TAM —
        meaningful but not dominant. Mature 13% operating margin reflects
        aerospace economics: better than legacy carriers (5-8%) but well below
        software (25%+). This is what the Damodaran framework produces with
        defensible peer-set anchors.
      - >
        The math: $3.1B operating EV, $2.5B cash, 1.28B FY36 fully-diluted
        shares (31% dilution from $3.75B raises). DCF $4.34 per share. With 18%
        failure probability, expected per-share $3.65 — well below today's
        price. The base case alone does not carry the valuation; the upper
        scenarios do.
    probability_rationale: >
      Modal outcome given de-risking factors already in place. FAA Type Cert
      progresses on schedule or slightly delayed; Toyota manufacturing scales
      incrementally rather than to full 500-aircraft/year; Dubai launches
      commercially but stays limited in scope; Joby and Archer effectively
      split the US market based on funding/partnership advantages. The 55%
      weight reflects that the base case requires the LEAST faith — no
      breakthrough business model, no dominant competitive position, no
      breakthrough regulatory cooperation. Just sequential execution on plans
      largely in motion. Result: real revenue with aerospace-blend operating
      margins (~13%, peer-set median between regional aviation at 8% and ADAS
      software at 30%), well below the software-economics framing implicit in
      today's market cap. Joby reaches commercial scale; the open question is
      at what margin.


# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Will Joby capture meaningful share of a $250B global UAM TAM by 2036 —
  or is today's $10B market cap pricing certainty that competitive eVTOL
  economics don't support?

thesis: >
  Joby trades at ~$10.3B against $24M of Q1 2026 revenue and $700M
  annualized cash burn. The $2.5B cash position (post Feb 2026 $1.2B raise)
  provides ~3 years of runway. FAA Type Certification is in Stage 4 (final),
  Dubai exclusive operations begin in 2026, and the Toyota manufacturing
  partnership unlocks scale. Pre-revenue category-defining companies present
  a Damodaran problem: the standard 5-year DCF generates nonsense. The
  young-company framework asks what mature TAM share is plausible, what
  terminal margins look like at scale, and what probability of outright
  failure. Three scenarios, weighted; show your work.


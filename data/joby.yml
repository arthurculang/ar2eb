  bear:
    label: Bear
    short_label: Bear           # for charts at small font (chart builder uses this)
    probability: 0.17
    expected_per_share: 0.42    # weighted by within-scenario p_fail; not raw DCF
    headline: "Cert delays; mfg stumbles; China wins."
    narrative:
      - >
        The pessimistic case is brutal for eVTOL economics. FAA Type Certification
        slips from 2026 into 2027 or later — Stage 5 (TIA) was entered in March 2026,
        but for-credit FAA testing has historically taken longer than companies project. The
        Dubai launch is real but on a single route; volume builds slowly.
        Manufacturing in Dayton scales below the 4-aircraft/month target.
      - >
        Cash burn continues at $700M+ annualized. The $2.5B cash position lasts
        ~3 years, but commercial scaling requires far more capital. By FY30 Joby
        has raised another $2-3B at progressively lower prices, diluting holders
        50%+. Aerospace economics don't reach software-like margins — at scale
        operating margin tops out around 5%, similar to legacy regional aviation
        operators.
      - >
        Competition compounds. EHang dominates China and Asia, Airbus enters with
        credibility advantage. Joby reaches just 0.6% of $250B global UAM TAM by
        FY36 — $1.5B revenue, 5% margin. With 35% probability of bankruptcy,
        expected per-share is near-zero.
    probability_rationale: >
      Aerospace startups historically fail at high rates even with funding. SR3
      audit timing has slipped industry-wide; TIA for-credit testing routinely
      extends 12-24 months beyond projections. Manufacturing scaling at Dayton
      is the hardest unproven part — Tesla took years on Model 3 with mature
      automotive suppliers. The 17% weight acknowledges that the $2.5B cash +
      Toyota manufacturing partnership materially reduce execution risk relative
      to a typical aerospace startup, but eVTOL unit economics remain
      fundamentally unproven at fleet scale. Even with strong execution, the
      category itself could fail to generate profitable demand. Within-scenario
      35% p_fail captures Joby-specific bankruptcy; the 17% bear weight —
      with a further 13% ultra-bear split out beneath it — captures the
      broader 'bear world' where eVTOL economics don't scale even if Joby
      executes.


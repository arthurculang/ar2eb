scenarios:

  # ───────────────────────────────────────────────────────────────────────────
  ultra_bear:
    label: Ultra Bear
    short_label: UltBear
    probability: 0.10
    expected_per_share: 50.74
    headline: "Value trap confirmed; NAV marks down; −24%."
    narrative:
      - >
        The fifteen-year discount is fifteen years old for a reason. In the
        ultra-bear, rates stay high or rise, Houston and Las Vegas housing freeze,
        and land sales stall — Summerlin superpad pricing rolls back from the
        FY2025 ~$1.7M/acre record toward bulk-sale levels (~$434K/acre), and
        operating-asset cap rates widen. The NAV itself is re-appraised lower,
        toward ~$86/share, as the land marks down. Vantage stumbles in its first
        underwriting years — insurance is hard, and a green float book can post
        losses — marking to ~$0.9B.
      - >
        Meanwhile the Pershing management fee accrues against a shrinking equity
        base and the governance overhang (the Delaware control-premium suit)
        deters the marginal buyer. The market keeps a ~40% discount on a now-lower
        NAV → ~$51/share, a −24% tail. This is a drawdown, not an impairment: the
        land does not go to zero, and Ackman's $100 cost basis sits far above it —
        but conviction in the catalyst would be tested.
    probability_rationale: >
      Joint conjunction of three fault lines: a real-estate / rate shock that
      actually marks the land down (not just slows sales); a Vantage underwriting
      stumble in its first years; and the discount staying wide as the fee and the
      litigation weigh. Each is individually plausible; together ~10%. Lower than
      bear because the hard-asset land bank and Ackman's $100 cost basis cushion
      the downside — this is the levered, marked-down case, not insolvency.

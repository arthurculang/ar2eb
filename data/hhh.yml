  market_cap_billion: 3.96       # 59.63M sh × $72.53
  shares_outstanding_million: 59.63   # Q1'26 10-Q (Mar-31-2026)
  cash_billion: 1.84             # cash & equivalents (Q1'26)
  net_debt_billion: 5.79         # total debt $5.79B − cash $1.84B
  extras:
    - "~37% discount to $104 NAV"   # the structural story; SOTP non-operating context

# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Howard Hughes trades at a ~37% discount to its own $104 sum-of-the-parts NAV — is
  Bill Ackman's Berkshire-style holding-company conversion the catalyst that finally
  closes a fifteen-year discount on this land bank, or a value trap with a new fee?

thesis: >
  Howard Hughes trades at $66.86 (~$4.0B market cap) — roughly book (~$63/sh) but a
  ~37% discount to the company's own $104/share sum-of-the-parts NAV (~80%
  irreplaceable master-planned-community land + operating assets, ~20% the new
  Vantage insurer). The land bank monetizes at records — FY2025 MPC EBT a record
  $476M, NOI a record $276M. The hard floor: Pershing Square (Ackman, ~47%,
  Executive Chairman) paid $900M for stock at $100 — a 48% premium — in May 2025,
  then closed Vantage ($2.1B insurer, Jun-2026) to start a Buffett-style float
  engine. The bear is the fifteen-year-old one: an illiquid land bank the market
  won't pay NAV for, plus rate, concentration, fee, and governance risks.
  Sum-of-the-parts below; five scenarios, weighted.


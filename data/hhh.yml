# ═════════════════════════════════════════════════════════════════════════════
# HHH — Howard Hughes Holdings · mature_company_sotp (real-estate NAV / SOTP)
# ═════════════════════════════════════════════════════════════════════════════
# A discount-to-NAV real-estate holding company. Valued sum-of-the-parts:
#   op_ev  = real-estate NAV (MPC land + operating assets + Ward Village condos)
#   special_assets = Vantage insurance (the new Berkshire-style float leg)
#   + cash − total debt = equity NAV.
# The terminal is an EXIT MULTIPLE (cap rate) on stabilized RE cash flow, not a
# Gordon growth — real estate is cap-rate-valued. Each scenario's expected price
# = NAV × (1 − the residual discount the market keeps). Model: /tmp/hhh/model.py.
# ═════════════════════════════════════════════════════════════════════════════

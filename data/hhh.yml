glossary:
- term: SOTP / NAV
  definition: 'Sum-of-the-parts / net-asset-value: each piece (land, op assets, condos, Vantage) + cash − debt = equity — the lens when asset value, not cash flow, holds the worth.'
- term: MPC
  definition: 'Master-planned community — a large, decades-entitled land development (Summerlin, Bridgeland). HHH sells finished "superpads" to homebuilders.'
- term: MPC EBT
  definition: "MPC earnings before tax — HHH's headline land-segment profit. Record $476M in FY2025 (+36%)."
- term: Operating Assets NOI
  definition: "NOI from HHH's owned office / retail / multifamily. Record $276M in FY2025 (+8%)."
- term: Ward Village
  definition: "HHH's ~60-acre Honolulu condo plan. ~$5B future gross revenue / ~$1.3B est. profit, 2026–2030."
- term: Vantage / float
  definition: "A $2.1B insurer HHH bought (Jun-2026); its premium 'float' funds Pershing-managed investments — the Berkshire model."

# ═════════════════════════════════════════════════════════════════════════════
# Page 4 — Competitive landscape (§6d). Power Audit lens (mature_company_sotp).
# ═════════════════════════════════════════════════════════════════════════════
competitive:
  arena: >
    Large-scale master-planned land development — HHH owns irreplaceable, decades-
    entitled land in the best US growth markets (Las Vegas, Houston, Phoenix) and
    sells finished superpads to homebuilders. The competitive question is not
    displacement (the land is unique) but whether the public market ever pays NAV
    for an illiquid, long-duration land bank — the cost-of-capital problem the
    Ackman holdco conversion is built to solve.
  lens: power_audit
  powers:
    scale_economies:     { score: 2, note: "Large contiguous land positions spread infrastructure + entitlement cost." }
    network_economies:   { score: 1, note: "Community amenity flywheel is modest; not a true network." }
    counter_positioning: { score: 1, note: "No incumbent to disrupt; the holdco conversion is novel but imitable." }
    switching_costs:     { score: 1, note: "Homebuilders can buy land elsewhere; entitled superpads at scale are the scarcity." }
    branding:            { score: 2, note: "Summerlin / Ward Village are premium, decades-built community brands." }
    cornered_resource:   { score: 4, note: "Irreplaceable entitled land at scale (22,500-acre Summerlin, 11,500-acre Bridgeland, 37,000-acre Teravalis) — a multi-decade moat that cannot be recreated." }
    process_power:       { score: 2, note: "Master-planning + multi-decade entitlement + phasing expertise." }
  dominant_power: cornered_resource
  durability: high
  rivals:
    - { name: "Private MPC developers (Irvine Co., etc.)", kind: private, note: "Few public peers at this scale; mostly private land owners.", growth: 0.03, margin: 0.40, multiple: "n/a (private)" }
    - { name: "Homebuilders (Lennar, D.R. Horton)", kind: public, note: "Customers more than rivals — they buy HHH's superpads.", growth: 0.05, margin: 0.15, multiple: "~9x" }
    - { name: "Diversified REITs / land", kind: public, note: "Compete for the real-estate capital allocation, not the land.", growth: 0.04, margin: 0.30, multiple: "~14x" }
    - { name: "Berkshire-style holdcos", kind: public, note: "The conversion comp — permanent-capital compounders using float.", growth: 0.08, margin: 0.20, multiple: "~NAV" }
  threats:
    - { vector: cornered_resource, who: "Macro / housing cycle", falsifier: "Land sales stall and superpad pricing reverts toward bulk levels for multiple years, marking the land NAV down." }
    - { vector: counter_positioning, who: "Cost of capital / market", falsifier: "The discount to NAV stays > 30% indefinitely — the market refuses to pay for the land bank even post-conversion." }
  takeaway: >
    The durable Power is the irreplaceable, decades-entitled land bank (cornered
    resource) — a genuine multi-decade moat, not a competitive contest. The whole
    debate is not displacement but realization: whether the public market ever pays
    NAV for an illiquid land bank, which is precisely the cost-of-capital problem the
    Berkshire-style conversion (control + insurance float + permanent capital) is
    designed to fix. Discount-to-NAV and MPC pricing are the gauges.

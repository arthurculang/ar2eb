central_question: 'After doubling on a beat-and-raise, Caris trades ~8x sales — level with Tempus — with the base case ~37%
  below the price: is the market right to pay now for Caris Detect and the data platform before either shows revenue?'
thesis: Caris Life Sciences is an AI precision-oncology diagnostics company — whole-exome/transcriptome tumor profiling plus
  blood-based testing — that IPO'd June 2025 at $21.00 and now trades $30.65 after doubling since July on a beat-and-raise
  (Q2'26 revenue +45%, gross margin 68%, FY26 guide raised to $1.03-1.04B) and favorable preliminary 2027 Medicare rates.
  At ~8x sales it is priced level with Tempus, while owner free cash flow runs ~zero this year as it builds out Caris Detect,
  a cash-pay screening test with no revenue yet. Weighted fair value $23.62, ~23% below spot; the base case ($19.35) sits
  ~37% below, with ~73% of the probability mass at or below the price.

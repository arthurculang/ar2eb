weighting_rationale:
- label: Ultra Bear 13%
  body: Growth ~6.6%, the reimbursement true-up reverses, margins stay near zero — DCF $5.25.
- label: Bear 27%
  body: Decelerates to ~11.9%, pricing pressure bites, the multiple re-rates down — DCF $10.28.
- label: Base 33%
  body: ~16.7% growth, margin inflection holds to 21% owner-FCF — DCF $19.41, roughly fair at spot.
- label: Bull 18%
  body: ~22% hypergrowth, the data moat drives operating leverage — DCF $39.65.
- label: Ultra Bull 9%
  body: ~27% growth, oncology-data standard, software-like 35% margins — DCF $73.64.
appendix:
  pushback:
  - label: Already FCF-positive, unlike Tempus
    body: Caris is FCF-positive at GAAP breakeven with +97% growth, where the similarly-priced Tempus was barely breakeven
      — same multiple, further along.
  - label: The margin inflection is real
    body: Gross margin went 47%->65% in a year and Q1'26 posted positive GAAP operating income — observed operating leverage,
      not promised.
  - label: Comprehensive profiling is differentiated
    body: Whole-exome + whole-transcriptome is deeper than rivals' pure-NGS panels, and the data asset compounds — a cornered
      resource as volume scales.
  - label: Priced below the IPO
    body: At $18.33 versus a $21.00 offer eight months ago, the base case is roughly fair and the hypergrowth and data-moat
      tails are not richly priced in.
  - label: The true-up flatters the trend
    body: About $33M of 2025 revenue was prior-year reimbursement catch-ups, and SBC of ~$70M flatters adj-EBITDA — the underlying
      organic, owner-economics trend is softer than the headlines.
  triggers:
  - label: Bull validation
    body: Test volume sustaining ~20%+ past the FY26 guide; gross margin holding 65%+ and converting to rising owner-FCF.
  - label: Bear validation
    body: Growth undershooting the +24% guide; per-test pricing eroding; the 2025 reimbursement true-up not recurring.
  - label: Reframe needed
    body: Margin gains reversing, or SBC/dilution making owner-FCF negative despite positive adj-EBITDA — the Tempus 'priced-for-perfection'
      read.
glossary:
- term: Comprehensive molecular profiling
  definition: Whole-exome (all coding genes) + whole-transcriptome (all RNA) tumor sequencing — broader than rivals' targeted
    NGS panels.
- term: MI Cancer Seek
  definition: Caris's combined DNA/RNA tumor-profiling assay; reimbursement reach is measured in covered lives (>225M).
- term: Caris Assure
  definition: The blood-based liquid-biopsy line, including minimal-residual-disease (MRD) monitoring — detecting cancer DNA
    in blood to track recurrence.
- term: Test-volume KPI
  definition: Clinical test volume growth (~20% guided) — the operating metric that drives diagnostics revenue, watched independently
    of price/mix.
- term: Adj-EBITDA vs owner-FCF
  definition: Adj-EBITDA adds back ~$70M of stock comp; owner-FCF treats SBC as a real cost, so it is the more conservative
    read of cash economics.
- term: Reimbursement true-ups
  definition: Catch-up revenue booked when payers settle prior-period claims; ~$33M in 2025 — non-recurring, so it flatters
    the reported growth rate.
competitive:
  arena: Comprehensive molecular diagnostics and oncology data — Caris competes with Tempus, Guardant, Roche's Foundation
    Medicine, Natera and Exact Sciences for tumor-profiling and liquid-biopsy volume.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Fixed lab and data-platform costs leverage as test volume compounds; +97% growth drove gross margin 47% to 65%.
    network_economies:
      score: 2
      note: More tests enrich the molecular database, which sharpens the ADAPT AI and wins more clinician and pharma demand.
    counter_positioning:
      score: 1
      note: Whole-exome/transcriptome depth is hard for pure-NGS-panel incumbents to match without re-tooling, but not a true
        business-model trap.
    switching_costs:
      score: 1
      note: Clinician workflow integration and longitudinal patient data create some stickiness, modest versus entrenched
        EHR or pathway tools.
    branding:
      score: 1
      note: Growing reputation in oncology decision support, but clinical results and reimbursement, not brand, drive adoption.
    cornered_resource:
      score: 2
      note: The proprietary whole-exome/transcriptome dataset plus the ADAPT platform — the deepest differentiator and the
        basis of the data moat.
    process_power:
      score: 1
      note: Integrated profiling-plus-AI workflow is hard to replicate quickly, but rivals are closing on capability.
  dominant_power: cornered_resource
  durability: medium
  rivals:
  - name: Tempus (TEM)
    kind: public
    note: AI-precision-oncology data peer; near-breakeven, the direct comp
    growth: 0.25
    margin: null
    multiple: ~6x sales
  - name: Guardant Health
    kind: public
    note: Liquid-biopsy leader, still loss-making, overlaps in blood-based testing
    growth: 0.2
    margin: -0.1
    multiple: ~6x sales
  - name: Foundation Medicine
    kind: private
    note: Roche-owned tumor-profiling division; deep-pocketed incumbent, not standalone-priced
    growth: null
    margin: null
    multiple: division
  - name: Natera
    kind: public
    note: Genetic testing and MRD; faster-growing, ~breakeven, richer multiple
    growth: 0.3
    margin: null
    multiple: ~9x sales
  threats:
  - vector: scale/pricing
    who: Tempus, Guardant, Foundation
    falsifier: Per-test reimbursement or list pricing falls under competitive and payer pressure, halting the gross-margin
      inflection.
  - vector: cornered_resource
    who: Tempus, Roche, Natera
    falsifier: A rival assembles a comparable comprehensive-profiling dataset, commoditizing the data moat before scale and
      network effects lock in.
  - vector: network_economies
    who: well-capitalized incumbents
    falsifier: Volume growth stalls below ~20%, so the data and scale flywheel never reaches the operating leverage the bull
      case needs.
  takeaway: Caris is originating a plausible cornered resource — a proprietary whole-exome/transcriptome dataset feeding the
    ADAPT AI — with scale and network economics building as volume compounds, already visible in the 47%-to-65% gross-margin
    move. Durability is medium, not high — Foundation has Roche's balance sheet, Tempus and Natera are building comparable
    data, and reimbursement pricing is the shared vulnerability. The falsifier the bull must clear is sustained ~20%+ volume
    growth with the gross margin holding 65%+; if growth decelerates below that or pricing erodes margin, the moat commoditizes
    before it locks in.
pocd:
  people:
    ceo: 'David D. Halbert'
    founder_led: true
    tenure_years: 18
    insider_ownership_pct: 44.0
    capital_allocation: 'IPO''d Jun-2025 at $21.00, raising ~$494M gross (23.5M Class A shares); FY2025 cash &
      equivalents jumped to $796.3M (from $64.0M FY24), ~$418M net cash. The inflection: FY2025 operating cash
      flow turned positive at +$83.2M (vs -$245.2M FY24) and, against ~$16.3M capex, free cash flow went positive
      ~+$67M near GAAP breakeven. R&D $101.6M FY25. No dividend; first capital return came post-period — a $100M
      buyback authorized Jun-2026. SBC $70.0M FY25 (up from $18.6M FY24, IPO-driven), which flatters adjusted EBITDA.'
    incentive_alignment: 'FY2025 total compensation ~$20.35M, ~96% equity/option awards granted around the June
      2025 IPO and only ~3.8% (~$0.77M) base salary — a normal salary, not a nominal $1. The dominant alignment
      lever is the founder stake (~44% economic, ~$2.3B at the FY2025 price), not annual cash pay.'
    governance_flags:
      - 'single class of common stock, one vote per share (no dual-class / super-voting) — confirmed across the final 424B4, the post-IPO charter, Form 8-A12B (listed security = plain "common stock"), the 10-K Exhibit 4.2, the proxy share count, and SEC XBRL; the Class A/B 10-vote language existed only in the draft S-1 and was dropped before the IPO'
      - 'founder David Halbert is the largest holder at ~44.6% economic = ~44.6% of the vote (single-class) — significant influence, below an outright majority; insiders together ~66%'
      - 'combined Founder + Chairman + CEO (Halbert), with a lead independent director (Peter Castleman) as the counterweight'
      - 'the IPO prospectus used conditional "may become a controlled company" language (never an affirmative claim); governance is run with a majority-independent board (8 of 10), fully independent Audit + Compensation committees, and no standing nominating committee (nominations by the independent directors)'
      - 'related-party: aircraft agreements with Halbert-affiliated entities (Caris Air), ~$1.6-2.1M/yr net; co-founder Jon Halbert on the board since 2014'
    key_person_risk: high
    score: 3
    takeaway: 'Founder-Chair-CEO Halbert is the largest holder at ~44.6% on a clean single-class one-vote register
      (no super-voting — the draft S-1''s dual-class was dropped before the IPO), giving significant influence
      below an outright majority; the board keeps fully-independent Audit/Comp, 8-of-10 independence and a lead
      independent director, and he is aligned via the stake + a fresh FCF inflection + a new $100M buyback — with
      the combined Chair/CEO, the ~44.6% concentration, and a Halbert-affiliated aircraft related-party the offsets.'

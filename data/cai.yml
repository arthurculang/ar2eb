    narrative:
    - FY26 lands ~$1.01B on a Q4 stumble below the $1.04B guide floor, and revenue then compounds only ~7.1% as test-volume growth
      stalls and reimbursement true-ups reverse rather than recur. The ~$81M of prior-period catch-ups booked in Q4'25 alone make

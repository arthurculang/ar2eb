    headline: Growth collapses; true-up reverses
    narrative:
    - Revenue compounds only ~6.6% as test-volume growth stalls and reimbursement true-ups reverse rather than recur. The
      ~$33M of 2025 revenue tied to prior-year reimbursement catch-ups proves non-repeatable, and the reported growth rate
      is exposed as flattered.
    - Margins barely move off the floor, holding near 0% owner-FCF as price competition from Tempus, Guardant and Foundation
      erodes the gross-margin gains. The ~6.5x sales multiple compresses hard against a decelerating, low-margin base. DCF
      lands at $5.25, down 71%.
    probability_rationale: Requires the volume engine to stall near term and the true-up to be a one-off rather than a recurring
      feature of payer settlements. Possible given the steep step-down already guided, but the cash-positive base makes outright
      collapse less likely than for a pre-breakeven peer.

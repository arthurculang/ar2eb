  threats:
  - vector: scale/pricing
    who: Tempus, Guardant, Foundation
    falsifier: 'Per-test pricing falls under payer and competitive pressure, halting the margin inflection — trips if gross
      margin falls below 65% (the FY25 level) for two consecutive quarters, or final CY2027 rates (Nov-2026) land below the
      preliminary $8,455 for MI Cancer Seek or $5,250 for Caris Assure. First test survived: the preliminary schedule cut
      ~1,100 codes but held or raised both; Q3''26 gross margin 66%.'
  - vector: cornered_resource
    who: Tempus, Roche, Natera
    falsifier: 'A rival assembles a comparable comprehensive-profiling dataset before Caris''s scale and network effects lock
      in — trips when a rival reports a completed dataset of at least 100,000 multimodal whole genomes, Tempus''s first stated
      milestone (effort launched Sep-11-2026; 1M-genome goal). Tempus''s ~$1.5B Personalis deal (S-4 filed) separately consolidates
      the MRD front. Not tripped: an effort is not a dataset.'
  - vector: network_economies
    who: well-capitalized incumbents
    falsifier: 'Volume growth below 20% for two straight quarters (Q3''26 +21%, Q2 +18%), so the data and scale flywheel never
      reaches the operating leverage the bull case needs. MRD is crowding: Natera Signatera ~283k tests (+56%), Guardant Reveal
      >2x, FoundationOne MRD (May-2026) and Tempus/Personalis are all ahead of Caris''s two H2-2026 MRD launches, with MolDX
      and New York State decisions still pending.'
  takeaway: 'Caris is originating a plausible cornered resource — a proprietary whole-exome/transcriptome dataset feeding
    the ADAPT AI — with scale and network economics building as volume compounds, already visible in the 47%-to-68% gross-margin
    move. Durability is medium, not high — Foundation has Roche''s balance sheet, Tempus has now moved on the core dataset
    (100k genomes, Sep-2026) as well as MRD, and reimbursement pricing is the shared vulnerability, though it held its first,
    preliminary test. The falsifier the bull must clear is sustained ~20%+ volume growth (Q3''26: +21%) with the gross margin
    holding the high-60s; Detect''s screening front is contested with Grail on an FDA/Medicare pathway Caris has not entered.'
pocd:
  people:
    ceo: David D. Halbert
    founder_led: true
    tenure_years: 18
    insider_ownership_pct: 44.0
    capital_allocation: 'IPO''d Jun-2025 at $21.00, raising ~$494M gross; FY2025 cash & equivalents jumped to $796.3M (from
      $64.0M FY24), ~$418M net cash. The inflection: FY2025 operating cash flow turned positive at +$83.2M (vs -$245.2M FY24)
      and, against ~$16.3M capex, free cash flow went positive ~+$67M near GAAP breakeven. R&D $101.6M FY25; no dividend;
      a $100M buyback authorized Jun-2026. SBC $70.0M FY25 (from $18.6M, IPO-driven) flatters adj-EBITDA. Apr-2026: a $400M
      Blue Owl/Blackstone term loan (SOFR+5.00%, 2031) replaced the 2023 loan, plus a $300M acquisition delayed-draw — explicit
      M&A capacity; buyback $31.4M spent through Sep-2026; nine-month FCF -$10.8M as a $78.5M Detect supplies build absorbed
      OCF.'
    incentive_alignment: FY2025 total compensation ~$20.35M, ~96% equity/option awards granted around the June 2025 IPO and
      only ~3.8% (~$0.77M) base salary — a normal salary, not a nominal $1. The dominant alignment lever is the founder stake
      (~44% economic, ~$2.3B at the FY2025 price), not annual cash pay.
    governance_flags:
    - single class of common stock, one vote per share (no dual-class / super-voting) — confirmed in the final 424B4, the
      post-IPO charter, 10-K Exhibit 4.2 and SEC XBRL; the draft S-1's Class A/B 10-vote language was dropped before the IPO
    - founder David Halbert is the largest holder at ~44.6% economic = ~44.6% of the vote (single-class) — significant influence,
      below an outright majority; insiders together ~66%
    - combined Founder + Chairman + CEO (Halbert), with a lead independent director (Peter Castleman) as the counterweight
    - majority-independent board (8 of 10), fully independent Audit + Compensation committees, no standing nominating committee;
      the prospectus's 'may become a controlled company' language was conditional, never affirmed
    - 'related-party: aircraft agreements with Halbert-affiliated entities (Caris Air), ~$1.6-2.1M/yr net; co-founder Jon
      Halbert on the board since 2014'
    - material weakness in internal controls (FY25 10-K; remediating, no restatement); open DOJ civil investigative demand
      (Mar 2025, False Claims Act, Medicare 14-day rule; a 2022 ~$2.9M settlement covered the same rule)
    - Aug-Sep 2026 option-related insider sales ~$28M (Spetzler, Brille, Poste); CEO Halbert sold nothing; director Jon Halbert
      bought $990K (May-2026)
    key_person_risk: high
    score: 3
    takeaway: Founder-Chair-CEO Halbert is the largest holder at ~44.6% on a clean single-class one-vote register (no super-voting
      — the draft S-1's dual-class was dropped before the IPO), giving significant influence below an outright majority; the
      board keeps fully-independent Audit/Comp, 8-of-10 independence and a lead independent director, and he is aligned via
      the stake + the FY2025 FCF inflection + a new $100M buyback — with the combined Chair/CEO, the ~44.6% concentration,
      and a Halbert-affiliated aircraft related-party the offsets. The unremediated material weakness and open DOJ inquiry
      are new integrity-class flags; the score holds at 3 but sits at the 3/2 boundary.

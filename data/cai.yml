    founder_led: true
    tenure_years: 18
    insider_ownership_pct: 44.0
    capital_allocation: 'IPO''d Jun-2025 at $21.00, raising ~$494M gross; FY2025 cash & equivalents jumped to $796.3M (from
      $64.0M FY24), ~$418M net cash. The inflection: FY2025 operating cash flow turned positive at +$83.2M (vs -$245.2M FY24)
      and, against ~$16.3M capex, free cash flow went positive ~+$67M near GAAP breakeven. R&D $101.6M FY25; no dividend;
      a $100M buyback authorized Jun-2026. SBC $70.0M FY25 (from $18.6M, IPO-driven) flatters adj-EBITDA. Apr-2026: a $400M
      Blue Owl/Blackstone term loan (SOFR+5.00%, 2031) replaced the 2023 loan, plus a $300M acquisition delayed-draw — explicit
      M&A capacity; buyback executed 1.0M shares for $17.9M; Q2-2026 FCF $6.4M as a ~$47M Detect inventory build absorbed
      OCF.'
    incentive_alignment: FY2025 total compensation ~$20.35M, ~96% equity/option awards granted around the June 2025 IPO and
      only ~3.8% (~$0.77M) base salary — a normal salary, not a nominal $1. The dominant alignment lever is the founder stake
      (~44% economic, ~$2.3B at the FY2025 price), not annual cash pay.
    governance_flags:
    - single class of common stock, one vote per share (no dual-class / super-voting) — confirmed in the final 424B4, the
      post-IPO charter, 10-K Exhibit 4.2 and SEC XBRL; the draft S-1's Class A/B 10-vote language was dropped before the IPO
    - founder David Halbert is the largest holder at ~44.6% economic = ~44.6% of the vote (single-class) — significant influence,
      below an outright majority; insiders together ~66%
    - combined Founder + Chairman + CEO (Halbert), with a lead independent director (Peter Castleman) as the counterweight
    - majority-independent board (8 of 10), fully independent Audit + Compensation committees, no standing nominating committee;
      the prospectus's 'may become a controlled company' language was conditional, never affirmed
    - 'related-party: aircraft agreements with Halbert-affiliated entities (Caris Air), ~$1.6-2.1M/yr net; co-founder Jon
      Halbert on the board since 2014'
    - material weakness in internal controls (FY25 10-K; remediating, no restatement); open DOJ civil investigative demand
      (Mar 2025, False Claims Act, Medicare 14-day rule; a 2022 ~$2.9M settlement covered the same rule)
    - Aug-Sep 2026 option-related insider sales ~$28M (Spetzler, Brille, Poste); CEO Halbert sold nothing; director Jon Halbert
      bought $990K (May-2026)
    key_person_risk: high
    score: 3
    takeaway: Founder-Chair-CEO Halbert is the largest holder at ~44.6% on a clean single-class one-vote register (no super-voting
      — the draft S-1's dual-class was dropped before the IPO), giving significant influence below an outright majority; the
      board keeps fully-independent Audit/Comp, 8-of-10 independence and a lead independent director, and he is aligned via
      the stake + a fresh FCF inflection + a new $100M buyback — with the combined Chair/CEO, the ~44.6% concentration, and
      a Halbert-affiliated aircraft related-party the offsets. The unremediated material weakness and open DOJ inquiry are
      new integrity-class flags; the score holds at 3 but sits at the 3/2 boundary.

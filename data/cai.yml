weighting_rationale:
- label: Ultra Bear 10%
  body: Q4 stumble then stall, growth ~6.6%, the true-up reverses, margins near zero — DCF $5.10.
- label: Bear 27%
  body: Modest guide miss, decelerates to ~12%, the multiple re-rates down — DCF $9.97.
- label: Base 36%
  body: ~17.4% growth, margin inflection holds to 21% owner-FCF — DCF $19.35, ~37% below spot.
- label: Bull 18%
  body: ~22% hypergrowth, the data moat drives operating leverage — DCF $38.69.
- label: Ultra Bull 9%
  body: ~27% growth, oncology-data standard, software-like 35% margins — DCF $72.05.
appendix:
  pushback:
  - label: Still cheaper than Tempus
    body: At ~8.0x the FY26 guide vs Tempus at ~8.7x, Caris is marginally cheaper and already FCF-positive where Tempus is
      not — but the July discount has closed.
  - label: The margin inflection is real
    body: Gross margin went 47%->65% in FY25 and 68% in Q2'26, with ~+$27M of GAAP operating income in the quarter — observed
      leverage, not promised.
  - label: Comprehensive profiling is differentiated
    body: Whole-exome + whole-transcriptome is deeper than rivals' pure-NGS panels, and the data asset compounds — a cornered
      resource as volume scales.
  - label: Reimbursement went Caris's way
    body: CMS's preliminary 2027 fee schedule held MI Cancer Seek at $8,455 and raised Caris Assure to $5,250 while cutting
      ~1,100 codes — the pricing leg held.
  - label: Detect is upside no scenario carries
    body: Caris Detect (Jul-2026, $3,500 cash-pay) has demand ahead of plan; the model already charges its build-out (FY26 owner-FCF
      ~1%) but books its revenue in no scenario — any uptake is upside.
  triggers:
  - label: Bull validation
    body: Volume re-accelerating from +18% toward ~23%; gross margin holding high-60s; first disclosed Detect revenue; CMS
      final rates (Nov).
  - label: Bear validation
    body: Revenue undershooting the raised $1.03-1.04B guide; pharma/data line missing its $75-85M guide (H1 $16.9M); MolDX/NYS
      going against Assure.
  - label: Reframe needed
    body: Owner-FCF still negative through FY27 while adj-EBITDA is positive; material weakness unremediated at the FY26 10-K,
      or the DOJ inquiry escalating.
glossary:
- term: Comprehensive molecular profiling
  definition: Whole-exome (all coding genes) + whole-transcriptome (all RNA) tumor sequencing — broader than rivals' targeted
    NGS panels.
- term: MI Cancer Seek
  definition: Caris's combined DNA/RNA tumor-profiling assay; reimbursement reach is measured in covered lives (>225M).
- term: Caris Assure
  definition: The blood-based liquid-biopsy line, including minimal-residual-disease (MRD) monitoring — detecting cancer DNA
    in blood to track recurrence.
- term: Test-volume KPI
  definition: Clinical test volume growth (~20% guided) — the operating metric that drives diagnostics revenue, watched independently
    of price/mix.
- term: Adj-EBITDA vs owner-FCF
  definition: Adj-EBITDA adds back ~$70M of stock comp; owner-FCF treats SBC as a real cost, so it is the more conservative
    read of cash economics.
- term: Reimbursement true-ups
  definition: Catch-up revenue booked when payers settle prior-period claims; ~$33M in FY25, ~$81M in Q4'25 alone — non-recurring,
    so it flatters growth.
competitive:
  arena: Comprehensive molecular diagnostics and oncology data — Caris competes with Tempus, Guardant, Roche's Foundation
    Medicine, Natera and Abbott (Exact Sciences, acquired Mar-2026) for tumor-profiling and liquid-biopsy volume. The Caris
    Detect launch (Jul-2026) adds a cash-pay multi-cancer early-detection front versus Grail's Galleri and Exact's Cancerguard,
    where Medicare coverage under the 2026 MCED Act is gated on FDA approval — a pathway Grail has entered (FDA panel Sep-2026)
    and Caris has not.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Fixed lab and data-platform costs leverage as test volume compounds; +97% growth drove gross margin 47% to 65%.
    network_economies:
      score: 2
      note: More tests enrich the molecular database, which sharpens the ADAPT AI and wins more clinician and pharma demand.
    counter_positioning:
      score: 1
      note: Whole-exome/transcriptome depth is hard for pure-NGS-panel incumbents to match without re-tooling, but not a true
        business-model trap.
    switching_costs:
      score: 1
      note: Clinician workflow integration and longitudinal patient data create some stickiness, modest versus entrenched
        EHR or pathway tools.
    branding:
      score: 1
      note: Growing reputation in oncology decision support, but clinical results and reimbursement, not brand, drive adoption.
    cornered_resource:
      score: 2
      note: The proprietary whole-exome/transcriptome dataset plus the ADAPT platform — the deepest differentiator and the
        basis of the data moat.
    process_power:
      score: 1
      note: Integrated profiling-plus-AI workflow is hard to replicate quickly, but rivals are closing on capability.
  dominant_power: cornered_resource
  durability: medium
  rivals:
  - name: Tempus (TEM)
    kind: public
    note: AI-precision-oncology data peer; owner-FCF still negative, the direct comp — Personalis merger S-4 filed (~$1.5B
      all-stock, close late-2026/early-2027) to build MRD; FDA-approved xT CDx (May-2026) unlocks unified ADLT pricing from
      2027
    growth: 0.25
    margin: null
    multiple: ~8.5x sales
  - name: Guardant Health
    kind: public
    note: Liquid-biopsy leader, still loss-making; FY26 guide +36-38%; Liquid CDx FDA-approved May-2026, stepping to the $8,455
      Medicare rate
    growth: 0.37
    margin: -0.1
    multiple: ~6x sales
  - name: Foundation Medicine
    kind: private
    note: Roche-owned tumor-profiling division; deep-pocketed incumbent, not standalone-priced
    growth: null
    margin: null
    multiple: division
  - name: Natera
    kind: public
    note: Genetic testing and MRD; faster-growing, ~breakeven, richer multiple
    growth: 0.31
    margin: null
    multiple: ~9x sales
  threats:
  - vector: scale/pricing
    who: Tempus, Guardant, Foundation
    falsifier: 'Per-test pricing falls under payer and competitive pressure, halting the margin inflection — trips if gross
      margin falls below 65% (the FY25 level) for two consecutive quarters, or final CY2027 rates (Nov-2026) land below the
      preliminary $8,455 for MI Cancer Seek or $5,250 for Caris Assure. First test survived: the preliminary schedule cut ~1,100
      codes but held or raised both; Q2''26 gross margin 68%.'
  - vector: cornered_resource
    who: Tempus, Roche, Natera
    falsifier: 'A rival assembles a comparable comprehensive-profiling dataset before Caris''s scale and network effects lock
      in — trips when a rival reports a completed dataset of at least 100,000 multimodal whole genomes, Tempus''s first stated
      milestone (effort launched Sep-11-2026; 1M-genome goal). Tempus''s ~$1.5B Personalis deal (S-4 filed) separately consolidates
      the MRD front. Not tripped: an effort is not a dataset.'
  - vector: network_economies
    who: well-capitalized incumbents
    falsifier: 'Volume growth stalls below ~20% (Q2''26 printed +18%), so the data and scale flywheel never reaches the operating
      leverage the bull case needs. MRD is crowding: Natera Signatera ~283k tests (+56%), Guardant Reveal >2x, FoundationOne
      MRD (May-2026, Medicare-covered) and Tempus/Personalis are all ahead of Caris''s two H2-2026 MRD launches, with MolDX
      and New York State decisions still pending.'
  takeaway: 'Caris is originating a plausible cornered resource — a proprietary whole-exome/transcriptome dataset feeding
    the ADAPT AI — with scale and network economics building as volume compounds, already visible in the 47%-to-68% gross-margin
    move. Durability is medium, not high — Foundation has Roche''s balance sheet, Tempus has now moved on the core dataset
    (100k genomes, Sep-2026) as well as MRD, and reimbursement pricing is the shared vulnerability, though it held its first,
    preliminary test. The falsifier the bull must clear is sustained ~20%+ volume growth (Q2''26: +18%) with the gross margin
    holding the high-60s; Detect''s screening front is contested with Grail on an FDA/Medicare pathway Caris has not entered.'
pocd:

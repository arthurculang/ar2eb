    headline: Q4 stumble, then stall
    narrative:
    - FY26 lands ~$983M after a Q4 stumble — a miss of the raised guide — and revenue then compounds only ~6.6% as test-volume
      growth stalls and reimbursement true-ups reverse rather than recur. The ~$81M of prior-period catch-ups booked in Q4'25
      alone make the H2'26 comparison optically weak, and the reported growth rate is exposed as flattered.
    - Margins barely move off the floor — owner-FCF ~0% this year and only ~10% by FY30 — as price competition from Tempus,
      Guardant and Foundation erodes the gross-margin gains. The ~8x sales multiple compresses hard against a decelerating,
      low-margin base. DCF lands at $5.10, down 83%.
    probability_rationale: Requires the volume engine to stall from Q4 onward and the true-up to be a one-off rather than
      a recurring feature of payer settlements. With H1'26 booked at +59% a 2026 collapse is arithmetically foreclosed, so
      the stall must arrive from FY27 — a longer conjunction than in July. Trimmed from 13% to 10%, the three points to the

thesis: Caris Life Sciences is an AI precision-oncology diagnostics company — whole-exome/transcriptome tumor profiling plus
  blood-based testing — that IPO'd June 2025 at $21.00 and now trades $17.58, down 46% in a month despite a Q3 beat-and-raise
  (revenue +27%, clinical volume +21%, FY26 guide $1.04-1.05B). Profit was weaker (gross margin 66%, from 68%), the pharma
  line lags its guide, a Caris Detect inventory build turned owner free cash flow negative, and growth stocks sold off broadly.
  At ~5x sales it is priced below Tempus. Weighted fair value $22.36, ~27% above spot; the base case ($19.04) sits ~8% above,
  with ~37% of the probability mass at or below spot.

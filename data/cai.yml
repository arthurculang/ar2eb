    - Margins barely move off the floor — owner-FCF negative this year and only ~10% by FY30 — as price competition from Tempus,
      Guardant and Foundation erodes the gross-margin gains. The ~5x sales multiple compresses hard against a decelerating, low-margin
      base. DCF lands at $4.91, down 72%.

weighting_rationale:
- label: Ultra Bear 20%
  body: FDA rejects; no coverage; near-total loss.
- label: Bear 28%
  body: FDA late; Medicare narrow; sub-scale; low teens.
- label: Base 34%
  body: FDA 2027 + Medicare 2028; leader; ≈ spot.
- label: Bull 13%
  body: Broad adoption; category leader; ~3×.
- label: Ultra Bull 5%
  body: MCED standard of care; dominant; ~6×.
appendix:
  pushback:
  - label: Only randomized MCED dataset.
    body: The NHS-Galleri RCT (~140k) is the largest, only randomized MCED dataset — a cornered resource even after the primary-endpoint
      miss (stage IV fell -14%; mortality follow-up extended).
  - label: FDA filing rests on PATHFINDER 2, not NHS.
    body: The PMA is built on the positive PATHFINDER 2 (69.8% sensitivity for the 12 deadliest, 99.6% specificity) plus the
      NHS prevalent round — not the failed late-stage primary.
  - label: Medicare law already signed.
    body: The MCED coverage benefit is law (Feb 2026); coverage is gated on FDA approval and earliest 2028 at ~$509 mt-stool-DNA
      parity, but the legislative risk is retired.
  - label: Cash-funded into the coverage window.
    body: ~$823M and burn halved to ~$300M/yr funds GRAIL into the ~2028 Medicare window without an imminent raise.
  - label: Tiny share count amplifies the unlock.
    body: ~43M shares means a reimbursed-volume inflection moves per-share value hard — the asymmetry cuts both ways.
  triggers:
  - label: Bull validation
    body: FDA PMA approval (2026-27)  ·  Medicare NCD activates (~2028)  ·  broad private coverage  ·  test volume sustains
      >40% growth
  - label: Bear validation
    body: PMA rejected/delayed  ·  Medicare narrow/post-2028 or stuck at ~$509 parity  ·  Abbott-backed Cancerguard scales  ·  private
      payers demand mortality data
  - label: Reframe needed
    body: if the extended NHS follow-up shows a mortality benefit, the clinical-utility debate resolves and the bull/ultra
      weights rise materially
glossary:
- term: Galleri
  definition: GRAIL's blood test screening for 50+ cancers from one draw; sold self-pay (~$949) today as an LDT, FDA PMA filed
    Jan 2026 (accepted).
- term: MCED
  definition: Multi-cancer early detection — blood-based screening across many cancer types; a new category GRAIL pioneered.
- term: NHS-Galleri
  definition: The ~140k-participant UK randomized trial; missed its stage-shift primary endpoint (Feb 2026) but cut stage
    IV; mortality follow-up extended.
- term: PMA / NCD
  definition: FDA Premarket Approval (filed Jan 2026, now accepted) and Medicare National Coverage Determination (earliest
    2028, ~$509 mt-stool-DNA parity through 2030) — the two gates to reimbursed scale.
- term: Sales-to-capital (s2c)
  definition: Damodaran reinvestment efficiency — incremental revenue per dollar of reinvested capital.
competitive:
  arena: Multi-cancer early detection (MCED) blood screening — GRAIL (Galleri, 50+ cancers, only RCT) vs Abbott/Exact (Cancerguard
    + Cologuard cash engine), Guardant (Shield, FDA-approved CRC -> MCED), Freenome, Delfi; the race to originate the first
    FDA-approved, reimbursed MCED franchise.
  lens: power_origination
  powers:
    scale_economies:
      score: 1
      note: A reimbursed-volume cost curve is future; today's self-pay volume is sub-scale.
    network_economies:
      score: 1
      note: No network flywheel yet; data scale is the closest analog.
    counter_positioning:
      score: 2
      note: Galleri's 50-cancer breadth + build-own dataset is hard for single-cancer (Shield CRC) entrants to mirror without
        their own large trials.
    switching_costs:
      score: 1
      note: Provider-ordering and EHR integration build mild lock-in; early.
    branding:
      score: 2
      note: The MCED category-definer brand; strong but dented by the NHS miss.
    cornered_resource:
      score: 3
      note: The only randomized MCED dataset (NHS ~140k) + first PMA + largest commercial test base — the strongest, if contested,
        origination asset.
    process_power:
      score: 1
      note: Assay + bioinformatics pipeline is real but not a demonstrated durable process edge.
  dominant_power: cornered_resource
  window: open
  rivals:
  - name: Abbott / Exact Sciences
    kind: public
    note: Cancerguard MCED (LDT, launched Sep'25, $689) now owned by Abbott (deal closed Mar'26) — a 160-country distributor
      behind the Cologuard franchise.
    share_now: 0.05
    share_terminal: 0.27
    capital: Abbott-backed; global scale
  - name: Guardant Health
    kind: public
    note: Shield FDA-approved for CRC (Medicare $1,495); extending to MCED (Breakthrough Device).
    share_now: 0.05
    share_terminal: 0.22
    capital: ~$700M-rev co.
  - name: Freenome
    kind: private
    note: CRC-first -> multi-cancer; ~$1.35B raised (Roche, T. Rowe).
    share_now: 0.0
    share_terminal: 0.1
    capital: $1.35B private
  - name: Delfi Diagnostics
    kind: private
    note: FirstLook Lung (fragmentomics); niche, lung-first.
    share_now: 0.0
    share_terminal: 0.05
    capital: Merck GHI + rounds
  lead_lag:
  - metric: MCED clinical evidence (RCT)
    company: NHS ~140k (only RCT; primary missed)
    best_rival: none randomized
    verdict: leading
  - metric: FDA approval
    company: PMA accepted (decision 2026-27)
    best_rival: Guardant Shield approved (CRC)
    verdict: roughly level
  - metric: Reimbursement / commercial scale
    company: self-pay; Medicare gated to 2028
    best_rival: Exact Cologuard reimbursed engine
    verdict: lagging
  takeaway: 'GRAIL is originating the MCED category — the broadest test (50+ cancers), the only randomized dataset, and the
    first PMA — but the NHS-Galleri primary-endpoint miss dented the ''proven population benefit'' narrative, and Abbott/Exact
    (Cancerguard on a 160-country distributor) and Guardant (FDA + Medicare in CRC) are scaling MCED behind it. The origination
    window is open but closing: GRAIL must convert the PMA into approval + Medicare coverage before better-capitalized rivals
    scale, and the extended NHS mortality follow-up is the falsifier that could reopen — or close — the whole thesis.'
pocd:
  people:
    ceo: 'Josh Ofman'
    founder_led: false
    tenure_years: 0
    insider_ownership_pct: 1.8
    capital_allocation: 'GRAIL is pre-profit and cash-burning. It was spun out of Illumina in June 2024 (Illumina had paid
      ~$8B in 2021; the public market now values GRAIL near ~$2.7B — heavy value destruction under prior ownership, pre-spin).
      Current management has roughly halved the cash burn to ~$300M/yr and holds ~$823M cash with no debt, funding the company
      into the ~2028 Medicare window without an imminent raise. FY25 revenue $147M (+17%). No dividend or buyback — appropriate
      for a pre-scale development-stage screener.'
    incentive_alignment: 'CEO pay is predominantly equity (RSU grants per Form 4 filings); Ofman directly owns ~0.4M shares
      (~1%). Total insider ownership is low (~1.8%) — typical of a corporate spinco and weaker skin-in-the-game than a founder-led
      name, with no founder block on the register.'
    governance_flags:
      - 'single class of common stock, one vote per share — no dual-class or super-voting'
      - 'independent Chair (Greg Summe) is separate from the CEO — the Chair and CEO roles are split'
      - 'brand-new CEO: Josh Ofman became CEO 1 June 2026 (Bob Ragusa retired); ~7 years at GRAIL prior (CMO/President since 2019), but under a month in the top seat during the post-NHS-miss period'
      - 'pending securities class-action litigation following the NHS-Galleri primary-endpoint miss (lead-plaintiff deadline Aug 2026)'
      - 'Illumina retained ~14.5% at the June-2024 spin (a diminishing overhang as it divests); the franchise carries the history of ~$8B destroyed under Illumina ownership in 2021-2024 (pre-spin)'
    key_person_risk: medium
    score: 3
    takeaway: 'Professional management on a clean single-class register with an independent Chair (Summe) split from the CEO
      — but a brand-new CEO (Ofman, June 2026), thin insider ownership (~1.8%, no founder block), a fresh post-NHS securities
      class action, and the spinco history of ~$8B destroyed under Illumina hold it at a middling 3; the offsets are the split
      Chair/CEO, the disciplined ~$823M cash runway, and the absence of dual-class.'
  opportunity_ref: 'The scenario distribution · the business snapshot'
  context_ref: 'The 7 Powers analysis (Power Origination)'
  deal: 'Open-market common — entry price weighed against the probability-weighted fair value (the +6.4% finding), then position-sized.'

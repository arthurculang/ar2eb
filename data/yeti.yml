weighting_rationale:
- label: Ultra Bear 15%
  body: Fad fades; dupes win; ~$22 (-49%).
- label: Bear 30%
  body: US saturated; tariff drag; ~$37 (-14%).
- label: Base 33%
  body: Intl + categories offset US; ~$50 (+18%).

central_question: Is YETI a durable premium brand re-accelerating via international + new categories — or a saturated, fad-cyclical
  US drinkware brand whose +2% trough caps the multiple?
thesis: 'YETI trades at ~$3.6B (≈$48/sh) — ~17x FCF on $1.87B revenue, net cash, a $500M buyback. Growth troughed at +2% in
  FY2025 (US drinkware saturation + Stanley/Owala/dupes) and re-accelerated to +8% in Q1''26 on wholesale + international;
  tariffs compressed margins (~16.5%->14.4% adj op) but China is now <5% of COGS. The mature DCF asks whether international
  (20%->25% target) + new categories (bags via Mystery Ranch, cookware) + margin recovery offset the saturating core. The
  finding: roughly fair — the modal growth/margin-recovery path lands near spot.'

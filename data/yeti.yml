  body: Intl ramps; bags/cookware; ~$74 (+72%).
- label: Ultra Bull 5%
  body: Durable multi-category global brand; ~$96 (+124%).
appendix:
  pushback_side: bear
  pushback:
  - label: US drinkware is flat.
    body: Q2 US drinkware was flat on a ~600bp drag from three trend SKUs; the risk is that the year-end 're-baseline' becomes
      the run-rate in a ~58%-of-sales category.
  - label: Q2's margin beat was one-time.
    body: Gross margin of 66.7% (vs 57.8%) includes a ~$43M one-time tariff-refund credit to cost of goods; excluding it, gross
      margin was roughly flat.
  - label: SG&A is outrunning sales.
    body: Q2 SG&A rose 17.1% to 47.3% of sales (from 43.9%) on 8.5% sales growth; margin recovery needs that spend to pay off.
  - label: Cash is tighter than it looks.
    body: A ~$131M Q2 buyback took YETI to ~$41M net debt; supplier-finance obligations rose to $90M from $54M in H1, flattering
      operating cash flow.
  - label: H2 must beat H1 to hit the guide.
    body: FY25's Q4 had 14 weeks ($583.7M); +7-8% for FY26 needs ~10-12% like-week H2 growth, above H1's +8.4%.
  triggers:
  - label: Bull validation
    body: international passes 25% of revenue  ·  bags/cookware become reported needle-movers  ·  adj op margin, ex one-time
      tariff refunds, recovers above 16%  ·  FY26-30 FCF tracks above the $1.4B top of management's framework
  - label: Bear validation
    body: US drinkware declines YoY in two straight quarters after the year-end re-baseline  ·  Owala/Stanley/dupes keep taking
      share  ·  FY26-30 FCF tracks below the $1.2B framework floor  ·  new categories stall
  - label: Reframe needed
    body: if drinkware brand heat structurally rotates away (the fad ends), re-rate the core toward a commodity-housewares
      multiple
glossary:
- term: Drinkware
  definition: YETI's tumbler/bottle core (~58% of sales, higher margin) — the fad-cyclical, most-contested category.
- term: Mystery Ranch / Butter Pat
  definition: '2024 acquisitions: technical bags (premium-bag TAM $9B+) + cast-iron cookware — the new-category diversification
    bets.'
- term: Dupes
  definition: Lower-priced look-alikes (RTIC, private label) + viral challengers (Stanley, Owala) eroding the drinkware premium.
- term: Branding
  definition: 'Helmer Power: premium pricing + community/ambassadors + durability reputation — durable in outdoor, contestable
    in faddish tumblers.'
- term: FCF margin
  definition: Free cash flow / revenue (~11% FY25, tariff-compressed); the mature-DCF lever as margins recover.
competitive:
  arena: Premium outdoor drinkware + gear — YETI (brand, ~60% DTC, drinkware + coolers + new bags/cookware) vs Stanley, Owala,
    Hydro Flask (Helen of Troy), RTIC, Newell; defending a premium brand Power in a fad-cyclical core.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Sourcing/marketing leverage at ~$1.9B revenue; modest vs housewares conglomerates.
    network_economies:
      score: 1
      note: Community/ambassador affinity, not a hard network.
    counter_positioning:
      score: 1
      note: Premium incumbent; dupes counter-position on price.
    switching_costs:
      score: 1
      note: Weak — drinkware is a discretionary, swappable purchase.
    branding:
      score: 2
      note: 'The dominant Power: premium pricing + outdoor credibility — durable in coolers/gear, contestable in viral tumblers.'
    cornered_resource:
      score: 2
      note: Brand IP + design + durability reputation; real but copyable.
    process_power:
      score: 1
      note: Design/sourcing learning curve; modest.
  dominant_power: branding
  durability: medium
  rivals:
  - name: Stanley (PMI/HAVI)
    kind: private
    note: US unit leader; viral surge cooling (~50% search decline 2025).
    growth: null
    margin: null
    multiple: private
  - name: Owala
    kind: private
    note: Fastest-growing brand (+~60% search); took the viral baton from Stanley.
    growth: null
    margin: null
    multiple: private
  - name: Hydro Flask (Helen of Troy)
    kind: public
    note: Cleanest public peer; Home & Outdoor was shrinking (~-7%), but company sales rose 8.2% in the May-2026 quarter and
      FY27 guidance was raised.
    growth: null
    margin: 0.1
    multiple: ~9x P/E
  - name: RTIC / private label
    kind: private
    note: Explicit price-dupe of YETI; arbitrages the premium.
    growth: null
    margin: null
    multiple: private
  threats:
  - vector: branding
    who: Owala / Stanley / dupes
    falsifier: Management-reported US drinkware sales decline year over year in two consecutive quarters after the year-end
      re-baseline (FY26-FY27) as viral share rotates to Owala/Stanley.
  - vector: scale_economies
    who: Tariffs / sourcing
    falsifier: Adjusted operating margin, excluding one-time tariff refunds, stays below 14% in both FY26 and FY27.
  - vector: counter_positioning
    who: Private label / RTIC
    falsifier: Sustained price competition forces YETI off its full-price model.
  takeaway: YETI's brand Power is durable in coolers/outdoor gear but genuinely contestable in its fad-cyclical drinkware
    core (~58% of sales), where viral heat rotates (Stanley->Owala) and dupes arbitrage the premium. International (toward
    25%) + new categories (bags/cookware) + margin recovery (China <5% of COGS) are the diversification offsets. At ~15x FY25
    FCF the modal path sits ~18% above spot; the sign hinges on whether growth holds ~5% a year after FY26 (the low end of
    management's FY26-30 framework) as US drinkware re-baselines.
pocd:
  people:
    ceo: 'Matt Reintjes'
    founder_led: false
    tenure_years: 10
    insider_ownership_pct: 18.0
    capital_allocation: 'No dividend; capital returned via buybacks — ~$500M / ~13M shares repurchased over
      FY2024-FY2025 (~14% of shares out), incl. 8.2M shares / ~$298M in FY2025; the board re-loaded the
      authorization to $500M (May 2026), then repurchased 2.8M shares at a $46.47 average (~$131M) in Q2 FY26,
      leaving $370M. M&A is small/tuck-in and cash-funded: Mystery Ranch (bags)
      + Butter Pat (cast-iron cookware), ~$48.5M total cash (Q1 2024) — new-category capability, not
      transformational. The Q2 buyback, funded partly by a net $30M revolver draw, took the balance sheet from ~$114M
      net cash at FY-end to ~$41M net debt at Jul 4 2026; capex funds capacity and new categories.'
    incentive_alignment: 'Reintjes FY2024 total ~$7.8M ($1.03M salary · ~$1.67M bonus · ~$5.12M stock) —
      ~85%+ at-risk/equity. LTI is 75% performance RSUs / 25% time RSUs; the PBRSUs vest on 3-yr cumulative
      free-cash-flow with a relative-TSR modifier (90%-of-target threshold, 200% cap, 3-yr cliff).
      Pay-for-performance, FCF + TSR-linked.'
    governance_flags:
      - 'single-class — one share, one vote (no super-voting / dual-class)'
      - 'combined Chair & CEO since Aug 7 2026 (Reintjes named Chair), mitigated by a Lead Independent Director (Robert Shearer, the prior independent Chair); board of 10, 9 independent'
      - 'classified / staggered board (three classes, three-year terms)'
      - 'founders no longer on the board — Roy Seiders resigned as a director eff. May 2021 (no disagreement); Ryan Seiders not a director'
      - 'founders retain large economic stakes (Ryan ~15%, Roy ~2%); Cortec Group (PE, majority 2012) fully exited; now institutionally held'
    key_person_risk: low
    score: 3
    takeaway: 'Professionalized and single-class: a 10-yr hired CEO on FCF + relative-TSR pay, a clean one-share-one-vote
      register with no controller and PE fully exited, buybacks (~$630M since FY2024) and only small cash-funded tuck-ins.
      Scored 3, not 4: since Aug 2026 the CEO also chairs the board, and although a Lead Independent Director mitigates that,
      it now stacks on a classified board; the deep brand expertise still sits with the now-absent founders.'
  opportunity_ref: 'The scenario distribution · the business snapshot · the Arthur Indicator'
  context_ref: 'The 7 Powers analysis (Power Audit)'
  deal: 'Open-market common — entry price weighed against the probability-weighted fair value (the ~+13% finding; the modal base ~18% above spot, 45% of the probability below it), then position-sized.'

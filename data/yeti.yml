weighting_rationale:
- label: Ultra Bear 15%
  body: Fad fades; dupes win; ~$23 (-52%).
- label: Bear 30%
  body: US saturated; tariff drag; ~$38 (-20%).
- label: Base 33%
  body: Intl + categories offset US; ~$52 (+8%).
- label: Bull 17%
  body: Intl ramps; bags/cookware; ~$75 (+56%).
- label: Ultra Bull 5%
  body: Durable multi-category global brand; ~$97 (+103%).
appendix:
  pushback:
  - label: Net cash, ~$212M FCF, $500M buyback.
    body: Debt-light, cash-generative, shrinking the float at ~17x FCF — capital return is real.
  - label: China sourcing de-risked.
    body: China now <5% of COGS (Vietnam/Philippines/Mexico) — the tariff drag (~$0.35/sh) is largely an annualization headwind,
      not structural.
  - label: International is the engine.
    body: ~20% of revenue growing mid-teens, Japan greenfield (2025), 25%-by-2027 target — a runway the US-saturation view
      misses.
  - label: New categories extend the brand.
    body: Mystery Ranch bags ($9B+ premium-bag TAM) + Butter Pat cookware diversify beyond fad-cyclical drinkware.
  - label: Q1'26 re-accelerated to +8%.
    body: Wholesale +19% (best in 3 years) + international suggest the +2% FY25 was a trough, not a new normal.
  triggers:
  - label: Bull validation
    body: international passes 25% of revenue  ·  bags/cookware become reported needle-movers  ·  adj op margin recovers above
      16%  ·  wholesale rebound sustains
  - label: Bear validation
    body: US drinkware stays soft  ·  Owala/Stanley/dupes keep taking share  ·  margins stay tariff-compressed  ·  new categories
      stall
  - label: Reframe needed
    body: if drinkware brand heat structurally rotates away (the fad ends), re-rate the core toward a commodity-housewares
      multiple
glossary:
- term: Drinkware
  definition: YETI's tumbler/bottle core (~58% of sales, higher margin) — the fad-cyclical, most-contested category.
- term: Mystery Ranch / Butter Pat
  definition: '2024 acquisitions: technical bags (premium-bag TAM $9B+) + cast-iron cookware — the new-category diversification
    bets.'
- term: Dupes
  definition: Lower-priced look-alikes (RTIC, private label) + viral challengers (Stanley, Owala) eroding the drinkware premium.
- term: Branding
  definition: 'Helmer Power: premium pricing + community/ambassadors + durability reputation — durable in outdoor, contestable
    in faddish tumblers.'
- term: FCF margin
  definition: Free cash flow / revenue (~11% FY25, tariff-compressed); the mature-DCF lever as margins recover.
competitive:
  arena: Premium outdoor drinkware + gear — YETI (brand, ~60% DTC, drinkware + coolers + new bags/cookware) vs Stanley, Owala,
    Hydro Flask (Helen of Troy), RTIC, Newell; defending a premium brand Power in a fad-cyclical core.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Sourcing/marketing leverage at ~$1.9B revenue; modest vs housewares conglomerates.
    network_economies:
      score: 1
      note: Community/ambassador affinity, not a hard network.
    counter_positioning:
      score: 1
      note: Premium incumbent; dupes counter-position on price.
    switching_costs:
      score: 1
      note: Weak — drinkware is a discretionary, swappable purchase.
    branding:
      score: 2
      note: 'The dominant Power: premium pricing + outdoor credibility — durable in coolers/gear, contestable in viral tumblers.'
    cornered_resource:
      score: 2
      note: Brand IP + design + durability reputation; real but copyable.
    process_power:
      score: 1
      note: Design/sourcing learning curve; modest.
  dominant_power: branding
  durability: medium
  rivals:
  - name: Stanley (PMI/HAVI)
    kind: private
    note: US unit leader; viral surge cooling (~50% search decline 2025).
    growth: null
    margin: null
    multiple: private
  - name: Owala
    kind: private
    note: Fastest-growing brand (+~60% search); took the viral baton from Stanley.
    growth: null
    margin: null
    multiple: private
  - name: Hydro Flask (Helen of Troy)
    kind: public
    note: Cleanest public peer; Home/Outdoor segment declining (~-7%).
    growth: -0.05
    margin: 0.1
    multiple: ~9x P/E
  - name: RTIC / private label
    kind: private
    note: Explicit price-dupe of YETI; arbitrages the premium.
    growth: null
    margin: null
    multiple: private
  threats:
  - vector: branding
    who: Owala / Stanley / dupes
    falsifier: US drinkware revenue declines while viral share rotates to challengers.
  - vector: scale_economies
    who: Tariffs / sourcing
    falsifier: Margins stay compressed below 14% adj op for 2+ years.
  - vector: counter_positioning
    who: Private label / RTIC
    falsifier: Sustained price competition forces YETI off its full-price model.
  takeaway: YETI's brand Power is durable in coolers/outdoor gear but genuinely contestable in its fad-cyclical drinkware
    core (~58% of sales), where viral heat rotates (Stanley->Owala) and dupes arbitrage the premium. International (toward
    25%) + new categories (bags/cookware) + margin recovery (China <5% of COGS) are the diversification offsets. At ~17x FCF
    the modal growth/margin-recovery path lands near spot — roughly fair, with the sign hinging on whether the +2% FY25 was
    a trough (Q1'26 +8%) or a new normal.

thesis: 'YETI trades at ~$3.1B (≈$42.8/sh), ~15x FY25 free cash flow on $1.87B revenue. Growth troughed at +2% in
  FY2025 and re-accelerated to +8.4% in H1''26 on wholesale + international. In August management held its +7-8% FY26
  sales outlook while reporting flat US drinkware (three trend SKUs cycling out); Q2 margins carried a one-time ~$43M
  tariff-refund credit. The DCF asks whether international + new categories + margin recovery offset the saturating core.
  Weighted fair value ~$48 sits ~13% above spot and the modal base ~18% above, with 45% of the probability below the price.'

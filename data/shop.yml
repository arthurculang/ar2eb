central_question: Does agentic-AI commerce make Shopify the merchant rails for AI shopping agents, or disintermediate the
  storefront it sells?
thesis: 'Shopify trades at ~$140.6B (~$108.24, down ~30% YTD off the $182 high) — ~30x forward / ~67x trailing FCF on revenue
  and GMV growing ~34-35%, net cash ~$5.8B, FCF ~$2.0B (~17%). The headline GAAP net loss is a non-cash equity-investment
  mark; ex-that, earnings are ~$360M. The bull is durable 30%+ GMV compounding, take-rate expansion (Payments at 67% of GMV),
  and agentic commerce making Shopify the rails for AI shopping agents; the bear is AI disintermediating the storefront plus
  macro cyclicality on GMV. The weighted DCF lands -15.1% (~$92): a great franchise, de-rated but still priced for the win.'

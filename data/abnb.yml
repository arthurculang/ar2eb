appendix:
  pushback:
  - label: High-teens EV/FCF, 37% FCF margin.
    body: A verb-grade two-sided network throwing off $4.8B FCF at a 37% margin — priced like a maturing OTA, not a durable
      platform.
  - label: $9.5B net cash, working-capital-positive.
    body: Guest pre-payments fund the float -> structurally high FCF conversion; fortress balance sheet, ~$3.8B/yr buyback.
  - label: Network economies + a verb brand.
    body: '''Airbnb'' is the default for alternative accommodations; direct traffic lowers CAC vs OTAs — the two-sided liquidity
      moat.'
  - label: Experiences/Services optionality is free.
    body: The 2025 relaunch expands TAM beyond rentals; unmonetized today, so any traction is upside the multiple doesn't
      pay for.
  - label: International under-penetrated.
    body: Latin America / Asia-Pacific grow faster than core — a multi-year runway the US-centric view misses.
  triggers:
  - label: Bull validation
    body: revenue re-accelerates to mid-teens  ·  Experiences/Services monetizes into a reported needle-mover  ·  take rate
      rises  ·  international outgrows core
  - label: Bear validation
    body: growth decays to high-single  ·  major-metro bans spread  ·  Booking out-grows ABNB in alternative accommodations  ·  multiple
      de-rates toward peers
  - label: Reframe needed
    body: if a flagship market structurally bans STRs or Google disintermediates search, re-rate the network durability +
      terminal multiple
glossary:
- term: GBV / take rate
  definition: Gross booking value (~$91B FY25) x ~13.4% take = revenue; the two metrics that drive the model.
- term: Network economies
  definition: 'Helmer Power: more hosts -> more guests -> more hosts; the two-sided liquidity flywheel that is Airbnb''s core
    moat.'
- term: Experiences / Services
  definition: The 2025 relaunch (locally-hosted activities + in-stay services); the TAM-expanding optionality, unmonetized
    today.
- term: FCF margin
  definition: Free cash flow / revenue (~38% structural; ignore the seasonal Q1 ~64% float build) — the mature-DCF lever.
- term: STR regulation
  definition: Short-term-rental bans/registration (Barcelona 2028 phase-out, NYC -92%) — the structural cap on dense-urban
    supply.
competitive:
  arena: Travel / lodging + experiences — Airbnb (two-sided STR marketplace, ~8M listings, verb-grade brand) vs Booking, Expedia/Vrbo,
    Google Travel, hotels; defending a network + brand Power as growth matures and regulation tightens.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Fixed platform/trust-&-safety/marketing spread over $91B GBV -> best-in-class ~38% FCF margin.
    network_economies:
      score: 3
      note: 'The dominant Power: two-sided host<->guest density; more hosts -> more guests -> more hosts.'
    counter_positioning:
      score: 1
      note: Was the disruptor vs hotels; incumbents (Booking, Vrbo) have matched the STR model.
    switching_costs:
      score: 1
      note: 'Weak-medium: hosts multi-list; guests are promiscuous.'
    branding:
      score: 3
      note: '''Airbnb'' is a verb; direct-traffic advantage lowers CAC vs OTAs — durable demand-side Power.'
    cornered_resource:
      score: 1
      note: No durable exclusive asset; supply is replicable.
    process_power:
      score: 2
      note: Matching/pricing/trust-and-safety execution at scale.
  dominant_power: network_economies
  durability: medium-high
  rivals:
  - name: Booking Holdings
    kind: public
    note: Larger GBV; pushing into alternative accommodations (>8M listings, growing faster than ABNB there).
    growth: 0.13
    margin: 0.36
    multiple: ~15.6x P/E
  - name: Expedia / Vrbo
    kind: public
    note: '#3 OTA; Vrbo the direct STR competitor.'
    growth: 0.06
    margin: 0.15
    multiple: ~11.8x P/E
  - name: Google Travel
    kind: incumbent-division
    note: Disintermediation risk at the search layer.
    growth: null
    margin: null
    multiple: n/a
  - name: Hotels / chains
    kind: incumbent
    note: Direct booking + loyalty; the alternative for urban stays.
    growth: 0.05
    margin: null
    multiple: varies
  threats:
  - vector: network_economies
    who: Booking in alternative accommodations
    falsifier: Booking out-grows ABNB in alt-accommodations bookings for 2+ years.
  - vector: branding
    who: Google Travel disintermediation
    falsifier: Paid-search dependence rises and direct-traffic share falls.
  - vector: scale_economies
    who: STR regulation
    falsifier: A flagship metro structurally bans STRs, or registration regimes materially shrink supply.
  takeaway: Airbnb's network-economies + verb-grade brand are genuinely durable on the demand side (direct traffic, two-sided
    liquidity), and the ~38% FCF margin is best-in-class. The terminal-value debate is not a competitor out-networking them
    — it's regulation (dense-urban supply caps) + growth maturation. At a high-teens EV/FCF the cash flow is priced cheaply for the
    quality; the Experiences/Services relaunch is the unpaid-for optionality, and the sign hinges on whether growth holds
    in the teens or decays to GDP-plus.

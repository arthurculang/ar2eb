pocd:
  people:
    ceo: Brian Chesky
    founder_led: true
    tenure_years: 18
    insider_ownership_pct: 13.7
    capital_allocation: 'Disciplined capital return: $2.1B of buybacks in 1H26 ($3.4B left on the Aug-2025 $6B program); ~634M
      fully diluted shares, down ~10% since buybacks began in Q3 2022. $2.5B of A-/Baa1 notes (Mar 2026) refinanced the $2.0B
      converts. Build-not-buy; no dividend. Stock comp ($897M in 1H26, +15%) partly offsets the buyback.'
    incentive_alignment: $1 salary, no cash bonus; paid via a 2020 ten-year performance RSU (~12M units) that vests only against
      escalating share-price hurdles (Tranche 2 vested Nov 2024). Chesky has pledged to donate the net proceeds of his CEO
      equity to charity.
    governance_flags:
    - multi-class super-voting (Class B = 20 votes) → founder bloc ~79% voting control (binding agreement); fixed Dec-2040
      sunset
    - CEO + Chairman combined, mitigated by a lead independent director (Ken Chenault)
    - fully-independent board committees, no controlled-company exemptions used; classified board
    - CEO also founding an outside, independently funded AI lab (Jun 2026) — split attention; CTO and business-chief exits
      within nine months
    key_person_risk: high
    score: 3
    takeaway: 'Founder-CEO on a $1 salary, paid only if the stock clears price hurdles, with buybacks cutting the fully diluted
      count ~10% since 2022 — strong alignment and capital discipline. The offsets: a ~79% founder voting bloc + combined
      CEO/Chair (mitigated by a lead independent director, fully independent committees and a fixed 2040 sunset), and a CEO
      now also founding an outside AI lab.'
  opportunity_ref: The scenario distribution · the business snapshot · the Arthur Indicator
  context_ref: The 7 Powers analysis (Power Audit)

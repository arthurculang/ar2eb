central_question: At ~30× FCF after stock comp, is Airbnb's 2026 re-acceleration durable — or do fading currency and World Cup boosts, AI booking agents and regulation pull growth back to high-single digits?
thesis: Airbnb's reported FY25 FCF of $4.6B (38% of revenue) excludes $1.59B of stock comp (13%); net of it, FCF is ~$3.0B (25%),
  and the ~$90B enterprise value is ~30× that (~20× reported). Growth re-accelerated in 2026 (+18%/+17% in Q1-Q2; guide raised
  twice to at least mid-teens, ~3 points of it currency) as nights outgrew Booking's rental business (+10% vs +4% in Q2). The DCF
  asks whether that pace holds once currency and World Cup boosts fade, AI booking agents launch without Airbnb, and regulation caps
  city supply. Net of stock comp, the most likely case (growth near 10%) sits ~14% below the price; 72% of the probability sits
  below it.

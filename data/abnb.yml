weighting_rationale:
- label: Ultra Bear 12%
  body: Regulation + maturation; ~$85 (-49%).
- label: Bear 25%
  body: High-single growth; regulation; ~$108 (-35%).
- label: Base 35%
  body: Mid-teens 2026, then ~10%; ~$143 (-14%).
- label: Bull 20%
  body: Experiences/intl re-accel; ~$189 (+13%).
- label: Ultra Bull 8%
  body: End-to-end travel hub; ~$238 (+43%).
appendix:
  pushback:
  - label: 2026 is running ahead of the base.
    body: Revenue grew +18%/+17% in Q1-Q2 (~3 points currency), yet the base fades growth to 11% in 2027 and 9% by 2029.
  - label: Stock comp is held at 13% of revenue.
    body: It grew +15% in 1H26, slower than revenue; if that persists, the modeled 25-26% margin after stock comp is too low
      (~$5 a share per point in the base).
  - label: Network economies + a verb brand.
    body: '''Airbnb'' is the default for alternative stays; direct traffic keeps acquisition costs below online travel agencies''
      — room for margins above the base.'
  - label: Experiences/Services is barely in the base.
    body: The 2025 relaunch and the 2026 hotels line widen the market beyond homes; the base credits only modest monetization,
      so real traction is upside to it.
  - label: International is under-penetrated.
    body: Latin America / Asia-Pacific grow faster than core — a multi-year runway the base's 9% out-year growth may understate.
  triggers:
  - label: Bull validation
    body: revenue growth holds 13%+ in 2027  ·  stock comp under 11% of revenue  ·  Experiences/Services becomes material  ·
      international outgrows core
  - label: Bear validation
    body: growth decays to high-single  ·  major-metro bans spread  ·  Booking out-grows ABNB in alternative accommodations  ·  multiple
      de-rates toward peers
  - label: Reframe needed
    body: if a flagship market structurally bans short-term rentals or Google disintermediates search, re-rate network
      durability and terminal growth
glossary:
- term: GBV / take rate
  definition: Gross booking value (~$91B FY25) x ~13.4% take = revenue; the two metrics that drive the model.
- term: Network economies
  definition: 'Helmer Power: more hosts -> more guests -> more hosts; the two-sided liquidity flywheel that is Airbnb''s core
    moat.'
- term: Experiences / Services
  definition: The 2025 relaunch (locally-hosted activities + in-stay services); the TAM-expanding optionality, unmonetized
    today.
- term: FCF after stock comp
  definition: 'The FCF the DCF values: net of stock-based compensation (13% of FY25 revenue), 25% of revenue vs 38% reported.'
- term: STR regulation
  definition: Short-term-rental bans/registration (Barcelona 2028 phase-out, NYC -92%) — the structural cap on dense-urban
    supply.
competitive:
  arena: Travel / lodging + experiences — Airbnb (two-sided STR marketplace, ~8M listings, verb-grade brand) vs Booking, Expedia/Vrbo,
    Google Travel, hotels; defending a network + brand Power as growth matures and regulation tightens.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Fixed platform/trust-&-safety/marketing spread over $91B GBV -> a 38% reported FCF margin (25% after stock comp).
    network_economies:
      score: 3
      note: 'The dominant Power: two-sided host<->guest density; more hosts -> more guests -> more hosts.'
    counter_positioning:
      score: 1
      note: Was the disruptor vs hotels; incumbents (Booking, Vrbo) have matched the STR model.
    switching_costs:
      score: 1
      note: 'Weak-medium: hosts multi-list; guests are promiscuous.'
    branding:
      score: 3
      note: '''Airbnb'' is a verb; direct-traffic advantage lowers CAC vs OTAs — durable demand-side Power.'
    cornered_resource:
      score: 1
      note: No durable exclusive asset; supply is replicable.
    process_power:
      score: 2
      note: Matching/pricing/trust-and-safety execution at scale.
  dominant_power: network_economies
  durability: medium-high
  rivals:
  - name: Booking Holdings
    kind: public
    note: Larger GBV; pushing into alternative accommodations (>8M listings, growing faster than ABNB there).
    growth: 0.13
    margin: 0.36
    multiple: ~15.6x P/E
  - name: Expedia / Vrbo
    kind: public
    note: '#3 OTA; Vrbo the direct STR competitor.'
    growth: 0.06
    margin: 0.15
    multiple: ~11.8x P/E
  - name: Google Travel
    kind: incumbent-division
    note: Disintermediation risk at the search layer.
    growth: null
    margin: null
    multiple: n/a
  - name: Hotels / chains
    kind: incumbent
    note: Direct booking + loyalty; the alternative for urban stays.
    growth: 0.05
    margin: null
    multiple: varies
  threats:
  - vector: network_economies
    who: Booking in alternative accommodations
    falsifier: Booking out-grows ABNB in alt-accommodations bookings for 2+ years.
  - vector: branding
    who: Google Travel disintermediation
    falsifier: Paid-search dependence rises and direct-traffic share falls.
  - vector: scale_economies
    who: STR regulation
    falsifier: A flagship metro structurally bans STRs, or registration regimes materially shrink supply.
  takeaway: 'Airbnb''s network-economies + verb-grade brand are genuinely durable on the demand side (direct traffic, two-sided
    liquidity), and the FCF margin is high — 38% as reported, 25% after stock comp. The terminal-value debate is not a competitor
    out-networking them — it''s regulation (dense-urban supply caps) + growth maturation. At ~30× FCF after stock comp the price
    needs more than the most likely case (growth near 10%, ~14% below it): the Powers are real, but only the bull cases (teens
    growth held) clear it, and the Experiences/Services relaunch is the swing.'

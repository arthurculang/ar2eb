central_question: Does Airbnb's ~15x EV/FCF fairly price a decelerating but FCF-gushing travel network — or is the Experiences/Services
  optionality + international runway underpriced?
thesis: 'Airbnb trades at ~$79B (≈$133/sh) — ~15x EV/FCF on a $4.6B-FCF, 38%-margin two-sided travel network with ~$9.5B net
  cash. Growth has decelerated (+40%→+10%, guided low-mid-teens) and regulation (Barcelona, NYC) caps dense-urban supply.
  The mature DCF asks whether the verb-grade brand + network defend the FCF and whether Experiences/Services + international
  re-accelerate growth. The finding: at ~15x FCF for this quality the modal case implies modest undervaluation — the premium-to-Booking
  is on P/E, not on the cash flow the DCF values.'

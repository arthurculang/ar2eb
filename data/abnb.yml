central_question: At a high-teens EV/FCF, is Airbnb's 2026 re-acceleration durable — or do fading currency and World Cup boosts, AI booking agents and regulation pull growth back to high-single digits?
thesis: 'Airbnb trades at a high-teens multiple of trailing FCF ($4.8B, a 37% margin before ~$1.8B/yr of stock comp) with ~$9.5B net cash. Growth re-accelerated in 2026 (+18% and +17% in Q1-Q2; guide raised twice to at least mid-teens, ~3 points of it currency) as nights outgrew Booking''s rental business (+10% vs +4% in Q2) and a hotels line launched. The DCF asks whether that pace holds once currency and World Cup boosts fade, AI booking agents launch without Airbnb, and regulation caps city supply. The finding: the modal case still implies undervaluation.'

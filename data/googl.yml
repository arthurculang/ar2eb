central_question: Does Alphabet's full AI stack (TPUs->Gemini->Cloud->apps) defend and monetize Search faster than generative-AI
  assistants erode its query and ad economics?
thesis: 'Alphabet trades at ~$4.35T (~$360, +28% YTD and ~130-160% TTM) - roughly 60x EV/FCF on $402.8B revenue growing ~15%,
  32% operating margins, net cash, $73.3B FCF before a capex ramp to ~$190B. Cloud just re-accelerated to +63% with a ~$462B
  backlog and the AI stack re-rated the name, but Search is still ~60%+ of revenue and the price embeds the win. The DCF asks
  whether Search holds its economics through the generative-AI shift while Cloud compounds. The finding lands -21.4% (weighted
  ~$286): the modal base sits right at spot, so the run priced in the franchise and then some.'

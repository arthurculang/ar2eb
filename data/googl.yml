appendix:
  pushback:
  - label: The run priced the franchise in.
    body: After +28% YTD / ~130-160% TTM the name is ~60x EV/FCF and the modal DCF is ~-20% - the AI stack is real, but the
      price already embeds the win, leaving thin margin of safety.
  - label: Cloud at +63% with doubling margins is the new engine.
    body: Cloud hit $20.0B/+63% at 32.9% operating margin (from 17.8%) with a ~$462B backlog ~2x QoQ - a credible second franchise
      that the bull/ultra-bull cases lean on.
  - label: Search defense is winning so far.
    body: Q1'26 Search & other still grew +19% to $60.4B with AI Overviews at 2.5B MAU monetizing near parity - the central
      bear (query/CPC leakage) is not yet visible in the numbers.
  - label: The ~$190B capex is the FCF swing.
    body: Capex guided to ~$190B FY26 and higher in 2027 crushes near-term FCF; the bull needs it to convert to high-return
      capacity.
  - label: Antitrust is the unpriced tail.
    body: The DOJ search remedy (default bans + data-sharing, on appeal) and a pending ad-tech remedy (possible AdX/DFP divestiture)
      sit outside the DCF.
  triggers:
  - label: Bull validation
    body: Cloud growth holds >40% with margin above 30%  ·  Search & other stays >+15% as AI Overviews/AI Mode monetize  ·  FCF
      margin recovers above ~22% as capex is absorbed  ·  backlog keeps building
  - label: Bear validation
    body: Search & other decelerates toward low-single-digit or CPCs fall  ·  FCF margin stays below ~18% as ~$190B+ capex
      outruns cash  ·  Cloud growth/margin rolls over  ·  an adverse ad-tech (AdX/DFP) divestiture remedy
  - label: Reframe needed
    body: if generative-AI assistants take durable query share and ad load drops, the ~60%-of-revenue Search engine loses
      its economics - re-rate the terminal toward a slower-growth, lower-FCF-margin platform
glossary:
- term: Search & other
  definition: Alphabet's core search-advertising revenue (~$60.4B in Q1'26, ~60%+ of total); the swing-factor segment the
    generative-AI shift threatens.
- term: Google Cloud
  definition: The cloud-infrastructure + Workspace segment ($20.0B/+63% in Q1'26 at ~33% operating margin, ~$462B backlog)
    - the second engine.
- term: AI Overviews / AI Mode
  definition: Gemini-powered answers atop Search (2.5B / 1B MAU) monetizing roughly at Search-parity - how Google defends
    ad economics through the AI transition.
- term: TPU
  definition: Tensor Processing Unit - Google's custom AI accelerator; serves Gemini and Cloud AI below merchant-silicon cost.
- term: FCF margin
  definition: Free cash flow / revenue (~18% FY25, depressed by the capex ramp); whether ~$190B capex converts to ~24% recovery.
competitive:
  arena: Search + digital advertising and cloud/AI infrastructure - Alphabet (Search, YouTube, Cloud, the TPU->Gemini->apps
    stack) vs Microsoft/OpenAI, Amazon, Meta, and chatbot challengers; auditing entrenched network/scale/cornered-resource
    Powers against a generative-AI substitution and a live antitrust threat.
  lens: power_audit
  powers:
    scale_economies:
      score: 4
      note: Massive fixed-cost leverage across the index, ad systems, YouTube, and global data centers; 32% operating margin
        at $403B revenue - few can match the spend per query.
    network_economies:
      score: 4
      note: Search's two-sided advertiser/user loop, YouTube's creator/viewer flywheel, and Android/Play ecosystems - more
        users sharpen results and pricing, a genuine network Power.
    counter_positioning:
      score: 1
      note: The incumbent now being counter-positioned by AI-native assistants (ChatGPT), not the disruptor; AI Overviews
        is a defensive retrofit, not counter-positioning.
    switching_costs:
      score: 3
      note: Workspace/Cloud contracts and the ~$462B backlog lock enterprises in; consumer Search switching is low, but Android/Chrome/account
        defaults raise friction.
    branding:
      score: 3
      note: '''Google'' is a verb and a default trust signal, but brand alone won''t hold queries if an assistant answers
        better - durable yet not the binding Power.'
    cornered_resource:
      score: 4
      note: The crawl index, decades of query/click data, custom TPUs, and frontier Gemini models - assets rivals cannot quickly
        replicate; the data + silicon edge is the deepest moat.
    process_power:
      score: 2
      note: Deep ML/infra engineering capability, but increasingly a contested field rather than a unique repeatable process.
  dominant_power: network_economies
  durability: high
  rivals:
  - name: Microsoft / OpenAI
    kind: public
    note: Azure + Copilot + OpenAI partnership attack both Cloud and Search via AI assistants; the primary full-stack rival.
    growth: 0.16
    margin: 0.45
    multiple: ~35x P/E
  - name: Amazon (AWS)
    kind: public
    note: Cloud market leader; the EV/FCF and Cloud-growth benchmark Alphabet's Cloud is measured against.
    growth: 0.15
    margin: 0.11
    multiple: ~30x EV/FCF
  - name: Meta Platforms
    kind: public
    note: Ad-budget rival and AI-compute peer; competes for advertiser dollars and AI talent/capex.
    growth: 0.2
    margin: 0.41
    multiple: ~24x EV/FCF
  - name: OpenAI / Anthropic
    kind: private
    note: Frontier-model labs whose assistants are the direct generative-AI substitution threat to Search query volume.
    growth: null
    margin: null
    multiple: private
  threats:
  - vector: network_economies
    who: ChatGPT / AI-native assistants
    falsifier: Search & other growth decelerates toward low-single-digit or query volume visibly leaks to chatbots, breaking
      the user/advertiser loop.
  - vector: cornered_resource
    who: Frontier labs + merchant silicon (NVIDIA)
    falsifier: Rivals match Gemini quality and serving cost, eroding the data/TPU advantage as a differentiator.
  - vector: scale_economies
    who: DOJ / ad-tech antitrust remedy
    falsifier: An adverse ad-tech ruling forces an AdX/DFP divestiture or default-distribution bans dent Search's scale and
      reach.
  takeaway: 'Alphabet''s network and scale Powers are deeply entrenched - a two-sided Search/advertiser loop, YouTube''s flywheel,
    and a cornered-resource stack (index, query data, custom TPUs, Gemini) few rivals can replicate. The Audit: network_economies
    is durable (high); the live threats are generative-AI assistants substituting for ~60%+-of-revenue Search and an antitrust
    overhang (DOJ search appeal, a pending ad-tech divestiture) the DCF doesn''t price. Q1''26 (Search +19%, Cloud +63%) says
    the defense is winning - but the ~28% YTD run re-rated the name to ~60x EV/FCF, so the modal case lands at spot: -21.4%,
    a durable franchise priced for the win.'
pocd:
  people:
    ceo: 'Sundar Pichai'
    founder_led: false
    tenure_years: 6
    insider_ownership_pct: 6.0
    capital_allocation: 'Capital return ramping off a long no-payout history: initiated the first-ever dividend
      April 2024 ($0.20/qtr, raised 5% to $0.21 in 2025), alongside two consecutive $70B buyback authorizations
      (April 2024 + April 2025). Simultaneously a record capex build — FY2025 guidance raised $75B to $85B to
      $91-93B for AI infrastructure (TPUs/GPUs, data centers). Selective tuck-in M&A; SBC a multi-billion annual cost.'
    incentive_alignment: 'Non-founder CEO paid mostly in equity: FY2024 total comp $10.73M on a $2M base, the
      remainder equity. PSUs granted on a ~3-year cycle (2024 was an off-grant year; the 2022 grant pushed total
      comp to ~$226M); long-term grants carry performance/TSR conditions. Pichai holds Class A/C from comp, not
      the super-voting Class B.'
    governance_flags:
      - 'triple-class: Class A (1 vote, GOOGL) · Class B (10 votes, founder-held, unlisted) · Class C (0 votes, GOOG)'
      - 'founders Page + Brin control ~52.7% of votes via Class B (Page 27.1% + Brin 25.2%) on ~6% economics — majority voting control'
      - 'CEO Pichai operates but holds no Class B; founders, not the CEO, hold control and cannot be outvoted by outside holders'
      - 'public Class C (GOOG) carries no vote at all'
    key_person_risk: medium
    score: 3
    takeaway: 'Founders Page and Brin retain ~52.7% combined voting control via 10-vote Class B on roughly 6%
      economic ownership, while non-founder CEO Pichai (Alphabet CEO since Dec 2019) runs operations; capital
      return is ramping (first dividend 2024, repeated $70B buybacks) against a record AI capex build.'

central_question: At $1.32, can long-read consumables reach cash-flow breakeven before the ~$644M of converts mature in 2029/2030
  — or does the net debt swamp the equity first?
thesis: 'Pacific Biosciences sells long-read HiFi DNA sequencers (Revio, Vega) and the high-margin consumables that run on
  them — the #3 behind Illumina''s short-read scale and Oxford Nanopore in long-read. The $1.32 sticker hides the setup: $0.276B
  cash against ~$0.644B of convertible notes is ~$0.368B net debt, larger than the $410M equity cap — a financially-levered
  option, not a cheap value stock. The DCF asks whether ~16%-growing consumable pull-through reaches cash-flow positive (targeted
  2027) before the converts mature. Roughly half the probability mass is worth ~$0 because the debt outranks the equity; a
  fat long-read-wins tail offsets it. Weighted $1.29 vs spot $1.32, modestly negative.'

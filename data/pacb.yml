      margin. Pull-through never funds the cost base, and burn forces small dilutive raises that add shares at a low price
      while the value migrates to the noteholders.
    - With a 50% failure probability the ~$0.644B of converts outrank a tiny equity stub, so common is worth ~$0 in restructuring
      (distress $0.30/share). DCF -$1.06; probability-weighted contribution rounds to $0. The debt, not the business, sets
      the floor.
    probability_rationale: 'The razor/blade pivot is real but unproven at scale, and a 50% p_fail reflects a sub-scale #3

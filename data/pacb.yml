weighting_rationale:
- label: Ultra Bear 18%
  body: Long-read stalls; converts wipe out equity.
- label: Bear 32%
  body: Growth too slow to clear the debt in time.
- label: Base 30%
  body: Breakeven ~2027; equity just clears converts.
- label: Bull 13%
  body: Long-read inflects; consumables beat the debt.
- label: Ultra Bull 7%
  body: Long-read wins big WGS share; a re-rating.
appendix:
  pushback:
  - label: Converts were already refinanced
    body: The 2028 SoftBank wall was pushed to 2029/2030, buying runway — but ~$644M still outranks a $410M equity cap and
      must be cleared.
  - label: Consumables are inflecting now
    body: Consumables grew +16% to $82M while instruments fell -18% — the razor/blade pivot is visibly underway, the bull's
      required first step.
  - label: Restructuring de-risks the burn
    body: FY26 opex guided down to $220-225M with headcount -16% targets cash-flow-positive in 2027 — if hit, base-case equity
      survives.
  - label: Long-read accuracy is a real edge
    body: 'HiFi reads solve problems short-read can''t; if whole-genome sequencing shifts to long-read, the #3 still captures
      a growing consumables annuity.'
  - label: It is a barbell, not sticker-cheap
    body: The $1.32 looks cheap, but net debt above the equity cap means ~half the mass is ~$0 — the price reflects leverage,
      not a bargain.
  triggers:
  - label: Bull validation
    body: Consumable pull-through accelerates above ~$229K/Revio; adj-EBITDA turns positive; the FY27 cash-flow-positive target
      is reaffirmed; converts refinanced non-dilutively.
  - label: Bear validation
    body: Instrument declines persist; pull-through flattens; burn stays ~$45M/qtr; a dilutive equity or convert refinancing
      before 2029.
  - label: Reframe needed
    body: A larger-than-expected raise, a covenant or maturity event, or a credible buyer for the long-read franchise — any
      of which resets the equity thesis.
glossary:
- term: long-read / HiFi sequencing
  definition: DNA sequencing that reads long, highly accurate fragments (HiFi), resolving regions short-read instruments struggle
    with.
- term: consumable pull-through
  definition: Recurring high-margin reagent/kit revenue each installed instrument generates per year — the 'blade' in the
    razor/blade model.
- term: Revio
  definition: PACB's high-throughput long-read sequencer (346 installed); the main pull-through driver at ~$229K annualized.
- term: convertible notes
  definition: Debt that can convert to equity; ~$644M here (due 2029/2030) that outranks common holders until repaid or converted.
- term: razor/blade model
  definition: Selling instruments (razor) to drive recurring consumable sales (blade); the pivot underway as consumables grow
    and instruments shrink.
- term: p_fail
  definition: Modeled probability the equity is wiped out (distress ~$0.30/share) before the scenario's terminal year — elevated
    here by net debt above the equity cap.
competitive:
  arena: Long-read DNA sequencing within the broader sequencing market — PACB (HiFi/SMRT) versus Illumina's dominant short-read
    scale and Oxford Nanopore in direct long-read.
  lens: power_origination
  powers:
    scale_economies:
      score: 1
      note: 'Sub-scale #3 at ~$160M revenue; Illumina''s ~$4.5B base buys cost and R&D advantages PACB can''t match.'
    network_economies:
      score: 1
      note: Some ecosystem pull from published HiFi methods and installed-base data, but no strong cross-side network.
    counter_positioning:
      score: 1
      note: Long-read is structurally different from short-read, but Illumina can and does add long-read offerings, blunting
        the wedge.
    switching_costs:
      score: 2
      note: Installed Revio/Vega plus validated lab workflows create real stickiness, anchoring recurring consumable pull-through.
    branding:
      score: 1
      note: Credible accuracy reputation in long-read, but no pricing-power brand against the incumbent.
    cornered_resource:
      score: 2
      note: HiFi/SMRT IP and accuracy are the asset PACB is trying to turn into Power, but contested by Nanopore and Illumina.
    process_power:
      score: 1
      note: Manufacturing and chemistry know-how exist; not yet a durable, hard-to-replicate process advantage at scale.
  dominant_power: cornered_resource
  window: closing
  rivals:
  - name: Illumina
    kind: public
    note: Short-read scale leader, ~$4.5B revenue; dominant economics, adding long-read
    share_now: 0.85
    share_terminal: 0.7
    capital: strong cash flow, self-funded
  - name: Oxford Nanopore
    kind: public
    note: Direct long-read rival (LSE); portable, real-time reads
    share_now: 0.05
    share_terminal: 0.12
    capital: public, funded but pre-profit
  - name: Pacific Biosciences
    kind: public
    note: 'The #3; HiFi accuracy edge, net-debt-constrained'
    share_now: 0.1
    share_terminal: 0.18
    capital: net debt ~$368M; burning cash
  lead_lag:
  - metric: Long-read accuracy (HiFi)
    company: Leading on accuracy
    best_rival: Oxford Nanopore
    verdict: leading
  - metric: Scale / cost per genome
    company: Sub-scale
    best_rival: Illumina
    verdict: lagging
  - metric: Balance-sheet strength
    company: Net debt above equity cap
    best_rival: Illumina
    verdict: lagging
  takeaway: A Power is being attempted, not yet originated. PACB is trying to convert HiFi/SMRT accuracy into a cornered-resource
    and process Power in long-read, but it lags Illumina's scale economies badly and shares the long-read field with Oxford
    Nanopore. The falsifier the bull must clear is observable and singular — consumable pull-through compounding fast enough
    to reach cash-flow breakeven and clear the ~$644M convert wall before 2029/2030. Miss it and the leverage, not the technology,
    decides the outcome.

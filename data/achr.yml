      (≈2.4yr of cash at the ~$727M/yr burn) before the FAA grants a TC. Lilium's 2025 collapse proves the category kills
      the under-capitalized. Archer dilutes desperately at collapsing prices, then restructures; the residual is defense scraps
      plus whatever cash survives the attempt.
    - With a 45% within-scenario failure probability and the share count ballooning past 1.4B on sub-$4 raises, the expected
      per-share collapses toward the distress floor — a near-total loss from today's $6.81.
    probability_rationale: The category's base rate is unforgiving — no one holds an FAA Type Certificate yet, and Lilium
      (raised $1.4B, failed) proves under-capitalization is fatal. Archer is the cert-follower with ≈2.4yr of runway; 45%
      within-scenario failure reflects real first-of-a-kind certification + funding risk. 12% scenario weight.

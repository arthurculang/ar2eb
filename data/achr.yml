central_question: Is Archer's ~half-Joby price enough discount to make the eVTOL-plus-defense lottery ticket positive-EV —
  despite being the certification follower?
thesis: 'Archer trades at ~$5.4B (≈$6.81/sh) on $0 revenue — about half Joby''s cap on a near-identical certification position,
  with $1.78B cash but a ~$727M/yr burn (≈2.4yr runway) and a defense wildcard (the Anduril autonomous-VTOL JV) Joby lacks.
  The young-company DCF asks what aircraft fleet, UAM-plus-defense revenue, and dilution are plausible over a decade. The
  finding: 85% of the probability sits well below spot — heavy dilution craters the bear/base outcomes — but Archer is cheap
  enough that the 15% cert-success-plus-defense tail (paying 4-13×) lifts the weighted expected modestly above today''s price.'

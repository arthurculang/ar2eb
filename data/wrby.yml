appendix:
  pushback:
  - label: At ~3x sales the price already embeds the margin ramp.
    body: The weighted DCF is -42.1% and the modal base is -43% — only the ultra-bull (+26%) clears spot; the inflection is
      pre-paid, not a free upside.
  - label: The Google glasses are a genuine free call-option.
    body: $150M committed, Android XR + Gemini, NOT in 2026 guidance — credible optionality, but it lives only in the bull/ultra-bull.
  - label: Stores are the engine and the economics work.
    body: 323 stores end-2025 (+47), guiding ~50 more in 2026 at profitable economics; the ~900-1,000+ unit runway must convert
      to EBITDA.
  - label: Gross-margin compression is the watch-item.
    body: Gross margin fell to 54.0% from 56.3% and GAAP profit is a few million dollars; thin profitability plus SBC dilution
      is what 'never inflects' looks like.
  - label: Net cash, p_fail ~0.
    body: $286M cash, no debt — no solvency risk; the downside here is multiple/margin (the inflection failing), not survival.
  triggers:
  - label: Bull validation
    body: adj-EBITDA margin expands above ~14-15%  ·  active-customer growth re-accelerates above +5-6%  ·  gross margin recovers
      toward 56%  ·  Google AI-glasses ship as a real Meta-Ray-Ban competitor
  - label: Bear validation
    body: customer growth decelerates below ~+4% / turns price-led  ·  gross margin compresses below ~53%  ·  GAAP turns back
      to a loss and FCF margin stalls near 5%  ·  glasses slip
  - label: Reframe needed
    body: if EBITDA margin stays stuck near ~12% for 2+ years while customer growth fades, the inflection thesis breaks —
      re-rate the terminal toward a thin-margin specialty retailer, not a premium-brand compounder
glossary:
- term: Active customers
  definition: Trailing-12-month buyers (2.69M, +4.8% TTM); the demand gauge — decelerating growth, increasingly price- not
    customer-led, is the central bear signal.
- term: Revenue per customer
  definition: TTM revenue / active customer (~$331, +6.9%); rising as holistic vision (eye exams, insurance/HSA, contacts)
    deepens the wallet — the offset to slowing customer counts.
- term: Adjusted EBITDA margin
  definition: Non-GAAP operating profitability (~12.2%); the swing-factor metric — whether store-led scale lifts it toward
    high-teens/20% is the whole question.
- term: Android XR / Gemini glasses
  definition: Google-partnered AI smart glasses ($150M committed, launching 2026, not in guidance) — a call-option to compete
    with Meta-Ray-Ban, upside not base case.
- term: FCF margin
  definition: Free cash flow / revenue (~3% FY25); the mature-DCF lever — whether the unit runway and holistic-vision upsell
    convert thin EBITDA into durable free cash flow.
competitive:
  arena: Eyewear / premium consumer DTC — Warby Parker (vertically-integrated DTC brand, ~323 stores + e-commerce, ~4% US
    eyewear share) vs EssilorLuxottica (Ray-Ban/LensCrafters/Sunglass Hut), National Vision, Zenni/EyeBuyDirect, and the optical-retail
    incumbents; auditing a brand Power + a nascent vertical-integration process edge against a dominant incumbent and a thin
    margin.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Vertical integration (in-house design, lens labs, optometry) gives a nascent cost/process edge, but tiny vs EssilorLuxottica's
        global manufacturing/retail scale.
    network_economies:
      score: 0
      note: None — eyewear isn't a network; the app and Virtual Try-On are channels, not network effects.
    counter_positioning:
      score: 2
      note: Was the DTC disruptor that undercut the EssilorLuxottica markup; now part-incumbent with its own stores, so the
        counter-position is narrowing.
    switching_costs:
      score: 1
      note: Weak — eyewear is a periodic, promiscuous purchase; holistic vision (exams/insurance) builds modest stickiness
        but no lock-in.
    branding:
      score: 3
      note: 'The dominant Power: a genuine premium DTC brand (design, price-transparency, Buy-a-Pair-Give-a-Pair) with pricing
        power — but a brand alone doesn''t convert to EBITDA while margins are thin.'
    cornered_resource:
      score: 1
      note: In-house design/lens-lab capability + store locations; valuable but not truly cornered.
    process_power:
      score: 1
      note: 'Emerging: vertically-integrated retail + holistic-vision playbook and new-store economics; unproven at the scale
        the inflection needs — the bull''s swing factor.'
  dominant_power: branding
  durability: medium
  rivals:
  - name: EssilorLuxottica
    kind: public
    note: The dominant incumbent — global lens manufacturing + Ray-Ban/LensCrafters/Sunglass Hut retail + the Meta smart-glasses
      partner Warby's Google glasses must beat.
    growth: 0.07
    margin: 0.18
    multiple: ~28x P/E
  - name: National Vision (EYE)
    kind: public
    note: Value optical-retail operator (America's Best/Eyeglass World); the mass-market, capital-intensive store comp.
    growth: 0.05
    margin: 0.04
    multiple: ~25x EV/EBITDA
  - name: Zenni / EyeBuyDirect
    kind: private
    note: Ultra-low-price online eyewear; the price-led share threat as Warby leans more on price than new customers.
    growth: null
    margin: null
    multiple: private
  - name: Meta x EssilorLuxottica (Ray-Ban)
    kind: public
    note: The AI-smart-glasses leader already in market — the competitor Warby's Google/Gemini program is chasing, not leading.
    growth: null
    margin: null
    multiple: part of EL
  threats:
  - vector: branding
    who: Zenni/EyeBuyDirect + value optical (price-led share)
    falsifier: Active-customer growth turns price-led and decelerates below ~+4% while gross margin compresses below ~53%.
  - vector: process_power
    who: Capital intensity + SBC (the margin inflection)
    falsifier: Adj-EBITDA margin stays stuck near ~12% for 2+ years while FCF margin stalls near 5% — leverage never shows
      up.
  - vector: counter_positioning
    who: Meta-EssilorLuxottica AI glasses
    falsifier: The Google/Gemini glasses slip or launch behind Ray-Ban Meta, so the optionality the bull/ultra-bull rely on
      fails to read as a real competitor.
  takeaway: 'Warby Parker''s brand Power is genuine — a premium, vertically-integrated DTC eyewear name with real pricing
    power and a nascent process edge from in-house design/lens labs/optometry — but a brand does not convert to free cash
    flow while the adjusted-EBITDA margin sits near ~12% and GAAP profit flips between a few million dollars and breakeven.
    The Audit: branding is durable (medium), process_power (store-led vertical integration) is the emerging swing factor,
    and the live threats are capital/SBC intensity capping the margin inflection plus price-led share loss to Zenni/value
    optical; the Google AI-glasses program is upside optionality, not the base, and it chases a Meta-EssilorLuxottica leader.
    At ~3x sales the price already embeds the margin ramp and some of the glasses optionality, so the weighted DCF is -42.1%
    and the modal case lands -43% — only the ultra-bull''s full inflection-plus-second-act clears spot.'

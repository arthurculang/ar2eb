central_question: Does store-led scale finally drive Warby Parker's EBITDA margin from ~12% toward high-teens/20% with durable
  GAAP profit and FCF — or stay a thin-margin, decelerating brand priced for an inflection?
thesis: Warby Parker trades at ~$3.25B (~$26.46, up ~13-16% YTD) — ~3x sales on $872M revenue growing ~13%, net cash, but
  only a ~12% adj-EBITDA margin and razor-thin GAAP profit. The bull is store-led operating leverage finally lifting EBITDA
  toward high-teens/20% as the unit base scales from 323 toward ~900-1,000+, plus a Google AI-smart-glasses call-option outside
  guidance; the bear is decelerating customer growth (+4.8%), gross-margin compression, and the inflection never arriving.
  At ~3x sales the price already embeds the ramp, so the weighted finding is -42.1% and the modal case lands -43%.

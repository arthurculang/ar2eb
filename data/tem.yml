  body: ~25% growth, software margins, data standard; DCF $118.12.
appendix:
  pushback:
  - label: The moat is real and hard to replicate
    body: 7.3M multimodal records (1.3M genomic, 1.4M imaging) feeding an ~80%-margin licensing flywheel is a cornered resource
      rivals can't quickly assemble.
  - label: Data and Applications is compounding +40%+
    body: If data-licensing keeps growing 44% as in Q1'26, the high-margin mix re-rates the whole company toward the bull/ultra-bull
      path.
  - label: Ambry adds scale and a funnel
    body: The ~$600M Ambry deal added hereditary-cancer testing volume that feeds more records into the library — scale economics,
      not just revenue.
  - label: Adj-EBITDA already inflected positive
    body: Q4'25 was +$12.9M and FY26 guides ~$65M; the margin turn the base needs may already be underway, just masked by
      SBC.
  - label: Pharma is validating the data, not just buying tests
    body: The $200M AstraZeneca-Pathos foundation-model deal prices the data asset directly — a repeatable, capital-light
      revenue type.
  triggers:
  - label: Bull validation
    body: Data and Applications sustains 40%+ growth; gross margin and adj-EBITDA margin both expand while SBC falls as a
      share of revenue; new multi-year pharma data deals sign.
  - label: Bear validation
    body: Diagnostics revenue-per-test compresses under Guardant/Natera/Caris; total growth slips toward the low teens; SBC
      stays above adj-EBITDA so owner-FCF remains negative.
  - label: Reframe needed
    body: Foundation models trained on open or competitor data erode the licensing premium, or reimbursement cuts diagnostics
      economics — either would collapse the ~80%-margin moat thesis.
glossary:
- term: Multimodal data library
  definition: TEM's 7.3M+ de-identified patient records linking genomic, imaging, and clinical data — the proprietary asset
    feeding both diagnostics and licensing.
- term: Data and Applications
  definition: The pharma data-licensing segment ($87M in Q1'26, +41%); ~80% gross margin, the high-margin flywheel distinct
    from the diagnostics lab business.
- term: MRD
  definition: Minimal residual disease — detecting trace cancer after treatment; a growth vector for oncology testing volume
    and a competitive battleground.
- term: Adj-EBITDA vs owner-FCF
  definition: Adjusted EBITDA adds back ~$136M/yr of stock comp; true owner free cash flow does not, so the headline positive
    adj-EBITDA still maps to negative cash today.
- term: SBC
  definition: Stock-based compensation (~$136M/yr, over 10% of revenue) — a real, recurring, dilutive cost that exceeds adj-EBITDA
    and currently swamps the margin story.
- term: Dual-class control
  definition: Founder-CEO Eric Lefkofsky holds ~60% of the vote via super-voting shares, concentrating control and limiting
    outside accountability — a governance flag.
competitive:
  arena: 'AI-precision-oncology: molecular diagnostics plus a multimodal-data-licensing flywheel, against Guardant, Natera,
    Caris, Foundation Medicine (Roche), and Exact Sciences.'
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Larger record base lowers unit cost of model training and licensing; reinforces the data flywheel as volume grows.
    network_economies:
      score: 2
      note: More clinical use feeds more records, which improve products that attract more use — a data network loop, not
        a user network.
    counter_positioning:
      score: 1
      note: Software-margin data licensing is a model legacy lab-only rivals can't easily adopt without cannibalizing test
        revenue.
    switching_costs:
      score: 1
      note: Pharma data pipelines and clinician workflow integration create modest stickiness, but contracts are re-competed.
    branding:
      score: 1
      note: Recognized in AI-oncology, but diagnostics buyers decide on accuracy, reimbursement, and price, not brand.
    cornered_resource:
      score: 3
      note: The 7.3M-record multimodal library (1.3M genomic, 1.4M imaging) is the proprietary, hard-to-replicate asset and
        the dominant Power.
    process_power:
      score: 1
      note: Multimodal data engineering is a capability, but not yet a durable, uncopyable process advantage.
  dominant_power: cornered_resource
  durability: medium
  rivals:
  - name: Guardant Health
    kind: public
    note: Liquid biopsy and MRD; scaling oncology volume
    growth: 0.2
    margin: null
    multiple: ~6x sales
  - name: Natera
    kind: public
    note: Oncology and women's-health molecular testing; near breakeven
    growth: 0.3
    margin: 0.0
    multiple: ~9x sales
  - name: Foundation Medicine
    kind: private
    note: Roche-owned genomic-profiling division; deep-pocketed
    growth: null
    margin: null
    multiple: division of Roche
  - name: Exact Sciences
    kind: public
    note: Cologuard plus oncology; established but slower-growing
    growth: 0.12
    margin: null
    multiple: ~4x sales
  threats:
  - vector: cornered_resource erosion
    who: foundation-model rivals
    falsifier: Open or competitor-trained oncology models replicate the data edge, commoditizing the ~80%-margin licensing
      line.
  - vector: scale_economies / pricing
    who: Guardant, Natera, Caris
    falsifier: Diagnostics price competition compresses revenue per test, starving the volume that feeds the data flywheel.
  - vector: regulatory / reimbursement
    who: payers and CMS
    falsifier: Reimbursement cuts to molecular diagnostics undermine the core economics and the funnel that grows the record
      library.
  takeaway: 'A durable Power is plausibly present but not proven. The cornered resource — a 7.3M-record multimodal library
    feeding an ~80%-margin licensing flywheel with a data-network loop — is genuinely hard to replicate, hence the bull case.
    But durability is medium, not high: the falsifier is foundation models trained on open or rival data closing the gap,
    or diagnostics pricing pressure starving the volume that feeds it. The moat must keep Data and Applications compounding
    40%+ to earn the price.'
pocd:
  people:
    ceo: Eric Lefkofsky
    founder_led: true
    tenure_years: 11
    insider_ownership_pct: 24.0
    capital_allocation: Founder Eric Lefkofsky is Chairman & CEO (founded 2015; serial founder of Groupon, Lightbank,
      Mediaocean and Pathos AI). Capital funds rapid growth and acquisitions (Ambry Genetics ~$672M, Paige, OneOme)
      against ~$605M cash; FY2025 revenue $1.27B (+83%) at roughly adjusted-EBITDA breakeven. No dividend or buyback,
      and the share count is rising from deal stock plus heavy stock-based comp — FY2025 SBC of ~$125M far exceeds
      the ~$7M adjusted-EBITDA loss, so owner cash economics are weaker than the adjusted figure implies.
    incentive_alignment: 'Lefkofsky took no base salary in 2024 and an $800K base + $800K target from 2025; alignment
      is via his stake. But the related-party web is the standout flag: Tempus COO Ryan Fukushima simultaneously runs
      Lefkofsky-founded Pathos AI, which is contracted to pay Tempus ~$200M over three years; there is also a SoftBank
      JV and possible affiliated landlord. Insider trading is programmatic 10b5-1 selling. An active securities suit
      alleges AI-washing / round-tripping (unadjudicated).'
    governance_flags:
    - 'multi-class super-voting: Class B = 30 votes per share; Lefkofsky controls ~59.9% of the vote on ~24% economics
      — majority single-person control'
    - combined Chair & CEO (Lefkofsky); no confirmed lead independent director
    - the Class B sunset is person-tied to Lefkofsky (converts only when he exits or drops below 10M shares) — no
      fixed-date sunset
    - dense related-party web around Lefkofsky entities (Pathos AI via a shared COO, ~$200M contract; SoftBank JV)
      — the subject of an active securities suit
    - stock-based comp (~$125M FY2025) exceeds the adjusted-EBITDA result; no buyback to offset dilution
    - 'mitigants: the controlled-company exemption was declined; 8 of 9 directors independent; board declassified
      (annual elections)'
    key_person_risk: high
    score: 2
    takeaway: 'The most-entrenched tier: founder-CEO Lefkofsky holds ~59.9% of the vote on ~24% economics through
      30-vote Class B, combines Chair and CEO, and sits at the center of a dense related-party web (a shared COO running
      a Lefkofsky company contracted to pay Tempus ~$200M) now under securities litigation. Real mitigants keep it
      a 2-with-mitigants rather than lower — the controlled-company exemption was declined, the board is 8-of-9 independent
      and declassified — but majority single-person control plus the related-party concentration drive the score.
      Key-person risk is high.'

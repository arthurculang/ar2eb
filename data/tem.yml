central_question: At ~6.6x sales and near-breakeven, is the market paying for proven cash economics, or for a data-moat plus
  a margin inflection that SBC currently swamps and the modal case doesn't deliver?
thesis: Tempus AI is AI-precision-oncology diagnostics plus a multimodal health-data flywheel. Revenue is $1.3B, growing 25-36%,
  adj-EBITDA just inflected positive (FY26 guide ~$65M). But SBC runs ~$136M/yr — more than 10% of revenue and larger than
  that adj-EBITDA — so true owner free cash flow is still negative. At $47.82 (~$8.6B cap, down ~20% YTD, net cash ~$84M)
  the modal 5-year DCF is $30.42, about 36% below spot. Only the bull case — sustained 21%+ growth and a ~23% terminal margin
  — clears the price. You are paying today for continued hypergrowth and an unproven margin turn.

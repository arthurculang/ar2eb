- label: Ultra Bear 14%
  body: GBM erodes post-TRIDENT; new indications never adopt; $4.20.
- label: Bear 28%
  body: Slow adoption, thin leverage; small owner-FCF; $9.19.
- label: Base 33%
  body: Moderate new-indication ramp; margin ~10%; ~fair, $14.00.
- label: Bull 17%
  body: Lua and Pax adopt, the 78% margin levers to 14%; $23.58.
- label: Ultra Bull 9%
  body: TTFields a multi-indication standard; $39.81.
appendix:
  pushback:
  - label: Cheap with a bounded floor
    body: At ~2.5x sales, net cash, 78% GM — the downside is capped, no insolvency risk even in the bear.
  - label: Multiple shots on goal
    body: GBM, lung, pancreatic, brain-mets are four approved/filed indications; one real ramp re-rates the thesis.
  - label: First pancreatic therapy in ~30 years
    body: PANOVA-3 made Optune Pax the first new locally-advanced pancreatic therapy in ~30 years — a differentiated position.
  - label: Unproven operating leverage
    body: The bull needs the first durable operating profit in company history; a decade of losses and SBC over $100M a year
      mean that leverage is asserted, not demonstrated.
  - label: Adoption lags labels
    body: Continuous-wear compliance keeps real prescriptions below approved populations — Optune Lua is still only ~$3M a
      quarter despite full FDA approval.
  triggers:
  - label: Bull validation
    body: Active patients accelerating above ~4,800; Lua/Pax revenue ramping to tens of millions; owner-FCF turning durably
      positive.
  - label: Bear validation
    body: Active-patient growth flattening; Lua/Pax stuck in single-digit millions; adj-EBITDA staying negative; reimbursement
      gating.
  - label: Reframe needed
    body: A second pivotal trial missing (after TRIDENT) in a new indication, or GBM revenue declining — collapses the multi-indication
      TAM-expansion thesis.
glossary:
- term: Tumor Treating Fields (TTFields)
  definition: Low-intensity alternating electric fields, via a wearable device, that disrupt cancer-cell division.
- term: Optune Gio / Lua / Pax
  definition: 'The approved products: Gio (glioblastoma, the base), Lua (metastatic NSCLC, early ramp), Pax (locally-advanced
    pancreatic, newly approved).'
- term: Active patients
  definition: The key device KPI — patients currently on therapy (~4,791 in Q1 2026); revenue scales with this count, not
    with label approvals alone.
- term: TRIDENT / PANOVA-3
  definition: Phase 3 trials — TRIDENT (newly-diagnosed GBM + radiation) MISSED its endpoint June 2026; PANOVA-3 (pancreatic)
    succeeded and enabled Optune Pax.
- term: adj-EBITDA vs owner-FCF
  definition: Adjusted EBITDA (-$34M FY25) excludes stock comp; owner-FCF subtracts the ~$100M+/yr of SBC, so true owner cash
    starts well below the headline.
- term: SBC
  definition: Stock-based compensation — a real, dilutive cost (a $43M charge hit Q1'26 on the Optune Pax approval) that the
    adj-EBITDA figure adds back.
competitive:
  arena: Solid-tumor oncology, where a wearable TTFields device competes for oncologist and patient mindshare against systemic
    drugs and radiation, not against a rival device.
  lens: power_audit
  powers:
    scale_economies:
      score: 1
      note: Some fixed-cost leverage in R&D and field operations, but the model is still loss-making after years.
    network_economies:
      score: 0
      note: No network effect; value to one patient does not rise with the number of other users.
    counter_positioning:
      score: 2
      note: A non-systemic modality incumbents (pharma, radiation) cannot easily add without cannibalizing or re-tooling around
        drugs.
    switching_costs:
      score: 1
      note: Modest — an in-progress treatment course is sticky, but adoption is per-line and physician-driven, not locked-in.
    branding:
      score: 1
      note: Optune has oncology recognition, but prescribing follows clinical evidence and reimbursement, not brand.
    cornered_resource:
      score: 3
      note: The TTFields IP and patented device platform are unique — no direct device competitor delivers this modality.
    process_power:
      score: 1
      note: Accumulated regulatory and trial know-how across indications, but reproducible by a well-funded entrant over time.
  dominant_power: cornered_resource
  durability: medium
  rivals:
  - name: Standard chemo / radiation
    kind: incumbent
    note: The real competition for oncologist mindshare; entrenched, reimbursed, default pathway.
    growth: null
    margin: null
    multiple: n/a (standard of care)
  - name: Pharma oncology (IO / targeted)
    kind: public
    note: Systemic drugs competing for the same treatment line; vastly larger R&D budgets.
    growth: null
    margin: null
    multiple: large-cap pharma multiples
  - name: Other neuro-oncology device / trials
    kind: private
    note: Few direct device rivals today; the threat is future entrants replicating the modality.
    growth: null
    margin: null
    multiple: early-stage / venture
  - name: Build-vs-adopt inertia
    kind: incumbent
    note: Continuous-wear compliance and physician habit, not a competitor, gate real-world uptake.
    growth: null
    margin: null
    multiple: n/a
  threats:
  - vector: cornered_resource
    who: Future device entrants
    falsifier: A competing electric-field or wearable modality clearing trials and eroding the patent/platform exclusivity.
  - vector: counter_positioning
    who: Payers / reimbursement
    falsifier: Coverage restrictions or denials gating new indications, which keeps real prescriptions below approved populations.
  - vector: process_power
    who: New-indication trial risk
    falsifier: A second pivotal miss after TRIDENT in lung, pancreatic, or brain mets — undercutting the clinical-evidence
      moat that justifies each new label.
  takeaway: 'NovoCure has a genuine cornered resource — the TTFields IP and the only approved device for this modality — reinforced
    by a per-indication clinical-evidence moat (PANOVA-3, METIS). That makes the modality largely uncontested by direct device
    rivals. But the Power is medium-durability, not high: real-world adoption lags labels, reimbursement gates uptake, and
    the June 2026 TRIDENT miss shows the moat must be re-won trial by trial. The falsifier is a second pivotal miss or flat
    active-patient growth — either would prove the platform cannot extend beyond GBM.'

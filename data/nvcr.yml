      Active patients stall near today's ~4,800, and continuous-wear compliance keeps real-world uptake well below the approved
      population.
    - Owner-FCF margin starts at -10% and crawls to 2% — the operating leverage never arrives after a decade of losses. At
      ~1.8% growth and a barely-positive terminal margin the DCF is $4.20, ~71% below spot. Net cash prevents distress, but
      the equity is worth little if TTFields stays a single-indication niche.
    probability_rationale: Roughly one-in-seven. Requires both the GBM franchise softening after TRIDENT and the new indications
      stalling, while the gross margin never translates into operating profit — plausible given the long loss history, but

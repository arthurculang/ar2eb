central_question: NovoCure trades at ~2.5x sales with net cash and an unproven new-indication tail — does the optionality
  beyond glioblastoma justify the price, or does it stay a loss-making device story?
thesis: NovoCure sells Tumor Treating Fields (TTFields), a wearable oncology device anchored by Optune Gio in glioblastoma.
  FY2025 revenue was $655M (+8%) at a 78% gross margin, yet it posted a $136M GAAP loss — funded by ~$0.47B net cash, not
  insolvency risk. At $14.33 the stock is cheap on sales; the upside lives in new FDA-approved indications (Optune Lua/lung,
  Pax/pancreatic, METIS) multiplying the TAM beyond GBM. Weighted fair value $14.97, ~4.5% above spot — fair, with the June
  2026 TRIDENT miss capping the GBM leg.

      rev_path:    [0.08, 0.10, 0.12, 0.10, 0.08]
      op_margin:   [0.420, 0.430, 0.440, 0.450, 0.450]
      wacc_path:   [0.075, 0.075, 0.075, 0.075, 0.075]

      pv_terminal: 68.44          # bumped 63.40 → 68.44 so op_ev = sum_pv_fcf + pv_terminal (80.05 = 11.61 + 68.44)
      op_ev: 80.05
      cash: 7.8
      net_debt: 0.0
      special_assets: 16.0
      total_equity: 103.85
      raise_total: 0.0
      dilution_pct: 0
      final_shares: 250

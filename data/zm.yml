# ═════════════════════════════════════════════════════════════════════════════
# zm.yml — Zoom Communications (NASDAQ: ZM)
# Canonical data file per memo-spec §6c.16 (proposed)
# Schema v003 · 2026-05-18_07-00
# ═════════════════════════════════════════════════════════════════════════════
#
# SCHEMA NOTE — differences from joby.yml that revealed schema gaps:
#
# 1. dcf_type = mature_company_sotp (new value alongside young_company)
# 2. dcf_path arrays are length-5 (5-year explicit DCF), NOT length-10
# 3. dcf_path.rev_path stores GROWTH RATES (e.g. 0.04 = 4%), not absolute revenue.
#    A starting revenue (`rev_b`) is the anchor; year-1 revenue = rev_b * (1+rev_path[0]).
#    For young_company tickers (JOBY/AUR), rev_path is ABSOLUTE $B values.
#    Semantics differ by dcf_type — generator must dispatch.
# 4. dcf_metrics block has different keys: cagr_5y, wacc, anthropic_stake
#    (instead of JOBY's tam_share, p_fail, s2c).
# 5. ZM has no shim fields (the prior Python code had bogus tam_share/p_fail/s2c
#    values to make ribbon code "work" — schema cleans these out entirely).
# 6. dcf_path includes `special_assets` (Anthropic stake at SOTP scenario value)
#    used in equity decomposition equation. JOBY has no special_assets.
# 7. market.extras populated: "Anthropic stake (carried)" appears in masthead.
# ═════════════════════════════════════════════════════════════════════════════

# ── Ticker identity ─────────────────────────────────────────────────────────
ticker: ZM
company: Zoom Communications
exchange: NASDAQ
dcf_type: mature_company_sotp   # young_company | mature_company | mature_company_sotp
date: '2026-09-22'
spot: 90.90
# ── Market data ─────────────────────────────────────────────────────────────
market:
  market_cap_billion: 27.24
  shares_outstanding_million: 299.7
  cash_billion: 7.9           # ZM cash & marketable securities (post-Q1 FY27)
  net_debt_billion: 0.0
  extras:
    - "Anthropic stake (carried)"   # ZM-specific masthead extra; SOTP non-operating asset

# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Is Zoom a melting ice cube — or, with stock comp counted as a cost, still a
  stable cash machine sitting on a $7B Anthropic stake not yet marked by an
  IPO?

thesis: Zoom trades at $90.90 ($27.2B market cap); $7.9B of cash covers 29% of that. FY26 revenue was $4.87B, and reported
  free cash flow of $1.92B adds back $0.76B of stock comp (15.6% of revenue). Net of that real cost, owner FCF is ~$1.16B
  and enterprise value is ~17× it (~10× headline FCF), or ~11× net of a $7B Anthropic value. That stake, carried near $1.5B,
  is valued at $2-16B across scenarios pending its IPO; the core faces real but slow competition from Teams and Workspace.
  Valued on owner FCF and today's ~300M diluted shares (buybacks spend cash already counted), the weighted value is ~$100,
  +10% vs the price. The most likely case (base, 50%) sits ~11% above the price; 30% of the probability sits below it.

# ── Page 3 chart-level reference data ───────────────────────────────────────
chart_reference:
  # ZM has 5 years of history on Page 3 charts (FY21-25), not 3 like JOBY
  history_years: [2021, 2022, 2023, 2024, 2025]
  history_revenue: [2.65, 4.10, 4.39, 4.53, 4.66]  # $B fiscal-year actuals
  history_op_margin:   # %  GAAP operating income / revenue (SEC XBRL OperatingIncomeLoss)
  - 24.9
  - 25.9
  - 5.6
  - 11.6
  - 17.4
  history_fcf: [1.466, 1.605, 1.292, 1.470, 1.706]  # $B FCF

# ── Page 3 chart-aesthetic config (Phase 4: migrated out of JSX) ────────
page3_chart_config:
  segment_a: "Enterprise"
  segment_b: "Online"
  # Historical Enterprise share of revenue (FY21-25). Not in chart_reference
  # because it's chart-aesthetic, not memo content.
  hist_ent_split: [0.55, 0.58, 0.59, 0.60, 0.603]
  chart6_title: "SOTP equity (Op EV + cash + Anthropic)"
  chart6_type: "zmSotp"

# ═════════════════════════════════════════════════════════════════════════════
# SCENARIOS
# ═════════════════════════════════════════════════════════════════════════════
# Mature-Company DCF: 5-year explicit period (FY26 → FY30).
# All dcf_path arrays are length-5.
# ═════════════════════════════════════════════════════════════════════════════

scenarios:

  # ───────────────────────────────────────────────────────────────────────────
  # ULTRA_BEAR — Cisco-Webex displacement pattern. Mirror of ultra_bull's
  # joint-conjunction structure (4 things have to hit together). Captures the
  # tail risk that the current "bear" doesn't: not slow erosion, but
  # coordinated displacement + AI commoditization + Anthropic disappointment.
  # ───────────────────────────────────────────────────────────────────────────
  ultra_bear:
    label: Ultra Bear
    short_label: UltBear
    probability: 0.08
    expected_per_share: 28.70
    headline: "Cisco-Webex moment; deep tail."
    narrative:
      - >
        The ultra-bear is qualitatively different from bear's slow melt. It's
        the Cisco Webex collaboration trajectory — revenue prints -10%, then
        -13%, then -19% YoY as Teams reaches its tipping point. Four things
        compound: enterprise NDR breaks 95% as Teams Premium pricing collapses
        ZM's seat economics; AI Companion Pro fails to differentiate against
        Copilot/Gemini bundled into M365 and Workspace; Phone + Contact Center
        growth stalls below 15% (the diversification story dies); and
        Anthropic IPOs below $400B (Pentagon supply-chain risk + AI-capex
        moderation + cheap-AI commoditization), gutting the SOTP "hidden
        asset" narrative.
      - >
        Revenue collapses from $4.87B to $3.6B over five years (-26%). Operating margin after stock comp falls from ~20% to about −4% as ZM spends to defend the enterprise base, and owner FCF turns negative in year five. Terminal growth of -2% turns the terminal
        value negative, leaving Op EV at just $1.1B. Cash drains to ~$5.5B on
        buybacks that only offset dilution. Anthropic floors at $2B (sub-$400B
        IPO). SOTP equity: $8.6B ÷ 299.7M shares =
        ~$28.70/share — a -68% tail, against the ultra-bull's +154%.
    probability_rationale: >
      Joint conjunction of four independent fault lines: (a) Cisco-style
      displacement curve materializes (-10/-13/-19% YoY) — historical base
      rate of incumbent-SaaS displacement by hyperscaler bundles is real but
      not the median outcome; (b) Anthropic IPO disappoints below $400B (vs
      current $900B private mark) on AI-capex correction + Pentagon
      supply-chain risk + cheap-AI commoditization; (c) AI Companion Pro
      fails to monetize as Microsoft Copilot bundling collapses pricing
      power for collaboration AI; (d) Phone + Contact Center growth stalls
      below 15%, killing the diversification story. Each individually 15-30%
      probability conditional on macro; joint conjunction at 8%. Lower than
      bear's 22% because (i) Q1 FY27 printed a beat with NDR ticking up
      to 99% and AI Companion MAUs +184% YoY, and (ii) compound conjunction
      requires all four to fire simultaneously over five years.

    # Mature-Company SOTP DCF metrics — structural-decline risk premium baked
    # into WACC (12% vs base 10%); Anthropic stake at low-IPO floor.
    dcf_metrics:
      cagr_5y: -5.8           # 5y revenue CAGR (%)
      wacc: 0.120             # discount rate — structural-decline premium
      anthropic_stake: 2.0    # Anthropic equity at sub-$400B IPO mark ($B)

    # 5-year DCF path (FY26 → FY30) — Cisco-Webex displacement curve
    dcf_path:
      rev_b: 4.87                                  # starting revenue ($B FY25 actual)
      rev_path:    [-0.02, -0.05, -0.08, -0.08, -0.06] # declining growth rates
      op_margin:   [0.204, 0.144, 0.084, 0.024, -0.036] # defensive-spend margin crush
      wacc_path:   [0.120, 0.120, 0.120, 0.120, 0.120]
      fcf:         [0.971, 0.652, 0.349, 0.091, -0.131]
      pv_fcf:      [0.867, 0.520, 0.248, 0.058, -0.074]
      term_g: -0.02                                 # perpetual decline, not zero
      sum_pv_fcf: 1.62
      terminal_value: -0.92
      pv_terminal: -0.52
      op_ev: 1.10
      cash: 5.5                                     # drained from $7.9B by defensive buybacks
      net_debt: 0.0
      special_assets: 2.0                           # Anthropic stake $B at low IPO floor
      total_equity: 8.60
      raise_total: 0.0
      dilution_pct: 0
      final_shares: 299.7
      dcf_per_share: 28.70
      distress: 0.0

    chart_data:
      ev_rev_multiple: [2.5, 2.0, 1.7, 1.5, 1.3]    # multiple compression
      ev_fcf_multiple: [5.0, 4.5, 4.0, 3.5, 3.3]    # structural-decline multiple

  # ───────────────────────────────────────────────────────────────────────────
  bear:
    label: Bear
    short_label: Bear
    probability: 0.22
    expected_per_share: 62.80
    headline: "Zoom without a core market."
    narrative:
      - >
        The pessimistic case is harsh and worth taking seriously: video
        conferencing has commoditized. Microsoft Teams ships with every E3 and
        E5 license — well north of 400M enterprise seats globally. Google Meet
        ships with Workspace. Webex, Slack Huddles, Discord, FaceTime —
        everyone has video. The product Zoom invented and dominated is now
        table stakes inside the productivity bundles customers are already
        paying for.
      - >
        In this world Zoom's revenue stagnates and then declines. Enterprise
        renewals come at lower seat counts as IT teams quietly migrate to
        Teams. Online (consumer + SMB) erodes faster as free alternatives
        become good enough. Phone and Contact Center continue growing 20-25%+
        but on too small a base to offset the core decline. Revenue drifts
        from $4.87B in FY26 to ~$4.7B by FY30. Margins compress as Zoom
        spends to defend: owner FCF margin, after stock comp, slides from 19%
        to 13%.
      - >
        Even Anthropic disappoints: the AI capex cycle moderates, IPO prices
        at the low end, and the stake marks closer to $4B than $9B. SOTP math
        still gives some floor — $7.0B op EV + $7.8B cash + $4B Anthropic =
        $18.8B equity ÷ 299.7M shares = ~$62.80/share, 31% below today's
        $90.90; the cash + stake (~$39/share) cushion the loss. Bear isn't
        bankruptcy; it's structural erosion of the operating business.
    probability_rationale: >
      Bearish thesis is competitive commoditization: Teams (Microsoft's
      bundled play) and Google Meet (free for Workspace customers) continue
      to take seats from ZM's enterprise base; AI Companion Pro fails to
      differentiate or monetize meaningfully (Microsoft Copilot integration
      into Teams is the obvious competitive response); Phone seats stagnate;
      Contact Center fails to reach scale; Anthropic stake gets compressed
      if AI valuations correct or Anthropic does an underwhelming IPO. The
      22% weight (30% with the ultra-bear) reflects that Teams/Workspace
      competition is real, ongoing,
      and structurally favored — but ZM has shown unexpected resilience
      through 2024-25 (stable revenue, growing FCF, $1B+ buyback program).
      Not bankruptcy risk; share-loss-with-margin-compression risk.

    # Mature-Company SOTP DCF metrics (for Page 1 ribbon — no shims)
    dcf_metrics:
      cagr_5y: -0.7           # 5y revenue CAGR (%)
      wacc: 0.100             # discount rate (decimal)
      anthropic_stake: 4.0    # Anthropic equity at SOTP mark ($B)

    # 5-year DCF path (FY26 → FY30) — length-5 arrays, NOT zero-padded
    dcf_path:
      rev_b: 4.87                                  # starting revenue ($B FY25 actual)
      rev_path:    [0.01, 0.00, -0.01, -0.02, -0.02]    # growth rates per year
      op_margin:   [0.229, 0.214, 0.199, 0.184, 0.164]  # operating margin after stock comp
      wacc_path:   [0.100, 0.100, 0.100, 0.100, 0.100]
      fcf:         [0.953, 0.903, 0.846, 0.733, 0.625]
      pv_fcf:      [0.866, 0.746, 0.636, 0.501, 0.388]
      term_g: 0.0
      sum_pv_fcf: 3.14
      terminal_value: 6.25
      pv_terminal: 3.88
      op_ev: 7.02
      cash: 7.8
      net_debt: 0.0
      special_assets: 4.0      # Anthropic stake $B contribution to SOTP equity
      total_equity: 18.82
      raise_total: 0.0
      dilution_pct: 0
      final_shares: 299.7
      dcf_per_share: 62.80
      distress: 0.0

    chart_data:
      # ZM doesn't use raises/raise_prices/rev_per_aircraft (those are
      # young-company concepts). ZM-specific Page 3 chart auxiliaries:
      ev_rev_multiple: [3.8, 3.5, 3.3, 3.0, 2.8]      # for EV/Rev chart
      ev_fcf_multiple: [10.0, 9.0, 8.0, 7.0, 6.0]     # for EV/FCF chart (right axis)

  # ───────────────────────────────────────────────────────────────────────────
  base:
    label: Base
    short_label: Base
    probability: 0.50
    expected_per_share: 101.30
    headline: "Stable cash machine with a visible kicker."
    narrative:
      - >
        The middle path. Zoom continues as a stable mid-single-digit growth
        business. Enterprise revenue grows 6-7%, Online stays flat to
        slightly down, Phone and Contact Center add 25%+ on smaller bases.
        Blended revenue grows 3-4% — exactly what FY27 guidance is calling
        for and consistent with the last two years.
      - >
        AI Companion stays bundled into paid plans and helps justify price
        increases at renewal. The strategic logic is right: make AI a feature
        of the bundle rather than try to monetize it as a separate SKU
        customers can decline. After a near-term capex step-up for the
        post-pandemic data center refresh, owner FCF (after the ~16% of
        revenue paid in stock) holds a steady ~19% margin, ~$1.0-1.1B a year.
        Shares are held at today's ~300M, since buybacks spend cash already valued.
      - >
        The big mid-term catalyst lands: Anthropic IPOs in late 2026 at
        $700B-1T and Zoom's stake gets marked publicly for the first time.
        The hidden asset on Zoom's balance sheet becomes visible to every
        screener. SOTP math: $15.6B op EV + $7.8B cash + $7B Anthropic =
        $30.4B equity ÷ 299.7M shares = ~$101/share. The core's multiple
        expands from ~11x owner FCF (net of cash and a $7B Anthropic value)
        to ~13x as the cash and Anthropic carry stop being discounted
        heuristically.
    probability_rationale: >
      Modal outcome. ZM stabilizes at mid-single-digit revenue growth; FY27
      guidance holds; AI Companion Pro is a meaningful contributor but not
      a category-defining product; Anthropic stake gets a public mark via
      Anthropic's IPO at $700B-1T valuation; ZM multiple expands modestly
      as the market gives credit for the Anthropic stake AND for stable
      cash generation. Stock comp holds near 16% of revenue. The 50% weight
      reflects that this requires the least faith —
      sequential execution on plans already in motion.

    dcf_metrics:
      cagr_5y: 3.1
      wacc: 0.085
      anthropic_stake: 7.0

    dcf_path:

competitive:
  arena: >
    Video communications + collaboration — Zoom vs Microsoft Teams (bundled in M365),
    Google Meet (Workspace), Cisco Webex; the question is whether a standalone platform
    holds against suite bundling, and whether AI Companion monetizes.
  lens: power_audit
  powers:
    scale_economies:     { score: 2, note: "Large user base + global media infrastructure spread cost." }
    network_economies:   { score: 2, note: "Ubiquity ('Zoom me'), guest-join reach, app marketplace." }
    counter_positioning: { score: 1, note: "Was the ease-of-use disruptor; incumbents have since matched the model." }
    switching_costs:     { score: 2, note: "Enterprise contracts; Zoom Phone / Contact Center stickiness; habit." }
    branding:            { score: 3, note: "Category-defining verb; default for external meetings." }
    cornered_resource:   { score: 1, note: "No durable exclusive asset; talent + reliability are replicable." }
    process_power:       { score: 2, note: "Reliability/UX engineering culture; uptime track record." }
  dominant_power: branding
  durability: medium
  rivals:
    - { name: "Microsoft Teams", kind: incumbent-division, note: "Bundled free in M365 — the existential bundling threat.", growth: 0.10, margin: 0.40, multiple: "bundled" }
    - { name: "Google Meet", kind: incumbent-division, note: "Bundled in Workspace; good-enough for many.", growth: 0.08, margin: 0.30, multiple: "bundled" }
    - { name: "Cisco Webex", kind: public, note: "Enterprise legacy; declining share.", growth: -0.05, margin: 0.25, multiple: "~12x" }
    - { name: "RingCentral / 8x8", kind: public, note: "UCaaS pure-plays in Phone/CC.", growth: 0.05, margin: 0.18, multiple: "~8x" }
  threats:
    - { vector: counter_positioning, who: "Microsoft Teams (bundling)", falsifier: "Online seat growth < 0% or net-dollar-retention < 100% as Teams bundling displaces standalone seats." }
    - { vector: branding, who: "AI assistants (Copilot/Gemini)", falsifier: "AI Companion fails to lift ARPU while bundled rivals give equivalent AI free." }
  takeaway: >
    A category-defining brand + network with real switching costs, but durability is the whole
    debate — Microsoft's bundling is the dominant threat the terminal multiple hinges on; seat
    growth and net retention are the gauges.

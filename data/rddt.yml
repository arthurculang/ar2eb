appendix:
  pushback:
  - label: ~91% gross margin and +62% growth is rare — why is the modal case negative?
    body: Quality isn't the issue; price is. At ~43x headline FCF even strong execution lands the base at ~-23% — the price
      already embeds the bull.
  - label: Headline FCF overstates the cash.
    body: FCF was ~$0.70B (~32% of revenue) but SBC runs ~$300M+/yr; ex-SBC owner FCF is ~a quarter lower and dilutes — the
      model uses it.
  - label: Data-licensing is the offsetting wildcard.
    body: Google (~$60M/yr) and OpenAI (~$70M/yr) deals are ~6% of revenue but high-margin and scaling — a scarce corpus,
      partly hedging traffic risk.
  - label: The Google dependency is the whole thesis.
    body: ~40-50% of traffic arrives via Google; AI-search answer-boxes that satisfy queries without a click are the threat,
      already denting growth in Q4-2025.
  - label: Net cash, p_fail ~0.
    body: ~$954M cash and no debt — no solvency risk; the entire downside is multiple/growth/traffic, not survival.
  triggers:
  - label: Bull validation
    body: ARPU keeps climbing toward peer levels (+40%+)  ·  daily uniques hold despite AI-search  ·  data-licensing scales
      beyond ~6% of revenue
  - label: Bear validation
    body: daily-unique growth stalls for 2+ quarters  ·  Google referral share visibly falls  ·  another algorithm change
      dents traffic
  - label: Reframe needed
    body: if AI-search clearly disintermediates Google-sourced discovery, re-rate the terminal toward a shrinking platform —
      ultra-bear becomes the base
glossary:
- term: Daily active uniques (DAUq)
  definition: Unique logged-in + logged-out daily users (~126.8M, +17%) — the traffic base; its deceleration and Google-algorithm
    sensitivity are the central bear signal.
- term: ARPU
  definition: Average revenue per user (~$5.23, +44%) — far below Meta, so the gap is the bull's monetization runway, the
    lever that lifts ad revenue without more users.
- term: Data licensing
  definition: High-margin revenue from licensing Reddit's corpus for AI training (Google ~$60M/yr, OpenAI ~$70M/yr; ~6% of
    revenue) — a scarce-resource annuity, the wildcard to traffic risk.
- term: AI-search cannibalization
  definition: AI answer-boxes (Google AI Overviews, ChatGPT) satisfying queries without a click-through to Reddit — the threat
    to the ~40-50% of traffic that arrives via Google.
- term: FCF margin
  definition: Free cash flow / revenue, modeled ex-SBC (owner FCF, not the ~32% headline); SBC ~12% of revenue is a ~25%
    haircut to headline plus ongoing dilution.
competitive:
  arena: Digital advertising and the AI-training-data market — Reddit (the community/UGC discussion graph, ~126.8M daily uniques,
    under-monetized ad engine) vs Meta, Pinterest, Snap for ad dollars and the AI labs (Google, OpenAI) as data-licensing
    buyers; auditing a network-economies Power against AI-search disintermediation.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Some ad-infrastructure and content-moderation leverage at ~$2.2B revenue, but small vs Meta/Google; ad-tech scale
        is years away.
    network_economies:
      score: 4
      note: 'The dominant Power: a self-reinforcing community/UGC graph — more users and subreddits make the content more
        useful, which draws more users; decades of accumulated discussion are hard to replicate.'
    counter_positioning:
      score: 1
      note: Pseudonymous, community-moderated, interest-graph format the incumbents don't replicate well, but not a true counter-position
        they can't follow.
    switching_costs:
      score: 2
      note: Karma, communities, and moderator investment create some stickiness for power users, but most traffic is casual/search-sourced
        with no lock-in.
    branding:
      score: 2
      note: A recognized, trusted 'ask Reddit / real-people answers' brand, but discovery is mediated by Google rather than
        direct, blunting the brand's pull.
    cornered_resource:
      score: 4
      note: A scarce, hard-to-replicate human-generated corpus — the live, opinionated discussion data AI labs pay to train
        on (Google/OpenAI deals); genuinely cornered while licensed exclusively.
    process_power:
      score: 1
      note: Emerging ad-tooling and AI features (Reddit Answers) lifting ARPU, but unproven as a durable, hard-to-copy process
        advantage.
  dominant_power: network_economies
  durability: medium
  rivals:
  - name: Meta (META)
    kind: public
    note: The ad-monetization benchmark — ARPU and ad-tech Reddit is measured against and far below; the under-monetization
      gap is the bull.
    growth: 0.22
    margin: 0.42
    multiple: ~22x EV/FCF
  - name: Pinterest (PINS)
    kind: public
    note: Closest comp — a mid-cap interest-graph ad platform, profitable, similar monetization-runway debate.
    growth: 0.16
    margin: 0.25
    multiple: ~18x EV/FCF
  - name: Snap (SNAP)
    kind: public
    note: A scaled social-ad platform that has struggled to monetize and grow profitably — the cautionary comp on the engine
      cooling.
    growth: 0.1
    margin: null
    multiple: ~3x EV/sales
  - name: Google / OpenAI
    kind: public
    note: 'Dual role: the data-licensing buyers paying for the corpus AND, via AI-search, the existential threat to Reddit''s
      referral traffic.'
    growth: null
    margin: null
    multiple: n/a (counterparties)
  threats:
  - vector: network_economies
    who: Google / OpenAI AI-search
    falsifier: Daily-unique growth turns negative as AI answer-boxes satisfy queries without sending traffic to Reddit — the
      graph stops compounding.
  - vector: cornered_resource
    who: AI labs / synthetic data / open scraping
    falsifier: Labs route around paid licensing (open crawls, synthetic data) and the data-licensing premium gets competed
      down toward zero.
  - vector: scale_economies
    who: Meta / Google ad-tech
    falsifier: ARPU gains stall well below peers as Reddit can't match the majors' targeting/ad-tech, capping the monetization
      runway.
  takeaway: 'Reddit''s network-economies Power is real — a self-reinforcing community/UGC graph and a scarce human-generated
    corpus (cornered_resource) that AI labs pay to train on. But the Audit''s tension is that the same corpus is discovered
    mostly through Google: ~40-50% of traffic is referral, so AI-search answer-boxes can disintermediate the front door even
    as the data itself gets more valuable (the Q4-2025 algorithm change already dented user growth). Durability is medium,
    not high — the graph compounds but its discovery layer is rented from a counterparty that is also a competitor. That squares
    with the DCF: a 91%-gross-margin, +62%-growth franchise priced at ~43x FCF lands the modal case at ~-23%, because the
    price embeds the bull''s monetization-plus-licensing inflection while carrying an existential, observable traffic risk
    the distribution puts real weight on.'
pocd:
  people:
    ceo: Steve Huffman
    founder_led: true
    tenure_years: 11
    insider_ownership_pct: 3.3
    capital_allocation: 'Co-founder Steve Huffman has been CEO since returning in 2015 (co-founded 2005); co-founder
      Alexis Ohanian left the board in 2020. The company turned GAAP-profitable in FY2025 (revenue ~$2.2B, +69%; net
      income ~$530M) and is net cash (~$2.8B, ~zero debt). Capital allocation is early: a first $1B buyback authorized
      February 2026 (barely begun), no dividend. AI data-licensing (Google ~$60M/year, OpenAI ~$70M/year) is a high-margin
      revenue stream — and a strategic dependence.'
    incentive_alignment: Huffman’s ~$193M 2023 equity award drew public backlash; it is price-hurdle-vesting ($45/$60/$90)
      through ~2028. His 2025 base is ~$569K with a 150%-of-salary target bonus. He owns only ~3% economically yet
      controls ~70.7% of the vote (his super-voting Class B plus an irrevocable proxy over Advance Publications’ shares)
      — a very wide vote/economics gap. Insider selling is small and programmatic (10b5-1).
    governance_flags:
    - 'three-class structure: Class B = 10 votes, Class C = no votes; the high-vote class held ~97% of the vote at
      IPO'
    - founder-CEO Huffman controls ~70.7% of the vote on ~3% direct economic ownership — via super-voting Class B
      plus an irrevocable proxy over Advance Publications’ shares
    - eligible NYSE “controlled company” (Huffman votes a majority) — but voluntarily complies with all independence
      requirements
    - 'mitigant: Chair and CEO are separated — independent Chair (Habiger) plus a Vice-Chair; 7 of 8 directors independent;
      annual elections'
    - the charter requires Advance’s (and, while he is CEO, Huffman’s) written approval to select any Chairperson
    - 'CEO pay: the ~$193M 2023 award drew backlash and is price-hurdle-vesting through ~2028'
    - business dependence on Google search referrals and AI data-licensing (Google / OpenAI)
    key_person_risk: high
    score: 2
    takeaway: 'The defining fact is control: founder-CEO Huffman directs ~70.7% of the vote — his super-voting class
      plus an irrevocable proxy over Advance’s shares — on roughly 3% economic ownership, and Reddit is a controlled
      company, which places it in the most-entrenched tier alongside the super-voting megacaps. The mitigants are
      real and more than most controlled companies offer: the Chair and CEO are separated under an independent chair,
      7 of 8 directors are independent, and the company complies with independence rules despite the exemptions —
      which is why it is a 2 with strong mitigants rather than a 1. Key-person risk is high.'

- label: Ultra Bear 16%
  body: Google/AI-search erodes traffic; the model de-rates; ~$41 (-75%).
- label: Bear 27%
  body: Growth decelerates under AI-search pressure; ~$70 (-57%).
- label: Base 32%
  body: Ad engine compounds, traffic holds, still priced in; ~$125 (-23%).

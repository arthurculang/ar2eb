central_question: Does Reddit's under-monetized ad engine plus a scarce AI-training corpus outgrow its ~43x FCF price, or
  does Google/AI-search erode the traffic it rests on?
thesis: 'Reddit trades at ~$30.2B (~$162, down ~28% YTD) — ~43x headline FCF on $2.20B revenue growing ~62% at ~91% gross
  margin, net cash, GAAP-profitable. The bull is a deeply under-monetized ad engine (ARPU far below Meta) plus high-margin
  data-licensing/AI deals (Google, OpenAI); the bear is existential — ~40-50% of traffic comes from Google, and AI-search
  answer-boxes can disintermediate that discovery (a Q4-2025 change already dented growth). On ex-SBC owner FCF, the modal
  case lands ~-23%: priced for perfection.'

appendix:
  pushback_side: bear
  pushback:
  - label: "Management's own warning is the bear case."
    body: "Q4 users could fall by a low double-digit percent; the base assumes a one-time step, and nothing yet shows the decline stopping."
  - label: Headline FCF overstates the cash.
    body: "FCF ran ~40% of revenue in 2026, but stock comp was 15.6% of FY25 revenue; the model charges it and holds 201.9M diluted shares."
  - label: "Licensing can cut both ways."
    body: "Google's ~$60M-a-year licence is due early 2027 and talks were strained in July; the same buyer's AI answers divert the traffic."
  - label: "Search was the front door."
    body: "Search also re-engages logged-in users, so the loss leaks into the base that earns 80% of revenue; Similarweb shows visits down 13% in a year."
  - label: "Cheap only if traffic stabilizes."
    body: "At ~17x FCF after stock comp the price fits the bear (~$82); value needs FY27 growth near 22%, not 12%."
  triggers:
  - label: Bull validation
    body: "Q4 daily uniques fall less than 10% and stabilize in H1 2027  ·  ARPU growth stays above +25%  ·  Google licence renewed at ≥$60M/yr"
  - label: Bear validation
    body: "DAUq below ~117M for two quarters  ·  US DAUq still falling year over year  ·  FY27 revenue growth guided below 15%"
  - label: Reframe needed
    body: "if logged-in users also shrink year over year, the decline has reached the paying base: treat the ultra-bear as the base"
glossary:
- term: Daily active uniques (DAUq)
  definition: "Unique logged-in + logged-out daily users (~130.3M, +12%; US -2%) — the traffic base; Google referral losses hit logged-out users first and hardest."
- term: ARPU
  definition: "Average revenue per unique (~$6.87, +36%) — still far below Meta; the gap is the monetization runway that must offset falling traffic."
- term: Data licensing
  definition: "Revenue from licensing Reddit's corpus for AI training (Google ~$60M/yr, due for renewal early 2027; OpenAI ~$70M/yr): scarce, high-margin, the wildcard."
- term: AI-search cannibalization
  definition: "AI answer-boxes (Google AI Overviews and AI Mode, ChatGPT) satisfying queries without a click to Reddit — the threat now visible in October's referral losses."
- term: FCF margin
  definition: "Free cash flow / revenue, modeled after stock comp (owner FCF, ~24% in FY26 vs ~40% headline); stock comp ran 15.6% of FY25 revenue."
competitive:
  arena: Digital advertising and the AI-training-data market — Reddit (the community/UGC discussion graph, ~130.3M daily uniques,
    under-monetized ad engine) vs Meta, Pinterest, Snap for ad dollars and the AI labs (Google, OpenAI) as data-licensing
    buyers; auditing a network-economies Power against AI-search disintermediation.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: "Some ad-infrastructure and content-moderation leverage at ~$3.4B revenue, but small vs Meta/Google; ad-tech scale is years away."
    network_economies:
      score: 4
      note: 'The dominant Power: a self-reinforcing community/UGC graph — more users and subreddits make the content more
        useful, which draws more users; decades of accumulated discussion are hard to replicate.'
    counter_positioning:
      score: 1
      note: Pseudonymous, community-moderated, interest-graph format the incumbents don't replicate well, but not a true counter-position
        they can't follow.
    switching_costs:
      score: 2
      note: Karma, communities, and moderator investment create some stickiness for power users, but most traffic is casual/search-sourced
        with no lock-in.
    branding:
      score: 2
      note: A recognized, trusted 'ask Reddit / real-people answers' brand, but discovery is mediated by Google rather than
        direct, blunting the brand's pull.
    cornered_resource:
      score: 4
      note: A scarce, hard-to-replicate human-generated corpus — the live, opinionated discussion data AI labs pay to train
        on (Google/OpenAI deals); genuinely cornered while licensed exclusively.
    process_power:
      score: 1
      note: Emerging ad-tooling and AI features (Reddit Answers) lifting ARPU, but unproven as a durable, hard-to-copy process
        advantage.
  dominant_power: network_economies
  durability: medium
  rivals:
  - name: Meta (META)
    kind: public
    note: The ad-monetization benchmark — ARPU and ad-tech Reddit is measured against and far below; the under-monetization
      gap is the bull.
    growth: 0.22
    margin: 0.42
    multiple: ~22x EV/FCF
  - name: Pinterest (PINS)
    kind: public
    note: Closest comp — a mid-cap interest-graph ad platform, profitable, similar monetization-runway debate.
    growth: 0.16
    margin: 0.25
    multiple: ~18x EV/FCF
  - name: Snap (SNAP)
    kind: public
    note: A scaled social-ad platform that has struggled to monetize and grow profitably — the cautionary comp on the engine
      cooling.
    growth: 0.1
    margin: null
    multiple: ~3x EV/sales
  - name: Google / OpenAI
    kind: public
    note: 'Dual role: the data-licensing buyers paying for the corpus AND, via AI-search, the existential threat to Reddit''s
      referral traffic.'
    growth: null
    margin: null
    multiple: n/a (counterparties)
  threats:
  - vector: network_economies
    who: Google / OpenAI AI-search
    falsifier: "Total DAUq stays below 117M (10% under Q3-2026's 130.3M) for two quarters in 2027, with US users still falling year over year."
  - vector: cornered_resource
    who: AI labs / synthetic data / open scraping
    falsifier: "Other revenue (mostly licensing) falls below $35M a quarter, or Google's licence lapses in 2027 with no ~$60M/yr replacement."
  - vector: scale_economies
    who: Meta / Google ad-tech
    falsifier: "ARPU growth slows below +15% year over year for two quarters by end-2027 (Q3 2026: +36%), well short of peers."
  takeaway: "Reddit's network-economies Power is real — a self-reinforcing community/UGC graph and a scarce human-generated corpus (cornered_resource) that AI labs pay to train on. But the Audit's tension is that the same corpus is discovered mostly through Google, and that front door is now narrowing: referrals fell over 1M a week in October and management warned Q4 users could fall by a low double-digit percent. Durability is medium, not high — the graph compounds but its discovery layer is rented from a counterparty that is also a competitor. That squares with the DCF: at ~17x FCF after stock comp the price sits on the bear (-4%), so the step-down base lands ~+56% and the weighted value ~+38%, with half the probability at or below spot."
pocd:
  people:
    ceo: Steve Huffman
    founder_led: true
    tenure_years: 11
    insider_ownership_pct: 3.3
    capital_allocation: "Co-founder Steve Huffman has been CEO since returning in 2015 (co-founded 2005); co-founder Alexis Ohanian left the board in 2020. The company turned GAAP-profitable in FY2025 (revenue ~$2.2B, +69%; net income ~$530M) and holds $3.0B of net cash (September 2026, no debt). A first $1B buyback (February 2026) had used ~$340M by September; no dividend. AI data-licensing (Google ~$60M/year, OpenAI ~$70M/year) is a high-margin revenue stream — and a strategic dependence."
    incentive_alignment: Huffman’s ~$193M 2023 equity award drew public backlash; it is price-hurdle-vesting ($45/$60/$90)
      through ~2028. His 2025 base is ~$569K with a 150%-of-salary target bonus. He owns only ~3% economically yet
      controls ~70.7% of the vote (his super-voting Class B plus an irrevocable proxy over Advance Publications’ shares)
      — a very wide vote/economics gap. Insider selling is small and programmatic (10b5-1).
    governance_flags:
    - 'three-class structure: Class B = 10 votes, Class C = no votes; the high-vote class held ~97% of the vote at
      IPO'
    - founder-CEO Huffman controls ~70.7% of the vote on ~3% direct economic ownership — via super-voting Class B
      plus an irrevocable proxy over Advance Publications’ shares
    - eligible NYSE “controlled company” (Huffman votes a majority) — but voluntarily complies with all independence
      requirements
    - 'mitigant: Chair and CEO are separated — independent Chair (Habiger) plus a Vice-Chair; 7 of 8 directors independent;
      annual elections'
    - the charter requires Advance’s (and, while he is CEO, Huffman’s) written approval to select any Chairperson
    - 'CEO pay: the ~$193M 2023 award drew backlash and is price-hurdle-vesting through ~2028'
    - business dependence on Google search referrals and AI data-licensing (Google / OpenAI)
    key_person_risk: high
    score: 2
    takeaway: 'The defining fact is control: founder-CEO Huffman directs ~70.7% of the vote — his super-voting class
      plus an irrevocable proxy over Advance’s shares — on roughly 3% economic ownership, and Reddit is a controlled
      company, which places it in the most-entrenched tier alongside the super-voting megacaps. The mitigants are
      real and more than most controlled companies offer: the Chair and CEO are separated under an independent chair,
      7 of 8 directors are independent, and the company complies with independence rules despite the exemptions —
      which is why it is a 2 with strong mitigants rather than a 1. Key-person risk is high.'
  opportunity_ref: The scenario distribution · the business snapshot · the Arthur Indicator
  context_ref: The 7 Powers analysis (Power Audit)
  deal: Open-market common — entry price weighed against the probability-weighted fair value + position sizing.

appendix:
  pushback:
  - label: The de-rate met a proven inflection, not a story.
    body: GAAP op margin went -7% -> 0.3% -> 4.7% and adj EBITDA doubled FY25 - the leverage is real, so the ~40% drop re-priced
      a real business.
  - label: Payments is ~80% of revenue, so FCF margin reads low.
    body: On TOTAL payments-heavy revenue FCF margin looks ~6-11%; read ex-SBC owner FCF on recurring gross profit - the take
      rate is the real lever.
  - label: The take rate is the whole question.
    body: Payments competition (Block/Square, Clover, Shift4) is the live threat to the ~80% fintech book; attach lifts take
      rate as Toast scales.
  - label: Location runway is long but the easy share thins.
    body: 171k of 875k+ US restaurants leaves a long runway, but US SMB adds get harder; enterprise/international is the next
      leg the bull needs.
  - label: Net cash, p_fail ~0.
    body: $1.35B cash, no debt, GAAP-profitable (net income $342M FY25) - no solvency risk; the downside is take-rate/multiple,
      not survival.
  triggers:
  - label: Bull validation
    body: location adds hold ~20% (enterprise/international ramping)  ·  payments take rate stable-to-up as attach scales
      (Capital, marketing, ToastIQ)  ·  GAAP op margin sustains the inflection toward the teens  ·  ARR growth stays >=20%
  - label: Bear validation
    body: location adds decelerate below ~10%  ·  payments take rate compresses as Block/Clover/Shift4 undercut  ·  GAAP op
      margin stalls or reverses  ·  SMB churn rises through a restaurant-spending downturn
  - label: Reframe needed
    body: if the take rate compresses structurally or location growth falls below ~10% without enterprise/international offsetting,
      the runway shortens - re-rate the terminal toward a low-growth, price-competed payments processor multiple
glossary:
- term: GPV
  definition: Gross Payment Volume - total payments processed across Toast restaurants (~$51.3B/quarter, +22%); the base the
    payments take rate is applied to, and the swing-factor's denominator.
- term: Take rate
  definition: Fintech (payments) revenue as a fraction of GPV; ~80%+ of total revenue rides on it, so its durability against
    Block/Square/Clover competition is the central question.
- term: ARR
  definition: Annualized recurring revenue (~$2.2B, +26%) - the SaaS subscription book (81% gross margin); the higher-margin
    leg whose mix-up is the margin-inflection lever.
- term: Attach
  definition: Add-on products beyond core POS/payments - Toast Capital (lending), marketing/ads, ToastIQ - that lift ARPU
    and the effective take rate per location.
- term: FCF margin
  definition: Free cash flow / revenue; modeled on TOTAL payments-heavy revenue so it reads ~6-11% - read ex-SBC owner FCF
    on recurring gross profit net of ~11% SBC dilution; the mature-DCF swing factor.
competitive:
  arena: Restaurant commerce platforms (POS + payments + software) - Toast (171k live locations, $51B+ GPV, vertically-integrated
    hardware/SaaS/payments) vs Block/Square, Fiserv (Clover), Shift4, Olo, plus legacy POS (NCR/Aloha, Lightspeed); auditing
    an embedded switching-cost Power against payments take-rate competition.
  lens: power_audit
  powers:
    scale_economies:
      score: 3
      note: 'Real and growing: $51B+ GPV and 171k locations give payments/sourcing/R&D leverage that funded the margin inflection,
        but Block/Fiserv process far more volume overall.'
    network_economies:
      score: 1
      note: Nascent - data/ToastIQ across the restaurant base and supplier/marketplace links could compound, but it is early
        and not yet a durable network effect.
    counter_positioning:
      score: 2
      note: The vertically-integrated restaurant-specific stack (hardware + SaaS + payments) is awkward for horizontal processors
        (Block) and pure-SaaS (Olo) to copy without cannibalizing their model.
    switching_costs:
      score: 4
      note: 'The dominant Power: once Toast is the restaurant''s POS, payments, payroll, online-ordering and capital operating
        system, ripping it out mid-service is costly and risky - high retention, the moat the take rate rides on.'
    branding:
      score: 2
      note: A strong restaurant-category brand and reference base, but brand alone doesn't set the payments take rate.
    cornered_resource:
      score: 1
      note: The installed base and restaurant operating data are valuable, but not a truly cornered resource.
    process_power:
      score: 2
      note: Demonstrated operating-leverage execution (-7% -> 21% GAAP op margin, adj EBITDA doubled) and product velocity
        (Capital, marketing, ToastIQ); improving, not yet a structural process moat.
  dominant_power: switching_costs
  durability: high
  rivals:
  - name: Block / Square
    kind: public
    note: Horizontal payments + Square for Restaurants; the primary payments take-rate competitor and pricing pressure.
    growth: 0.1
    margin: 0.1
    multiple: ~3x EV/sales
  - name: Fiserv (Clover)
    kind: public
    note: Scaled processor with a fast-growing restaurant/SMB POS; the volume-and-distribution threat to the take rate.
    growth: 0.07
    margin: 0.3
    multiple: ~14x P/E
  - name: Olo
    kind: public
    note: Restaurant ordering/digital SaaS; an attach/adjacency competitor and partner, asset-light vs Toast's payments model.
    growth: 0.18
    margin: 0.1
    multiple: ~5x EV/sales
  - name: Shift4
    kind: public
    note: Payments-led restaurant/hospitality processor; a direct take-rate rival expanding in the vertical.
    growth: 0.25
    margin: 0.2
    multiple: ~18x P/E
  threats:
  - vector: switching_costs
    who: Block/Square, Clover, Shift4 underpricing payments
    falsifier: Payments take rate on GPV compresses as competitors undercut, eroding the ~80% fintech book even with retention
      holding.
  - vector: scale_economies
    who: Fiserv/Block volume + distribution
    falsifier: Location adds decelerate below ~10% as scaled processors win SMB share through bundling and price.
  - vector: network_economies
    who: Olo / data-platform entrants
    falsifier: ToastIQ/data and the attach flywheel fail to compound, leaving Toast a price-competed processor rather than
      an operating system.
  takeaway: 'Toast''s switching-cost Power is genuine and dominant - once it is the restaurant''s POS, payments, payroll and
    ordering operating system, ripping it out mid-service is costly, which underpins high retention and the take rate the
    model rides on, supported by real scale (171k locations, $51B+ GPV). The Audit: switching_costs is durable (high), scale_economies
    funded a demonstrated margin inflection (-7% -> 21% GAAP op margin), and a network/data leg (ToastIQ) is nascent; the
    live threat is payments take-rate competition from Block/Square, Clover and Shift4 against an ~80%-payments revenue base.
    The ~40% TTM de-rate met that proven inflection, and the modal DCF lands +24% - the distribution says the sell-off overshot
    a real operating-leverage story, gated on the take rate holding as Toast scales.'

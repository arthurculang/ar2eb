central_question: Did Toast's ~40% de-rate near the lows misprice a proven operating-leverage inflection — or is it priced
  for location growth and a payments take-rate that competition compresses?
thesis: Toast trades at ~$14.4B (~$24.82, down ~40% TTM, near the 52-week low) — ~2.1x EV/sales on $6.15B revenue growing
  ~23%, net cash, with a proven margin inflection (GAAP op margin -7% -> 0.3% -> 4.7%, and 21% last quarter). The bull is
  durable ~20% location growth (171k of 875k+ US restaurants) plus attach (Capital, marketing) lifting ARPU and take rate;
  the bear is payments take-rate compression and SMB cyclicality against Block/Square, Olo and Shift4. The modal case lands
  +24%, so the de-rate looks like it overshot a real inflection.

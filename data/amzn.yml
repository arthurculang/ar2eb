central_question: Does Amazon's ~$200B/yr AI-infrastructure capex earn its cost of capital as AWS reaccelerates — or compress
  returns into an overbuild before FCF recovers off the FY25 trough?
thesis: 'Amazon trades at ~$2.56T (~$238.55, +14% TTM, down ~10% in 30 days on capex fear) - but the FCF multiple is distorted:
  FY25 free cash flow was crushed to ~$7.7B (from ~$33B in FY24) by a ~$200B AI-data-center build. The DCF models FCF margin
  recovering off that trough as AWS reaccelerates (+28%) and retail/ads margins expand. The finding is roughly fair (-6.9%):
  the modal base ~-12% as depreciation lags monetization, a wide spread either way.'

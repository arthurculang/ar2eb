appendix:
  pushback:
  - label: The FCF multiple is distorted by the capex trough.
    body: FY25 FCF was crushed to ~$7.7B (from ~$33B in FY24) by the ~$200B build; the DCF prices the recovery off the trough,
      not the depressed print - that's why the multiple looks extreme.
  - label: AWS reaccelerating is the whole bull.
    body: AWS +28% (fastest in 15 quarters) at ~$150B run-rate and ~37.7% margin, with triple-digit AI revenue growth - the
      question is whether that demand justifies the depreciation.
  - label: Trainium is the margin defense.
    body: Custom silicon (Trainium/Graviton/Nitro) is >$20B run-rate with ~$225B commitments and Trainium2 sold out - vertical
      integration lowers AI cost and defends AWS margins as the build scales.
  - label: Advertising is a high-margin third engine.
    body: ~$70B annualized and growing fast, structurally high-margin - it scales operating income independent of the AWS
      capex cycle.
  - label: The swing is AWS AI ROIC, not solvency.
    body: ~$54B net cash and a record 11.2% op margin mean no balance-sheet risk; the downside is whether ~$200B/yr of capex
      earns its cost of capital, not survival.
  triggers:
  - label: Bull validation
    body: AWS growth holds high-20s% with expanding margin  ·  FCF margin recovers off the ~1% trough toward 10%+  ·  Trainium
      commitments convert to revenue  ·  advertising sustains 20%+ growth
  - label: Bear validation
    body: AWS growth decelerates back toward the teens  ·  capex keeps rising while FCF stays trough-bound  ·  depreciation
      compresses AWS margin below ~35%  ·  adverse FTC/EU cloud ruling
  - label: Reframe needed
    body: if AWS AI demand cools or commoditizes and the ~$200B build becomes a visible overbuild (FCF fails to recover 2+
      years), re-rate the terminal toward a low-ROIC capital-heavy multiple
glossary:
- term: AWS
  definition: Amazon Web Services - the cloud-infrastructure segment (~$150B run-rate, ~38% operating margin, ~16-17% of revenue
    but the majority of operating income); reaccelerated to +28% on AI demand, the central swing.
- term: Capex / AI infrastructure
  definition: Capital expenditure on AI data centers and chips (~$200B guided FY26, ~+50% YoY); the cash drag that crushed
    FY25 FCF, with a 6-24 month lag to monetization - the bear's mechanism.
- term: Trainium
  definition: Amazon's custom AI training silicon (with Graviton/Nitro, >$20B run-rate, ~$225B commitments, Trainium2 sold
    out); vertical integration that lowers AI cost and defends AWS margins.
- term: AI ROIC
  definition: Whether the ~$200B/yr AI-infrastructure build earns its cost of capital; the biggest 5-year swing factor.
- term: FCF margin
  definition: Free cash flow / revenue (~1% in FY25 at the capex trough vs ~5% in FY24); the bet is recovery off the trough.
competitive:
  arena: Cloud infrastructure + e-commerce/advertising - Amazon (AWS cloud leader, the largest US marketplace, fast-growing
    ad business) vs Microsoft Azure, Google Cloud, and retail rivals Walmart/Shopify; auditing scale, switching, and network
    Powers against a ~$200B AI capex bet and an FTC trial.
  lens: power_audit
  powers:
    scale_economies:
      score: 4
      note: 'Strong: AWS infrastructure scale + Trainium vertical integration lower unit cost; fulfillment/logistics scale
        across the largest US marketplace - a genuine, compounding cost advantage.'
    network_economies:
      score: 3
      note: The marketplace two-sided network (more buyers -> more sellers -> more selection) is real and self-reinforcing,
        though weaker than a pure social network and contestable by Walmart/Shopify.
    counter_positioning:
      score: 1
      note: Was the e-commerce disruptor; now the incumbent - little counter-positioning left, and AWS faces well-capitalized
        Azure/GCP, not a slow legacy.
    switching_costs:
      score: 4
      note: 'High in AWS: embedded workloads, data gravity, committed-spend contracts, and re-architecture cost make migration
        painful - the stickiest Power, the AWS retention moat.'
    branding:
      score: 2
      note: Trust/convenience (Prime) is a real consumer asset, but cloud is bought on price/performance, not brand; modest
        as a pricing Power.
    cornered_resource:
      score: 2
      note: Custom silicon (Trainium) + Prime membership + first-party logistics are valuable and hard to copy, but not uniquely
        cornered against Azure/GCP/Walmart.
    process_power:
      score: 3
      note: Decades of logistics/operations and cloud-operations learning curves (fulfillment, AWS reliability, custom hardware)
        are a real, hard-to-replicate process advantage.
  dominant_power: switching_costs
  durability: high
  rivals:
  - name: Microsoft (Azure)
    kind: public
    note: 'The #1 cloud rival; Azure + OpenAI is the AWS AI-compute benchmark and the main switching-cost threat.'
    growth: 0.16
    margin: 0.45
    multiple: ~35x EV/FCF
  - name: Alphabet (Google Cloud)
    kind: public
    note: '#3 cloud growing fast with a full AI stack/TPUs; pressures AWS growth and margins on AI workloads.'
    growth: 0.13
    margin: 0.32
    multiple: ~25x EV/FCF
  - name: Walmart
    kind: public
    note: Largest US retailer; scaled e-commerce + advertising + marketplace - the network/scale challenger on the retail
      side.
    growth: 0.05
    margin: 0.04
    multiple: ~35x P/E
  - name: Shopify
    kind: private
    note: Arms the long tail of independent merchants against the Amazon marketplace; the network-economies pressure on retail.
    growth: 0.25
    margin: 0.12
    multiple: ~60x EV/FCF
  threats:
  - vector: switching_costs
    who: Microsoft Azure / Google Cloud (AI workloads)
    falsifier: AWS growth decelerates back toward the teens as AI workloads shift to Azure/GCP, signaling the migration cost
      is being overcome.
  - vector: network_economies
    who: Walmart + Shopify (marketplace)
    falsifier: US marketplace/seller share erodes as Walmart's network and Shopify's merchant base take third-party GMV.
  - vector: scale_economies
    who: AI capex overbuild / FTC antitrust
    falsifier: FCF fails to recover off the trough for 2+ years, or the Oct-2026 FTC Buy-Box trial forces structural marketplace
      changes that dent unit economics.
  takeaway: 'Amazon''s Powers are genuine and durable: AWS switching costs (data gravity, committed spend) are the stickiest,
    layered on scale (AWS infrastructure + Trainium, fulfillment) and a self-reinforcing marketplace network. The Audit: switching_costs
    is the dominant, high-durability Power - hard for Azure/GCP to dislodge - but the live threat is the ~$200B AI-capex bet
    and whether AWS AI demand earns its cost of capital before rivals erode growth. That squares with the DCF: the franchise
    isn''t in question, the return on the build is, and the modal case lands ~-12% (roughly fair) because spot already assumes
    the capex monetizes and FCF normalizes off the FY25 trough.'
pocd:
  people:
    ceo: 'Andy Jassy'
    founder_led: false
    tenure_years: 5
    insider_ownership_pct: 9.0
    capital_allocation: 'No dividend ever paid; the sole return program is a $10B buyback authorization (March
      2022, no expiration) that has gone largely unused — ~$6.1B still remaining in 2025, no repurchases in the
      quarters ended March 2024 or 2025. Cash is reinvested instead: FY2025 capex $128.3B (vs $77.7B FY2024, the
      step driven by AI/AWS infrastructure), ~$200B guided for FY2026; D&A $41.9B FY2025. SBC $19.5B FY2025
      (down ~12% YoY). M&A: MGM ($8.5B, closed Mar 2022), One Medical ($3.9B, closed Feb 2023); the iRobot deal
      was terminated Jan 2024 ($94M break fee paid).'
    incentive_alignment: 'No new annual equity grant — no RSU award since 2021. Pay rests on a single 10-year
      grant made when he became CEO in 2021 (originally valued ~$212M), vesting through 2031 on a fixed schedule
      regardless of stock performance. FY2024 realized comp ~$40.1M (that grant vesting plus stock appreciation);
      the FY2025 Summary Comp Table figure was ~$2.1M (base ~$365K plus security/travel) since no new award was
      made. Heavily equity-front-loaded, time-based.'
    governance_flags:
      - 'single-class common stock (one share, one vote) — no dual-class / super-voting, a structural positive vs the dual-class mega-cap peers'
      - 'founder Jeff Bezos is Executive Chair (stepped down as CEO July 2021); Chair and CEO roles are split'
      - 'Bezos beneficially owns ~9% — fell below 10% for the first time in 2025 via scheduled sales'
      - 'Jamie Gorelick is lead independent director; majority-independent board'
    key_person_risk: medium
    score: 4
    takeaway: 'Andy Jassy has been CEO since July 2021 and founder Jeff Bezos is Executive Chair holding ~9%, on
      a clean single-class one-share-one-vote register with a split Chair/CEO structure and a lead independent
      director; capital is directed to reinvestment (FY2025 capex $128.3B, ~$200B guided 2026) over capital
      return — no dividend and a largely-unused buyback.'
  opportunity_ref: 'The scenario distribution · the Page-3 business snapshot · the Arthur Indicator'
  context_ref: 'The 7 Powers analysis (Power Audit)'
  deal: 'Open-market purchase = the deal: entry price vs. the scenario distribution (the -6.9% finding) + position sizing.'

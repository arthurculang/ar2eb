central_question: Is Clear Secure a maturing airport-lane subscription decelerating to terminal growth, or a horizontal identity-verification
  network expanding past the airport?
thesis: 'Clear Secure trades at ~$4.77B (~$50.25, up ~55% YTD / ~41% TTM) — about 13x EV/FCF on $0.901B revenue growing ~20%,
  with a deferred-revenue membership model that throws off a ~30% FCF margin, net cash ~$0.80B and no debt; capital return
  is aggressive. The fork the DCF resolves: airport CLEAR Plus saturating against a US frequent-flyer ceiling (with TSA''s
  own free touchless ID commoditizing the lane) versus the identity platform — TSA PreCheck enrollment, biometric eGates,
  enterprise verification — extending the network. The modal case lands ~+40%, so the distribution leans to cheap quality.'

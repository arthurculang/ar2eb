    headline: Factory economics work; ~7 GW AI-power.
    narrative:
    - 'The bull: Aurora''s factory-built economics prove out (capex per GW falls with cadence), NRC licensing clears, and
      Oklo converts a real slice of its pipeline — ~7 GW deployed by 2034, powering AI data centers under long-dated PPAs
      at scale, with fuel-recycling and radioisotope verticals adding optionality. Revenue compounds toward ~$4.8B at a ~58%
      operating margin.'
    - Heavy but value-accretive raises fund the buildout; the business self-funds late. DCF ~$37/share — and still ~45% below
      spot. The bull case is genuinely good and still doesn't reach today's price on a 10-year fundamental basis; you must
      extend the horizon or believe a richer terminal.
    probability_rationale: 'A chain: Aurora works AND factory-cost economics materialize AND NRC clears AND the pipeline converts
      to binding PPAs at scale. Each plausible at 50-70%; jointly ~23%. A real, fundable trajectory — Oklo has the cash, the

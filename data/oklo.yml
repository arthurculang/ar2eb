central_question: Does ~$12B on zero revenue price a realistic path to a build-own-operate nuclear prime — or an AI-baseload-power
  outcome a decade of fundamentals can't reach?
thesis: 'Oklo trades at ~$12B on $0 revenue, against $2.54B cash and a ~14 GW (mostly non-binding) pipeline — a build-own-operate
  nuclear IPP (Aurora fast reactors sold as power; first power 2027-28; the only commercial advanced-fission site under construction).
  The DCF asks what deployed-GW scale, IPP margins, and — in the ultra-bull — a HALEU fuel-monopoly second act are plausible
  over a decade. The finding: base (~3 GW) and bull (~7 GW) sit below spot; only the ~8% ultra-bull (13 GW + fuel monopoly,
  +184%) clears it — the capital-intensive base leaves the weighted ~-53%.'

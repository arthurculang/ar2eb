    headline: First power ~2028; ~3 GW IPP fleet.
    narrative:
    - 'The modal path: Aurora reaches first power on roughly the targeted timeline (~2028), and Oklo scales the build-own-operate
      model to a ~3 GW operating fleet by 2034, selling baseload power to data centers at ~$75-90/MWh and ~50% mature operating
      margins — genuine IPP economics. FY30 revenue ~$0.42B sits near the (thin) analyst consensus, compounding as reactors

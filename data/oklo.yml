  bear:
    label: Bear
    short_label: Bear
    probability: 0.25
    expected_per_share: 9.66
    headline: Aurora slips; ~1 GW niche, capped.
    narrative:
    - Aurora certifies and powers up, but late (first power ~2029) and at low cadence; Oklo becomes a credible niche advanced-nuclear
      operator — ~1 GW deployed by the mid-2030s, real PPA revenue (~$0.8B by FY35) at solid IPP margins — but never converts
      the headline pipeline. FOAK costs run high and the factory-cost thesis only partly materializes.
    - Modest dilution funds the slow buildout. The DCF lands ~$10/share — the market is pricing a far larger, faster fleet.
      This is the 'real company, wrong price' world.
    probability_rationale: Aurora works but underwhelms on cadence and cost; the ~14 GW pipeline converts only fractionally
      as binding PPAs prove hard to land. 18% failure probability — lower than a pure science-project given $2.54B cash, DOE
      support, and a site under construction, but FOAK nuclear execution risk is real. 25% weight as a very plausible 'competent
      but capped' outcome.

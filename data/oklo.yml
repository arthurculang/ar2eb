    body: DOE site-use permit + Aurora-INL groundbreaking (Sep 2025) — a structural first-mover lead on physical deployment,
      not just paper.
  - label: Build-own-operate captures more value.
    body: Selling power via PPAs, not reactors — recurring, higher-lifetime-value revenue vs equipment-sale SMR peers.
  - label: Vertical integration is a hedge.
    body: Fuel recycling + Atomic Alchemy radioisotopes add non-power revenue and a HALEU-supply hedge against the sector's
      fuel bottleneck.
  - label: The demand pull is structural.
    body: AI data-center power demand (33→176 GW US by 2035) plus the 400 GW US nuclear goal — the pull is real even if today's
      pipeline is non-binding.
  triggers:
  - label: Bull validation
    body: Aurora-INL first power on schedule (2027-28)  ·  first binding PPA (pipeline → contracted)  ·  factory capex tracking
      < $2.5B/GW
  - label: Bear validation
    body: first power slips beyond 2029  ·  COLA stalls at NRC  ·  pipeline stays non-binding / churns
  - label: Reframe needed
    body: if factory-built capex approaches $1B/GW at cadence, the bull deployment ceiling lifts materially — revisit tam_share
      and the terminal
glossary:
- term: Aurora Powerhouse
  definition: Oklo's sodium-cooled fast microreactor (15→50→75 MWe), metallic HALEU fuel, modeled on EBR-II; sold as power,
    not hardware.
- term: Build-own-operate (IPP)
  definition: Oklo owns and runs the reactors and sells electricity via long-dated PPAs — an independent-power-producer model
    with recurring revenue.
- term: HALEU
  definition: High-Assay Low-Enriched Uranium (5-20% U-235), the fuel advanced reactors need; supply is scarce — a sector-wide
    constraint.
- term: COLA / NRC
  definition: Combined Operating License Application to the Nuclear Regulatory Commission; Oklo's 2022 COLA was denied without
    prejudice — the regulatory falsifier.
- term: Sales-to-capital (s2c)
  definition: Damodaran reinvestment efficiency — incremental revenue per dollar of reinvested capital; low for capital-intensive
    nuclear (here ~0.2-0.6, implying ~$1.2-3B/GW capex).
competitive:
  arena: Advanced-fission power for AI data centers — Oklo (Aurora fast reactor, build-own-operate IPP, fuel recycling) vs
    NuScale, X-energy, Kairos, TerraPower, GE-Hitachi BWRX-300, Westinghouse eVinci; the race to originate the build-own-operate
    AI-baseload-nuclear position.
  lens: power_origination
  powers:
    scale_economies:
      score: 1
      note: Factory-built microreactors could reset capex/GW with cadence, but Aurora is pre-commercial — the learning curve
        is unbuilt.
    network_economies:
      score: 1
      note: A fleet/grid + fuel-recycling flywheel is a future moat, not yet originated.
    counter_positioning:
      score: 2
      note: Build-own-operate (sell power, not reactors) + vertical fuel integration is hard for equipment-sale SMR peers
        to replicate without becoming IPPs themselves.
    switching_costs:
      score: 2
      note: 20-40yr PPAs and co-located behind-the-meter reactors embed deeply once contracted (Equinix prepay a signal) —
        but most commitments are non-binding today.
    branding:
      score: 2
      note: A leading advanced-nuclear brand (Altman halo, DOE selection); strong but unproven on delivery.
    cornered_resource:
      score: 2
      note: DOE site-use permit + INL site under construction + awarded fuel + Atomic Alchemy isotopes + DeWitte-led fast-reactor
        IP — a genuine first-mover physical lead. In the ultra-bull this extends to a HALEU fuel-recycling monopoly — the
        Power-gated second act.
    process_power:
      score: 1
      note: No operating reactor yet; the EBR-II heritage is design pedigree, not demonstrated process power.
  dominant_power: cornered_resource
  window: open
  rivals:
  - name: NuScale
    kind: public
    note: Only NRC-approved SMR design (LWR, 77 MWe VOYGR); deploys ~2030; TVA + Romania (RoPower).
    share_now: 0.0
    share_terminal: 0.2
    capital: public; Fluor / ENTRA1
  - name: X-energy
    kind: private
    note: HTGR 80 MWe TRISO pebble; Amazon 5+ GW by 2039; reactor early-2030s.
    share_now: 0.0
    share_terminal: 0.18
    capital: $985M+; Amazon, DOE
  - name: Kairos Power
    kind: private
    note: Fluoride-salt KP-FHR; Hermes test reactor ~2027 (nearest demo); Google 500 MW.
    share_now: 0.0
    share_terminal: 0.12
    capital: DOE $303M; Google
  - name: TerraPower (Natrium)
    kind: private
    note: Sodium fast + molten-salt storage, 345 MWe; ops ~2030+; HALEU-delayed.
    share_now: 0.0
    share_terminal: 0.12
    capital: '>$3.4B; Gates, Nvidia, DOE'
  - name: GE-Hitachi BWRX-300
    kind: incumbent-division
    note: BWR 300 MWe; OPG first unit ~2030; TVA Clinch River.
    share_now: 0.0
    share_terminal: 0.15
    capital: GE Vernova / Hitachi
  lead_lag:
  - metric: Commercial site under construction
    company: Aurora-INL (ground broken 2025)
    best_rival: none commercial
    verdict: leading
  - metric: NRC design / license status
    company: COLA pending (denied 2022)
    best_rival: NuScale design-approved
    verdict: lagging
  - metric: Operating reactor / demo
    company: none (first power 2027-28)
    best_rival: Kairos Hermes ~2027
    verdict: roughly level
  takeaway: Oklo is originating a genuine build-own-operate AI-baseload-nuclear position — the only commercial advanced-fission
    site under construction, a model that captures more value than equipment-sale SMR peers, $2.54B to fund it, and the structural
    AI-power demand pull. But it lags NuScale on design approval, has no operating reactor, was denied once by the NRC, and
    its ~14 GW pipeline is overwhelmingly non-binding; first-of-a-kind execution and HALEU-fuel supply are the falsifiers
    the whole bull case must clear.

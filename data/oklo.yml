  ultra_bear:
    label: Ultra Bear
    short_label: UltBear
    probability: 0.1
    expected_per_share: 6.4
    headline: Aurora fails; NRC/FOAK setback; cash shell.
    narrative:
    - First-of-a-kind execution defeats Oklo — a sodium fast-reactor technical setback, a second NRC denial (the 2022 COLA
      was denied without prejudice), or a HALEU-fuel shortfall (the same constraint that slipped TerraPower) pushes Aurora
      past 2030 or off the table. The build-own-operate model never reaches commercial power; Oklo subsists as a radioisotope
      (Atomic Alchemy) and services shell.
    - The $2.54B cash is the floor — but dilutive flailing raises and a decade of opex erode it, and a 38% within-scenario
      probability of restructuring pulls the expected toward the distress floor. Revenue stalls near $0.1B; the equity is
      worth a fraction of today's ~$12B.
    probability_rationale: 'The compound bear: a fast-reactor FOAK failure or regulatory re-denial, plus HALEU-fuel scarcity.
      Advanced fission has never been commercialized on this build-own-operate model, and the prior 2022 NRC denial is a real
      datapoint. 38% within-scenario failure reflects that Oklo, though cash-rich and debt-free, is pre-revenue and dependent
      on never-built technology.'

  base:
    label: Base
    short_label: Base
    probability: 0.50
    expected_per_share: 3.03
    headline: "Commercial scale works at limited share."
    narrative:
      - >
        The Aurora Driver works at commercial scale. By FY28 the company
        operates 1,000–2,000 driverless trucks on commercial highways.
        McLane (Berkshire) expands beyond Texas. FedEx, Schneider, Werner
        pilots convert to multi-year volume commitments. Hirschbach's
        500-truck order ships through 2027–28.
      - >
        But the market splinters. Kodiak owns industrial off-highway. Waabi
        grows through the Volvo OEM channel. PlusAI lands legacy retrofits.
        Aurora becomes one of 2–3 'winners' in US for-hire long-haul,
        capturing ~7.5% of the $160B TAM by FY36 — $12B revenue. Mature
        margin settles around 20% — a blend of software-licensing and
        own-fleet operations.
      - >
        The math: $8.3B operating EV + $1.3B cash, divided by 2.48B FY36
        fully-diluted shares (27% dilution). Apply 25% failure haircut.
        Expected per-share $3.03 — materially below today's $7.74. The model
        says the current price requires bull-case assumptions to hold; the
        base case implies meaningful downside.
    probability_rationale: >
      Modal outcome. Aurora launches commercial Driverless service on
      schedule (2027), proves cost-per-mile advantage on a single route
      (Dallas-Houston initially), expands to 2-3 routes by 2029, secures
      pilot partnerships with major carriers (Werner, Schneider, FedEx).
      Reaches ~7-8% share of $160B addressable autonomous trucking TAM by
      2036 — meaningful but not dominant. Mature operating margin lands at
      ~20% (tech-auto blend, well below software economics). The 50% weight
      reflects that this is the modal outcome — most realistic for a strong
      technical team executing on a long technical-commercial timeline, but
      not requiring breakthrough commercial dominance.


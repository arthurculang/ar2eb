  ultra_bull:
    label: Ultra Bull
    short_label: UltBull
    probability: 0.03
    expected_per_share: 100.00
    headline: "Dominant US; software-take-rate."
    narrative:
      - >
        The ultra-bull case is that Aurora becomes the dominant US autonomous
        trucking platform AND wins the software-take-rate game. Commercial
        launch on schedule by 2027 + Aurora Driver reaches 1M+ autonomous
        miles by 2028 + 25%+ TAM share by 2036 + software-take-rate model
        wins (Aurora monetizes via per-mile revenue share with PACCAR/Volvo/
        FedEx fleet partners rather than capex-heavy direct ownership). By
        FY36 Aurora generates $8B+ revenue at 40%+ software-like margins.
      - >
        Compound conditional: each piece individually plausible at 50-65%;
        joint at 3-4%. Reflected here at 3%. This is the scenario where
        Aurora joins the Tesla/Nvidia tier — not just 'autonomy works,' but
        'Aurora wins the autonomy market.' Contributes $3.00 to weighted
        ($100 × 3%) — the asymmetric tail.
    probability_rationale: >

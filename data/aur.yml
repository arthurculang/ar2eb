        The ultra-bull case is that Aurora becomes the dominant US autonomous
        trucking platform — the category's default Driver. Commercial launch
        on schedule by 2027 + Aurora Driver reaches 1M+ autonomous miles by
        2028 + by FY36 Aurora runs the dominant share of US autonomous
        long-haul, monetized through a hybrid of owned capacity in the densest
        lanes and per-mile take-rate elsewhere with PACCAR/Volvo/FedEx. As
        autonomy penetrates the full long-haul market, Aurora books ~$50B
        revenue at ~40% margins — well above the bull, as a dominant platform
        must be.
      - >
        Compound conditional: each piece individually plausible at 50-65%;
        joint at 3-4%. Reflected here at 3%. This is the scenario where
        Aurora joins the Tesla/Nvidia tier — not just 'autonomy works,' but
        'Aurora wins the autonomy market.' Contributes $2.10 to weighted
        (~$70 × 3%) — the asymmetric tail.
    probability_rationale: >
      Tail of tails: commercial launch on schedule (50%) AND Aurora becomes the
      dominant US autonomous long-haul platform — owned capacity in the densest
      lanes plus per-mile take-rate elsewhere, ~31% of the fully-penetrating TAM
      by 2036 (30% conditional on launch) AND the hybrid platform scales at ~40%
      margins (40%) AND multiple expansion to a platform premium (50%). Each
      individually plausible; joint at 3-4%. Captures the scenario where Aurora
      becomes a category-defining Big Tech-tier company.


# ── Ticker identity ─────────────────────────────────────────────────────────
ticker: AUR
company: Aurora Innovation
exchange: NASDAQ
dcf_type: young_company
date: '2026-08-22'
spot: 6.24
# ── Market data ─────────────────────────────────────────────────────────────
market:
  market_cap_billion: 10.68
  shares_outstanding_million: 1710        # 1.71B sh
  cash_billion: 1.28
  net_debt_billion: 0.0                   # ~$0 funded debt (Q1'26 10-Q); the $1B 0% convertible is Uber's exchangeable note, not Aurora's
  extras: []

# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Will Aurora capture meaningful share of a $160B US autonomous trucking TAM
  by 2036 — or is today's $13B market cap pricing certainty about driverless
  commercial economics that hasn't been proven?

thesis: >
  Aurora trades at ~$13.2B against $11M of Q1 2026 revenue and $640M
  annualized cash burn. The $1.28B liquidity position needs replenishment by
  mid-2027 absent commercial conversion. Driverless commercial launch slipped
  from 2024 to now 2027; the Driver runs supervised highway pilots with
  PACCAR, Volvo, FedEx. Young-company DCF below: TAM share, terminal margin,
  P(failure). Five scenarios, weighted; show your work.

# ── Page 3 chart-level reference data ───────────────────────────────────────
chart_reference:
  tam_billion: 160                        # US autonomous trucking TAM at FY36
  history_years: [2024, 2025, 2026]
  history_revenue: [0.069, 0.106, 0.044]  # $B actuals (Q1 2026 = $11M annualized)
  history_fleet: [6, 20, 50]              # cumulative trucks deployed

# ── Page 3 chart-aesthetic config (Phase 4: migrated out of JSX) ────────
page3_chart_config:
  peer_y: 20
  peer_text: "Mature tech-auto peer median ~20%"
  fleet_anchor: 50
  fleet_title: "Driverless trucks deployed (log)"
  fleet_reference:                            # horizontal reference: addressable fleet ceiling
    value: 750000
    label: "US Class 8 fleet ~750K"
  valn_anchor_y: 4
  valn_anchor_text: "Mature peer P/S ~3-5×"
  valn_caption: "Bear=stretched (6×), base=fair (1.3×), bull=cheap (0.5×)."
  tam_title: "$160B US autonomous trucking TAM (FY36) — AUR share"
  tam_legend: ["AUR", "Competitors", "Non-autonomous (legacy)"]


    headline: "Dominant US platform, software-like margins."
    narrative:
      - >
        Aurora becomes the dominant US autonomous trucking platform. FY27
        driverless commercial launch proceeds on schedule, unlocking
        follow-on orders from major carriers (Werner, Schneider, FedEx,
        Hirschbach). By FY28 fleet exceeds 5,000 trucks; by FY31, 50,000+.
        Network effects compound — lane data, edge cases, regulatory
        relationships in TX/OK/NM/AZ.
      - >
        The competitive set narrows. Kodiak stays viable but smaller. Waabi
        struggles. PlusAI runs out of SPAC capital. By FY32 only Aurora and
        one other player operate at-scale driverless commercial fleets.
        Aurora captures 22.5% of the $160B TAM — $36B FY36 revenue. Pivot to
        software-take-rate on OEM trucks (Volvo VNL, PACCAR). Mature margin
        reaches 35% — similar to Mobileye's ADAS economics.
      - >
        The math: $89.4B operating EV, $1.3B cash, 2.14B FY36 shares (10%
        dilution only). DCF $42.26 per share. With 12% failure probability,
        expected per-share $37.31. The bull case implies today's $7.74 is
        significantly undervaluing the trajectory — but only if you assign
        meaningful probability to the dominant-platform outcome.
    probability_rationale: >
      Compound bet: Driverless commercial launches on schedule AND scaled
      trucking fleet ramps to 5,000+ trucks by 2028 AND software-take-rate
      model emerges (Aurora-as-platform on partner-operated fleet) AND
      competitive narrowing (Kodiak underperforms, Waabi stays niche) AND
      autonomous trucking proves uniquely viable. Each condition
      independently plausible at 40-60% probability; conjunctive probability
      lands at 15%. The asymmetric venture-bet pattern characteristic of
      autonomous-platform investments — bull case pays multiples-of-current-
      valuation if it converges, but requires conditions to align over 5-10
      years.


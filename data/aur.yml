  # ───────────────────────────────────────────────────────────────────────────
  bear:
    label: Bear
    short_label: Bear
    probability: 0.20
    expected_per_share: 0.11
    headline: "Tech doesn't scale, capital exhausts."
    narrative:
      - >
        The pessimistic case is brutal. Highway autonomy is harder than demos
        suggest — five years of 'next year' promises (launch was 2025, then
        2026, now 2027), and the long tail of edge cases (night construction,
        weather, urban surface streets) proves more durable than current
        systems handle. Commercial routes stay limited to highway-only,
        daytime, sunbelt-only operation.
      - >
        Cash burn doesn't moderate. Q1 2026's $640M annualized outflow keeps
        rising. The $1.28B liquidity needs replenishment by mid-2027.
        Successive raises come at lower prices — cumulative ~74% dilution by
        FY36, issuance averaging below $3, destroying per-share value even
        when the business survives.
      - >
        By FY36 Aurora reaches just 1.5% of the US autonomous trucking TAM —
        $2.5B revenue, 8% margin. With 45% probability of bankruptcy and zero
        distress recovery, expected per-share is essentially zero. Aurora
        ends up the WeWork of autonomy — first mover, market-defining, but
        unable to convert that into durable economics.
    probability_rationale: >
      Bearish thesis is compound: tech doesn't scale from supervised highway
      pilots to driverless at necessary safety thresholds; capital exhausts
      before commercial validation; dilution at falling prices accelerates as
      capital needs persist; competitive losses to Kodiak (cargo-focused,
      well-funded) and Waabi (smaller but capital-efficient). Within-scenario
      45% p_fail captures Aurora-specific failure; the 35% scenario weight
      reflects category-level risk — autonomous trucking economics may not
      scale for Western operators. Waymo Via's 2023 shutdown was a credible
      signal of category difficulty. The 15% weight is slightly above JOBY's
      30% bear because AUR is earlier-stage (pre-commercial), more
      capital-dependent, and faces more direct competition.

    dcf_metrics:
      tam_share: 1.5
      p_fail: 45
      s2c: 1.2


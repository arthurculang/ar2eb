# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Will Aurora capture meaningful share of a $160B US autonomous trucking TAM
  by 2036 — or is today's $13B market cap pricing certainty about driverless
  commercial economics that hasn't been proven?

thesis: >
  Aurora trades at ~$13.2B against $11M of Q1 2026 revenue and $640M
  annualized cash burn. The $1.28B liquidity position needs replenishment by
  mid-2027 absent commercial conversion. Driverless commercial launch slipped
  from 2024 to now 2027; the Driver runs supervised highway pilots with
  PACCAR, Volvo, FedEx. Young-company DCF below: TAM share, terminal margin,
  P(failure). Three scenarios, weighted; show your work.

# ── Page 3 chart-level reference data ───────────────────────────────────────
chart_reference:
  tam_billion: 160                        # US autonomous trucking TAM at FY36
  history_years: [2024, 2025, 2026]
  history_revenue: [0.069, 0.106, 0.044]  # $B actuals (Q1 2026 = $11M annualized)
  history_fleet: [6, 20, 50]              # cumulative trucks deployed


    growth: 0.08
    margin: 0.06
    multiple: ~6-8% division margin
  - name: Honeywell Intelligrated
    kind: private
    note: Division of a diversified industrial; scaled integrator with broad install base.
    growth: 0.05
    margin: 0.07
    multiple: industrial-conglomerate margins
  - name: AutoStore
    kind: public
    note: Higher-margin modular ASRS vendor, mid-teens growth, software-like economics.
    growth: 0.14
    margin: 0.4
    multiple: ~40% EBITDA margin
  threats:
  - vector: cornered_resource
    who: Walmart
    falsifier: Walmart in-sources automation or renegotiates terms, collapsing the >84% revenue concentration.
  - vector: process_power
    who: execution / controls
    falsifier: Another restatement, deployment delay, or material-weakness recurrence signals integration is not yet a durable
      advantage.
  - vector: scale_economies
    who: margin structure
    falsifier: Gross margin stays near 19% through scale, proving the model never reaches software-like, platform economics.
  takeaway: 'A cornered-resource relationship with Walmart plus the largest contracted backlog is real Power, but it cuts
    both ways: the same dependence is an extreme concentration risk, and a 19% gross margin shows scale has not yet produced
    a durable cost or process advantage. Durability is medium at best. The falsifier the bull must clear is margin: gross
    margin expanding well beyond the high teens with ex-SBC owner FCF turning durably positive, ideally alongside a second
    large anchor customer.'
pocd:
  people:
    ceo: Rick Cohen
    founder_led: true
    tenure_years: 18
    insider_ownership_pct: 7.7
    capital_allocation: Founder Rick Cohen is Chairman & CEO (founded 2007; concurrently Executive Chairman of family-owned
      C&S Wholesale Grocers — split attention). The balance sheet is strong — ~$1.2B cash at FY2025 (~$2.0B after
      a Dec-2025 raise), no debt — but the business sits near adjusted-EBITDA breakeven (~$147M on $2.25B revenue)
      and GAAP-unprofitable, with revenue ~85% concentrated in Walmart and a ~$22.5B backlog. No dividend or buyback.
      A 2024 restatement (premature revenue recognition) produced a material weakness in internal controls that remained
      unremediated through Q3 FY2025.
    incentive_alignment: 'Cohen takes $0 compensation — no salary, bonus or equity — a genuine anti-extraction signal;
      his alignment is entirely his founder equity. Against that sits a dense related-party web: C&S Wholesale Grocers
      (Cohen-controlled — aircraft agreements, a customer, and GreenBox’s first customer), Walmart (largest customer
      and a holder), and the GreenBox JV (SoftBank 65% / Symbotic 35%, a ~$7.5B+ purchase commitment). Insider trading
      is selling, led by SoftBank steadily exiting; no insider buying.'
    governance_flags:
    - 'Up-C super-voting: Class V-3 = 3 votes per share; the Cohen-led insider classes control roughly 86-91% of the
      vote on ~20% economics, while public Class A holds under 9% of the vote'
    - combined Chair & CEO (Cohen) with no lead independent director designated, and a controlled-company-eligible
      structure (Cohen group > 50% of the vote)
    - a 2024 financial restatement with a material weakness in internal controls still unremediated through Q3 FY2025
      — an integrity flag the other entrenched names lack
    - 'dense related-party web: C&S Wholesale Grocers (Cohen-controlled), Walmart, and the GreenBox JV (SoftBank)'
    - extreme customer concentration — Walmart ~85% of revenue and most of the backlog
    - 'mitigants: a Class V-3 sunset to single-vote ~2029, an 8-of-9 independent board with fully-independent
      committees, declassified annual elections, and $0 CEO pay'
    key_person_risk: high
    score: 1
    takeaway: 'The most-entrenched tier, and the weakest of it: founder-CEO Cohen controls ~86-91% of the vote on
      ~20% economics via a 3-vote Up-C class, combines Chair and CEO, splits attention with C&S, and sits in a dense
      C&S/Walmart/GreenBox related-party web — on top of a 2024 restatement whose material weakness was still unremediated
      into FY2025, an integrity flag the cleaner controlled companies do not carry. The mitigants are real (a 2029
      sunset, a majority-independent board with independent committees, declassified elections, and a founder who
      takes $0 pay), but near-total vote control combined with an unremediated material weakness makes SYM the one name in the book where governance integrity, not merely entrenchment, is in question — which is why it sits at 1, the floor. Key-person risk is high.'

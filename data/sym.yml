appendix:
  pushback:
  - label: Backlog gives rare visibility
    body: A ~$22.5B backlog (Walmart + GreenBox) is multiples of revenue, an unusually contracted forward book that de-risks
      the growth path.
  - label: Labor automation is structural
    body: Warehouse-labor scarcity and rising fulfillment volume make AI automation a durable, multi-decade demand tailwind,
      not a cycle.
  - label: GAAP just turned positive
    body: Q2 FY26 net income of +$9M marks the inflection from years of losses; operating leverage may now compound.
  - label: GreenBox adds recurring mix
    body: The SoftBank WaaS JV (~$11.6B backlog) shifts the model toward recurring, higher-margin revenue versus one-time
      system sales.
  - label: Cash flow is real cash
    body: Operating cash flow was +$867M; even if milestone-timed, it funds the ramp without dilution or debt.
  triggers:
  - label: Bull validation
    body: Gross margin climbing above the low-20s; GreenBox recurring revenue scaling; a second large anchor customer beyond
      Walmart.
  - label: Bear validation
    body: Walmart order cadence slowing or terms renegotiated; gross margin stuck near 19%; another restatement or control
      deficiency.
  - label: Reframe needed
    body: Sustained software-like gross margin (30%+) with ex-SBC owner FCF turning durably positive would move this from
      systems integrator to platform.
glossary:
- term: Systems-integrator model / gross margin
  definition: Designs, builds, and installs automation systems; margins are construction-like (~19% here), not software-like,
    because hardware and integration dominate cost.
- term: Backlog
  definition: Contracted but not-yet-recognized revenue (~$22.5B), giving forward visibility; converts to revenue as systems
    are deployed over multiple years.
- term: Up-C dual-class economic units
  definition: 'An Up-C structure: economic ownership spans Class A plus Class V units (~591M total), so per-share value uses
    ~591M, not the smaller Class A float.'
- term: GreenBox (warehouse-as-a-service)
  definition: SoftBank JV offering automated warehousing as an outsourced, recurring service (~$11.6B of backlog) rather than
    a one-time system sale.
- term: Adj-EBITDA vs owner FCF; customer-funded OCF
  definition: Adj-EBITDA ($147M) excludes SBC ($184M); the $867M operating cash flow is customer milestone prepayments (working
    capital), not sustainable owner cash.
- term: SBC (stock-based compensation)
  definition: Non-cash pay in stock ($184M, exceeding adj-EBITDA); it dilutes owners and is the main driver of the GAAP operating
    loss.
competitive:
  arena: Warehouse-automation systems for large retailers and 3PLs; Symbotic competes with incumbent material-handling integrators
    and in-house programs from the largest buyers.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Largest dedicated automation deployments fund R&D and standardization, but a 19% gross margin shows limited cost
        advantage so far.
    network_economies:
      score: 1
      note: Some data and operational learning across sites, but no cross-customer network effect that compounds value as
        installs grow.
    counter_positioning:
      score: 1
      note: Full-stack AI-robotics integrator differs from legacy hardware vendors, but incumbents can adopt similar AI without
        a business-model conflict.
    switching_costs:
      score: 2
      note: Installed multi-year systems are deeply embedded and costly to rip out, but that locks the customer, not new wins.
    branding:
      score: 1
      note: Credibility from the Walmart reference, but enterprise buyers procure on proof and economics, not brand.
    cornered_resource:
      score: 2
      note: The Walmart relationship and contracted backlog are a privileged asset, but the same dependence is the concentration
        risk.
    process_power:
      score: 1
      note: Integration and software know-how exist, but a thin gross margin and the restatement history argue the process
        advantage is not yet durable.
  dominant_power: cornered_resource
  durability: medium
  rivals:
  - name: Amazon Robotics
    kind: private
    note: In-house automation at the largest buyer; not for sale but sets the build-vs-buy bar.
    growth: null
    margin: null
    multiple: deep parent balance sheet
  - name: Dematic (KION)

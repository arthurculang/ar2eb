appendix:
  pushback:
  - label: The de-rate corrected an excess, it didn't create a bargain.
    body: Down ~75% from the 2021 peak looks cheap, but at ~25x FCF and low-single-digit growth the modal DCF is +1% - growth,
      not the multiple, is the constraint.
  - label: The category is still only ~15-20% penetrated.
    body: Clear aligners are early in displacing wires/brackets; teen/IPE opens the larger teen ortho TAM the flat top line
      masks.
  - label: Brand + installed base are the moat.
    body: Invisalign is category-defining; iTero (>125,000 scanners) + scan-data + the patent estate are hardest for Angelalign
      to replicate.
  - label: ASP/share erosion is the whole question.
    body: ASPs guided -1 to -2%, Angelalign taking China share + litigating patents, at-home at the low end - 'category grows'
      vs 'Align grows' is the fork.
  - label: Net cash, p_fail ~0.
    body: $1.10B cash, no debt, ~$200M buyback - no solvency risk; the downside is growth/multiple, not survival.
  triggers:
  - label: Bull validation
    body: Invisalign case volume re-accelerates above ~+7%  ·  teen/IPE case-starts scale materially  ·  ASPs stabilize (not
      down)  ·  operating margin recovers back toward ~20%
  - label: Bear validation
    body: case volume flat-lines or declines for 2+ quarters  ·  ASPs fall faster than the guided -1 to -2%  ·  Angelalign/at-home
      take visible share  ·  op margin grinds below ~13%
  - label: Reframe needed
    body: if clear aligners commoditize (Angelalign wins on price + the ITC/patent actions fail), the branding + cornered-resource
      Powers erode - re-rate the terminal toward a low-growth, price-taking dental-device multiple
glossary:
- term: Clear Aligner
  definition: Align's largest segment (~82-85% of revenue) - Invisalign removable aligners that displace traditional wires/brackets;
    case volume x ASP is the swing factor.
- term: iTero / Systems & Services
  definition: Intraoral scanners (iTero Lumina, installed base >125,000) + software/services - the cornered-resource base that
    feeds Invisalign workflow and scan-data.
- term: ASP
  definition: Average selling price per case; guided -1 to -2% in FY26 on country/product mix and competition - the price
    half of the volume-vs-price question.
- term: IPE (Invisalign Palatal Expander)
  definition: US-FDA-cleared device targeting teen/kids case-starts (the majority of global ortho) - the TAM-expansion lever
    in the bull.
- term: FCF margin
  definition: Free cash flow / revenue (~12-13% FY25); the mature-DCF lever - whether category growth converts the ~70% gross
    margin to free cash flow as ASP pressure bites.
competitive:
  arena: Clear-aligner orthodontics / dental devices - Align Technology (Invisalign, the category-defining brand, + iTero
    scanners) vs Angelalign, SmileDirect-style at-home/DIY, Dentsply Sirona, Straumann/ClearCorrect, and traditional wires/brackets;
    auditing a brand + cornered-resource Power against commoditization and a discretionary-demand market.
  lens: power_audit
  powers:
    scale_economies:
      score: 3
      note: Largest clear-aligner manufacturer; manufacturing/R&D/sales leverage at $4B revenue and ~70% gross margin - real,
        but Angelalign is scaling fast in China.
    network_economies:
      score: 2
      note: Invisalign-trained doctor base + iTero/exocad workflow create two-sided pull (more doctors -> more patients),
        but not a hard network effect.
    counter_positioning:
      score: 1
      note: Was the disruptor of wires/brackets; now the incumbent being counter-positioned by lower-cost Angelalign and at-home/DIY
        models.
    switching_costs:
      score: 2
      note: Doctors invested in iTero hardware + Invisalign training face friction switching systems; patient-side switching
        is low (a single discretionary purchase).
    branding:
      score: 4
      note: 'The dominant Power: Invisalign is the category-defining consumer brand with pricing power and direct-to-consumer
        demand pull - but eroding at the ASP line under competition.'
    cornered_resource:
      score: 3
      note: iTero installed base (>125,000), accumulated scan-data, and a deep patent estate (the basis of the Angelalign
        suits/ITC action) - durable, the hardest piece to replicate.
    process_power:
      score: 2
      note: Mass-customization manufacturing + the digital treatment-planning stack; a real learning curve, modest as a standalone
        Power.
  dominant_power: branding
  durability: medium
  rivals:
  - name: Angelalign
    kind: public
    note: Fast-growing Chinese clear-aligner challenger; competes on price, taking China share - the live patent/ITC threat.
    growth: 0.3
    margin: 0.25
    multiple: HK-listed
  - name: Dentsply Sirona
    kind: public
    note: Diversified dental incumbent (incl. SureSmile aligners + imaging); the legacy-dental comp.
    growth: 0.0
    margin: 0.1
    multiple: ~12x EV/EBITDA
  - name: Straumann / ClearCorrect
    kind: public
    note: Premium dental/implant group with a growing aligner line; the high-end aligner challenger.
    growth: 0.1
    margin: 0.25
    multiple: ~30x P/E
  - name: At-home / DIY (SmileDirect legacy)
    kind: private
    note: Direct-to-consumer aligners at the low end; SmileDirect went bankrupt, but the price-competitive segment persists.
    growth: null
    margin: null
    multiple: private
  threats:
  - vector: branding
    who: Angelalign + at-home/DIY (price competition)
    falsifier: ASPs fall faster than the guided -1 to -2% as the brand premium erodes against lower-cost aligners.
  - vector: cornered_resource
    who: Angelalign (patents / ITC)
    falsifier: The patent suits + ITC import-block action fail, letting competitors replicate the technology and scan-data
      edge.
  - vector: scale_economies
    who: Discretionary-demand softness + China bulk-procurement
    falsifier: Case volume flat-lines or declines and a low-cost mix de-levers the ~70% gross margin below ~13% operating
      margin.
  takeaway: 'Align''s brand Power is genuine - Invisalign is the category-defining clear-aligner name with pricing power and
    consumer demand pull, reinforced by the iTero installed base and patent estate as a cornered resource - but the franchise
    is decelerating: revenue is flat (+1%), op margin has slid four straight years to 13.5%, and ASPs are guided down under
    Angelalign + at-home price competition. The Audit: branding is durable (medium) but eroding at the price line; the cornered
    resource (iTero/scan-data/patents) is the real defense, and the live threats are commoditization + a discretionary-demand
    market. The ~75% de-rate from the 2021 peak corrected the prior excess to roughly fair, not to a bargain; the DCF tests
    whether category penetration + the teen/IPE TAM outrun ASP/share erosion, and the modal case lands +1% - de-rated, but
    priced about right.'

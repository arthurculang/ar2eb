central_question: Does clear-aligner category growth and Invisalign share retention outrun ASP/share erosion from Angelalign
  and at-home commoditization?
thesis: 'Align trades at ~$12.5B (~$174.84, deeply de-rated from the 2021 ~$700 peak to ~$175) - ~25x FCF on $4.04B revenue
  growing low-single-digit, ~70% gross margin, net cash and a buyback. It is the category-defining clear-aligner brand (Invisalign
  + iTero) in a market still only ~15-20% penetrated, but growth has flat-lined (+1%) as discretionary demand softens and Angelalign/at-home
  rivals pressure ASPs (-1 to -2% guided). The DCF asks whether category penetration plus the teen/Palatal-Expander TAM outrun
  price/share erosion. The finding lands ~fair (-1.5%): the modal case is +1%, de-rated but not cheap.'

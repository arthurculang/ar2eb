appendix:
  pushback:
  - label: ~11x FCF for an 80%-margin ad engine compounding on a $10B+ GTV base.
    body: Net-cash, GAAP op margin scaling 12.3->17.9%, advertising +16% - priced like a contested delivery app, not a retail-media
      platform; the modal DCF is +57%.
  - label: The buyback is worth ~35% of the market cap.
    body: $3.5B authorized (raised from $2.5B), $349M repurchased in Q1; it offsets SBC dilution so shares stay flat - the
      ex-SBC owner FCF accrues per-share rather than leaking to issuance.
  - label: Reported FCF flatters the picture.
    body: ~$0.9B reported FCF includes a heavy SBC add-back (~$93M/qtr); the base models ex-SBC owner FCF at ~15-19%, the
      honest cash the buyback must offset - not the headline ~11x.
  - label: Advertising is the whole thesis - and it is decelerating.
    body: ~80%-margin ad revenue grew +16% in Q1 but is guided to 11-14%, well below the 27%/34% era; whether it re-accelerates
      on a $10B+ GTV base is the bull/bear fork.
  - label: Cornered purchase data feeds the ad engine.
    body: First-party grocery purchase data across the retailer network is the hardest input for the delivery field to replicate
      - a nascent cornered resource the retail-media platform monetizes.
  triggers:
  - label: Bull validation
    body: advertising re-accelerates above the 11-14% guide  ·  ad revenue compounds faster than GTV  ·  GAAP op margin holds
      >=18%  ·  enterprise (Carrot/Caper) wins named retailers  ·  buyback keeps shares flat-to-down
  - label: Bear validation
    body: advertising decelerates into single digits  ·  the ~7% take rate compresses  ·  orders keep trailing GTV (frequency
      stalls)  ·  GTV growth slows as DoorDash/Amazon/Walmart take share  ·  op margin stalls in the low-teens
  - label: Reframe needed
    body: if advertising growth converges to GTV growth (no high-margin premium) or the take rate erodes structurally, the
      flywheel is gone - re-rate the terminal toward a low-margin, contested delivery marketplace multiple
glossary:
- term: GTV
  definition: Gross transaction value - total spend across the platform (groceries + fees + tips), $10.29B in Q1 (+13%, first
    >$10B); the base the ~7% take rate and the ad engine monetize.
- term: Take rate
  definition: Transaction revenue / GTV (~7.1%); structurally low for grocery delivery and a key bear lever - the marketplace's
    cut of each order before advertising.
- term: Advertising & other
  definition: High-margin (~80%) retail-media revenue ($286M in Q1, +16%) from brands paying for placement against purchase
    data - the flywheel and the swing factor; guided to decelerate to 11-14%.
- term: Enterprise (Carrot / Caper)
  definition: Instacart's technology sold to retailers - the Carrot e-commerce stack and Caper AI smart carts - extending
    the platform beyond delivery and feeding the data/ad engine; the switching-cost lever.
- term: FCF margin
  definition: Free cash flow / revenue; the mature-DCF swing factor - the base models ex-SBC owner FCF (~15-19%), below the
    ~24% reported, with the $3.5B buyback offsetting SBC dilution.
competitive:
  arena: Online grocery delivery + retail media - Instacart (category leader, $10B+ GTV, ~80%-margin advertising, enterprise/Carrot
    tech) vs DoorDash, Uber Eats, Amazon and Walmart; auditing a two-sided network Power and a nascent ad-data cornered resource
    against a deep-pocketed field and a low take rate.
  lens: power_audit
  powers:
    scale_economies:
      score: 3
      note: Largest pure-play grocery-delivery GTV ($10B+/qtr) gives sourcing/logistics density and retail-media reach, but
        Amazon/Walmart/Uber operate at far greater corporate scale.
    network_economies:
      score: 4
      note: 'The dominant Power: a two-sided retailer/shopper marketplace - more retailers and selection pull more consumers,
        whose orders pull more retailers and brand ad dollars; a genuine, if contestable, flywheel.'
    counter_positioning:
      score: 1
      note: Was the asset-light shopper-network disruptor; now the incumbent the delivery field is attacking, not counter-positioning.
    switching_costs:
      score: 2
      note: Enterprise integrations (Carrot e-commerce, Caper carts) embed Instacart in retailer operations; consumer switching
        is low, but the B2B tech is sticky.
    branding:
      score: 2
      note: Strong category association ('Instacart' = grocery delivery) but not pricing power; convenience, not brand, drives
        the order.
    cornered_resource:
      score: 3
      note: 'A nascent cornered resource: first-party grocery purchase data across the retailer network feeds the ~80%-margin
        ad engine - the hardest input for rivals to replicate, but early and contestable.'
    process_power:
      score: 2
      note: Shopper-routing, fulfilment and ad-targeting systems are real operating know-how; meaningful but not a decisive,
        hard-to-copy edge.
  dominant_power: network_economies
  durability: medium
  rivals:
  - name: DoorDash (DASH)
    kind: public
    note: Larger logistics network expanding aggressively into grocery + retail media; the primary delivery-field threat to
      GTV and ad share.
    growth: 0.2
    margin: 0.04
    multiple: ~33x EV/FCF
  - name: Uber Eats (UBER)
    kind: public
    note: Global delivery scale + advertising push; Uber Eats grocery directly contests Instacart's lane.
    growth: 0.18
    margin: 0.08
    multiple: ~14x EV/FCF
  - name: Amazon
    kind: public
    note: Whole Foods + Amazon Fresh + Prime + a dominant retail-media machine; the deepest-pocketed structural threat to
      both legs.
    growth: 0.1
    margin: 0.11
    multiple: ~30x EV/FCF
  - name: Walmart
    kind: public
    note: Walmart+ delivery + the fastest-growing rival retail-media network (Walmart Connect); scale and grocery primacy
      pressure the take rate.
    growth: 0.05
    margin: 0.04
    multiple: ~30x P/E
  threats:
  - vector: network_economies
    who: DoorDash / Uber Eats / Amazon / Walmart
    falsifier: GTV growth slows and orders keep trailing GTV as the deep-pocketed field pulls shoppers and retailers off the
      platform.
  - vector: cornered_resource
    who: Amazon / Walmart retail media
    falsifier: Advertising decelerates into single digits as brand ad dollars flow to larger first-party retail-media networks.
  - vector: scale_economies
    who: Grocer DTC + delivery-field take-rate pressure
    falsifier: The ~7% take rate compresses as retailers build their own fulfilment or the field undercuts the marketplace
      cut.
  takeaway: 'Instacart''s network Power is genuine - the largest pure-play grocery-delivery GTV ($10B+/qtr) running a two-sided
    retailer/shopper marketplace that feeds a nascent cornered resource (first-party purchase data -> an ~80%-margin ad engine)
    and is stickied by enterprise integrations (Carrot, Caper). But the field is the deepest-pocketed in retail - DoorDash,
    Uber, Amazon, Walmart - and the ~7% take rate plus a guided ad deceleration (11-14% vs the 27%/34% era) are the live threats.
    The Audit: network_economies is durable but contestable (medium), the ad-data cornered resource is the real prize if it
    compounds, and the swing factor is whether high-margin advertising keeps scaling on the GTV base. The DCF tests exactly
    that - and even the competitive ultra-bear is -28% while the modal flywheel lands +57%, with reported FCF honestly discounted
    to ~15-19% ex-SBC owner margin and the $3.5B buyback offsetting dilution.'

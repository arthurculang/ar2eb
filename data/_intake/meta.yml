appendix:
  pushback:
  - label: Cheapest mega-cap on normalized FCF.
    body: -18% TTM to a high-teens EV/FCF while ad revenue accelerates to +33% - priced as if the ad engine were decelerating,
      not accelerating; the capex fear is doing the de-rating.
  - label: The capex ROI is the whole question.
    body: ~$130B/yr spend (~2x prior year) with uncertain return is the bear; Q1'26's accelerating volume AND price is the
      first datapoint it might earn its cost of capital - the bull/bear fork.
  - label: 41% margins self-fund the buildout.
    body: Meta pays for the entire AI capex out of operating cash flow at a 41% margin while still buying back ~$26B + paying
      ~$5B dividends - no balance-sheet risk in the spend.
  - label: AI is already monetizing in the core ad stack.
    body: Proprietary Muse Spark ad-creative and AI ranking are live; ad-creative adopters doubled to ~8M, with impressions
      +19% and price/ad +12% in Q1'26.
  - label: Breakup risk is materially reduced.
    body: Meta won the FTC antitrust trial (Nov-2025) and keeps Instagram/WhatsApp; the FTC's Jan-2026 appeal leaves a tail,
      but the existential breakup case is largely off the table.
  triggers:
  - label: Bull validation
    body: ad revenue stays >=20% with BOTH impressions and price/ad rising  ·  operating margin holds >=40% through the D&A
      step-up  ·  FCF margin inflects back above ~25% as capex intensity peaks  ·  Muse Spark / AI-ad adoption keeps compounding
  - label: Bear validation
    body: ad growth decelerates into the mid-single digits  ·  operating margin falls below ~38% as D&A outruns the operating
      line  ·  FCF margin stays stuck near ~20% as capex keeps stepping up  ·  Reality Labs loss widens beyond ~$24B/yr
  - label: Reframe needed
    body: if the ~$130B/yr capex visibly fails to earn its cost of capital - ad growth fades while D&A keeps climbing - re-rate
      the terminal toward a slow-growth, capex-heavy ad utility, not a compounding platform
glossary:
- term: Family of Apps
  definition: Meta's core ad business - Facebook, Instagram, WhatsApp, Messenger (~99% of revenue, 41%+ operating margin);
    the social-graph ad engine the Powers and the DCF rest on.
- term: Reality Labs
  definition: The AR/VR/metaverse segment (~$24B/yr operating loss, ~$80B cumulative); a structural drag on consolidated margin
    and the bear's most concrete cost line.
- term: AI capex / ROI
  definition: The $125-145B FY26 buildout (~2x the prior ~$72B) of AI compute; whether it earns its cost of capital via faster,
    higher-priced ads is the single biggest 5-year swing factor.
- term: Impressions x price/ad
  definition: The two ad-revenue drivers (Q1'26 +19% volume, +12% price); AI lifting both simultaneously is the bull mechanism,
    a soft cycle is the bear.
- term: FCF margin
  definition: Free cash flow / revenue (~23% FY25, down from ~33% as capex stepped up); the mature-DCF swing factor - whether
    the AI buildout converts to free cash flow as D&A scales.
competitive:
  arena: Digital advertising / social platforms - Meta (3B+ user social graph, ~$55B/qtr ads, 41% margin) vs Alphabet/Google,
    Amazon ads, TikTok/ByteDance, and Snap/Pinterest/Reddit; auditing a branding + network-economies + scale Power against
    the AI-capex ROI question.
  lens: power_audit
  powers:
    scale_economies:
      score: 4
      note: 'Massive: ~$200B revenue and a global ad/infra base spread fixed R&D and compute across 3B+ users; AI capex deepens
        the cost-per-impression advantage if it earns out.'
    network_economies:
      score: 4
      note: 'The core Power: the social graph compounds - more users and content make each app more valuable to users and
        advertisers; cross-app (FB/IG/WhatsApp) reinforces it.'
    counter_positioning:
      score: 1
      note: Was the mobile-social disruptor; now the incumbent being counter-positioned by TikTok's algorithmic feed, which
        forced the Reels response.
    switching_costs:
      score: 2
      note: 'Moderate: social graph + content history + creator relationships create stickiness, but users multi-home and
        attention is contestable.'
    branding:
      score: 3
      note: 'Real: Instagram/WhatsApp are category-defining consumer brands with global mindshare, though the corporate brand
        is contested and ad-trust is a perennial overhang.'
    cornered_resource:
      score: 2
      note: The 3B+ user behavioral/interest dataset and the social graph itself are hard to replicate; tempered by privacy
        regulation (DMA, ATT) constraining its use.
    process_power:
      score: 3
      note: AI ad-ranking, creative (Muse Spark) and infra are a compounding learning curve; the open question is whether
        the capex turns this into durable monetization.
  dominant_power: network_economies
  durability: high
  rivals:
  - name: Alphabet (GOOGL)
    kind: public
    note: The other ad duopolist - Search/YouTube + full AI stack; the scale/margin benchmark and direct ad-budget competitor.
    growth: 0.15
    margin: 0.32
    multiple: ~26x EV/FCF
  - name: Amazon (AMZN)
    kind: public
    note: Fastest-growing large ad platform (retail-media), taking share of performance budgets at the margin.
    growth: 0.13
    margin: 0.11
    multiple: ~3x EV/sales
  - name: ByteDance / TikTok
    kind: private
    note: The attention threat that forced Reels; algorithmic short-form competing directly for engagement and ad dollars.
    growth:
    margin:
    multiple: private
  - name: Snap / Pinterest / Reddit
    kind: public
    note: Sub-scale social-ad peers; pressure on incremental ad budgets, not the core graph.
    growth: 0.15
    margin: 0.08
    multiple: ~5x EV/sales
  threats:
  - vector: network_economies
    who: ByteDance / TikTok (attention)
    falsifier: Family DAP growth stalls or turns negative as engagement and time-spent shift to short-form rivals, capping
      the impression base.
  - vector: process_power
    who: AI-capex ROI (Alphabet's full stack)
    falsifier: Ad growth decelerates while D&A from the ~$130B/yr buildout keeps climbing - the spend fails to convert to
      durable monetization.
  - vector: cornered_resource
    who: Privacy regulation (DMA, ATT, FTC appeal)
    falsifier: EU 'pay or consent' / signal-loss erodes ad targeting and pricing, or the FTC appeal reopens the structural-separation
      risk.
  takeaway: 'Meta''s network-economies Power is genuinely durable (high): the 3B+ social graph compounds, reinforced by scale
    across a ~$200B ad base and the Instagram/WhatsApp brands - and Q1''26''s accelerating ads show the engine isn''t decelerating.
    The Audit: network economies dominates, scale and branding reinforce it, and the live threats are TikTok''s pull on attention,
    privacy regulation, and above all the ~$130B/yr AI-capex ROI. The market prices that capex fear - the cheapest mega-cap
    on normalized FCF at a high-teens EV/FCF - so the DCF tests whether AI lifts ads faster than the D&A weighs: a weighted
    +14.6%, base ~+8%, a fat right tail.'

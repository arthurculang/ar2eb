central_question: Does the ~$130B/yr AI capex earn its cost of capital - lifting ad growth and pricing faster than the resulting
  D&A compresses Meta's 41% margins?
thesis: 'Meta trades at ~$1.43T (~$567, +12.6% YTD but -18% TTM, off the $796 high) - the cheapest mega-cap on normalized
  FCF at a high-teens EV/FCF, while Q1''26 ad growth accelerated to +33%. The fork is the capex: guidance jumped to $125-145B
  (~2x prior year) and the stock flinched on the ROI question, even as 41% margins fund the buildout from cash flow. The DCF
  asks whether AI-driven ad efficiency compounds revenue faster than D&A crushes margins. The finding: a weighted +14.6%,
  the modal base ~+8% - the AI ad engine carrying the upside, the capex-ROI fear the bear.'

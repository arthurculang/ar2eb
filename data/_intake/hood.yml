central_question: Has Robinhood diversified beyond crypto and rates into a durable platform worth ~52x FCF — or is it still
  a transaction broker levered to the crypto and rate cycle?
thesis: 'Robinhood trades at ~$82.8B (~$93, down ~27% YTD after a ~280% 2025 rally) — ~52x FCF on $4.473B revenue growing
  ~49%, ~50% adj-EBITDA margin, net cash, share count rising (SBC-dilutive). Roughly a third of revenue is rate-sensitive
  net interest (~$40M/qtr per 25bp Fed cut) and transaction revenue is crypto/rate-cyclical (crypto -47% last quarter). The
  DCF asks whether events/futures/options/Gold convert HOOD into a durable diversified platform or it reverts to a transaction
  broker. The finding: even the diversification bull lands -40%, and only the ultra-bull (-14%) approaches fair — the price
  embeds a hyper-growth platform the modal case (-59%) doesn''t deliver.'

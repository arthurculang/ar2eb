weighting_rationale:
- label: Ultra Bear 10%
  body: Neutron fails; dilution; SpaceX runs away.
- label: Bear 25%
  body: 'Neutron slips; credible #2 but capped.'
- label: Base 35%
  body: 'Neutron works; #2 + Space Systems prime ~18%.'
- label: Bull 22%
  body: Reusable Neutron scales; top-3 + constellations.
- label: Ultra Bull 8%
  body: SpaceX-scale prime by 2035 — still below spot.
appendix:
  pushback:
  - label: Best-capitalized new-space name.
    body: $0.83B cash + $1.85B backlog + ATM access; far more de-risked than pre-revenue peers.
  - label: Space Systems is the hidden engine.
    body: The majority of revenue is components/satellites, not launch — diversified, growing, and sticky
      (designed-in).
  - label: Neutron is optionality, not the whole thesis.
    body: Even modeling Neutron conservatively, Space Systems alone compounds to a real business.
  - label: Reusability could reset the cost curve.
    body: If Neutron lands reuse economics, the bull launch-share path opens — the single biggest swing
      factor.
  - label: Backlog visibility.
    body: $1.85B backlog (+73% YoY) gives unusual revenue visibility for a 'young' name.
  triggers:
  - label: Bull validation
    body: Neutron reaches orbit on schedule (Q4'26)  ·  reuse demonstrated by FY27  ·  Space Systems >
      $1B annual run-rate
  - label: Bear validation
    body: Neutron slips beyond FY27  ·  gross margin stalls < 35%  ·  Space Systems growth decelerates
      < 20%
  - label: Reframe needed
    body: If reusable medium-lift cadence approaches Falcon 9 economics, the launch-share ceiling lifts
      materially — revisit the bull tam_share
glossary:
- term: Electron
  definition: 'RKLB''s small-lift (~300kg) orbital rocket; the established #2 to SpaceX by launch count.'
- term: Neutron
  definition: RKLB's reusable medium-lift (~13t) rocket targeting a Q4 2026 first launch; the core bull
    catalyst.
- term: Space Systems
  definition: 'RKLB''s non-launch segment: satellites, star trackers, solar, separation systems, components
    — the majority of revenue.'
- term: Backlog
  definition: Contracted future revenue not yet recognized; RKLB's was $1.85B (+73% YoY) at FY25.
- term: Sales-to-capital (s2c)
  definition: 'Damodaran reinvestment efficiency: incremental revenue per dollar of reinvested capital.
    Higher = more capital-efficient growth.'
competitive:
  arena: Space launch + space systems — Rocket Lab (Electron small-lift, Neutron medium-lift reusable
    coming, vertically-integrated Space Systems) vs SpaceX (dominant), Firefly, Stoke Space, ULA/Blue
    Origin; the race to become a vertically-integrated space prime.
  lens: power_origination
  powers:
    scale_economies:
      score: 1
      note: Electron cadence builds a learning curve; Neutron reusability could reset cost, but it is
        pre-launch.
    network_economies:
      score: 1
      note: Owned-constellation/data flywheel is a future moat, not yet originated.
    counter_positioning:
      score: 2
      note: Vertically integrated launch + components + future constellation — few new-space peers can
        replicate the full stack.
    switching_costs:
      score: 1
      note: Space Systems components get designed-in (some lock-in); launch is largely contestable.
    branding:
      score: 2
      note: 'The credible #2 launch brand after SpaceX; strong gov/defense trust.'
    cornered_resource:
      score: 2
      note: Launch sites/licenses, an acquired vertically-integrated component portfolio, Beck-led engineering
        talent, Neutron IP.
    process_power:
      score: 2
      note: Electron reliability + manufacturing learning curve; a genuine, if narrow, process edge.
  dominant_power: cornered_resource
  window: open
  rivals:
  - name: SpaceX
    kind: private
    note: Falcon 9 cadence + Starship + Starlink — the gravity well of the industry.
    share_now: 0.0
    share_terminal: 0.45
    capital: $ tens of B; Starlink cash flow
  - name: ULA / Blue Origin
    kind: incumbent-division
    note: Vulcan / New Glenn; legacy contracts + Bezos capital.
    share_now: 0.0
    share_terminal: 0.12
    capital: Boeing/LM + Bezos
  - name: Firefly Aerospace
    kind: public
    note: Alpha + Elytra + MLV; lunar lander; recently public.
    share_now: 0.0
    share_terminal: 0.08
    capital: public; funded
  - name: Stoke Space
    kind: private
    note: Fully reusable from day one; early but ambitious.
    share_now: 0.0
    share_terminal: 0.05
    capital: ~$ hundreds M
  lead_lag:
  - metric: Medium-lift reusable launch
    company: Neutron pre-launch
    best_rival: Falcon 9 + Starship
    verdict: lagging
  - metric: Launch cadence (per yr)
    company: ~15-20 (Electron)

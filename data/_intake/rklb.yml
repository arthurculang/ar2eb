central_question: Does ~135x sales (~$81B on $602M FY25 revenue) price a realistic path to a space prime
  — or a SpaceX-scale outcome a decade of fundamentals can't reach?
thesis: 'Rocket Lab trades at ~$81B against $602M FY25 revenue (+38%) and a $1.85B backlog (+73%) — ~135x
  sales. Two engines: Electron (the established #2 small-lift launcher) plus Neutron (a reusable medium-lift
  vehicle targeting a Q4 2026 first launch after a stage-1 tank-test failure), and a larger vertically-integrated
  Space Systems segment with a path to owned constellations. The young-company DCF asks what mature scale,
  prime-style margins, and Neutron-stumble probability are plausible over ten years. Five scenarios, weighted
  — and the finding is stark: even an aggressive ultra-bull (a ~$20B-revenue space prime by 2035) lands
  below spot.'

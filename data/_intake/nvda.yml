central_question: Can datacenter AI capex compound for years at high-70s% gross margin to justify ~$5T and ~50x FCF, or does
  a digestion/air-pocket hit a stock priced for perfection?
thesis: 'NVIDIA trades at ~$4,986B (~$205/sh, ~+45% TTM) - the world''s largest company at ~50x FCF on $215.9B revenue (+65%),
  ~60% operating margins, ~$2B net cash. Data Center is ~88% of revenue and grew +92% last quarter at a mid-70s% gross margin,
  on a clean Blackwell -> Ultra -> Rubin cadence. The DCF asks whether hyperscaler + sovereign AI capex keeps compounding
  or hits a pause. The finding: the distribution is enormous (ultra-bear -80% to ultra-bull +73%), and even at huge growth
  the modal case can''t justify ~$5T - the weighted read is -25%.'

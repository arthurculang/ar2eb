appendix:
  pushback:
  - label: FCF is positive — why a -60% modal case?
    body: ~$0.4B FCF (~22%) is real but flatters a GAAP-loss business; the base models the ex-SBC margin AND a growing share
      count, so per-share cash flow is far thinner than the headline.
  - label: Vector is genuinely re-accelerating ads.
    body: Grow +24% with Vector +80% toward ~$1B ARR at high mobile-ad share is the bull; the question is whether it sustains
      past easy comps and beyond gaming, vs AppLovin.
  - label: The convertibles are a 2026 cliff.
    body: ~$2.2B notes mature Nov-2026 against ~$2.15B cash — manageable but it removes the buffer if the turnaround slips,
      and it's why the bear net-of-debt bridge bites.
  - label: Dilution is the core bear mechanism.
    body: Shares are up ~56% in five years on SBC; even with revenue growing, per-share value leaks unless stock comp moderates
      — modeled as a rising share count in every scenario.
  - label: Engine share is being contested.
    body: Godot + Unreal gained share post-runtime-fee (since cancelled); the Create franchise and the ad-data install base
      are the cornered resource being actively attacked.
  triggers:
  - label: Bull validation
    body: Vector ARR tracks toward ~$1B and Grow stays >20%  ·  ad share holds/expands beyond mobile gaming  ·  GAAP operating
      margin turns positive  ·  SBC/share count flattens
  - label: Bear validation
    body: Vector growth decelerates sharply as comps lapse  ·  Create seats/engine share keep leaking to Godot/Unreal  ·  GAAP
      stays loss-making  ·  share count keeps climbing >5%/yr
  - label: Reframe needed
    body: if the convertibles refinance on bad terms or Vector reverts to a low-growth engine losing developers, re-rate the
      terminal toward a dilutive, loss-making software multiple net of debt
glossary:
- term: Vector
  definition: Unity's AI-driven ad engine inside Grow - the turnaround driver, +80% YoY toward ~$1B ARR; whether it sustains
    ad-share gains beyond mobile gaming is the swing factor.
- term: Grow vs Create
  definition: Grow = the ads/monetization business (~69% of revenue, incl Vector); Create = the engine subscriptions (Unity
    Pro/Enterprise) - the two reported segments.
- term: Runtime fee
  definition: The 2023 per-install engine pricing (since cancelled) that triggered a developer backlash and gave Godot/Unreal
    an opening - the Create-franchise bear catalyst.
- term: Convertible notes
  definition: ~$2.2B of convertible debt (2026 Notes due Nov-2026) sitting against ~$2.15B cash; the maturity that shapes
    the equity bridge net of debt.
- term: FCF margin (ex-SBC)
  definition: Free cash flow / revenue net of stock-based comp, against a growing share count; the mature-DCF lever - here
    dilution, not GAAP FCF, drives the per-share result.
competitive:
  arena: Game-engine + mobile-ad monetization — Unity (the dominant cross-platform engine + the Grow/Vector ad network) vs
    Epic's Unreal and open-source Godot in engines, and AppLovin in mobile ads; auditing a contested branding + cornered-resource
    Power against an active developer exodus and dilution.
  lens: power_audit
  powers:
    scale_economies:
      score: 2
      note: Ad-network and engine scale at ~$1.85B revenue give data/cost leverage, but Unity is loss-making and sub-scale
        vs AppLovin in ads.
    network_economies:
      score: 2
      note: Developers + ad demand share the same install base (more games -> more ad inventory -> better targeting), but
        the loop is weaker than a pure marketplace and contested.
    counter_positioning:
      score: 1
      note: Was the accessible cross-platform engine vs costly bespoke tooling; now the incumbent, with Godot the low-cost
        counter-position after the runtime fee.
    switching_costs:
      score: 2
      note: Real once a game is built in Unity, but weak at the franchise edge - the runtime fee proved developers will start
        new projects on Godot/Unreal.
    branding:
      score: 3
      note: 'The dominant Power: Unity is the default name in mobile/indie game development with a huge install base - but
        the brand was damaged by the runtime fee and is eroding.'
    cornered_resource:
      score: 3
      note: The ad-data + engine install base feeding Vector is the genuine asset - nascent and being actively contested,
        the swing of the whole audit.
    process_power:
      score: 1
      note: AI/ML ad-optimization (Vector) is improving fast but unproven and chased by AppLovin; not yet a durable process
        advantage.
  dominant_power: cornered_resource
  durability: low
  rivals:
  - name: AppLovin (APP)
    kind: public
    note: The mobile-ad-monetization benchmark Vector is chasing; far more profitable, the Grow/Vector comp.
    growth: 0.3
    margin: 0.55
    multiple: ~30x EV/FCF
  - name: Epic Games (Unreal)
    kind: private
    note: Owns Unreal + Fortnite; the high-end engine taking AAA/console share, the Create threat.
    growth:
    margin:
    multiple: private
  - name: Godot
    kind: private
    note: Free, open-source engine that gained indie share post-runtime-fee; the low-cost counter-position.
    growth:
    margin:
    multiple: open-source
  - name: Roblox (RBLX)
    kind: public
    note: Adjacent UGC platform competing for creators/developers and ad dollars.
    growth: 0.25
    margin:
    multiple: ~loss-making
  threats:
  - vector: cornered_resource
    who: AppLovin (ad share) + comp lapse
    falsifier: Vector growth decelerates sharply as easy comps roll off and ad share stops expanding beyond mobile gaming.
  - vector: branding
    who: Godot + Unreal (engine share)
    falsifier: Create seats/engine share keep leaking as developers start new projects off Unity post-runtime-fee.
  - vector: switching_costs
    who: Developer exodus / dilution
    falsifier: GAAP stays loss-making and the share count keeps climbing >5%/yr, so per-share value leaks even as revenue
      grows.
  takeaway: 'Unity''s most genuine Power is a cornered resource - the ad-data plus engine install base feeding Vector - but
    it is nascent and being actively contested, and the branding leg (the default game engine) was damaged by the runtime
    fee and is eroding to Godot and Unreal. The Audit: the dominant Power is the contested ad-data/install-base resource (durability
    low), the live threats are engine-share erosion plus a developer exodus and ~56%-in-five-years SBC dilution, and ~$2.2B
    convertibles mature into ~$2.15B cash in Nov-2026. That squares with the DCF: even with Vector working and GAAP turning,
    the base lands -60% because the model carries a thinner ex-SBC margin and a growing share count - this is the most speculative
    name in the batch, a turnaround bet on Vector with a very wide -93% to +47% distribution, not an FCF compounder.'

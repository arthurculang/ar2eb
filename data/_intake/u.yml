- label: Ultra Bear 18%
  body: Vector stalls; engine bleeds; dilution wins; ~$2.02 (-93%).
- label: Bear 28%
  body: Modest growth; FCF thin; GAAP barely turns; ~$5.44 (-80%).
- label: Base 30%
  body: Vector scales; GAAP turns; dilution persists; ~$10.78 (-60%).

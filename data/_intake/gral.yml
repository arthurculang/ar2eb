central_question: Does ~$3B / ~20x sales price GRAIL's multi-gate regulatory option fairly — after the NHS-Galleri miss, but
  with the FDA filing and Medicare law in hand?
thesis: 'GRAIL trades at ~$3B (≈$73/sh on just ~43M shares) on ~$147M FY25 revenue and ~$823M cash. Galleri — a blood test
  for 50+ cancers, self-pay today — is a multi-gate regulatory option: FDA PMA (filed Jan 2026) → Medicare coverage (signed
  Feb 2026; ≥2028) → broad adoption. The shape is unusual: the pivotal NHS-Galleri trial MISSED its endpoint (-50% stock),
  but the FDA filing rests on the positive PATHFINDER 2 and the Medicare law passed — partly broken, partly de-risked. The
  finding: at $73 the market roughly prices the modal regulatory-success case, with FDA-rejection downside and broad-adoption
  upside about balanced.'

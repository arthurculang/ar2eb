central_question: Is lululemon's ~60% de-rating to ~10x FCF an overshoot on a still-profitable premium brand — or the early
  innings of structural brand impairment (US decline, Alo/Vuori share loss)?
thesis: 'Lululemon trades at ~$15B (≈$127/sh, down ~60% from $340) — ~10x FCF on $11.1B revenue, ~22% operating margins, net
  cash and a heavy buyback. Growth has decelerated hard (+42%→+5%, guided +2-4%): the US is shrinking (-1 to -3%) while China/international
  compound +20-29%. The mature DCF asks whether the brand stabilizes and defends margins, or whether dupes (Alo, Vuori) and
  stale product structurally impair it. The finding: even pricing real brand-impairment downside (ultra-bear -34%), the modal
  stabilization case at 10x FCF implies the de-rating overshot.'

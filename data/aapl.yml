appendix:
  pushback:
  - label: The de-rate is the multiple, not the franchise.
    body: Apple is a genuine quality compounder, but a mid-single-digit grower at ~43x FCF prices safety beyond growth — even
      the bull only reaches ~$279 (-4%).
  - label: The ~$20B Google payment is a discrete cliff.
    body: It is near-pure-margin Services that must be rebid annually under the DOJ ruling; losing it directly cuts the highest-quality
      earnings, and the bear/ultra-bear weight it.
  - label: AI is outsourced, not owned.
    body: A custom Gemini behind the revamped Siri (~$1B/yr to Google) makes Apple a fast-follower on foundation models; the
      bull needs the ecosystem to win the AI era on someone else's stack.
  - label: Services + installed base are the quality.
    body: ~$31B/quarter of Services at ~70%+ gross margin on 2.5B+ devices is durable recurring earnings — the base/bull lean
      on it compounding mid-teens.
  - label: iPhone is ~half the revenue and partly pulled forward.
    body: FQ2 iPhone +22% rode pent-up demand from ~315M users on 4+yr phones; a payback air-pocket is the bear's mechanism
      once the super-cycle clears.
  triggers:
  - label: Bull validation
    body: Services growth holds mid-teens+  ·  iPhone upgrade cycle sustains  ·  the Google search payment survives the rebid
      ·  gross margin defends ~47%+  ·  China revenue keeps reaccelerating
  - label: Bear validation
    body: Services decelerates below ~10%  ·  the search payment is cut or competed away  ·  EU/US App Store fee remedies
      take hold  ·  iPhone goes flat-to-down  ·  gross margin slips below ~46%
  - label: Reframe needed
    body: if the AI-platform shift cedes the next interface (a Gemini/agent layer that disintermediates iOS) or Services structurally
      stalls, re-rate the terminal toward a flat-hardware multiple - the ultra-bear's ~16x
glossary:
- term: Services
  definition: Apple's recurring high-margin revenue (App Store, AppleCare, advertising, payments, subscriptions; ~$31B/quarter
    at ~70%+ gross margin) on a 2.5B+ device base - the quality engine.
- term: Installed base
  definition: The >2.5B active Apple devices that drive Services attach and switching costs; its growth, not unit sales, anchors
    the mid-teens Services compounding.
- term: Google search payment
  definition: The ~$20B/yr Google pays to be the default Safari search engine - near-pure-margin Services that must be rebid
    annually under the DOJ ruling; a discrete cliff.
- term: Apple Intelligence
  definition: Apple's AI feature set; the revamped Siri runs a custom Google Gemini model (~$1B/yr) - AI partnered, not in-house.
- term: FCF margin
  definition: Free cash flow / revenue (~24% FY25); whether the grower defends ~70%+-margin Services against the search-payment
    tails.
competitive:
  arena: Premium consumer hardware + a high-margin Services ecosystem - Apple vs Samsung/Google (phones), Microsoft/Google
    (platforms/AI), and the App Store/payments field; auditing a branding + switching-costs Power against the AI-platform
    shift.
  lens: power_audit
  powers:
    scale_economies:
      score: 4
      note: Massive purchasing/manufacturing and R&D scale across ~$416B revenue; among the deepest in consumer tech, though
        not the single dominant Power.
    network_economies:
      score: 2
      note: iMessage/FaceTime/AirDrop and the developer ecosystem create modest network pull, but the lock-in is more switching
        cost than true network effect.
    counter_positioning:
      score: 1
      note: Largely the incumbent now; the privacy-and-integration stance differentiates but rivals can and do copy it - not
        a structural counter-position.
    switching_costs:
      score: 4
      note: 'Deep ecosystem lock-in: iCloud, App Store purchases, Watch/AirPods/Mac continuity, iMessage - leaving means abandoning
        a connected device estate; a core durable Power.'
    branding:
      score: 5
      note: 'The strongest Power: the premium global brand commands pricing power and ~49% gross margin and anchors a 2.5B+
        installed base; decades-durable.'
    cornered_resource:
      score: 2
      note: In-house silicon (A/M-series) is a real edge and the developer base is sticky, but neither is a fully cornered,
        irreplaceable resource.
    process_power:
      score: 3
      note: World-class supply-chain and silicon-design execution (Cook's operational machine); a genuine but partly replicable
        advantage.
  dominant_power: branding
  durability: high
  rivals:
  - name: Samsung
    kind: public
    note: The premium-Android hardware rival; competes on phones/wearables but lacks Apple's Services ecosystem and margin.
    growth: 0.05
    margin: 0.1
    multiple: ~12x P/E
  - name: Alphabet (GOOGL)
    kind: public
    note: Owns Android + Gemini; the AI-platform threat and Apple's ~$20B search-payment counterparty all at once.
    growth: 0.15
    margin: 0.32
    multiple: ~24x P/E
  - name: Microsoft (MSFT)
    kind: public
    note: The other quality mega-cap compounder; the platform/AI peer Apple's multiple is benchmarked against.
    growth: 0.13
    margin: 0.45
    multiple: ~33x P/E
  - name: Samsung Electronics / Xiaomi
    kind: public
    note: High-volume Android OEMs pressuring iPhone share in China/India at lower price points.
    growth: 0.08
    margin: 0.08
    multiple: ~10x P/E
  threats:
  - vector: switching_costs
    who: The AI-platform shift (Gemini/agent layer)
    falsifier: An AI agent layer that disintermediates the iOS interface and erodes ecosystem lock-in - measurable as Services
      attach/engagement flattening.
  - vector: branding
    who: Regulators (DOJ search remedy + EU/US App Store)
    falsifier: The ~$20B Google search payment is cut on rebid and App Store fee remedies take hold, draining the highest-margin
      Services dollars.
  - vector: scale_economies
    who: Tariffs + India supply shift
    falsifier: Gross margin slips below ~46% as the ~5-8% India cost premium and tariff drag (~$900M/quarter) outrun price.
  takeaway: 'Apple''s brand is the strongest single Power in this set - a premium global franchise with ~49% gross margin
    and pricing power - reinforced by deep ecosystem switching costs and immense scale; durability is high. But the live threat
    is the AI-platform shift: with Apple Intelligence outsourced to Gemini, the next interface may run on someone else''s
    model, and that same counterparty anchors a ~$20B/yr search payment now exposed to a DOJ rebid. The Powers are durable;
    the question the DCF presses is price, not moat. A mid-single-digit grower at ~43x FCF carries a premium even the bull
    (~$279, -4%) barely justifies, and the modal case lands ~$188 (-35%).'
pocd:
  people:
    ceo: Tim Cook
    founder_led: false
    tenure_years: 15
    insider_ownership_pct: 0.1
    capital_allocation: 'Tim Cook has been CEO since August 2011 (founder Steve Jobs died that year). A dated succession
      is now underway: announced April 2026, effective September 1, 2026, Cook becomes Executive Chairman and John
      Ternus (SVP Hardware Engineering, a 25-year Apple insider) becomes CEO, with Arthur Levinson moving to lead
      independent director. Capital allocation is best-in-class scale return: FY2025 ~$89B buybacks + ~$15B dividends
      (~$105B total), a fresh $100B buyback authorization, against ~$132B cash/securities versus ~$100B debt (~$32B
      net cash) and ~$35B R&D.'
    incentive_alignment: Cook’s FY2025 total compensation was ~$74M (≈$3M salary, ~$12M cash incentive, ~$57M equity),
      with the equity majority in performance RSUs tied to relative total shareholder return. Insider selling is routine
      and pre-scheduled (Rule 10b5-1 / sell-to-cover on RSU vesting). Insider ownership is under 0.1% — normal for
      a company this size and not a flag.
    governance_flags:
    - single class of common stock, one vote per share — no dual-class, no super-voting, no controlling shareholder
      (largest holders Vanguard ~9%, BlackRock ~8%)
    - Chair and CEO are currently separated (independent Chairman Levinson) — a positive
    - 'dated CEO succession: Cook → Executive Chairman and John Ternus → CEO effective September 1, 2026; Levinson
      → lead independent director (the chair role becomes a non-independent insider at that point)'
    - 7 of 8 directors independent; all directors elected annually (board not staggered)
    - the broadest executive-leadership turnover since 2011 (CEO, COO and CFO all refilled from within in 2025-2026)
    key_person_risk: low
    score: 4
    takeaway: 'Clean, shareholder-friendly governance: single-class one-vote stock, no controlling holder, a 7-of-8
      independent board, and — uncommon among megacaps — a chair currently separate from the CEO. Key-person risk
      is low because succession is not just planned but executed: a named internal CEO (Ternus) takes over on a fixed
      date, every senior role was backfilled from within, and no individual controls the company. The one notch to
      watch is that the chair becomes a non-independent Executive Chairman (Cook) in September 2026.'

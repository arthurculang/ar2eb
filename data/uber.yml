central_question: Is Uber a dominant FCF-inflecting mobility/delivery network at ~14x EV/FCF — or does autonomy commoditize
  its driver-marketplace and erode the network toll?
thesis: 'Uber trades at ~$145B (≈$70/sh, down ~30% on AV fear) — ~14x EV/FCF on $9.76B FCF (growing 40%+), $193.5B gross bookings
  (+19%), net cash and a $20B buyback. The mature DCF asks whether the two-sided network + advertising (>$2B run-rate) + delivery-margin
  ramp compound, or whether Waymo/Tesla bypass the marketplace. The finding: at 14x FCF for a network compounding GB ~mid-teens
  with expanding margins, the modal case implies meaningful undervaluation — but a genuine AV-disruption ultra-bear is -44%,
  so the sign is a bet on Uber remaining the AV demand-aggregator.'

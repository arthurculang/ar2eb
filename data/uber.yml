weighting_rationale:
- label: Ultra Bear 15%
  body: AV bypasses marketplace; ~$40 (-44%).
- label: Bear 27%
  body: AV pressure; decel; ~$75 (+6%).
- label: Base 33%
  body: Stays AV aggregator; ads + delivery; ~$110 (+55%).
- label: Bull 18%
  body: Network holds; AV accretive; ~$155 (+120%).
- label: Ultra Bull 7%
  body: The AV demand layer; ~$202 (+187%).
appendix:
  pushback:
  - label: ~14x EV/FCF on $9.76B FCF growing 40%+.
    body: A dominant two-sided network priced at a mid-teens FCF multiple while FCF is still inflecting steeply — the AV fear
      is doing the discounting.
  - label: Advertising is the hidden high-margin lever.
    body: '>$2B run-rate, +50%, near-100% incremental margin — the single biggest take-rate/margin-expansion driver, embedded
      in the segments.'
  - label: Uber One + multi-product flywheel.
    body: ~50M members driving ~half of gross bookings; rides+eats+ads on one app deepen switching costs.
  - label: AV could be a tailwind, not just a threat.
    body: Waymo on Uber outproduced 99% of human drivers; Uber's aggregator strategy + ~$10B AV commitments position it as
      the demand layer.
  - label: $20B buyback, net cash.
    body: ~7% FCF yield funding a large buyback at a depressed multiple — accretive.
  triggers:
  - label: Bull validation
    body: autonomous trips scale on Uber's network profitably  ·  advertising passes $3B run-rate  ·  delivery margin converges
      toward mobility's 8% of GB  ·  GB stays mid-teens+
  - label: Bear validation
    body: a major AV fleet (Waymo/Tesla) scales direct-to-consumer  ·  driver reclassification raises the cost base  ·  GB
      decelerates to mid-single
  - label: Reframe needed
    body: if AV demonstrably disintermediates the driver-marketplace (fleets bypass Uber's demand), re-rate the network durability
      + terminal toward a commoditized-logistics multiple
glossary:
- term: Gross bookings (GB)
  definition: Total value of rides+eats+freight (~$193.5B FY25); revenue is GB x ~27% take rate — the top of the model.
- term: AV / autonomy paradox
  definition: Uber's strategy to be the demand aggregator for all AV fleets is also its vulnerability — a winning fleet could
    bypass the marketplace.
- term: Network economies
  definition: 'Helmer Power: more riders <-> more drivers -> lower wait/price -> more riders; the deepest two-sided marketplace
    globally.'
- term: Uber One
  definition: ~50M-member subscription driving ~half of gross bookings; the frequency/retention + switching-cost flywheel.
- term: FCF margin
  definition: Free cash flow / revenue (~19% FY25, rising); the mature-DCF lever as ads + delivery margin mix up.
competitive:
  arena: Global mobility + delivery — Uber (two-sided rides + eats network, ads, Uber One) vs Lyft (rides), DoorDash (delivery),
    and the autonomous-vehicle stack (Waymo, Tesla); defending a network Power whose driver-supply side autonomy could commoditize.
  lens: power_audit
  powers:
    scale_economies:
      score: 3
      note: Largest GB base spreads fixed tech/insurance/support; data + routing density.
    network_economies:
      score: 3
      note: 'The dominant Power: two-sided liquidity flywheel, deepest marketplace globally.'
    counter_positioning:
      score: 1
      note: Was the disruptor; AV-native players could counter-position against the human-driver model.
    switching_costs:
      score: 2
      note: Uber One (~50M, ~half of GB) + cross-product habit; real but not deep.
    branding:
      score: 2
      note: '''Get an Uber'' verb; default global ride-hail brand.'
    cornered_resource:
      score: 1
      note: No durable exclusive asset; the AV stack is the cornered resource Uber lacks (Waymo/Tesla have it).
    process_power:
      score: 2
      note: Matching/pricing-algorithm + multi-product operational edge.
  dominant_power: network_economies
  durability: medium-high
  rivals:
  - name: Waymo (Alphabet)
    kind: incumbent-division
    note: AV leader; runs on Uber in Austin/Atlanta but separating in Dallas/SF — partner turning competitor.
    growth: null
    margin: null
    multiple: n/a
  - name: Tesla
    kind: public
    note: Camera-only robotaxi bet; could go direct-to-consumer and bypass the marketplace.
    growth: null
    margin: null
    multiple: n/a
  - name: DoorDash
    kind: public
    note: US delivery leader; richer EV/EBITDA, faster GOV growth.
    growth: 0.27
    margin: null
    multiple: ~25x EV/EBITDA
  - name: Lyft
    kind: public
    note: 'Distant #2 in US rides; sub-scale margin.'
    growth: 0.15
    margin: 0.029
    multiple: sub-scale
  threats:
  - vector: network_economies
    who: Waymo/Tesla direct-to-consumer AV
    falsifier: A major AV fleet scales D2C robotaxi without Uber's demand layer.
  - vector: counter_positioning
    who: Driver reclassification
    falsifier: A major-jurisdiction gig-worker ruling structurally raises the labor-cost base.
  - vector: scale_economies
    who: DoorDash / Lyft competition
    falsifier: DoorDash extends its delivery lead or Lyft regains rides share, compressing take rate.
  takeaway: 'Uber''s network economies + scale are genuinely dominant — the deepest two-sided marketplace, now throwing off
    ~$10B FCF with advertising and delivery margins still ramping. The entire terminal-value debate is the autonomy paradox:
    the network power is durable only if Uber remains the demand aggregator for AV fleets. At ~14x EV/FCF the market is pricing
    meaningful AV-disruption risk; the sign of the memo hinges on whether autonomy commoditizes the driver-supply side (ultra-bear
    -44%) or Uber tolls the cheaper AV rides (base +55%).'

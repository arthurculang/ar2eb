  # ───────────────────────────────────────────────────────────────────────────
  bear:
    label: Bear
    short_label: Bear
    probability: 0.20
    expected_per_share: 277.34
    headline: "Hugo lands; multiple resets to 33×."
    narrative:
      - >
        The pessimistic case takes the new competitive landscape seriously.
        Medtronic Hugo received FDA urology clearance in December 2025 — the
        first credible US soft-tissue robotics competitor in 25 years.
        General-surgery and GYN clearances follow within 18-24 months. Hugo
        takes 8-12% of new system placements by FY28, primarily at
        price-sensitive community hospitals. J&J Ottava enters trials and
        erodes the "no real competition" narrative; CMR Versius takes
        multi-specialty community share.
      - >
        Revenue growth decelerates from 23% (Q1 2026) toward 9% by FY28 and
        5% by FY30 as urology + gynecology mature and general surgery
        competes with Hugo on price. Operating margin holds at 27-29% — Hugo
        competitive-bid gross-margin pressure offset by mix toward
        higher-margin instruments/services on the installed base. The
        multiple resets from ~55× toward 33× FCF.
      - >
        Exit-multiple SOTP: $88B op EV + $9.5B cash = $97B equity ÷ 350M
        shares = ~$277/share on the model. Bear isn't existential — it's the
        "growth-software-loses-its-premium" trajectory. ISRG remains a great
        business at $277 (still ~28× FCF) — just not a great stock from $436.
    probability_rationale: >
      The competitive landscape genuinely shifted in late 2025: Hugo FDA
      clearance + J&J Ottava trials + CMR Versius commercial launch. History
      suggests soft-tissue medtech incumbents lose 5-15 points of share over
      five years when the first credible competitor lands (analog: Stryker
      Mako vs Zimmer ROSA in ortho — Stryker held but lost some new-account
      placements). The 20% weight reflects that competitive entry has already
      happened — higher base rate than the ultra-bear — but the multiple
      compression from ~55× to 33× FCF is the dominant driver, more than the
      revenue erosion. Q1 2026 procedure growth (17%) says we're not in this
      scenario yet; bear is the FY27-28 thesis.


  # ───────────────────────────────────────────────────────────────────────────
  bull:
    label: Bull
    short_label: Bull
    probability: 0.16
    expected_per_share: 800.86
    headline: "dV5 + general surgery wins; 52× holds."
    narrative:
      - >
        The bull case is that da Vinci 5 unlocks the general-surgery TAM —
        the unfought ~70% of US soft-tissue procedures still done open or
        laparoscopically — AND ISRG defends share against Hugo. dV5's force
        feedback, on-board insufflation, and Iris imaging hit critical mass
        in 2027-28; placements accelerate to 2,500+/yr. Ion sustains 30%+
        procedure growth toward a $1.5B revenue line. Cardiac clearance
        translates to real volume. Japan, Korea, Brazil penetrate at pace.
      - >
        Revenue accelerates above guidance: 17-18% CAGR through FY28,
        moderating to 12% by FY30. Operating margin expands toward 34% as
        the high-margin instrument/service razor outpaces systems. FCF
        reaches ~$6.9B by FY30. The market doesn't compress the multiple
        because growth re-accelerates — ~52× FCF sustains. Exit-multiple
        SOTP: $269B op EV + $9.5B cash = $279B equity ÷ 348M shares =
        ~$801/share. +83% from spot.
      - >
        The bull doesn't require Hugo to fail — it requires da Vinci 5 to be
        meaningfully better than Hugo at general surgery, which is what
        surgeons who've used both report so far. Platform width (cardiac,
        general, GYN, urology, thoracic, bariatric, hernia, colorectal) is
        the moat: Hugo competes in 1-2 specialties at a time.
    probability_rationale: >
      da Vinci 5 captures general surgery (vs Hugo's urology-first rollout)
      AND ISRG holds 85%+ of incremental US placements through FY28 AND Ion
      scales to ~$1.5B revenue AND the multiple sustains at ~52× FCF. The 16%
      weight is reasonable because (a) Q1 2026 dV5 placement velocity (232 vs
      147 prior year) supports the dV5 thesis, (b) general surgery is the
      largest unfought TAM and ISRG has a structural advantage, but (c)
      sustained 50×+ multiples require continued category leadership that
      competitive entry directly threatens. Not the base case but a real
      possibility — especially if the May 2026 recall stays contained to one
      product line.


# ═════════════════════════════════════════════════════════════════════════════
# SCENARIOS
# Mature-Company DCF: 5-year explicit period (FY26 → FY30). Exit-multiple
# terminal value (see schema note 3). All dcf_path arrays are length-5.
# Probabilities: ultra_bear 6 / bear 25 / base 48 / bull 16 / ultra_bull 5
# (2026-07-24 re-underwrite: base->bear 4pts on guided H2 deceleration;
# ultra_bull->bear 1pt on the evidenced-against China conditional).
# ═════════════════════════════════════════════════════════════════════════════

scenarios:

  # ───────────────────────────────────────────────────────────────────────────
  # ULTRA_BEAR — coordinated shock, not slow erosion. Mirror of ultra_bull.
  # ───────────────────────────────────────────────────────────────────────────
  ultra_bear:
    label: Ultra Bear
    short_label: UltBear
    probability: 0.06
    expected_per_share: 142.15
    headline: "GLP-1s + Hugo + recall."
    narrative:
      - >
        The ultra-bear is a coordinated shock, not slow erosion. GLP-1
        penetration compresses US bariatric volumes 30-40% over five years;
        Medtronic Hugo wins meaningful urology share (15-20% of new
        placements by FY28) and gets general-surgery clearance FY27; J&J
        Ottava launches commercially FY27 and takes 5-8% of share; and a
        recurring quality/recall cycle (the May 2026 SureForm 30 Class I
        recall was the warning shot) compresses operator confidence.
      - >
        Procedure growth collapses from 17% to ~6% by FY28, then 2%
        terminal. Installed-base growth halves from 12% to 5-6%. System
        ASPs compress as competitive bids force Xi-account discounting.
        Operating margin compresses from 29% to 22% on defensive spend.
        The multiple resets toward 28× FCF as the "monopoly
        compounder" narrative breaks. Exit-multiple SOTP: $42B op EV +
        $8.63B cash = $51B equity ÷ 358M shares = ~$142/share — a -59% tail.
    probability_rationale: >
      Joint conjunction of four largely independent risks: (a) GLP-1
      bariatric drag at the high end — this scenario needs ~30-40% volume
      compression, while Q2 2026 put the observed US bariatric decline at
      high-single-digits; (b) Hugo + Ottava combined share gain >15% over
      five years, requiring both to scale and hospitals to multi-source;
      (c) a quality/recall cycle that compresses the multiple structurally;
      (d) core-specialty (urology, GYN) procedure mix maturing earlier than
      expected. Each individually 15-25% conditional; joint stays at 6% —
      the conjunction requires multiple moats to break simultaneously
      within five years, faster than incumbents typically lose share in
      regulated medtech (historical base rate: 8-12 years for a
      soft-tissue leader to lose 20+ points of share).

    dcf_metrics:
      cagr_5y: 5.2            # 5y revenue CAGR (%) — implied by rev_path
      wacc: 0.105            # discount rate — structural-decline premium
      installed_base_fy30: 14500   # da Vinci systems at FY30 (vs 11,106 today)
      exit_fcf_multiple: 28   # terminal multiple — compression from ~55x


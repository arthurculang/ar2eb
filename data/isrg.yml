competitive:
  arena: >
    Soft-tissue robotic surgery — da Vinci's installed base vs. emerging challengers
    (Medtronic Hugo, J&J Ottava, CMR Surgical Versius, MicroPort Toumai) for the global
    multi-specialty minimally-invasive surgery platform standard.
  lens: power_audit
  powers:
    scale_economies:     { score: 3, note: "11,710 systems installed; instrument/service volume amortizes R&D no challenger matches." }
    network_economies:   { score: 2, note: "Surgeon training + case-data flywheel (Case Insights) compounds with the installed base." }
    counter_positioning: { score: 1, note: "Challengers catch up on model, not displace it; weak collateral-damage barrier." }
    switching_costs:     { score: 3, note: "Sunk capital + surgeon retraining + hospital workflow lock-in; razor/blade recurring revenue." }
    branding:            { score: 3, note: "da Vinci is the category synonym; surgeon and hospital default." }
    cornered_resource:   { score: 2, note: "Deep patent estate (many now expiring) + the installed base itself as a distribution asset." }
    process_power:       { score: 2, note: "Two decades of manufacturing/service learning-curve and reliability data." }
  dominant_power: switching_costs
  durability: high
  rivals:
    - { name: "Medtronic (Hugo)", kind: public, note: "FDA-cleared (urology) Dec 2025; GS + GYN 510(k)s filed Jun 2026; bundled into a broad device channel.", growth: 0.10, margin: 0.25, multiple: "~17x EV/EBIT" }
    - { name: "J&J MedTech (Ottava)", kind: public, note: "FORTE pivotal met May 2026; FDA De Novo grant reported Jul 2026; Ethicon stapling tie-in.", growth: 0.06, margin: 0.28, multiple: "~16x EV/EBIT" }
    - { name: "CMR Surgical (Versius)", kind: private, note: "Modular, lower-cost; OUS traction.", growth: 0.30, margin: null, multiple: "private" }
    - { name: "MicroPort MedBot (Toumai)", kind: public, note: "Leading Chinese domestic system — 200+ global commercial installations, 300+ orders; EU market access mid-2026." }
  threats:
    - { vector: counter_positioning, who: "Medtronic / J&J", falsifier: "ISRG procedure growth < 10% for 2 consecutive years while a rival's installed base passes 1,000 systems." }
    - { vector: counter_positioning, who: "MicroPort (Toumai) + domestic Chinese entrants", falsifier: "ISRG China revenue declines YoY for 2 consecutive years, or Toumai's installed base outside China passes 1,000 systems." }
    - { vector: switching_costs, who: "Hospitals (capital pressure)", falsifier: "da Vinci placement mix shifts to lease/usage > 50%, signaling pricing-power erosion." }
  takeaway: >
    A wide, durable moat anchored on switching costs and scale — the basis for the DCF's
    premium terminal multiple; challengers are real but years from the installed-base and
    brand barriers. Watch procedure growth as the erosion gauge.

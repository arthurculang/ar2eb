  base:
    label: Base
    short_label: Base
    probability: 0.52
    expected_per_share: 494.74
    headline: "Mid-teens growth; razor compounds."
    narrative:
      - >
        The middle path: ISRG executes on a near-monopoly that erodes slowly,
        not catastrophically. FY26 guidance (13.5-15.5% procedure growth)
        lands at the midpoint. da Vinci 5 keeps ramping — ~1,500 systems
        today toward ~5,000 by FY30 — driving a mid-single-digit utilization
        tailwind on the installed base. Ion scales (39% Q1 procedure growth
        annualizes toward 25-30%). Cardiac clearance opens a ~$2B incremental
        specialty.
      - >
        Hugo lands, but at the pace medtech rollouts actually run: 5-7% of
        new placements by FY28, mostly at community hospitals Intuitive was
        always going to fight for. The installed-base switching cost —
        surgeon retraining, instrument inventory, service contracts — keeps
        the 11,000+ existing systems sticky. Recurring mix climbs from 78% to
        81% as services and instruments compound on installed-base growth.
      - >
        Revenue: $10.1B → ~$17B by FY30 (~12% CAGR). Operating margin expands
        from 29% to 32% on Norcross + Mexicali manufacturing scale. FCF: $2.5B
        → ~$4.9B. The multiple compresses modestly from ~55× to ~45× FCF as
        growth decelerates. Exit-multiple SOTP: $165B op EV + $9.5B cash =
        $174B equity ÷ 352M shares = ~$495/share. Modest upside from spot —
        what a mature compounder offers when the moat is already mostly priced.
    probability_rationale: >
      Modal outcome. Q1 2026 just printed 23% revenue and 17% procedure
      growth — the base case is in motion, not a future call. FY26 guidance
      (procedures 13.5-15.5%, gross margin 67.5-68.5%, opex 11-14%) implies a
      slight deceleration but no inflection. Hugo competitive entry is real
      but slow — 18-24 months to general-surgery clearance, 3-5 years to
      material share. da Vinci 5 reaccelerates installed-base utilization.
      The 52% weight is higher than ZM's base (50%) because (i) Q1 2026
      actuals already validate the trajectory and (ii) the moat (surgeon
      training, switching cost, FDA data) provides more inertia than ZM's
      seat-based SaaS contracts.


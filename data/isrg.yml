  extras:
    - "11,710 da Vinci installed base"   # masthead extra — the moat in one number

# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Intuitive's soft-tissue near-monopoly — 11,710 da Vinci systems, ~78%
  recurring revenue — now trades at ~38× forward P/FCF after the market
  priced in part of the bear's compression. Does that multiple
  over-discount erosion (Hugo, Ottava, GLP-1s) that Q2 actuals don't yet
  show, or is the compression only beginning?

thesis: >
  Intuitive trades at $345.74 ($122.7B cap) — down ~21% since May, including
  −14.1% on Jul 17: Q2 beat every line (revenue +19%, non-GAAP EPS +28%,
  procedures +16%, margin guide raised) yet guidance was steered to the
  midpoint, implying H2 deceleration. Still: ~78% recurring revenue, 11,710
  systems, $8.63B cash, zero debt. But the bear is live: Hugo cleared US
  urology (Dec 2025), GS/GYN 510(k)s filed (Jun 2026); Ottava passed FORTE,
  FDA nod reported in July; GLP-1s shave bariatric volumes; a May 2026
  Class I recall dented the record. Mature-Company DCF with exit-multiple
  terminal framing below; five scenarios, weighted; show your work.


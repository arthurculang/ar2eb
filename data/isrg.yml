# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Is Intuitive's near-monopoly in soft-tissue surgical robotics — 11,100
  da Vinci systems, ~78% recurring revenue — durable enough to outrun the
  first credible competitors (Hugo, Ottava, Versius) and justify a 50-60×
  forward P/FCF, or is this peak-platform pricing?

thesis: >
  Intuitive trades at $436.64 ($155B mkt cap) on FY25 revenue $10.1B, ~$2.5B
  FCF, $9.5B cash, zero debt. Structurally enviable: ~78% recurring revenue,
  an 11,106-system installed base growing 12% YoY, 17% procedure growth in
  Q1 2026, and a 26-year moat no soft-tissue competitor has broken. But the
  bear case is finally non-trivial: Medtronic Hugo won FDA urology clearance
  Dec 2025, J&J Ottava is in trials, GLP-1s threaten bariatric volumes, and a
  May 2026 Class I recall compressed the multiple. Mature-Company DCF with
  exit-multiple terminal framing below; five scenarios, weighted; show your
  work.


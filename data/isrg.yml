  base:
    label: Base
    short_label: Base
    probability: 0.48
    expected_per_share: 492.27
    headline: "Mid-teens growth; razor compounds."
    narrative:
      - >
        The middle path: ISRG executes on a near-monopoly that erodes slowly,
        not catastrophically. FY26 guidance (13.5-15.5% procedure growth)
        lands at the midpoint management now points to. da Vinci 5 keeps
        ramping — 246 placements in Q2 2026, toward ~5,000 systems by FY30 —
        driving a mid-single-digit utilization tailwind on the installed
        base. Ion scales (+36% Q2 procedure growth annualizes toward
        25-30%). Cardiac clearance opens a ~$2B incremental specialty.
      - >
        Hugo lands, but at the pace medtech rollouts actually run: 5-7% of
        new placements by FY28, mostly at community hospitals Intuitive was
        always going to fight for. The installed-base switching cost —
        surgeon retraining, instrument inventory, service contracts — keeps
        the 11,000+ existing systems sticky. Recurring mix climbs from 78% to
        81% as services and instruments compound on installed-base growth.
      - >
        Revenue: $10.1B → ~$17B by FY30 (~12% CAGR). Operating margin expands
        from 29% to 32% on Norcross + Mexicali manufacturing scale. FCF: $2.5B
        → ~$4.9B. The multiple compresses modestly toward ~45× FCF as
        growth decelerates. Exit-multiple SOTP: $165B op EV + $8.63B cash =
        $173B equity ÷ 352M shares = ~$492/share — +42% from spot; the −21%
        derating moved the modal case from roughly-priced to well above the
        price.
    probability_rationale: >
      Modal outcome. Q2 2026 beat every line — revenue $2.89B +19%, non-GAAP
      EPS +28%, procedures +16%, gross-margin guide raised to 68-69% — and
      dV5 placements accelerated again (246 after Q1's 232). The trajectory
      is in motion, not a future call. The weight trims from 52% to 48%
      because management held FY26 guidance but steered to the midpoint (H2
      deceleration from H1's ~15%) and Hugo's clearance clock is running
      faster than "slow" — GS/GYN 510(k)s landed six months after urology.
      Still the mature-band modal weight (ZM 50, LULU 45): the moat (surgeon
      training, switching cost, FDA data) provides more inertia than
      seat-based SaaS contracts, and nothing in Q2 actuals validates the
      bear yet.


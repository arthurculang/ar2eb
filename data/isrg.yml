  # ───────────────────────────────────────────────────────────────────────────
  bear:
    label: Bear
    short_label: Bear
    probability: 0.25
    expected_per_share: 274.86
    headline: "Hugo lands; multiple resets to 33×."
    narrative:
      - >
        The pessimistic case takes the new competitive landscape seriously.
        Medtronic Hugo received FDA urology clearance in December 2025 — the
        first credible US soft-tissue robotics competitor in 25 years — and
        filed general-surgery and GYN 510(k)s just six months later (Jun
        2026), the fast end of the clearance clock. Hugo takes 8-12% of new
        system placements by FY28, primarily at price-sensitive community
        hospitals. J&J's Ottava — FORTE pivotal met, FDA nod reported Jul
        2026 — erodes the "no real competition" narrative; CMR Versius takes
        multi-specialty community share.
      - >
        Revenue growth decelerates from 19% (Q2 2026) toward 9% by FY28 and
        5% by FY30 as urology + gynecology mature and general surgery
        competes with Hugo on price. Operating margin holds at 27-29% — Hugo
        competitive-bid gross-margin pressure offset by mix toward
        higher-margin instruments/services on the installed base. The
        multiple resets from ~55× toward 33× FCF.
      - >
        Exit-multiple SOTP: $88B op EV + $8.63B cash = $96B equity ÷ 350M
        shares = ~$275/share on the model. Bear isn't existential — it's the
        "growth-software-loses-its-premium" trajectory. ISRG remains a great
        business at $275 (still ~27× FCF) — from $346 a real but bounded −21%.
    probability_rationale: >
      The competitive landscape genuinely shifted: Hugo's Dec-2025 urology
      clearance was followed six months later by GS + GYN 510(k) filings
      (Jun 2026), and Ottava's FORTE pivotal met its endpoints. History
      suggests soft-tissue medtech incumbents lose 5-15 points of share over
      five years when the first credible competitor lands (analog: Stryker
      Mako vs Zimmer ROSA in ortho). The weight rises from 20% to 25% on
      management's own words, not price action: FY26 procedure guidance was
      held but steered to the midpoint — H2 deceleration from H1's ~15% —
      with US da Vinci +12% vs +16% worldwide, US bariatric down
      high-single-digits on GLP-1s, and the ACA enhanced-subsidy expiration
      a named "modest adverse impact." Q2 actuals (procedures +16%, dV5 246
      placements) say we're not in this scenario yet; bear is the FY27-28
      thesis, and the multiple reset toward 33× is the dominant driver.


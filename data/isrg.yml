# ═════════════════════════════════════════════════════════════════════════════
# isrg.yml — Intuitive Surgical (NASDAQ: ISRG)
# Canonical data file per memo-spec §6c.16
# Schema v003 · mature_company (Variant A — no SOTP)
# ═════════════════════════════════════════════════════════════════════════════
#
# SCHEMA NOTES:
#
# 1. dcf_type = mature_company. ISRG's $8.63B cash is only ~7% of mkt cap —
#    not material enough for SOTP framing (cf. ZM, where the Anthropic stake
#    demands it). Plain operating-DCF + cash.
# 2. dcf_path arrays are length-5 (5-year explicit DCF). rev_path stores
#    GROWTH RATES; rev_b is the anchor (FY25 actual revenue).
# 3. EXIT-MULTIPLE TERMINAL FRAMING. ISRG is a high-multiple compounder
#    (~55× FCF). A Gordon perpetuity at a defensible terminal growth
#    systematically undervalues it — the market correctly prices a
#    multi-decade moat that a 5-year-explicit + Gordon tail truncates. So
#    each scenario's terminal_value = exit_fcf_multiple × fcf[-1], with the
#    multiple matching the scenario narrative (compression in the bears,
#    sustained/expanding in the bulls). dcf_metrics.exit_fcf_multiple drives
#    the validator's terminal-value check (instead of Gordon). term_g is
#    retained as the long-run-growth display value but is NOT the terminal
#    driver.
# 4. dcf_metrics ticker-specific 3rd key: installed_base_fy30 (da Vinci
#    systems at year 5) — the single most diagnostic number (placement
#    velocity + geographic expansion + competitive displacement in one).
# 5. Five scenarios (ultra_bear / bear / base / bull / ultra_bull) per the
#    §6c.18 + §6c.11 pattern.
# ═════════════════════════════════════════════════════════════════════════════

# ── Ticker identity ─────────────────────────────────────────────────────────

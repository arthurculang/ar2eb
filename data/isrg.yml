  ultra_bull:
    label: Ultra Bull
    short_label: UltBull
    probability: 0.05
    expected_per_share: 1257.39
    headline: "Outside-OR + China + AI; 62× re-rate."
    narrative:
      - >
        The ultra-bull is ISRG inflecting on three independent axes at once.
        (1) Outside-OR / clinic deployment: dV5 compact configurations enable
        ambulatory-surgical-center placements at $500K-1M (vs $2.5M
        traditional), tripling the addressable TAM beyond hospital ORs. (2)
        China + India scale: China revenue grows from <$500M past $2B by
        FY30 — a leg that must now outrun domestic rivals (MicroPort's
        Toumai, 200+ commercial installations and EU market access mid-2026);
        India localized manufacturing enables local-market price points. (3)
        AI / autonomous
        surgery: ISRG's data moat (17M+ recorded procedures) becomes training
        data for semi-autonomous assistance — a new SaaS-like recurring line.
      - >
        Revenue compounds at ~19% CAGR — $10.1B → $25B+ by FY30. Operating
        margin reaches 36-37% as 90%+-gross-margin software/AI blends in.
        FCF: $2.5B → ~$9B. The market re-rates to growth-software multiples:
        ~62× FCF on a $9B base. Exit-multiple SOTP: $425B op EV + $8.63B
        cash = $434B equity ÷ 345M shares = ~$1,257/share. +264% from spot.
        This is the scenario where ISRG stops being "great mature medtech"
        and becomes "the SaaS-like platform for procedures."
    probability_rationale: >
      Joint conditional: outside-OR / ASC deployment scales (40% conditional
      on a dV5 compact form factor) AND China crosses $2B by FY30 (trimmed
      to ~20-25% conditional — MicroPort's Toumai, the leading domestic
      system with 200+ installations and mid-2026 EU access, contests the
      uncontested-penetration assumption) AND AI / autonomous-surgery
      monetization gets real (25% conditional on an FDA approval pathway for
      semi-autonomous assist) AND the multiple re-rates to 60-65× FCF (40%).
      Joint now lands at 5% (was 6%). Tail of tails — but ISRG has the
      installed base, the data moat, and the cash to actually attempt all
      three simultaneously.


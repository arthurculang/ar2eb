  takeaway: 'No durable Power is originated yet — like all AI-bio, RXRX has zero approved drugs, so switching costs, branding
    and scale economies are still latent. The one candidate is a cornered resource: the Phenomap dataset and BioHive-2 compute
    generate proprietary phenotypic data at a scale rivals cannot easily match. The bet is whether that data-and-Phenomap
    flywheel converts into repeatable approved drugs before well-capitalized private labs (Insilico, Isomorphic) or pharma''s
    own AI close the gap. The falsifier the bull must clear is the 2026-2027 readouts producing real clinical and royalty
    economics — until a drug ships, the resource is unproven and the Power window stays open, not won.'

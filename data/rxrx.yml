      $0.15B by FY35 at a 3% operating margin — as partnered programs stall and pharma interest in the platform fades. The
      discovery engine is real but never converts into product royalties.
    - With nothing to fund itself, the company raises roughly $1.15B over the decade, pushing the share count toward 970M.
      The DCF lands at −$0.24; the $0.80 distress floor and residual cash drive the expected value to $0.64. The bet expires
      worthless except for the balance sheet.
    probability_rationale: A 15% read. The platform has zero approved drugs and NVIDIA fully exited its equity in Feb 2026
      — a negative external signal. An 85% p_fail reflects that AI-bio has, industry-wide, not yet produced an approved drug.

  - metric: Approved drugs from AI discovery
    company: Zero
    best_rival: Zero (Insilico/Isomorphic/Schrodinger)
    verdict: even
  - metric: Proprietary phenotypic data scale
    company: Industry-leading Phenomap library
    best_rival: Smaller / model-based

central_question: At a ~37%-de-rated $3.15 with ~$1.3/share of net cash, is RXRX a cheap option on AI-drug-discovery validation,
  or a platform that funds itself toward dilutive stagnation?
thesis: Recursion runs an AI-drug-discovery platform — automated wet-lab Phenomaps plus an NVIDIA supercomputer — that maps
  cellular phenotypes to find drug candidates. After the Exscientia merger doubled the share count, it trades at $3.15 (~$1.6B
  cap), down ~37% YTD, on FY25 revenue of $74.7M that is entirely collaboration income — no approved drug. Funded into early
  2028, the near-term risk is dilution, not insolvency. The DCF asks whether the platform ever yields an economically-meaningful
  approved drug. Weighted fair value is $3.85, +22% above spot — but the modal base sits below the price, so the answer rides
  the right tail.

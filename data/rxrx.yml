weighting_rationale:
- label: Ultra Bear 15%
  body: Platform never delivers; milestone-only revenue, heavy dilution toward the cash floor.
- label: Bear 30%
  body: One or two small partnered wins; revenue stays sub-scale and dilution offsets it.
- label: Base 32%
  body: Modest validation — a few wins plus broader partnerships; ~$0.9B revenue, still dilutive.
- label: Bull 15%
  body: AI discovery becomes a real engine — multiple approvals, royalty and licensing income.
- label: Ultra Bull 8%
  body: Recursion OS becomes a dominant tech-bio platform; a pharma-scale outcome.
appendix:
  pushback:
  - label: Cash cushion is real
    body: ~$1.3/share of net cash and runway to early 2028 mean the near-term risk is dilution, not insolvency — the floor
      is firm.
  - label: Three pharma partners paying
    body: Roche/Genentech ($213M received), Sanofi ($134M, fifth milestone Feb 2026) and Bayer validate that pharma will pay
      for the platform.
  - label: De-rated price, fat right tail
    body: Down ~37% YTD, the equity is a cheap option — ~88% of the expected value sits in the bull and ultra-bull, priced
      lightly.
  - label: Compute-scale advantage
    body: BioHive-2 plus automated Phenomaps generate proprietary phenotypic data at a scale rivals cannot easily match —
      the raw material of a cornered resource.
  - label: Milestones could self-fund
    body: If readouts hit, milestone and royalty income reduce future raises, shrinking the dilution that drags the base and
      bear.
  triggers:
  - label: Bull validation
    body: REC-617 combo data (1H27) and REC-4881 registrational path (2H26) read out positive; new or expanded pharma deals
      with upfront and royalty terms; raises shrink as milestones fund spend.
  - label: Bear validation
    body: Pipeline readouts slip or disappoint; milestone revenue stays lumpy (Q1'26 was only $6.5M); an equity raise on weak
      terms confirms dilutive stagnation; partners do not expand.
  - label: Reframe needed
    body: A drug actually reaches approval and royalty economics, shifting the story from option-on-platform to cash-flow;
      or a partner walks and the platform thesis breaks.
glossary:
- term: Recursion OS
  definition: Recursion's integrated platform — automated wet-lab biology plus AI/supercomputing — for finding and advancing
    drug candidates.
- term: Phenomap
  definition: A large map of how cells change appearance (phenotype) under genetic or chemical perturbations, used to spot
    disease-relevant drug effects.
- term: Milestone / collaboration revenue
  definition: Payments from pharma partners (Roche, Sanofi, Bayer) for upfronts and progress, not from selling an approved
    product — RXRX's only revenue today.
- term: p_fail
  definition: The modeled probability the scenario ends in failure (no economically-meaningful drug), driving the equity toward
    the distress floor.
- term: Sales-to-capital (s2c)
  definition: How much new revenue each dollar of reinvested capital produces; sets how fast revenue can grow before fresh
    capital is needed.
- term: Distress floor
  definition: The ~$0.80/share residual value (cash and salvage) the equity defaults to in a failure outcome, setting a floor
    under the expected value.
competitive:
  arena: AI-driven drug discovery — turning proprietary biological data into approved drugs — where RXRX competes with private
    AI-bio labs, one public peer, and big-pharma in-house AI.
  lens: power_origination
  powers:
    scale_economies:
      score: 1
      note: Compute and wet-lab automation scale, but no fixed-cost moat until products generate revenue.
    network_economies:
      score: 0
      note: No two-sided network; more partners help data, but value does not compound across users.
    counter_positioning:
      score: 1
      note: Tech-bio model big pharma is slow to copy, but pharma is building its own AI in parallel.
    switching_costs:
      score: 1
      note: Multi-year collaborations create some stickiness, but partners run several AI vendors at once.
    branding:
      score: 0
      note: No brand power pre-approval; credibility rests on data, not name.
    cornered_resource:
      score: 2
      note: The Phenomap dataset and BioHive-2 are the strongest candidate — proprietary, hard to replicate at scale, but
        unproven as a drug-output advantage.
    process_power:
      score: 1
      note: Integrated discovery workflow is distinctive but not yet shown to produce approved drugs repeatably.
  dominant_power: cornered_resource
  window: open
  rivals:

      internally but underutilized as a third-party foundry, dragging margins. Operating margin matures around 8% — better
      than legacy services but well below cloud-software economics the current multiple implies. Cash burn averages $300-400M
      through FY29; two raises ($400M + $1.0B) at $50-30 prices add ~25M shares net. Final ~440M. With 18% within-scenario
      p_fail, DCF/share ~$5; expected ~$4.20.

      '

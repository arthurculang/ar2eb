    headline: Trapped-ion sidelined; equity wiped.
    narrative:
    - 'Structural failure. Quantum advantage on commercial problems takes longer than the bull-deck slides project (BCG''s
      revised "broad advantage 2030-2040" view); the NISQ era stays a science-fair through 2030. IonQ burns $400-600M annually
      to AQ#256 with no commensurate revenue ramp. Worse, trapped-ion architecture hits a fundamental scaling wall around
      AQ#100: ion-shuttling complexity, vacuum-chamber engineering, and laser-stability budgets all degrade nonlinearly. Quantinuum''s
      H-series, with the same physics and Honeywell''s industrial-scale manufacturing, edges ahead and consolidates the trapped-ion
      niche.

      '
    - 'Meanwhile superconducting (IBM Nighthawk, Google Willow) achieves first verified commercial advantage at a price IonQ
      can''t match per-shot. Neutral-atom scales past 2,000 atoms by FY28 and wins the cost curve. IonQ''s $470M RPO converts
      but never grows; FY30 revenue stalls below $400M against $500M+ cash burn including SkyWater fab opex. Cash exhausts
      mid-2029. Successive raises in 2028-2030 at $40 → $15 → $4 dilute holders 4×. By FY32 the SkyWater fab is sold for parts;
      IonQ taken private at a token premium. With 60% within-scenario p_fail, distress recovery ~$0.80. Expected per share
      ~$0.50.

      '
    probability_rationale: '10% reflects three compounding tail risks specific to trapped-ion: fundamental scaling ceiling
      around 100-500 qubits — credible physicists still debate this; Quantinuum''s commercial dominance within the trapped-ion
      category after its $12.7B IPO; the broader risk that "useful" quantum advantage stays elusive through 2030, starving
      the whole sector. Each individually 25-35%; conjunctive 8-12%. SkyWater acquisition adds $1.8B of fab opex risk if quantum
      demand doesn''t materialize.


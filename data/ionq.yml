thesis: 'IonQ trades at ~$26B against $64.7M Q1 2026 revenue and FY26 guide $260-270M — P/S >95×.
  $2.39B cash + $470M RPO + the $1.8B SkyWater chip-fab acquisition is the optionality.
  Trapped-ion gives ~99.9%+ 2Q fidelity; AQ#64 on Tempo hit three months early. But the
  competitive set is brutal: Quantinuum IPOs at $12.7B with better logical-qubit performance,
  Google''s Willow demonstrated verifiable advantage on chemistry, and neutral-atom scaled past
  1,200 qubits. Honest math: cash-feasible raise schedules force heavy dilution before commercial
  inflection. Five scenarios, weighted; show your work.

  '

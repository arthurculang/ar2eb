    - 'Execution exists but the market shape disappoints. IonQ delivers AQ#256 by 2027 and the SkyWater 200K-qubit chip in
      2028 — real milestones. But commercial demand stays government- and research-heavy: DARPA QBI, DOE, NQI, a handful of
      pharma POCs. Quantinuum''s deeper logical-qubit lead wins enterprise mind-share post-IPO; IonQ becomes the credible
      #2 in trapped-ion, capturing premium government accounts but losing the big AWS/Azure/GCP enterprise-deployment race
      to superconducting.

      '

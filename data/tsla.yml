weighting_rationale:
- label: Ultra Bear 18%
  body: Deliveries keep falling; pure auto multiple; ~$26 (-93%).
- label: Bear 30%
  body: Auto stabilizes, energy grows, no autonomy revenue; ~$46 (-89%).
- label: Base 30%
  body: Growth resumes, margins heal, autonomy begins; ~$83 (-79%).
- label: Bull 14%
  body: FSD ships, robotaxi scales, software margins; ~$194 (-52%).
- label: Ultra Bull 8%
  body: Robotaxi + Optimus + energy compound into a platform; ~$383 (-6%).
appendix:
  pushback:
  - label: The DCF ignores robotaxi/FSD/Optimus.
    body: Correct, and that is the point - those cash flows aren't in the auto+energy base, so they sit only in the bull/ultra-bull
      second act; what you pay above ~$100 IS that optionality, priced explicitly.
  - label: Energy storage is real and compounding.
    body: +25% YoY and high-margin, and it is in the model (the Energy + Services segment) - but at ~26% of revenue it can't
      carry a ~$1.5T cap; even the bear builds energy in and lands -89%.
  - label: Margins recovered to ~19% ex-credits in Q1'26.
    body: Auto GM ex-credits did recover, but the Q1'26 beat leaned on ~$230M warranty true-downs and tariff relief while
      FCF turned negative - margin quality, not just level, is the question.
  - label: The FSD data flywheel is a real process Power.
    body: Granted - fleet-scale driving data is a genuine, hard-to-copy edge, which is why the bull/ultra-bull carry a platform
      multiple; the issue is timing, as unsupervised FSD slipped to Q4 2026 at earliest.
  - label: Net cash, no solvency risk.
    body: $44.1B cash vs ~$1.6B debt (~$42.5B net cash) - immaterial against a ~$1.5T price; the downside is multiple/fundamentals,
      not survival; this is a valuation-vs-optionality memo, not a distress one.
  triggers:
  - label: Bull validation
    body: unsupervised FSD ships to consumers  ·  robotaxi fleet scales past pilot into paid ride-hail at scale  ·  Optimus
      reaches volume production  ·  auto deliveries return to growth with margin recovery
  - label: Bear validation
    body: deliveries decline a third straight year  ·  robotaxi stays a sub-100-vehicle pilot  ·  unsupervised FSD slips beyond
      2027  ·  operating margin stays below ~8% as price cuts continue
  - label: Reframe needed
    body: if autonomy/Optimus ship and scale into material revenue, re-underwrite as a software/robotics platform (origination
      lens), not a mature auto maker - that is the only path that closes the gap to ~$1.5T
glossary:
- term: Robotaxi / FSD
  definition: Tesla's autonomous ride-hail (~20-34-vehicle pilot) and Full Self-Driving (unsupervised Q4'26+) - the auto-model
    optionality.
- term: Optimus
  definition: Tesla's humanoid robot (V3 reveal pushed to ~Jul/Aug 2026, production 'quite slow') - a non-auto TAM only in
    the second act.
- term: Deliveries
  definition: Vehicles delivered per period; FY25 1.64M (-8.6%), the second straight annual decline, Tesla now smaller than
    BYD.
- term: EV/sales
  definition: Enterprise value / revenue (~16x FY25); extreme for a ~3%-declining, 4.6%-margin auto maker - embeds autonomy
    optionality.
- term: FCF margin
  definition: Free cash flow / revenue (~6.5% FY25); whether volume and margin recovery (and, in upper cases, software) convert
    to FCF.
competitive:
  arena: Global autos + autonomy/AI - Tesla (premium EV brand, FSD-data scale, energy storage) vs Toyota, BYD, Volkswagen
    in autos and Waymo and the autonomy/robotics field in the second act; auditing a branding + nascent process Power against
    auto-multiple compression.
  lens: power_audit
  powers:
    scale_economies:
      score: 3
      note: Real manufacturing scale (~1.6M units, gigacasting, vertically integrated batteries) and the largest charging
        network, but volume is now declining and below BYD.
    network_economies:
      score: 1
      note: Supercharger access and fleet effects are mild; cars aren't a network - the FSD data flywheel is the closest thing
        and is counted as process power.
    counter_positioning:
      score: 1
      note: Was the EV disruptor legacy autos couldn't follow; now the incumbent being counter-positioned on price by BYD
        and on EVs by everyone.
    switching_costs:
      score: 1
      note: Weak in autos (next car is a fresh decision); modest stickiness from Supercharging and the app/software ecosystem.
    branding:
      score: 3
      note: A genuine premium/technology brand with pricing power and a devoted base, but eroding in Europe (registrations
        -17%, 13th straight monthly decline) and politically polarized.
    cornered_resource:
      score: 2
      note: Fleet-scale real-world driving data and battery/charging assets - valuable and hard to replicate, though contestable
        as rivals scale data and fast-charging.
    process_power:
      score: 2
      note: 'Nascent and the bull''s swing factor: manufacturing know-how plus the FSD-data/AI training loop - potentially
        durable if autonomy ships, unproven at unsupervised scale.'
  dominant_power: branding
  durability: medium
  rivals:
  - name: BYD
    kind: public
    note: Now the larger EV maker; cost leader taking global share, especially outside the US - the core auto-compression
      threat.
    growth: 0.2
    margin: 0.06
    multiple: ~20x P/E
  - name: Toyota
    kind: public
    note: Scale/quality benchmark; hybrid-led, slow on EVs but vast cash generation - the mature-auto multiple Tesla is measured
      against.
    growth: 0.05
    margin: 0.1
    multiple: ~9x P/E
  - name: Volkswagen
    kind: public
    note: Legacy scale leader pushing EVs hard in Europe, where Tesla's brand is weakening.
    growth: 0.02
    margin: 0.05
    multiple: ~4x P/E
  - name: Waymo (Alphabet)
    kind: private
    note: Furthest-ahead robotaxi operator; the benchmark for whether Tesla's autonomy second act can actually scale.
    growth: null
    margin: null
    multiple: private
  threats:
  - vector: branding
    who: BYD / Volkswagen (price + EV share)
    falsifier: Deliveries decline a third year as BYD/VW take share and Europe registrations keep falling.
  - vector: process_power
    who: Waymo / autonomy slipping
    falsifier: Unsupervised FSD and robotaxi keep slipping past 2027, so the data flywheel never converts to autonomy revenue.
  - vector: scale_economies
    who: BYD cost leadership
    falsifier: Operating margin stays below ~8% as price cuts continue and volume growth doesn't return.
  takeaway: 'Tesla''s strongest Power is its premium brand, backed by a nascent FSD-data process Power - but the brand is
    eroding in Europe, volume now trails BYD, and on the auto+energy fundamentals operating margin has compressed to 4.6%
    across two straight delivery declines. The Audit: branding is durable (medium) and process_power is the live swing factor
    (the autonomy flywheel), but the threat that dominates the cash flows is auto-multiple compression. The DCF underwrites
    only those fundamentals and lands ~-75%; the robotaxi/FSD/Optimus optionality sits entirely in the ultra-bull second act,
    and even full platform success lands -6% - so the ~$1.5T price embeds the moonshots succeeding, not the car business.'

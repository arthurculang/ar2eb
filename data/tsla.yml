central_question: At ~$1.5T on a declining ~$95B auto base earning 4.6% margins, does the price hold on auto+energy fundamentals,
  or only if unsupervised autonomy and Optimus ship into real revenue?
thesis: Tesla trades at ~$1.5T (~$406, +27% TTM) - ~16x EV/sales on $94.8B revenue that fell ~3% in FY25, the second straight
  delivery decline (1.64M, -8.6%), with GAAP operating margin compressed to 4.6% from 16.8% in 2022. The DCF underwrites only
  the auto+energy cash flows; on those fundamentals the weighted finding is ~$101 (-75%). The robotaxi/FSD/Optimus optionality
  is real but lives entirely in the ultra-bull second act, and even that lands -6%. What you pay above ~$100 is the autonomy/robot
  option, not the car business - the modal case, an auto maker re-rating toward an auto multiple, is deeply negative.

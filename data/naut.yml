        mid-2027 near today's price, then successive dilutive rounds
        at falling prices as the equity story deteriorates. Share
        count balloons from 127M to ~1.87B (93% dilution). By FY36
        NAUT reaches just 0.5% of the $130B proteomics TAM — $600M
        revenue at 8% margin, profitable but tiny relative to the
        diluted share count.
      - >
        Operating EV remains negative through the DCF; total equity
        floors near zero per share. With 40% within-scenario distress
        probability and $0.15 distress recovery (residual cash + IP),
        expected per-share is $0.00 — equity wipeout. Nautilus becomes
        the cautionary tale of single-molecule proteomics: a real
        technology that never found a sustainable commercial fit
        against entrenched affinity-platform competitors.
    probability_rationale: >

      mature margins reach 20-25% (40% conditional) AND market gives NAUT
      credit for platform position via acquisition or independent re-rating
      (50%). Joint at 10-15%, reflected at 12%. The bull case isn't blocked
      by any single piece looking unlikely — it requires conjunctive execution
      AND a favorable competitive backdrop where affinity platforms

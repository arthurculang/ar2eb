    headline: "Single-molecule wins proteoforms."
    narrative:
      - >
        The bull case is that single-molecule resolution becomes the new gold
        standard for proteoform analysis. Tau success — FDA biomarker
        validation, mainstream adoption in Alzheimer's drug development —
        catalyzes broader category acceptance. Broadscale (H1 2027) delivers
        on the 10B-protein-mapping promise; customers adopt Voyager as the
        routine high-resolution workhorse alongside (not replacing) Olink
        and SomaScan.
      - >
        By 2030, NAUT operates 2,000+ instruments globally at $300-500K/yr
        each (instrument + reagents + assay subscriptions). Assay catalog
        expands from 2 to 15+ proteoform assays. Pharma partnerships drive
        multi-year recurring revenue. Operating margin reaches 22% by FY36 as
        software/assay mix shifts to higher-margin recurring revenue. NAUT
        becomes an obvious acquisition target for Thermo / Danaher / Bruker at
        premium multiples — or remains independent at platform-tools scale.
      - >
        The math: FY36 $2.0B revenue (1.5% of $130B TAM) at 22% op margin.
        Terminal value $9.06B at 8% WACC. PV terminal $3.52B, op_ev $3.59B,
        total equity $3.73B. Cumulative $0.75B raised at $3.50-22/share to
        ~196M shares (36% dilution). DCF $19.00/share. With 8% within-scenario
        p_fail and $1.50 distress: $17.60 expected. Bull case implies today's
        $2.40 is materially undervaluing the trajectory — but only with
        meaningful probability weight on dominance.
    probability_rationale: >
      Compound conditional: Voyager establishes single-molecule resolution as
      the new gold standard for proteoform analysis (40-50% conditional on
      execution) AND Tau success drives Alzheimer's research/biomarker
      mainstream adoption (50%) AND assay portfolio expands successfully to
      10-15+ proteoforms by 2030 (60% conditional on platform success) AND
      mature margins reach 20-25% (40% conditional) AND market gives NAUT
      credit for platform position via acquisition or independent re-rating
      (50%). Joint at 10-15%, reflected at 12%. The bull case isn't blocked
      by any single piece looking unlikely — it requires conjunctive execution
      AND a favorable competitive backdrop where affinity platforms
      (Olink at Thermo, SomaScan at SBT) don't simply absorb the single-
      molecule frontier into their existing reach. 12% (vs JOBY's 12%) reflects
      that NAUT's category is structurally similar to JOBY's (compound
      conditional venture-bet) but the path is somewhat clearer (commercial
      launch ~6 months out vs JOBY's still-pending Type Certification).


      molecule frontier into their existing reach. 12% (vs JOBY's 12%) reflects
      that NAUT's category is structurally similar to JOBY's (compound
      conditional venture-bet) but the path is somewhat clearer (commercial
      launch ~6 months out vs JOBY's still-pending Type Certification).


scenarios:

  # ───────────────────────────────────────────────────────────────────────────
  bear:
    label: Bear
    short_label: Bear
    probability: 0.35
    expected_per_share: 0.12
    headline: "Tech doesn't scale, capital exhausts."
    narrative:
      - >
        The pessimistic case is structural. Voyager's single-molecule resolution
        doesn't deliver at commercial scale: Tau Early Access data through
        2026-27 surfaces reproducibility or throughput limitations that cap
        broader adoption. Broadscale (H1 2027) slips or underwhelms. Customers
        default to affinity platforms (Olink at Thermo, SomaScan at SBT) for
        routine proteomics and to mass spec for high-end research, leaving
        single-molecule proteomics as a research-niche curiosity.
      - >
        Cash burns at $50M+/yr through 2027, then accelerates into
        commercial-launch investment. The $143M Q1 2026 position exhausts by
        mid-2028. Successive dilutive raises come at $1.00-2.00/share —
        eventually below cash-per-share. Cumulative ~$450M raised, total
        dilution 80%+. By FY36, NAUT reaches just 0.5% of the $130B proteomics
        TAM — $600M revenue, 8% margin, profitable but tiny relative to a
        7×-diluted share count.
      - >
        Equity heads toward distress recovery — IP, instruments, residual cash
        — yielding ~$0.30/share. With 40% probability of outright distress and
        a near-zero core DCF, expected per-share is $0.12. Nautilus becomes the
        cautionary tale of single-molecule proteomics: a real technology that
        never found a sustainable commercial fit against entrenched
        affinity-platform competitors.
    probability_rationale: >
      Pre-revenue single-molecule platforms face a stack of risks the public
      market knows well — IPO'd peers demonstrate the path is hard (Olink
      acquired by Thermo at a premium; SomaLogic merged into Standard BioTools
      at a discount; Quantum-Si still pre-revenue). NAUT-specific: Voyager's
      late-2026 commercial launch already slipped from earlier guidance; the
      Jan 2026 Early Access Program is real but narrow (Tau proteoforms first);
      $143M cash extends operations to mid-2029 but commercial scale-up
      requires a 2027-2028 dilutive raise. Bear case is structural — tech
      doesn't scale beyond niche, or proteoform analysis stays a research
      curiosity rather than a diagnostic/clinical workhorse. 35% scenario
      weight (vs JOBY's 30%) reflects: NAUT is one stage earlier than JOBY
      (fully pre-revenue vs commercial pilot operations), smaller cash buffer
      relative to capital needs, more direct established competition.
      Within-scenario 40% p_fail captures Nautilus-specific bankruptcy risk;
      the 35% scenario weight captures the broader bear world where
      single-molecule proteomics economics don't scale even with execution.


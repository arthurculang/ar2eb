      - >
        Through 2028-2030, the installed base grows from ~100 instruments to
        ~500. Average revenue per instrument settles at $250-400K/yr
        (instrument + consumables + assay subscriptions). NAUT raises ~$1.08B
        cumulatively at $3-14/share to fund commercial scale-up, lifting share
        count to ~293M (57% dilution). Operating margin crosses zero by 2030
        and scales toward 16% by 2036 — between commodity tools and specialty
        diagnostics.
      - >

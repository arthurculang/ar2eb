  ultra_bull:
    label: Ultra Bull
    short_label: UltBull
    probability: 0.03
    expected_per_share: 85.84
    headline: "Dominant + multiomics + take-rate."
    narrative:
      - >
        The ultra-bull case requires Voyager to become the dominant
        single-molecule proteomics platform AND for multiomics
        integration (proteomics + sequencing + cell biology) to emerge
        as the standard for both research and diagnostics. By 2030
        NAUT operates 5,000+ instruments globally. By 2034, an
        instrument-as-a-service / assay-take-rate model emerges with
        software-economics on a meaningful fraction of revenue — the
        Mobileye/Illumina platform-take-rate analog. This "multiomics
        becomes routine" leg is now openly contested: Illumina — which
        acquired SomaScan in Jan 2026 — is pairing affinity proteomics
        with its sequencing installed base and DRAGEN software to
        originate the same platform Power, so the conditional is more
        likely to occur but less likely to be NAUT-captured
        (probability held at the 3% tail floor).
      - >
        Compound conditional: Voyager wins the single-molecule race
        (30% conditional on Tau success) AND multiomics becomes
        routine (40% conditional on platform success) AND NAUT
        captures dominant share at 4%+ of $130B TAM (25% conditional
        on both) AND multiple expansion from tools to platform (50%
        conditional on all above). Joint at 1.5-3%. Reflected here at
        3%.
      - >
        By FY36: $5.4B revenue (4.2% TAM share), 30% op margin, market
        re-rates to platform multiple. The math: op_ev $16.49B, total
        equity $16.62B. Cumulative $0.65B raised at $2.25-55/share
        dilutes to 188M shares (32% dilution): DCF $88.40/share. With
        3% p_fail and $3.00 distress: $85.84 expected. Contributes
        $2.58 to weighted expected (3% × $85.84) — the asymmetric tail
        that justifies position sizing despite the modest probability
        weight.
    probability_rationale: >
      Tail of tails: requires every Bull condition to hit AND multiomics
      integration becomes routine (proteomics + sequencing + cell
      biology fused as the new research and diagnostic standard) AND
      NAUT captures dominant share at 4%+ of $130B TAM AND software-
      economics emerge via instrument-as-a-service / assay-take-rate
      model AND multiple re-rates from tools to platform. Each
      individually 30-50% conditional on the prior; joint at 2-4%. 3%
      weight matches JOBY and the book's tail floor. The broad-proteome
      leg it needs is the configuration that missed spec in Q2 2026;
      that risk sits in the 3% weight, while the second-act gate rests
      on the now peer-reviewed decode method.

    dcf_metrics:
      tam_share: 4.15
      p_fail: 3
      s2c: 1.6


    narrative:
      - >
        The ultra-bull case requires Voyager to become the dominant
        single-molecule proteomics platform AND for multiomics integration
        (proteomics + sequencing + cell biology) to emerge as the standard for
        both research and diagnostics. By 2030 NAUT operates 5,000+ instruments
        globally. By 2034, an instrument-as-a-service / assay-take-rate model
        emerges with software-economics on a meaningful fraction of revenue —
        the Mobileye/Illumina platform-take-rate analog.
      - >
        Compound conditional: Voyager wins the single-molecule race (30%
        conditional on Tau success) AND multiomics becomes routine (40%
        conditional on platform success) AND NAUT captures dominant share at
        3%+ of $130B TAM (25% conditional on both) AND multiple expansion
        from tools to platform (50% conditional on all above). Joint at 1.5-3%.
        Reflected here at 3%.
      - >
        By FY36: $4.0B revenue (3.1% TAM share), 30% op margin, market re-rates
        to platform multiple. The math: op_ev $14B, total equity $14.1B,
        139M shares after 10% dilution → DCF $101/share. With 3% p_fail
        and $3 distress: $98.14 expected. Contributes $2.94 to weighted
        expected (3% × $98.14) — the asymmetric tail that justifies position
        sizing despite the modest probability weight.
    probability_rationale: >
      Tail of tails: requires every Bull condition to hit AND multiomics
      integration becomes routine (proteomics + sequencing + cell biology
      fused as the new research and diagnostic standard) AND NAUT captures
      dominant share at 3%+ of $130B TAM AND software-economics emerge via
      instrument-as-a-service / assay-take-rate model AND multiple re-rates
      from tools to platform. Each individually 30-50% conditional on the
      prior; joint at 2-4%. Captures the scenario where NAUT joins the
      platform-tools tier (Thermo / Danaher / Illumina) rather than remaining
      a niche tools player. 3% weight matches JOBY's ultra-bull pattern
      (genuine tail-of-tails reflecting compound conditional + market
      re-rating).


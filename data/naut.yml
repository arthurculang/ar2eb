# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Will Nautilus capture meaningful share of a $130B global proteomics TAM by
  2036 with its Voyager single-molecule platform — or is today's $302M market
  cap pricing certainty about commercial economics that the late-2026 launch
  and early-2027 instrument installations haven't yet earned?

thesis: >
  NAUT trades at $2.40 ($302M market cap) with essentially zero revenue (~$0.5M
  FY26, mostly Michael J. Fox Foundation grant) and $143M cash — 47% of market
  cap is liquid. The Voyager single-molecule proteomics platform has been in
  Iterative Mapping Early Access since Jan 2026 with the Tau proteoforms assay;
  commercial launch opens pre-orders late 2026 with first instrument
  installations early 2027 and Broadscale (10B-protein mapping) general
  availability H1 2027. Cash runway extends to ~mid-2029 absent commercial
  scale-up; one dilutive raise is likely 2027-2028 to fund commercial
  expansion. Comparable mature peer set — Olink (acq. Thermo Fisher), SomaScan
  (merging into Standard BioTools), Quantum-Si, mass spec (Thermo Orbitrap,
  Bruker) — anchors terminal margins and addressable TAM. Pre-commercial
  young-company DCF below: TAM share × terminal margin × P(failure). Four
  scenarios, weighted; show your work.

# ── Page 3 chart-level reference data ───────────────────────────────────────

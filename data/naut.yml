      assays by 2030; installed base reaches 500-1000 instruments by 2030.
      NAUT reaches ~1-2% share of the $130B FY36 proteomics TAM — meaningful
      but not dominant. Mature operating margin ~15-18% — between commodity
      tools (~10%) and high-margin specialty diagnostics (~25%). Dilution
      from ~$1.08B of 2027-2029 raises at $3-14/share lands at ~57% total. The
      50% weight reflects that this is the modal outcome — most realistic for
      a strong technical team executing on a long timeline, but not requiring
      breakthrough commercial dominance against entrenched affinity-platform
      competitors (Olink/Thermo, SomaScan/SBT). Base case is well-executed but
      stays a niche player; multiple stays compressed.


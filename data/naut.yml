    body: "Single-molecule proteomics unproven at commercial scale; entrenched competition from affinity platforms (Olink/Thermo, SomaScan/SBT)."
  - label: "Base 50%"
    body: "Modal outcome: Voyager launches on schedule, ~1-2% TAM share by 2036, niche-but-real platform alongside affinity peers."
  - label: "Bull 12%"
    body: "Compound conditional: single-molecule becomes proteoform gold standard; Tau success catalyzes mainstream adoption."
  - label: "Ultra Bull 3%"
    body: "Tail of tails: dominant proteomics + multiomics integration + software-take-rate model + platform-multiple re-rating."


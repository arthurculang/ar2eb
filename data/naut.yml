# ═════════════════════════════════════════════════════════════════════════════
# naut.yml — Nautilus Biotechnology (NASDAQ: NAUT)
# Canonical data file per memo-spec §6c.16
# Schema v003 · 2026-05-22_02-09
# ═════════════════════════════════════════════════════════════════════════════
#
# v002 — second-round draft. Changes from v001:
#   - Raise schedules redesigned so cumulative cash ≥ 0 in every year
#     (spec §3.5 invariant; v001 had bear/base/bull/ultra all going
#     negative). Dilution materially higher across the board; bear floors
#     at $0.00 expected (equity wipeout under heavy dilution).
#   - Thesis + weighting_rationale trimmed to fit Page 1 left column
#     (overlap into scenario card band fixed).
#   - Weighted expected $6.58 / +174% vs spot $2.40 (post-§6c.11.2 widening; was $5.72 / +138%; v001 $7.02 / +193%).
#
# Same dcf_type/family as JOBY+AUR (young_company). NAUT is materially earlier-
# stage: fully pre-revenue, commercial launch ~6 months away, ~47% of market
# cap is cash. Asymmetric venture-bet structure typical of the family.
# ═════════════════════════════════════════════════════════════════════════════

# ── Ticker identity ─────────────────────────────────────────────────────────
ticker: NAUT
company: Nautilus Biotechnology
exchange: NASDAQ
dcf_type: young_company   # young_company | mature_company | mature_company_sotp
date: '2026-07-02'
spot: 1.84

# ── Market data ─────────────────────────────────────────────────────────────
market:
  market_cap_billion: 0.232
  shares_outstanding_million: 126
  cash_billion: 0.143        # Q1 2026 cash & equivalents ($143.4M)
  net_debt_billion: 0.0
  extras: []

# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Will Nautilus capture meaningful share of a $130B global proteomics TAM by
  2036 with its Voyager single-molecule platform — or is today's $302M market
  cap pricing certainty about commercial economics that the late-2026 launch
  and early-2027 instrument installations haven't yet earned?

thesis: >
  NAUT trades at $2.40 ($302M mkt cap, 47% in cash) on essentially zero
  revenue. The Voyager single-molecule platform: Tau Early Access since
  Jan 2026; commercial launch late 2026, first instrument installs early
  2027, Broadscale (10B-protein mapping) H1 2027. Cash to ~mid-2029;
  dilutive raise likely 2027-2028. Mature peers — Olink (Thermo),
  SomaScan (SBT), Quantum-Si, mass spec — anchor terminal margins and
  TAM. Young-company DCF: TAM × margin × P(fail). Five scenarios,
  weighted; show your work.

# ── Page 3 chart-level reference data ───────────────────────────────────────
chart_reference:
  tam_billion: 130                            # FY36 global proteomics TAM ($B)
  history_years: [2024, 2025, 2026]
  history_revenue: [0.000, 0.000, 0.001]      # essentially pre-revenue (FY26 MJFF grant)
  history_fleet: [0, 0, 0]                    # no commercial Voyager instruments deployed yet

# ── Page 3 chart-aesthetic config ───────────────────────────────────────
# Migrated out of the JSX (Phase 4) so per-ticker labels, peer references,
# titles, captions, and legend strings live next to their data. Compute-
# from-inputs principle for the print harness layout.
page3_chart_config:
  # Chart 2 — path to profitability: horizontal dotted reference line.
  peer_y: 20
  peer_text: "Mature life-science-tools peer median ~20%"
  # Chart 4 — fleet / unit growth.
  fleet_anchor: 1                             # log-scale floor; first commercial Voyager installs early FY27
  fleet_title: "Voyager instruments deployed (log)"
  fleet_reference: null                       # no horizontal reference (cf. AUR's 750K US Class 8 fleet)
  # Chart 5 — P/S valuation.
  valn_anchor_y: 5
  valn_anchor_text: "Mature tools P/S ~4-7×"
  valn_caption: "Bear, base = stretched on FY36 niche-rev; bull onward = cheap."
  # Chart 6 — TAM positioning at FY36.
  tam_title: "$130B global proteomics TAM (FY36) — NAUT share"
  tam_legend: ["NAUT", "Competitors (Olink / SomaScan / MS)", "Other proteomics"]


# ═════════════════════════════════════════════════════════════════════════════
# naut.yml — Nautilus Biotechnology (NASDAQ: NAUT)
# Canonical data file per memo-spec §6c.16
# Schema v003 · 2026-05-22_02-09
# ═════════════════════════════════════════════════════════════════════════════
#
# 2026-09 quarterly re-underwrite (Q2 2026 reset). Inputs re-anchored to the
# Q2 2026 10-Q / call (Jul 28 2026) and the Sep 11 2026 8-K ($125M at-market
# program): cash $129.2M, 127.3M shares, first equity tranche moved to FY27 at
# the observed ~$1 regime (base later tranches on a peer-bounded ladder),
# probabilities 20/23/44/10/3 after the Broadscale bear trigger tripped.
# Earlier drafts (v001/v002, spot $2.40) are superseded — see git history.
#
# Same dcf_type/family as JOBY+AUR (young_company). NAUT is earlier-stage:
# first revenue $0.19M (Q2 2026), shipments guided mid-2027, market cap close
# to last-reported cash. Tail-driven venture-bet structure typical of the family.
# ═════════════════════════════════════════════════════════════════════════════

# ── Ticker identity ─────────────────────────────────────────────────────────
ticker: NAUT
company: Nautilus Biotechnology
exchange: NASDAQ
dcf_type: young_company   # young_company | mature_company | mature_company_sotp
date: '2026-09-22'
spot: 0.95
# ── Market data ─────────────────────────────────────────────────────────────
market:
  market_cap_billion: 0.121
  shares_outstanding_million: 127.3   # 127,255,223 sh at 7/24/26 (Q2 2026 10-Q cover)
  cash_billion: 0.129        # Q2 2026 cash + equivalents + AFS investments ($129.2M, 6/30/26)
  net_debt_billion: 0.0
  extras: []

# ── Page 1 narrative content ────────────────────────────────────────────────

central_question: >
  Will Nautilus turn a peer-reviewed proteoform method into a shipping Voyager
  (mid-2027) and meaningful share of a $130B proteomics TAM by 2036 — or will a
  ~$1 stock and an armed at-market equity program force the dilution the bear
  cases model before revenue scales?

thesis: 'NAUT''s ~$1 stock values it at about its last-reported $129M of cash (Jun 30 2026), which a ~$13-14M quarterly burn erodes;
  first revenue was $0.19M. Q2 2026 reset the plan: Voyager ships mid-2027; Broadscale missed spec, undated. Runway into Q1 2028;
  a debt and/or equity raise is planned by mid-2027, with a $125M at-market equity program filed. Shipping peers — Olink (Thermo),
  SomaScan (Illumina), Alamar — anchor margins and TAM. Modal case ~30% below the price; 87% of the probability sits at or below it
  (43% at $0), so the value is in a 13% tail.'

# ── Page 3 chart-level reference data ───────────────────────────────────────
chart_reference:
  tam_billion: 130                            # FY36 global proteomics TAM ($B)
  history_years: [2024, 2025, 2026]
  history_revenue: [0.000, 0.000, 0.001]      # essentially pre-revenue (FY26 MJFF grant)
  history_fleet: [0, 0, 0]                    # no commercial Voyager instruments deployed yet

# ── Page 3 chart-aesthetic config ───────────────────────────────────────
# Migrated out of the JSX (Phase 4) so per-ticker labels, peer references,
# titles, captions, and legend strings live next to their data. Compute-
# from-inputs principle for the print harness layout.
page3_chart_config:
  # Chart 2 — path to profitability: horizontal dotted reference line.
  peer_y: 20
  peer_text: "Mature life-science-tools peer median ~20%"
  # Chart 4 — fleet / unit growth.
  fleet_anchor: 1                             # log-scale floor; first commercial Voyager shipments mid-FY27
  fleet_title: "Voyager instruments deployed (log)"
  fleet_reference: null                       # no horizontal reference (cf. AUR's 750K US Class 8 fleet)
  # Chart 5 — P/S valuation.
  valn_anchor_y: 5
  valn_anchor_text: "Mature tools P/S ~4-7×"
  valn_caption: "All paths < 0.5× FY36 sales: the discount is dilution and P(fail)."
  # Chart 6 — TAM positioning at FY36.
  tam_title: "$130B global proteomics TAM (FY36) — NAUT share"
  tam_legend: ["NAUT", "Competitors (Olink / SomaScan / MS)", "Other proteomics"]


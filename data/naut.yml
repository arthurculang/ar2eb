    narrative:
      - >
        The catastrophic tail: Voyager's single-molecule chemistry fails to
        validate at commercial scale at all. Tau Early Access (2026-27) surfaces
        disqualifying reproducibility or throughput limits, Broadscale never
        reaches spec after its Q2 2026 miss, and customers reject the platform outright for Olink /
        SomaScan affinity assays and mass spec. Revenue stalls near zero — about
        $0.30B by FY36, under 0.25% of the $130B proteomics TAM.
      - >
        NAUT still raises the ~$1.1B of dilutive capital trying to reach
        commercial scale (127M to ~2.3B shares at $0.34-0.70, 95% dilution), but the money is
        spent against a platform that never gains traction — the worst
        combination of full dilution and a failed product. Operating EV is
        deeply negative with no self-sustaining FCF base, so the terminal carries
        negative going-concern value rather than the bear's floored-at-zero.
      - >
        With 52% within-scenario distress probability and only $0.10 distress
        recovery (residual cash + fire-sale IP), expected per-share is $0.00 — a
        deeper wipeout than the bear, in which the platform at least reaches
        niche $0.60B revenue. This is the tail where single-molecule proteomics
        simply does not work as a commercial modality.
    probability_rationale: >
      The deepest-failure tail, separated from the bear so the downside is not
      one undifferentiated bucket (the convention across the rest of the book).
      20% weight reflects genuine technical / competitive failure risk for a
      near-pre-revenue single-molecule platform whose Voyager launch has slipped
      again (shipments now mid-2027) and whose competitors (Olink at Thermo, SomaScan at Illumina, mass spec) are
      entrenched. Distinct from the bear (which reaches sub-scale $0.60B but is
      diluted to zero): here the platform fails outright. Within-scenario 52%
      p_fail captures Nautilus-specific bankruptcy / wind-down risk at the extreme.


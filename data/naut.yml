      - >
        The bull case is that single-molecule resolution becomes the new gold
        standard for proteoform analysis. Tau success — FDA biomarker
        validation, mainstream adoption in Alzheimer's drug development —
        catalyzes broader category acceptance. A re-engineered Broadscale
        recovers from its Q2 2026 spec miss and delivers on the
        10B-protein-mapping promise; customers adopt Voyager as the
        routine high-resolution workhorse alongside (not replacing) Olink
        and SomaScan.
      - >
        By 2030, NAUT operates 2,000+ instruments globally at $300-500K/yr
        each (instrument + reagents + assay subscriptions). Assay catalog
        expands from 2 to 15+ proteoform assays. Pharma partnerships drive
        multi-year recurring revenue. Operating margin reaches 22% by FY36 as
        software/assay mix shifts to higher-margin recurring revenue. NAUT
        becomes an obvious acquisition target for Thermo / Danaher / Bruker at
        premium multiples — or remains independent at platform-tools scale.
      - >
        The math: FY36 $2.8B revenue (2.2% of $130B TAM) at 22% op margin.
        Terminal value $10.49B at 8% WACC. PV terminal $4.12B, op_ev $4.08B,
        total equity $4.21B. Cumulative $0.75B raised at $1.75-22/share (the
        first tranche by mid-2027) to ~244M shares (48% dilution). DCF
        $17.25/share. With 8% within-scenario p_fail and $1.50 distress: $15.99
        expected. The bull case implies today's ~$1 stock materially
        undervalues the trajectory — but only with meaningful probability
        weight on dominance.
    probability_rationale: >
      Compound conditional: Voyager establishes single-molecule resolution as
      the new gold standard for proteoform analysis (40-50% conditional on
      execution) AND Tau success drives Alzheimer's research/biomarker
      mainstream adoption (50%) AND assay portfolio expands to 10-15+
      proteoforms by 2030 (60% conditional) AND mature margins reach 20-25%
      (40% conditional) AND the market gives NAUT credit via acquisition or
      re-rating (50%). Joint at 10-15% before the Q2 2026 reset; reflected at
      10%, trimmed from 12% because Broadscale — this case's broad-proteome
      pillar — missed spec and is undated, and shipments slipped to mid-2027.
      The bull requires conjunctive execution AND a favorable backdrop where
      affinity platforms (Olink at Thermo, SomaScan at Illumina) don't simply
      absorb the single-molecule frontier.


appendix:
  pushback_side: bear
  pushback:
  - label: 'Peak revenue priced as durable.'
    body: 'Revenue doubled in a year and chip cycles always digest. Even a modal +65% FY28 that then fades capitalizes a peak; 45% of the weight sits below the price.'
  - label: 'The probe goes to revenue quality.'
    body: 'Reuters (Nov 20) reports SEC staff examining NVIDIA''s accounting; with $65.5B of private stakes, some in its own customers, part of the demand may be self-funded.'
  - label: 'The founder left at the peak.'
    body: 'Huang resigned Nov 12; an interim CEO who is also CFO now runs the Rubin ramp, the ASIC defence and the probe response at once - risk the DCF only partly prices.'
  - label: 'Margins have peaked.'
    body: 'Q4 gross margin is guided to a 71-72% trough on memory costs; price increases must offset it while AMD''s Helios ships to Meta (6GW) and custom ASICs scale.'
  - label: 'China is a structural $0.'
    body: 'Guidance assumes no China datacenter compute (only $2.4B of older Hopper shipped there in Q3); Huawei entrenches in a market once worth ~$15-50B a year.'
  triggers:
  - label: Bull validation
    body: 'Q4 FY27 revenue >= $130B at >= 71% gross margin  ·  FY28 outlook held at ~+75%  ·  2027 hyperscaler capex guides rise  ·  SEC review closes with no restatement'
  - label: Bear validation
    body: 'Q4 revenue < $126B (below the guide range)  ·  FY28 outlook cut  ·  a top-4 hyperscaler cuts 2027 capex  ·  a restatement or formal SEC action  ·  gross margin < 70%'
  - label: Reframe needed
    body: 'if the probe forces a restatement of revenue tied to NVIDIA''s own investments, or FY28 revenue falls below ~$530B, re-rate to the bear''s cyclical multiple'
glossary:
- term: Data Center
  definition: 'NVIDIA''s dominant segment (~93% of revenue, +110% YoY) - GPUs + networking; the thesis rides on its growth.'
- term: Hyperscaler capex
  definition: Cloud-provider (Microsoft/Amazon/Google/Meta) AI-infrastructure spending - the demand source and biggest swing.
- term: Annual cadence (Blackwell -> Rubin)
  definition: 'NVIDIA''s yearly architecture rhythm (Blackwell -> Ultra -> Rubin, now shipping); how it stays ahead of ASICs.'
- term: Custom ASICs
  definition: Purpose-built AI chips (OpenAI-Broadcom, hyperscaler in-house) fragmenting GPU procurement; the live threat
    at the margin.
- term: FCF margin
  definition: 'FCF / revenue (~39% FY27 to date), valued after ~3% stock comp.'
competitive:
  arena: 'AI accelerators / datacenter compute - NVIDIA (GPUs + networking + the CUDA software platform, ~88% Data Center)
    vs AMD, the hyperscaler custom-ASIC programs (OpenAI-Broadcom, in-house silicon), and Broadcom; auditing a cornered-resource
    (CUDA) + scale Power against custom silicon and a credible #2.'
  lens: power_audit
  powers:
    scale_economies:
      score: 4
      note: 'Massive R&D and supply scale at ~$424B revenue funds a once-a-year architecture cadence rivals struggle to match; the leader''s volume self-reinforces.'
    network_economies:
      score: 4
      note: The CUDA developer ecosystem - millions of developers, libraries, frameworks tuned to NVIDIA - is a genuine two-sided
        network that compounds with installed base.
    counter_positioning:
      score: 1
      note: None meaningful now - NVIDIA is the incumbent being attacked by lower-cost ASICs/AMD, not the counter-positioner.
    switching_costs:
      score: 4
      note: Code, models and full racks are written/optimized to CUDA + NVIDIA networking; re-platforming to ASICs or AMD
        is costly and risky - a real lock-in.
    branding:
      score: 2
      note: Strong reputation as the AI-compute standard, but the buy is governed by performance/TCO and ecosystem, not brand
        premium.
    cornered_resource:
      score: 5
      note: 'The dominant Power: CUDA + the integrated GPU/networking/software stack is a ~two-decade head start rivals cannot
        quickly replicate - the moat''s foundation.'
    process_power:
      score: 3
      note: Deep systems/packaging and supply-chain (CoWoS) execution feeding the annual cadence; real, but partly bought
        capacity others can also access.
  dominant_power: cornered_resource
  durability: high
  rivals:
  - name: AMD
    kind: public
    note: 'The credible #2; MI450/Helios began shipping late 2026 on Meta (6GW) and OpenAI (6GW) deals - the direct GPU challenger.'
    growth: 0.3
    margin: 0.25
    multiple: '66x fwd P/E'
  - name: Custom ASICs (hyperscalers)
    kind: public
    note: In-house AI silicon (Google TPU, plus new programs) fragmenting GPU procurement; reduces NVIDIA's wallet share at
      the largest buyers.
    growth: null
    margin: null
    multiple: captive
  - name: OpenAI-Broadcom
    kind: public
    note: 10GW of custom accelerators (Broadcom-designed) landing H2-2026 - the marquee defection from merchant GPUs to bespoke
      silicon.
    growth: null
    margin: null
    multiple: ~partnership
  - name: Huawei (Ascend)
    kind: private
    note: Entrenching in China as the closed-market alternative now that NVIDIA datacenter revenue there is $0; not a US/global
      threat yet.
    growth: null
    margin: null
    multiple: private
  threats:
  - vector: cornered_resource
    who: Custom ASICs (OpenAI-Broadcom, hyperscaler in-house silicon)
    falsifier: 'Custom silicon wins >20% of a top-4 hyperscaler''s 2027 accelerator spend, or Data Center growth drops below +25% YoY in an FY28 quarter.'
  - vector: switching_costs
    who: AMD (MI450/Helios, H2-2026)
    falsifier: 'AMD''s data-center GPU revenue tops 15% of NVIDIA''s Data Center revenue in any CY2027 quarter.'
  - vector: scale_economies
    who: A datacenter AI capex digestion/air-pocket
    falsifier: 'The big-4 hyperscalers guide 2027 capex below their ~$730B 2026 total, or NVIDIA guides a sequential revenue decline in an FY28 quarter.'
  takeaway: 'NVIDIA''s dominant Power is a cornered resource - CUDA plus the integrated GPU/networking/software stack, reinforced by switching costs, scale and a developer network - and it''s durable (high). The live threats are AMD''s Helios, now shipping to Meta, and custom ASICs at the margin; China is a permanent $0. The Power did not break this month; the price did, on the founder''s exit and a reported accounting probe. The Audit squares with the DCF: the swing factor is whether AI capex digests after a doubling year, and at ~7x sales the modal case lands +75% - weighted +48%.'

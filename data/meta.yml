appendix:
  pushback:
  - label: FY25 cash flow is a capex trough.
    body: FCF after stock comp was ~23% of revenue in FY24, before capex doubled; the base never climbs back above ~16%.
  - label: The capex ROI is the whole question.
    body: ~$130B/yr capex (~2x prior year) is the bear; volume AND price accelerated in Q1'26, and revenue still grew +28%
      in Q2.
  - label: Cash flow self-funds the buildout.
    body: Operating cash flow covered ~$70B of FY25 capex plus ~$26B of buybacks and ~$5B of dividends, and H1'26's $49B of
      capex.
  - label: AI is already monetizing in the core ad stack.
    body: Proprietary Muse Spark ad-creative and AI ranking are live; adopters doubled to ~8M, with impressions +19% and price/ad
      +12% Q1'26.
  - label: Breakup risk is materially reduced.
    body: Meta won the FTC antitrust trial (Nov-2025) and keeps Instagram/WhatsApp; the Jan-2026 appeal leaves a tail, not
      the breakup case.
  triggers:
  - label: Bull validation
    body: ad revenue stays >=20% with BOTH impressions and price/ad rising  ·  operating margin holds >=40% through the D&A
      step-up  ·  FCF after stock comp tops ~16% of revenue  ·  AI-ad adoption keeps compounding
  - label: Bear validation
    body: ad growth decelerates into the mid-single digits  ·  operating margin falls below ~38% as D&A outgrows revenue  ·  FCF
      after stock comp stuck near ~10% of revenue  ·  Reality Labs loss widens beyond ~$24B/yr
  - label: Reframe needed
    body: if the ~$130B/yr capex visibly fails to earn its cost of capital - ad growth fades while D&A keeps climbing - re-rate
      the terminal toward a slow-growth, capex-heavy ad utility
glossary:
- term: Family of Apps
  definition: Meta's core ad business - Facebook, Instagram, WhatsApp, Messenger (~99% of revenue, 41%+ margin); the social-graph
    ad engine the DCF rests on.
- term: Reality Labs
  definition: The AR/VR/metaverse segment (~$24B/yr operating loss, ~$80B cumulative); a structural drag on margin and the
    bear's concrete cost line.
- term: AI capex / ROI
  definition: The $130-145B FY26 buildout (~2x the prior ~$72B) of AI compute; whether it earns its cost of capital via faster,
    higher-priced ads is the biggest swing.
- term: Impressions x price/ad
  definition: The two ad-revenue drivers (Q1'26 +19% volume, +12% price); AI lifting both is the bull mechanism, a soft cycle
    the bear.
- term: FCF after stock comp
  definition: 'Free cash flow less stock comp, which reported FCF adds back: ~13% of revenue in FY25, ~23% in FY24; the valuation''s
    basis.'
competitive:
  arena: Digital advertising / social platforms - Meta (3B+ user social graph, ~$55B/qtr ads, 41% margin) vs Alphabet/Google,
    Amazon ads, TikTok/ByteDance, and Snap/Pinterest/Reddit; auditing a branding + network-economies + scale Power against
    the AI-capex ROI question.
  lens: power_audit
  powers:
    scale_economies:
      score: 4
      note: 'Massive: ~$200B revenue and a global ad/infra base spread fixed R&D and compute across 3B+ users; AI capex deepens
        the cost-per-impression advantage if it earns out.'
    network_economies:
      score: 4
      note: 'The core Power: the social graph compounds - more users and content make each app more valuable to users and
        advertisers; cross-app (FB/IG/WhatsApp) reinforces it.'
    counter_positioning:
      score: 1
      note: Was the mobile-social disruptor; now the incumbent being counter-positioned by TikTok's algorithmic feed, which
        forced the Reels response.
    switching_costs:
      score: 2
      note: 'Moderate: social graph + content history + creator relationships create stickiness, but users multi-home and
        attention is contestable.'
    branding:
      score: 3
      note: 'Real: Instagram/WhatsApp are category-defining consumer brands with global mindshare, though the corporate brand
        is contested and ad-trust is a perennial overhang.'
    cornered_resource:
      score: 2
      note: The 3B+ user behavioral/interest dataset and the social graph itself are hard to replicate; tempered by privacy
        regulation (DMA, ATT) constraining its use.
    process_power:
      score: 3
      note: AI ad-ranking, creative (Muse Spark) and infra are a compounding learning curve; the open question is whether
        the capex turns this into durable monetization.
  dominant_power: network_economies
  durability: high
  rivals:
  - name: Alphabet (GOOGL)
    kind: public
    note: The other ad duopolist - Search/YouTube + full AI stack; the scale/margin benchmark and direct ad-budget competitor.
    growth: 0.15
    margin: 0.32
    multiple: ~57x EV/FCF
  - name: Amazon (AMZN)
    kind: public
    note: Fastest-growing large ad platform (retail-media), taking share of performance budgets at the margin.
    growth: 0.13
    margin: 0.11
    multiple: ~4x EV/sales
  - name: ByteDance / TikTok
    kind: private
    note: The attention threat that forced Reels; algorithmic short-form competing directly for engagement and ad dollars.
    growth: null
    margin: null
    multiple: private
  - name: Snap / Pinterest / Reddit
    kind: public
    note: Sub-scale social-ad peers; pressure on incremental ad budgets, not the core graph.
    growth: 0.15
    margin: 0.08
    multiple: ~5x EV/sales
  threats:
  - vector: network_economies
    who: ByteDance / TikTok (attention)
    falsifier: Family DAP growth stalls or turns negative as engagement and time-spent shift to short-form rivals, capping
      the impression base.
  - vector: process_power
    who: AI-capex ROI (Alphabet's full stack)
    falsifier: Ad growth decelerates while D&A from the ~$130B/yr buildout keeps climbing - the spend fails to convert to
      durable monetization.
  - vector: cornered_resource
    who: Privacy regulation (DMA, ATT, FTC appeal)
    falsifier: EU 'pay or consent' / signal-loss erodes ad targeting and pricing, or the FTC appeal reopens the structural-separation
      risk.
  takeaway: 'Meta''s network-economies Power is genuinely durable (high): the 3B+ social graph compounds, reinforced by scale
    across a ~$200B ad base and the Instagram/WhatsApp brands - and revenue growth of +33% in Q1''26 and +28% in Q2 shows
    the engine still growing fast. The Audit: network economies dominates, scale and branding reinforce it, and the live threats
    are TikTok''s pull on attention, privacy regulation, and above all the ~$130B/yr AI-capex ROI. The Power does not rescue
    the price: at ~73x FCF after stock comp (~41x reported), the DCF lands a weighted -46.9%, the base ~51% below spot, and
    only the ultra-bull clears it.'
pocd:
  people:
    ceo: 'Mark Zuckerberg'
    founder_led: true
    tenure_years: 22
    insider_ownership_pct: 14.0
    capital_allocation: 'Turned shareholder-return on aggressively: a $50B buyback authorization (Feb 2024) on top of prior
      programs, with ~$29.75B of Class A repurchased in FY2024 and ~$26B in FY2025, then none in H1 FY2026 as capex stepped
      up; plus the first-ever dividend ($0.50/quarter, initiated Feb 2024; ~$5.07B FY2024 incl. dividend equivalents). M&A
      built the franchise (Instagram 2012, WhatsApp 2014, Oculus 2014); subsequent deals drew FTC/antitrust scrutiny. Heavy
      R&D/capex — large multi-year AI/datacenter spend and the Reality Labs segment running deep operating losses. Stock comp
      ~$20.4B FY2025 (10.2% of revenue; ~$16.7B FY2024).'
    incentive_alignment: 'Pay is not the alignment lever — the founder stake is: FY2024 salary was $1 (by his
      request), $0 bonus, $0 new equity; reported other compensation (~$27.2M) is overwhelmingly personal
      security and aircraft costs, not incentive pay. No PSU/TSR program for the CEO (he takes no equity grants).'
    governance_flags:

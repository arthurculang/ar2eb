    headline: Growth stalls; never profitable
    narrative:
    - Revenue compounds only ~7.6% as price competition from deep-pocketed IDT and GenScript caps the synthesis franchise
      and biotech-funding softness slows orders. The factory's margin ramp arrives but is competed away, so owner-FCF starts
      negative and barely crosses into positive late in the window.
    - Owner-FCF margin grinds from about -8% to 8% — real but thin. At a ~7.6% grower that never builds durable platform economics,
      the DCF supports $7.50, roughly 91% below spot. The 14x-sales multiple was pricing an outcome the business does not
      reach.
    probability_rationale: 13% — assumes commoditization plus a funding winter that stalls the synthesis franchise. Possible

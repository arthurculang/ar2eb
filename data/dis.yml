central_question: Does streaming operating margin scale from ~10% toward mid-teens fast enough to outrun the secular decline
  of linear TV and cable-affiliate revenue?
thesis: Disney trades at ~$178.6B equity (~$100, down ~9% YTD) — ~22x EV/FCF on $94.4B revenue, an 18.6% and rising operating
  margin, ~$10.1B FCF against ~$36B net debt. Streaming (DTC) operating income just crossed 10% (+88% YoY, guided to keep
  scaling), Experiences is a record cash engine (~$2.6B quarterly OI) with a $60B capex runway, and the CEO succession overhang
  is resolved. The DCF asks whether DTC margin scales toward mid-teens before linear TV erodes the base. The modal case lands
  +14% — the cheap-turnaround read, with the secular cable decline as the live drag.

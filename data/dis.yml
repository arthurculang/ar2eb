appendix:
  pushback:
  - label: The streaming turnaround is no longer a maybe.
    body: DTC operating income +88% YoY to a 10.6% margin (first quarter above double digits, guided >=10% FY26) - the central
      bull thesis is already printing, not projected.
  - label: Experiences is a record cash engine.
    body: ~$2.6B quarterly OI (a record), a $60B/10-yr capex runway adding supply-constrained capacity - the parks fund the
      streaming build and anchor the floor.
  - label: Linear TV is the live drag, not a tail risk.
    body: Cable-affiliate and ad revenue are in structural decline; the whole question is whether DTC + Experiences outgrow
      it, and the bear/base fork turns on that pace.
  - label: The CEO overhang is resolved.
    body: Josh D'Amaro (28-yr veteran who ran Experiences) named CEO, effective at the March annual meeting - the succession
      question that hung over the stock is settled, though a first-time CEO carries transition risk.
  - label: Net debt ~$36B is the amplifier.
    body: Unlike the net-cash mega-caps, ~$36B of net debt levers the equity to EBITDA - the modal case re-rates above spot,
      but the downside scenarios bite harder.
  triggers:
  - label: Bull validation
    body: DTC operating margin scales past low-teens toward mid-teens  ·  ESPN DTC + bundle pricing hold  ·  Experiences reaccelerates
      beyond price-led growth as new capacity opens  ·  FCF compounds despite the $60B capex
  - label: Bear validation
    body: DTC margin stalls near 10% while linear affiliate/ad revenue keeps eroding  ·  domestic park attendance stays negative  ·  content
      underperforms (hit-driven)  ·  net debt rises on the capex without offsetting EBITDA
  - label: Reframe needed
    body: if linear TV erodes faster than DTC + Experiences can grow - the growth core never clears the legacy drag - re-rate
      the terminal toward a declining-media-conglomerate multiple rather than a scaling-streamer one
glossary:
- term: DTC / streaming
  definition: Direct-to-consumer (Disney+, Hulu, ESPN DTC) operating income; just crossed a 10% margin (+88% YoY), the turnaround
    metric.
- term: Linear networks / affiliate
  definition: Traditional cable/broadcast (ABC, ESPN cable) and carriage fees - in secular decline as cord-cutting erodes
    the base.
- term: Experiences
  definition: The parks, resorts, cruise and consumer-products segment - a record cash engine (~$2.6B quarterly OI), $60B/10-yr
    capex runway.
- term: Cornered resource (IP)
  definition: 'Helmer Power: the franchise/IP library (Disney, Pixar, Marvel, Star Wars, ESPN) monetized across streaming
    and parks.'
- term: FCF margin
  definition: Free cash flow / revenue (~11% FY25, ~$10.1B); what 18.6% operating margin converts to once the $60B capex is
    funded.
competitive:
  arena: Media + theme parks - Disney (IP library/franchises, parks, the Disney+/Hulu/ESPN DTC bundle) vs Netflix in streaming,
    Comcast/Universal in parks, Warner Bros. Discovery and Paramount in legacy media; auditing a cornered-resource/brand Power
    against the secular decline of linear TV.
  lens: power_audit
  powers:
    scale_economies:
      score: 4
      note: Massive content and capex scale - Disney spreads franchise production, a global parks footprint and DTC tech across
        the industry's largest revenue base; a genuine cost advantage.
    network_economies:
      score: 2
      note: The Disney+/Hulu/ESPN bundle plus loyalty/MagicBand data create modest cross-sell pull, but streaming is not a
        hard network - subscribers churn freely.
    counter_positioning:
      score: 0
      note: None - Disney is the incumbent being disrupted by streaming and cord-cutting, not the disruptor; it had to cannibalize
        its own cable economics to build DTC.
    switching_costs:
      score: 1
      note: Weak - streaming is month-to-month and promiscuous; parks/cruise loyalty is real but a small share of revenue.
    branding:
      score: 4
      note: A top global consumer brand - Disney/Pixar/Marvel/Star Wars command pricing power in parks and a trust premium
        with families; durable but not converting fast while linear declines.
    cornered_resource:
      score: 5
      note: 'The dominant Power: an irreplaceable IP/franchise library (a century of characters + ESPN sports rights) that
        monetizes across DTC, parks and products - the hardest asset in media to replicate.'
    process_power:
      score: 2
      note: Decades of theme-park operating and franchise-development know-how; real but not a primary moat versus the IP
        itself.
  dominant_power: cornered_resource
  durability: high
  rivals:
  - name: Netflix (NFLX)
    kind: public
    note: The streaming scale leader and DTC-margin benchmark Disney's turnaround is measured against; far higher streaming
      margin.
    growth: 0.14
    margin: 0.27
    multiple: ~12x EV/sales
  - name: Comcast / Universal (CMCSA)
    kind: public
    note: The parks rival (Epic Universe) and a cable peer; the closest media-plus-parks comp, cheaper multiple.
    growth: 0.02
    margin: 0.19
    multiple: ~7x EV/FCF
  - name: Warner Bros. Discovery (WBD)
    kind: public
    note: Legacy-media peer mid-restructuring; the cautionary 'cable decline + DTC build + leverage' comparison.
    growth: 0.0
    margin: 0.1
    multiple: ~6x EV/EBITDA
  - name: Paramount (PARA)
    kind: public
    note: Sub-scale legacy media + DTC; the 'left behind by streaming economics' comp.
    growth: 0.0
    margin: 0.08
    multiple: ~7x EV/EBITDA
  threats:
  - vector: cornered_resource
    who: Cord-cutting / linear decline
    falsifier: Cable-affiliate and ad revenue erode faster than DTC + Experiences grow, so the franchise library's legacy
      monetization shrinks faster than the new channels replace it.
  - vector: branding
    who: Netflix / streaming competition
    falsifier: DTC margin stalls near 10% as bundle pricing and ESPN DTC fail to scale against Netflix's lead, and subscriber
      growth/churn worsens.
  - vector: scale_economies
    who: Parks demand softness
    falsifier: Domestic attendance stays negative and the $60B capacity opens into a soft consumer, so Experiences growth
      stays price-led and the cash engine stalls.
  takeaway: 'Disney''s cornered-resource Power is genuine and durable (high) - a century-deep IP/franchise library plus ESPN
    sports rights that monetize across streaming, parks and consumer products, the hardest asset in media to replicate, backed
    by a top brand and the industry''s largest scale. The Audit: the live threat is the secular decline of linear TV/cable
    affiliate revenue, and the question is whether the scaling DTC margin (just crossed 10%, +88% YoY) and the record Experiences
    engine ($2.6B quarterly OI, $60B runway) outgrow that runoff before it erodes the base. The DCF tests the pace; the modal
    case lands +14% - the cheap-turnaround read, with ~$36B net debt amplifying both tails.'
pocd:
  people:
    ceo: 'Josh D''Amaro'
    founder_led: false
    tenure_years: 0
    insider_ownership_pct: 0.1
    capital_allocation: 'Mature capital-return machine. Dividend reinstated in 2023 after the COVID suspension and raised toward ~$1.00/yr; a $3B buyback was authorized for FY2024 (the first since 2018). The 21st Century Fox acquisition (~$71B, 2019) carried a ~$5B FY2020 goodwill impairment; Disney bought out Comcast to take full ownership of Hulu (closed mid-2025). Total debt deleveraged from ~$58B (FY2021) to ~$45B (FY2025), and streaming (DTC) turned profitable at ~+$1.3B operating income in FY2025 from a ~$4B loss three years earlier.'
    incentive_alignment: 'CEO pay is predominantly equity (Iger FY2025 total ~$45.8M). Director-and-officer ownership is a fraction of a percent (mega-cap norm), so alignment is via pay design, not a meaningful equity stake. The 2024 say-on-pay vote passed at only ~80% (below the S&P 500 median that year) - a recurring pay-friction point across Iger''s tenure.'
    governance_flags:
      - 'single class of common stock, one vote per share; no controlling shareholder'
      - 'independent Chair (James Gorman, since Jan 2025) is separate from the CEO; board ~90% independent (9 of 10), elected annually (no classified board)'
      - 'decisively won the 2024 Nelson Peltz / Trian proxy fight (Peltz lost ~2:1); ValueAct backed the company slate'
      - 'repeated CEO-succession failures historically (Chapek named 2020, ousted 2022, Iger recalled) - now resolved via a ~2-year board-led process to insider Josh D''Amaro (CEO since 18 Mar 2026; Iger advises through end-2026)'
      - 'capital-allocation negative: the ~$5B FY2020 goodwill impairment on the 21st Century Fox deal; Disney v. DeSantis litigation settled 2024'
    key_person_risk: medium
    score: 3
    takeaway: 'Clean single-class one-vote register with an independent Chair (Gorman) split from the CEO, a ~90%-independent annually-elected board, a decisive 2024 activist-fight win, and restored dividend + buyback discipline - all positives. Held to a middling 3 by Disney''s documented history of botched CEO successions (now resolved to an as-yet-unproven insider, D''Amaro), thin insider ownership, the Fox goodwill impairment, and ~80% say-on-pay friction.'

competitive:
  arena: >
    Autonomous electric aircraft — Pyka vs Zipline, Reliable Robotics / Merlin (autonomy),
    DJI / XAG (ag-drones), and eVTOL + defense primes; the race to field certified,
    revenue-generating autonomous flight in ag spraying and middle-mile cargo.
  lens: power_origination
  powers:
    scale_economies:     { score: 1, note: "Tiny — ~$7.5M est. revenue, ~74 people; no volume advantage yet." }
    network_economies:   { score: 1, note: "Minimal; no platform network effect in ag/cargo operations." }
    counter_positioning: { score: 2, note: "Autonomous electric flight vs incumbent piloted ag aviation — a model rivals can't easily copy." }
    switching_costs:     { score: 2, note: "Ag-distributor relationships + integrated fleet operations create stickiness once embedded." }
    branding:            { score: 1, note: "Recognized in autonomous-aviation niche; little broad brand power." }
    cornered_resource:   { score: 3, note: "The only large FAA-authorized autonomous fixed-wing electric aircraft actually selling units." }
    process_power:       { score: 3, note: "Vertically integrated autonomy, airframe, motors, and batteries — a hard-to-replicate stack." }
  dominant_power: cornered_resource
  window: open
  rivals:
    - { name: "Zipline", kind: private, note: "Far larger/later (~$7.6B) but light-payload medical/retail logistics, not heavy ag/cargo.", share_now: 0.30, share_terminal: 0.28, capital: "~$7.6B raised" }
    - { name: "Reliable Robotics / Merlin", kind: private, note: "Autonomy retrofit for existing aircraft — automation rival, not electric airframes.", share_now: 0.08, share_terminal: 0.12, capital: "$ hundreds of M" }
    - { name: "DJI / XAG", kind: incumbent, note: "Small ag-spray drones from below — cheap, scaled, lower payload/range.", share_now: 0.20, share_terminal: 0.22, capital: "Large balance sheets" }
    - { name: "eVTOL / defense primes", kind: mixed, note: "Joby/Archer (passenger) + primes (defense logistics) — richer stories, adjacent or pre-revenue.", share_now: 0.10, share_terminal: 0.14, capital: "$ billions" }
  lead_lag:
    - { metric: "Certified, revenue-generating autonomous aircraft", company: "leading", best_rival: "behind", verdict: leading }
    - { metric: "Scale / capital", company: "tiny (~$88M)", best_rival: "far larger", verdict: lagging }
    - { metric: "Capital efficiency per unit of progress", company: "high", best_rival: "lower", verdict: leading }
  takeaway: >
    Pyka is originating a real cornered-resource and process-power position — the only large
    FAA-authorized autonomous electric aircraft actually selling units, vertically integrated —
    but it is tiny and early versus better-capitalized rivals (Zipline above, DJI/XAG below);
    the window is open while it leads on certification, and capital starvation before full type
    certification is the falsifier for whether the scarcity endures.

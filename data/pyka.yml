scenarios:
  ultra_bear:
    label: Wipeout
    short_label: Wipeout
    probability: 0.20
    headline: Capital-starved; fire-sale.
    narrative:
    - 'Full type certification proves slower and dearer than aerospace history predicts. Ag and cargo orders stay soft and
      lumpy — the 2023 Skyports pre-commitments never firm — while DJI/XAG ag-drones compress from below and Zipline out-scales
      in light-payload logistics. Burn outruns a thin balance sheet; a 2028 bridge prices below the last mark, the defense
      pilots don''t convert to programs, and the company is acqui-hired or wound down.

      '
    - 'At a ~$60M outcome, common per share falls to ~$0.90 nominal — discounted three years at a 30% venture-WACC (illiquidity
      + execution + dilution overhang) and after a 35% within-scenario write-to-zero probability, expected PV is ~$0.37, roughly
      a tenth of the estimated mark.

      '
    - 'Certification stall + order softness + capital starvation is a compound event sized at ~20%.

      '
    probability_rationale: 'Certification stall + chronically soft orders + capital starvation is a compound 3-vector tail.
      Each individually 30-45% plausible for a sub-$10M-revenue, ~74-person aerospace company; joint near 20%. The dominant
      risk is running out of runway before full type certification — one binary, not slow erosion. Capital-efficiency and an
      already-shipping product temper it below a typical pre-revenue moonshot.

      '

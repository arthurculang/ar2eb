central_question: 'Is an ESTIMATED ~$200M post-money (~$4/share, undisclosed) defensible against a probability-weighted distribution
  of exits over 3-6 years — for an already-flying, FAA-authorized, revenue-generating autonomous-aircraft maker facing heavy
  dilution and a long full-certification road?

  '
thesis: 'Pyka is the rare autonomous-aircraft company that already flies, sells, and earns revenue — ~$7.5M est. across ag
  spraying (Pelican 2) and middle-mile cargo (Pelican Cargo) on four continents, FAA-authorized as the largest UAS cleared
  for US commercial operation, on ~$88M raised (capital-efficient versus eVTOL peers burning billions). The valuation is undisclosed,
  so the dominant variable is not an operating DCF but the exit distribution against an estimated mark. Real today (flying,
  regulated, two beachhead markets, an emerging dual-use defense leg) de-risks it versus pre-revenue eVTOLs; the bear is that
  it stays tiny and niche, faces a multi-year road to full type certification, and dilutes heavily. Probability-weighted PV
  lands near the estimated mark — a speculative option with a fat tail, where heavy dilution offsets large company-value exits.
  Five exit scenarios, weighted; show your work. The estimate itself is the load-bearing uncertainty.

  '

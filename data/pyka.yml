glossary:
- term: Pelican 2 / Pelican Spray
  definition: Pyka's autonomous all-electric ag aircraft — 300L / ~660lb payload, up to 100 ha/hr, ~$550K list; billed as
    the world's largest autonomous ag aircraft (Feb 2025).
- term: Pelican Cargo
  definition: Pyka's autonomous all-electric middle-mile cargo airplane — ~400lb payload, 200-mi range; billed as the world's
    largest zero-emission cargo airplane (Jan 2023).
- term: FAA authorization (vs type certification)
  definition: Operational clearance to fly/operate commercially under defined conditions — NOT full type certification, which
    is a separate multi-year road to unrestricted operation.
- term: AFWERX / Agility Prime
  definition: US Air Force programs accelerating electric/autonomous aircraft; Pyka delivered Pelican Cargo on lease (2024)
    — the basis of the dual-use defense leg.
- term: RumRunner
  definition: Militarized Pyka variant developed with Sierra Nevada Corporation (2024) for DoD contested-logistics resupply
    — the defense scale-up call option.
- term: Last-round mark (estimated)
  definition: Per-share value implied by the latest round (post-money ÷ fully-diluted). Pyka's post-money is undisclosed,
    so $4.00 is an estimate, not a disclosed or market price.

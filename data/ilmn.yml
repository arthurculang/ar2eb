central_question: Is Illumina's ~80% rally + ~5x EV/sales pricing a durable clinical/NovaSeq-X re-acceleration — or is flat
  revenue + low-cost-entrant (Ultima/Element) + Roche erosion the reality?
thesis: 'Illumina trades at ~$22B (≈$145/sh, up ~80% off the lows) — ~5x EV/sales, ~22x FCF on $4.34B revenue (flat for four
  years, Q1''26 +4.8%), ~70% gross margin, ~$1B FCF. The mature DCF asks whether the NovaSeq-X consumables pull-through +
  clinical mix (>65% of sequencing consumables, +20% ex-China) re-accelerate the franchise toward a ~26% margin, against low-cost
  entrants (Ultima/Element $100 genome), Roche''s 2026 SBX re-entry, China decline, and NIH cuts. The finding: the rally has
  priced the re-acceleration — only the bull-or-better clears spot; the base (modest re-accel) sits ~27% below. The TXG mirror.'

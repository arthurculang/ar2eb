appendix:
  pushback:
  - label: ~80% share, >90% of clinical genomics.
    body: Dominant installed base + consumables lock-in (validated clinical assays don't re-validate cheaply) — a real scale
      + switching Power.
  - label: ~70% gross margin, ~$1B FCF.
    body: A razor/blade annuity (consumables ~72% of revenue) with a clear path to a ~26% operating margin (2027 target).
  - label: NovaSeq-X pull-through is coming.
    body: ~890 installed (end-FY25); ~6-month pull-through lag -> a 2H'26 consumables acceleration the base is just starting
      to price.
  - label: Clinical mix is the durable engine.
    body: '>65% of sequencing consumables, +20% ex-China — less funding-exposed than the academic/research side.'
  - label: GRAIL overhang is gone.
    body: Divested Jun 2024; Core-only reporting, EU fine/impairments behind it; new CEO running the cost-out + clinical pivot.
  triggers:
  - label: Bull validation
    body: total revenue growth sustains >6%  ·  NovaSeq-X consumables accelerate (2H'26)  ·  non-GAAP op margin reaches ~26%  ·  clinical
      stays +20% ex-China
  - label: Bear validation
    body: revenue stays flat-to-down  ·  Ultima/Element take material share  ·  Roche SBX gains clinical traction  ·  China/NIH
      drag deepens
  - label: Reframe needed
    body: if a low-cost entrant or Roche SBX structurally breaks the SBS consumables-pricing Power, re-rate toward a commoditized-sequencing
      multiple
glossary:
- term: Consumables (razor/blade)
  definition: Reagents/flow-cells that run on the installed base (~72% of revenue, ~70% margin) — the recurring annuity and
    the moat.
- term: NovaSeq X
  definition: Illumina's flagship high-throughput sequencer; its installed-base ramp drives the consumables pull-through (the
    re-acceleration mechanism).
- term: Clinical mix
  definition: '>65% of sequencing consumables, +20% ex-China — the durable, less-funding-exposed demand engine vs academic/research.'
- term: Low-cost entrants
  definition: Ultima (~$80-100 genome) + Element (Vitari) + Roche SBX (2026) attacking the sequencing-by-synthesis franchise
    on price.
- term: FCF margin
  definition: Free cash flow / revenue (~21% FY25); the mature-DCF lever as the margin marches to the ~26% 2027 target.
competitive:
  arena: DNA sequencing — Illumina (~80% share, NovaSeq-X installed base, ~70%-margin consumables annuity) vs Ultima, Element,
    Roche (SBX, 2026), PacBio, Thermo, MGI/Complete Genomics; defending a scale + switching Power against low-cost entrants.
    (Supplies 10x Genomics/TXG; the two are IP litigants.)
  lens: power_audit
  powers:
    scale_economies:
      score: 3
      note: ~80% share + huge installed base -> manufacturing/R&D cost advantage on consumables; the dominant Power.
    network_economies:
      score: 1
      note: Published-protocol/citation network is mild.
    counter_positioning:
      score: 1
      note: Incumbent; low-cost entrants counter-position on price-per-genome.
    switching_costs:
      score: 3
      note: Validated clinical assays + DRAGEN pipelines on Illumina chemistry won't re-validate cheaply (regulatory friction).
    branding:
      score: 2
      note: The 'gold standard' in clinical NGS.
    cornered_resource:
      score: 2
      note: Sequencing-by-synthesis patent estate — established but contested/aging (litigated vs Element/BGI).
    process_power:
      score: 2
      note: Chemistry/manufacturing learning curve.
  dominant_power: scale_economies
  durability: medium
  rivals:
  - name: Ultima Genomics
    kind: private
    note: UG 100, ~$80-100 genome (high-throughput) — the low-cost price attack.
    growth: null
    margin: null
    multiple: private
  - name: Element Biosciences
    kind: private
    note: AVITI + Vitari ($100 30x genome); mutual IP litigation with Illumina.
    growth: null
    margin: null
    multiple: private
  - name: Roche (SBX)
    kind: incumbent-division
    note: Re-entering with sequencing-by-expansion (2026); diagnostics channel — the credible long-term threat.
    growth: null
    margin: null
    multiple: diversified
  - name: PacBio / Thermo / MGI
    kind: public
    note: Long-read niche / Ion Torrent / China (MGI blocked from US by BIOSECURE).
    growth: null
    margin: null
    multiple: varies
  threats:
  - vector: scale_economies
    who: Ultima / Element ($100 genome)
    falsifier: Low-cost entrants take material high-throughput share; consumables pricing compresses.
  - vector: cornered_resource
    who: Roche SBX (2026)
    falsifier: Roche's SBX gains clinical traction, breaking the SBS franchise.
  - vector: switching_costs
    who: NIH / China
    falsifier: NIH cuts + China decline shrink the academic installed base the annuity depends on.
  takeaway: 'Illumina''s scale + switching-cost Power is genuine and durable — ~80% share, >90% of clinical genomics, a ~70%-margin
    consumables annuity, and clinical labs that won''t cheaply re-validate. But the Power is being audited: revenue was flat
    for four years, China collapsed, NIH froze research demand, low-cost entrants (Ultima/Element $100 genome) attack pricing,
    and Roche''s SBX re-enters in 2026. The ~80% rally to ~5x EV/sales has priced the NovaSeq-X/clinical re-acceleration;
    only the bull-or-better clears spot, and the modal base sits ~27% below — the entry, not the franchise, is the problem
    (the TXG mirror).'

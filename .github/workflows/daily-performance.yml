# Daily portfolio performance vs. benchmarks (spec §15).
#
# A PLAIN scheduled script — NO Claude. The daily job is deterministic arithmetic
# (fetch closes, compute weighted return vs. benchmarks, append a row), so an agent
# would be the wrong tool. Runs after the US close and commits portfolio/performance.csv.
#
# REQUIRES (one-time, by the repo owner):
#   Settings → Actions → General → Workflow permissions → "Read and write"
#   so the job's GITHUB_TOKEN can commit the CSV back. No secret needed (Yahoo is keyless).

name: Daily portfolio performance

on:
  schedule:
    - cron: "0 22 * * 1-5"   # ~22:00 UTC on weekdays = after the 16:00 ET close (incl. DST)
  workflow_dispatch: {}        # manual trigger (testing)

permissions:
  contents: write

concurrency:
  group: daily-performance
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Track performance
        run: python portfolio/track_performance.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain portfolio/performance.csv)" ]]; then
            git config user.name  "ar2eb-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add portfolio/performance.csv
            git commit -m "perf: portfolio vs benchmarks $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no change (pre-launch, weekend, or market holiday) — nothing to commit"
          fi

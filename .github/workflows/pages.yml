# Build ar2eb.com via GitHub Actions and deploy to GitHub Pages.
#
# Triggered by push to main (auto-deploy) and via manual dispatch.
# The job: checkout → setup-node → npm ci → npm run build → upload
# public/ as the Pages artifact → deploy.
#
# Pages settings (one-time, in repo Settings → Pages):
#   Source: GitHub Actions
#   Custom domain: ar2eb.com (auto-detected from public/CNAME)
#   Enforce HTTPS: enabled
#
# DNS (Cloudflare): point ar2eb.com at GitHub Pages (A records or CNAME
# to <user>.github.io). Cloudflare can keep proxying (orange cloud)
# with SSL mode "Full (strict)".

name: Deploy ar2eb.com to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel in-flight deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
